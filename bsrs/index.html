<style>
  :root{
    --ink:#23252b; --ink-soft:#5b6270; --ink-faint:#8a93a3;
    --paper:#f4f6fa; --card:#ffffff; --line:#e3e8f0;
    --accent:#003D7C; --accent-soft:#eaf0f7;
    --good:#2e8b57; --good-soft:#e6f3ec;
    --mild:#b8860b; --mild-soft:#fbf2dd;
    --mod:#c2631f; --mod-soft:#fbeede;
    --severe:#c0392b; --severe-soft:#fbe8e6;
    --crisis:#c0392b; --crisis-soft:#fdeef0;
    --radius:16px; --maxw:560px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;
    font-weight:300;line-height:1.7;letter-spacing:.01em;padding:0 18px env(safe-area-inset-bottom)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:54px 0 130px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .logo{font-family:"Noto Serif TC",serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--accent)}
  .sub{font-size:11px;color:var(--ink-faint);letter-spacing:.18em}
  .tagline{font-size:13px;color:var(--ink-soft);margin:0 0 24px;line-height:1.6}
  .progress{display:flex;gap:6px;margin-bottom:24px}
  .progress i{flex:1;height:3px;border-radius:3px;background:var(--line);transition:.4s}
  .progress i.on{background:var(--accent)}
  .step{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .lead{font-size:14px;color:var(--ink-soft);line-height:1.8;margin:0 0 18px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 12px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,61,124,.04)}
  .qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
  .qnum{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;color:var(--accent);flex:none}
  .qtext{font-size:15.5px;color:var(--ink);font-weight:400;line-height:1.5}
  .qbadge{display:inline-block;font-size:10.5px;color:var(--severe);background:var(--severe-soft);border-radius:999px;padding:2px 8px;margin-left:6px;font-weight:500;vertical-align:middle}
  .opts{display:flex;gap:6px}
  .opt{flex:1;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:11px;
    padding:9px 4px;text-align:center;font-size:11.5px;color:var(--ink-soft);font-family:inherit;font-weight:300;transition:.15s;line-height:1.3}
  .opt .on{display:block;font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink-faint);margin-bottom:2px;font-weight:700}
  .opt:active{transform:scale(.97)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .opt.sel .on{color:var(--accent)}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 72%,transparent)}
  .bar-inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;align-items:center}
  .btn{flex:1;border:none;border-radius:999px;padding:15px;font-family:"Noto Sans TC",sans-serif;font-weight:700;
    font-size:15.5px;letter-spacing:.04em;cursor:pointer;transition:.18s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:disabled{background:var(--line);color:var(--ink-faint);cursor:not-allowed}
  .btn-primary:active:not(:disabled){transform:scale(.98)}
  .btn-ghost{flex:none;background:none;border:none;color:var(--ink-faint);font-size:14px;cursor:pointer;padding:15px 4px;font-family:inherit}
  .home-link{display:inline-block;background:none;border:none;color:var(--ink-faint);font-family:inherit;font-size:13px;cursor:pointer;padding:0 0 12px}
  .home-link:active{color:var(--accent)}

  /* —— 結果頁 —— */
  .crisis-card{background:var(--crisis-soft);border:1.5px solid var(--crisis);border-radius:var(--radius);padding:18px 18px;margin-bottom:18px}
  .crisis-card .ct{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:16px;color:var(--crisis);margin-bottom:8px}
  .crisis-card p{margin:0 0 12px;font-size:14px;line-height:1.8;color:var(--ink)}
  .crisis-res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .crisis-res li{font-size:14px;line-height:1.5;color:var(--ink)}
  .crisis-res a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--crisis);
    background:#fff;border:1px solid var(--crisis);border-radius:12px;padding:10px 14px;font-weight:500}
  .crisis-res a .num{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700}
  .crisis-res a .nm{font-size:13px;color:var(--ink-soft);font-weight:300}

  .score-card{color:#fff;border-radius:var(--radius);padding:24px 22px;margin-bottom:16px;position:relative;overflow:hidden}
  .score-card.b-good{background:var(--good)} .score-card.b-mild{background:var(--mild)}
  .score-card.b-moderate{background:var(--mod)} .score-card.b-severe{background:var(--severe)}
  .score-card .lab{font-size:11.5px;letter-spacing:.18em;opacity:.85;margin-bottom:10px}
  .score-card .big{display:flex;align-items:baseline;gap:6px}
  .score-card .num{font-family:"Noto Serif TC",serif;font-size:54px;font-weight:700;line-height:1}
  .score-card .max{font-size:15px;opacity:.8}
  .score-card .lvl{font-family:"Noto Serif TC",serif;font-size:21px;font-weight:700;margin-top:12px}
  .score-card .adv{font-size:14px;line-height:1.8;margin-top:8px;opacity:.97}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .panel h3{font-family:"Noto Serif TC",serif;font-weight:500;font-size:15px;margin:0 0 10px;color:var(--accent)}
  .panel p{margin:0;font-size:13.5px;line-height:1.75;color:var(--ink-soft)}
  .ans-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
  .ans-row:last-child{border-bottom:none}
  .ans-row .at{color:var(--ink-soft);flex:1;padding-right:10px}
  .ans-row .av{flex:none;font-family:"Noto Serif TC",serif;color:var(--accent);font-weight:500}
  .ans-row.supp .av{color:var(--severe)}

  .disclaimer{font-size:11.5px;color:var(--ink-faint);text-align:center;margin:18px 0 0;line-height:1.7;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

  /* —— 保存區 —— */
  .save-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;margin-top:18px}
  .save-title{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:6px}
  .save-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);margin-bottom:12px}
  .save-actions{display:flex;gap:10px}
  .save-actions button{flex:1;border-radius:999px;padding:12px;font-size:14px;font-family:inherit;cursor:pointer;border:1px solid var(--line)}
  .save-skip{background:transparent;color:var(--ink-faint)}
  .save-do{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
  .save-actions button:active{transform:scale(.98)}
  .save-done{font-size:13.5px;color:var(--accent);line-height:1.7}
  .save-done .save-view{color:var(--accent);text-decoration:underline;cursor:pointer}

  /* —— 趨勢頁 —— */
  .priv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .priv-btn{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:inherit;font-size:12.5px;cursor:pointer}
  .priv-btn:hover{background:var(--accent);color:#fff}
  .priv-link{font-size:12px;color:var(--accent);text-decoration:none;cursor:pointer}
  .priv-ok{font-size:12.5px;color:var(--ink-soft)}
  .trend-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 14px 10px;margin-bottom:16px}
  .trend-svg{width:100%;height:160px;display:block}
  .hist-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;margin-bottom:10px}
  .hist-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hist-badge{font-size:10.5px;padding:2px 9px;border-radius:999px;font-weight:500;color:#fff}
  .hist-badge.b-good{background:var(--good)} .hist-badge.b-mild{background:var(--mild)}
  .hist-badge.b-moderate{background:var(--mod)} .hist-badge.b-severe{background:var(--severe)}
  .hist-score{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;color:var(--ink)}
  .hist-when{margin-left:auto;font-size:11px;color:var(--ink-faint)}
  .hist-crisis{font-size:11px;color:var(--severe);margin-top:4px}
  .hist-ops{display:flex;gap:14px;margin-top:8px}
  .hist-ops button{background:none;border:none;font-family:inherit;font-size:12.5px;cursor:pointer;padding:0}
  .hist-del{color:var(--severe)}

  /* —— Google 登入 modal —— */
  #jte-login-modal{display:none;position:fixed;inset:0;background:rgba(20,28,40,.45);z-index:9999;align-items:center;justify-content:center;padding:18px}
  #jte-login-modal .jm-box{background:var(--card);border-radius:20px;padding:26px 22px 24px;width:100%;max-width:380px;box-shadow:0 16px 48px rgba(0,0,0,.22)}
  #jte-login-modal .jm-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px}
  #jte-login-modal .jm-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:18px}
  #jte-gsi-btn{display:flex;justify-content:center;margin-bottom:12px;min-height:40px}
  #jte-login-modal .jm-skip{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px;font-size:12.5px;color:var(--ink-faint);cursor:pointer;font-family:inherit}
</style>
</head>

<script>
/* ============================================================
   心情溫度計 BSRS · 作答 → 計分分級 → 危機把關 → 趨勢
   純邏輯（計分/分級/危機/記錄分層）在 bsrs-score.js（window.BsrsScore）
   ============================================================ */
const app=document.getElementById('app');
const bar=document.getElementById('bar');
const progressEl=document.getElementById('progress');
const state={ mode:'intro', answers:[null,null,null,null,null,null] };

function clearAll(){ app.innerHTML=''; bar.innerHTML=''; }
function backHomeLink(){
  const b=document.createElement('button');b.className='home-link';
  b.textContent=jteT('nav.back','← 回練息場平台');
  b.onclick=function(){location.href='https://flow222git.github.io/jte-platform-2026/';};
  return b;
}
function setProgress(on,total){
  progressEl.innerHTML='';
  for(let i=0;i<total;i++){const s=document.createElement('i');if(i<on)s.className='on';progressEl.appendChild(s);}
}

/* —— 入口 —— */
function renderIntro(){
  state.mode='intro';
  clearAll();setProgress(0,1);progressEl.innerHTML='';
  const d=document.createElement('div');d.className='step';
  d.appendChild(backHomeLink());
  d.insertAdjacentHTML('beforeend',
    '<p class="lead">'+jteT('intro.lead','最近一星期（包括今天），這些問題讓你感到困擾或苦惱嗎？<br>誠實回答，只需要一分鐘。你寫的只有你看得到。')+'</p>');
  const start=document.createElement('button');start.className='btn btn-primary';start.style.width='100%';
  start.textContent=jteT('intro.start','開始作答');
  start.onclick=renderQuiz;

  hist.onclick=function(){renderTrend();};
  d.appendChild(hist);
  d.insertAdjacentHTML('beforeend','<p class="disclaimer">'+_h(jteT('intro.disclaimer','本量表為情緒困擾的篩檢參考、非診斷工具，僅供參考；若持續困擾請尋求專業協助。'))+'</p>');
  app.appendChild(d);
}

/* —— 作答 —— */
function renderQuiz(){
  state.mode='quiz';
  clearAll();
  const d=document.createElement('div');d.className='step';
  d.appendChild(backHomeLink());
  d.insertAdjacentHTML('beforeend','<p class="lead" style="margin-bottom:14px">'+jteT('quiz.lead','<b style="color:var(--ink)">最近一星期（包括今天）</b>，這些問題讓你感到困擾或苦惱的程度？')+'</p>');
  const Q=BsrsScore.QUESTIONS, OPTS=BsrsScore.OPTIONS;
  // Translated questions (keyed q1–q6) and options (opt.0–opt.4)
  const tQ=Q.map(function(q,qi){return jteT('q'+(qi+1),q.text);});
  const tO=OPTS.map(function(o,oi){return jteT('opt.'+oi,o);});
  Q.forEach(function(q,qi){
    const card=document.createElement('div');card.className='qcard';
    const badge=q.supplementary?'<span class="qbadge">'+_h(jteT('quiz.badge.supplementary','附加題 · 不計入總分'))+'</span>':'';
    let opthtml='';
    tO.forEach(function(label,oi){
      const sel=state.answers[qi]===oi?' sel':'';
      opthtml+='<button class="opt'+sel+'" data-q="'+qi+'" data-o="'+oi+'"><span class="on">'+oi+'</span>'+_h(label)+'</button>';
    });
    card.innerHTML='<div class="qhead"><span class="qnum">'+(qi+1)+'.</span><span class="qtext">'+_h(tQ[qi])+badge+'</span></div><div class="opts">'+opthtml+'</div>';
    card.querySelectorAll('.opt').forEach(function(btn){
      btn.onclick=function(){
        const qq=Number(btn.dataset.q),oo=Number(btn.dataset.o);
        state.answers[qq]=oo;
        card.querySelectorAll('.opt').forEach(function(b){b.classList.remove('sel');});
        btn.classList.add('sel');
        updateQuizBar();
      };
    });
    d.appendChild(card);
  });
  app.appendChild(d);
  setProgress(0,1);progressEl.innerHTML='';
  updateQuizBar();
}
function updateQuizBar(){
  const done=state.answers.every(function(a){return a!==null;});
  bar.innerHTML='';
  const inner=document.createElement('div');inner.className='bar-inner';
  const go=document.createElement('button');go.className='btn btn-primary';
  go.textContent=done?jteT('quiz.btn.done','看結果'):jteT('quiz.btn.incomplete','請完成所有題目');
  go.disabled=!done;
  go.onclick=function(){if(done)renderResult();};
  inner.appendChild(go);
  bar.appendChild(inner);
}

/* —— 結果 + 危機把關 + 免責 —— */
const CRISIS_RESOURCES=[
  {num:'1925',nm:'安心專線（24 小時免付費）',nmKey:'crisis.res.1925',tel:'1925'},
  {num:'1995',nm:'生命線協談專線',nmKey:'crisis.res.1995',tel:'1995'},
  {num:'1980',nm:'張老師專線',nmKey:'crisis.res.1980',tel:'1980'}
];
function renderResult(){
  state.mode='result';
  const r=BsrsScore.score(state.answers);
  state.lastResult=r;
  clearAll();bar.innerHTML='';progressEl.innerHTML='';
  const d=document.createElement('div');d.className='step';
  d.appendChild(backHomeLink());

  // 危機把關：最上方明顯（非折疊）
  if(r.crisis){
    const c=document.createElement('div');c.className='crisis-card';
    let resHtml='';
    CRISIS_RESOURCES.forEach(function(x){
      const label=jteT(x.nmKey,x.nm);
      // For EN/JA the label already includes number info; for ZH show num separately
      const lang=typeof jteLang==='function'?jteLang():'zh';
      if(lang==='zh'){
        resHtml+='<li><a href="tel:'+x.tel+'"><span class="num">'+x.num+'</span><span class="nm">'+_h(label)+'</span></a></li>';
      } else {
        resHtml+='<li><a href="tel:'+x.tel+'"><span class="nm" style="font-size:14px">'+_h(label)+'</span></a></li>';
      }
    });
    const emergencyText=jteT('crisis.emergency','若有立即危險，請立刻撥打');
    c.innerHTML='<div class="ct"><i class="ti ti-heart-handshake"></i>'+_h(jteT('crisis.title','你並不孤單，現在就可以找人說'))+'</div>'+
      '<p>'+_h(jteT('crisis.body','你的回答顯示，最近這段時間可能很不好受。這些感受值得被認真對待——請讓專業的人陪你一起面對，不用一個人撐。'))+'</p>'+
      '<ul class="crisis-res">'+resHtml+
      '<li><a href="tel:119"><span class="num">119 / 110</span><span class="nm">'+_h(emergencyText)+'</span></a></li></ul>';
    d.appendChild(c);
  }

  // 分數卡：使用 i18n 化的 levelLabel 與 advice
  const levelLabelKey='level.'+r.level+'.label';
  const levelAdviceKey='level.'+r.level+'.advice';
  const LEVEL_ZH={
    good:{label:'身心適應狀況良好',advice:'你最近的狀態還不錯，繼續照顧自己。'},
    mild:{label:'輕度情緒困擾',advice:'找信任的家人朋友聊聊、抒發一下，會有幫助。'},
    moderate:{label:'中度情緒困擾',advice:'建議尋求心理諮商或專業協助，陪自己走一段。'},
    severe:{label:'重度情緒困擾',advice:'建議尋求精神科治療或心理諮商，你值得被好好接住。'}
  };
  const tLevelLabel=jteT(levelLabelKey,(LEVEL_ZH[r.level]||{}).label||r.levelLabel);
  const tLevelAdvice=jteT(levelAdviceKey,(LEVEL_ZH[r.level]||{}).advice||r.advice);

  const sc=document.createElement('div');sc.className='score-card b-'+r.level;
  sc.innerHTML='<div class="lab">'+_h(jteT('score.lab','最近一星期的情緒困擾分數'))+'</div>'+
    '<div class="big"><span class="num">'+r.total+'</span><span class="max">'+_h(jteT('score.max','／ 20'))+'</span></div>'+
    '<div class="lvl">'+_h(tLevelLabel)+'</div>'+
    '<div class="adv">'+_h(tLevelAdvice)+'</div>';
  d.appendChild(sc);

  // 附加題提醒（item6 ≥1 但未到 crisis 門檻時，也溫和提示）
  if(r.item6>=1 && !r.crisis){
    const note=document.createElement('div');note.className='panel';
    note.style.borderColor='var(--severe)';
    note.innerHTML='<h3 style="color:var(--severe)">'+_h(jteT('item6.title','關於第 6 題'))+'</h3>'+
      '<p>'+jteT('item6.body','你在「自殺的想法」這題有些勾選。即使分數不高，這份感受也值得被好好照顧。若這些念頭讓你困擾，隨時可以撥打安心專線 <b>1925</b>，有人願意聽你說。')+'</p>';
    d.appendChild(note);
  }

  // 各題作答回顧
  const detail=document.createElement('div');detail.className='panel';
  const tQ_r=BsrsScore.QUESTIONS.map(function(q,qi){return jteT('q'+(qi+1),q.text);});
  const tO_r=BsrsScore.OPTIONS.map(function(o,oi){return jteT('opt.'+oi,o);});
  let rows='<h3>'+_h(jteT('result.answers.title','你的作答'))+'</h3>';
  BsrsScore.QUESTIONS.forEach(function(q,qi){
    const v=state.answers[qi];
    rows+='<div class="ans-row'+(q.supplementary?' supp':'')+'"><span class="at">'+(qi+1)+'. '+_h(tQ_r[qi])+'</span><span class="av">'+_h(tO_r[v]||'')+'</span></div>';
  });
  detail.innerHTML=rows;
  d.appendChild(detail);

  // 免責常駐
  d.insertAdjacentHTML('beforeend','<p class="disclaimer">'+_h(jteT('result.disclaimer','本量表為情緒困擾的篩檢參考、非診斷工具，僅供參考；若持續困擾請尋求專業協助。'))+'</p>');

  // 保存區
  appendSaveBlock(d,r);

  app.appendChild(d);

  // 動作列
  const inner=document.createElement('div');inner.className='bar-inner';
  const again=document.createElement('button');again.className='btn btn-primary';
  again.textContent=jteT('result.btn.again','再測一次');
  again.onclick=function(){state.answers=[null,null,null,null,null,null];renderQuiz();};
  const trend=document.createElement('button');trend.className='btn-ghost';
  trend.textContent=jteT('result.btn.trend','看趨勢');
  trend.onclick=function(){renderTrend();};
  inner.appendChild(trend);inner.appendChild(again);
  bar.appendChild(inner);
}

/* —— 保存區 —— */
function appendSaveBlock(container,r){
  const wrap=document.createElement('div');wrap.className='save-block';
  wrap.innerHTML='<div class="save-title">'+_h(jteT('save.title','把這次的溫度記下來嗎？'))+'</div>'+
    '<div class="save-sub"><span>🔒</span><span>'+_h(jteT('save.privacy','只有你看得到，連我們也解不開'))+'</span></div>'+
    '<div class="save-actions"><button class="save-skip">'+_h(jteT('save.skip','這次不存'))+'</button><button class="save-do">'+_h(jteT('save.do','存這次'))+'</button></div>'+

/* ============================================================
   平台記錄 helper（比照 ven-i：localStorage + Firestore，fail-closed）
   ============================================================ */
var _db=null;
function initFirebase(){
  if(typeof firebase==='undefined'){setTimeout(initFirebase,200);return;}
  try{
    if(firebase.apps.length===0){
      firebase.initializeApp({
        apiKey:"AIzaSyBRZ1TNVMxOeJfyvGz4HhdlBzlKL0GIAfg",
        authDomain:"jointoenjoy.firebaseapp.com",
        projectId:"jointoenjoy",
        storageBucket:"jointoenjoy.firebasestorage.app",
        messagingSenderId:"978242729427",
        appId:"1:978242729427:web:ab31364f21c67c2ab56b26"
      });
    }
    _db=firebase.firestore();
  }catch(e){console.warn('Firebase init failed',e);}
}
window.addEventListener('load',initFirebase);

function jteEmail(){return localStorage.getItem('jte_user_email')||'';}
function jteKey(){const e=jteEmail();return e?'jte_daily_'+e.replace(/[^a-zA-Z0-9]/g,'_'):'jte_daily_v1';}
function jteTodayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function jteAll(){try{return JSON.parse(localStorage.getItem(jteKey())||'{}')}catch(e){return{}}}
// fail-closed 脫敏：BsrsScore 模組載入失敗時，本地去掉私密欄位再上傳（絕不上傳明文分數/作答）。
// 私密欄位清單須與 bsrs-score.js 的 PRIVATE_FIELDS 同步：['score','level','answers','item6']。
function _bsrsStripPrivate(r){var P=['score','level','answers','item6'];var o={};Object.keys(r).forEach(function(k){if(P.indexOf(k)===-1)o[k]=r[k];});return o;}
function jteFsSave(dateKey,day){
  const e=jteEmail();if(!_db||!e)return;
  const linked=day.linked||[];
  Promise.all(linked.map(function(r){return (window.BsrsScore&&window.BsrsScore.toCloudRec)?window.BsrsScore.toCloudRec(r):Promise.resolve(_bsrsStripPrivate(r));}))
   .then(function(cloudLinked){
     const cloudDay=Object.assign({},day,{linked:cloudLinked});
     return _db.collection('users').doc(e.toLowerCase().trim()).collection('daily').doc(dateKey).set(cloudDay,{merge:true});
   }).catch(function(err){console.warn('Firestore write failed',err);});
}
function jteWriteRecord(rec){
  const k=jteKey(),today=jteTodayKey(),all=jteAll();
  const day=all[today]||{moods:[],energy:5,note:'',tags:[],linked:[],createdAt:new Date().toISOString()};
  if(!day.linked)day.linked=[];
  day.linked.push(rec);day.updatedAt=new Date().toISOString();
  all[today]=day;localStorage.setItem(k,JSON.stringify(all));
  jteFsSave(today,day);
}
function _flattenBsrs(all){var out=[];Object.keys(all).forEach(function(dk){(all[dk].linked||[]).forEach(function(l){if(l.source==='BSRS')out.push(l);});});out.sort(function(a,b){return (a.ts||'').localeCompare(b.ts||'');});return out;}
function jteFsLoadDays(){
  const e=jteEmail();if(!_db||!e)return Promise.resolve({});
  return _db.collection('users').doc(e.toLowerCase().trim()).collection('daily').get()
   .then(function(snap){var days={};snap.forEach(function(doc){days[doc.id]=doc.data();});return days;})
   .catch(function(){return {};});
}
/* async：把雲端 daily 併回本機、hydrate localStorage，回傳攤平清單（時間正序） */
function jteListRecordsMerged(){
  const localAll=jteAll();
  if(!window.BsrsScore||!window.BsrsScore.mergeCloud)return Promise.resolve(_flattenBsrs(localAll));
  return jteFsLoadDays().then(function(cloudDays){
    return window.BsrsScore.mergeCloud(localAll,cloudDays);
  }).then(function(mergedAll){
    try{localStorage.setItem(jteKey(),JSON.stringify(mergedAll));}catch(e){}
    return _flattenBsrs(mergedAll);
  });
}
function jteDeleteRecord(id){
  const k=jteKey(),all=jteAll();let touched=null;
  Object.keys(all).forEach(function(dk){
    if(!all[dk].linked)return;
    const before=all[dk].linked.length;
    all[dk].linked=all[dk].linked.filter(function(l){return l.id!==id;});
    if(all[dk].linked.length!==before)touched=dk;
  });
  if(touched){all[touched].updatedAt=new Date().toISOString();localStorage.setItem(k,JSON.stringify(all));jteFsSave(touched,all[touched]);}
}

/* —— Google 登入（惰性）—— */
var _jtePendingSave=null,_jteGoogleReady=false;
var JTE_CLIENT_ID='1052529942242-jvr7ik3f7r987l5lq889nrfkjheoovg7.apps.googleusercontent.com';
function _jteHandleCredential(resp){
  var p=JSON.parse(atob(resp.credential.split('.')[1]));
  localStorage.setItem('jte_user_email',p.email);
  localStorage.setItem('jte_user_name',p.name||p.email);

  if(window.jteUserbarRefresh)window.jteUserbarRefresh();

}
function _jteInitGoogle(){
  if(_jteGoogleReady)return;_jteGoogleReady=true;
  google.accounts.id.initialize({client_id:JTE_CLIENT_ID,ux_mode:'popup',callback:_jteHandleCredential});
}
var _jteGsiTimer=setInterval(function(){
  if(window.google&&google.accounts){clearInterval(_jteGsiTimer);_jteInitGoogle();}
},300);
function jteCheckLoginThenSave(saveFn){
  if(jteEmail()){saveFn();return;}
  _jtePendingSave=saveFn;
  var modal=document.getElementById('jte-login-modal');modal.style.display='flex';
  var t=setInterval(function(){
    if(_jteGoogleReady&&window.google){
      clearInterval(t);
      var btn=document.getElementById('jte-gsi-btn');
      if(btn&&!btn.hasChildNodes())
        google.accounts.id.renderButton(btn,{theme:'outline',size:'large',width:280,text:'signin_with',locale:'zh-TW'});
    }
  },100);
}
function jteCloseLogin(){var m=document.getElementById('jte-login-modal');if(m)m.style.display='none';_jtePendingSave=null;}
window.jteLogin=function(){jteCheckLoginThenSave(function(){location.reload();});};
window.jteLogout=function(){localStorage.removeItem('jte_user_email');localStorage.removeItem('jte_user_name');localStorage.removeItem('jte_user_picture');if(window.google&&google.accounts)try{google.accounts.id.disableAutoSelect();}catch(e){}location.reload();};

/* ============================================================
   趨勢頁
   ============================================================ */
// HTML 跳脫：歷史/趨勢卡片用 innerHTML 組裝，使用者資料與雲端解密內容插入前都要跳脫，防 XSS（比照 ven-i 的 _h）。
function _h(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var _bsrsRenderToken=0;
function renderTrend(){
  state.mode='trend';
  var my=++_bsrsRenderToken;
  clearAll();bar.innerHTML='';progressEl.innerHTML='';
  const d=document.createElement('div');d.className='step';
  d.appendChild(backHomeLink());
  d.insertAdjacentHTML('beforeend','<h2 style="font-family:\'Noto Serif TC\',serif;font-weight:700;font-size:20px;color:var(--accent);margin:4px 0 14px">'+_h(jteT('trend.title','我的情緒趨勢'))+'</h2>');
  // 動作列：回去再測
  const inner=document.createElement('div');inner.className='bar-inner';
  const test=document.createElement('button');test.className='btn btn-primary';
  test.textContent=jteT('trend.btn.test','做一次測驗');
  test.onclick=function(){state.answers=[null,null,null,null,null,null];renderQuiz();};
  inner.appendChild(test);bar.appendChild(inner);

  if(!jteEmail()){
    d.insertAdjacentHTML('beforeend','<p class="lead">'+_h(jteT('trend.login.lead','登入後，你存過的每次心情溫度都會在這裡，看得到自己的變化。'))+'</p>');
    const btn=document.createElement('button');btn.className='btn btn-primary';btn.style.width='100%';
    btn.textContent=jteT('trend.login.btn','登入查看');
    btn.onclick=function(){jteCheckLoginThenSave(function(){renderTrend();});};
    d.appendChild(btn);
    // 本機若有記錄也顯示
    const localList=_flattenBsrs(jteAll());
    if(localList.length){d.insertAdjacentHTML('beforeend','<p class="lead" style="margin-top:18px">'+_h(jteT('trend.local.label','這個裝置上的記錄：'))+'</p>');_renderTrendBody(localList,d);}
    app.appendChild(d);return;
  }
  const pbar=document.createElement('div');pbar.className='priv-bar';
  d.appendChild(pbar);
  _renderPrivacyBar(pbar);
  const loading=document.createElement('p');loading.className='lead';loading.textContent=jteT('trend.loading','載入中…');
  d.appendChild(loading);
  app.appendChild(d);
  jteListRecordsMerged().then(function(list){
    if(my!==_bsrsRenderToken)return;
    if(loading&&loading.parentNode)loading.parentNode.removeChild(loading);
    _renderTrendBody(list,d);
  });
}
function _renderPrivacyBar(box){
  if(!window.JtePrivacy){box.innerHTML='';return;}
  box.innerHTML='<span class="priv-ok" style="color:var(--ink-faint)">'+_h(jteT('priv.checking','私密同步：檢查中…'))+'</span>';
  Promise.resolve(JtePrivacy.isEnabled()).then(function(enabled){
    if(!enabled){
      box.innerHTML='<button class="priv-btn">'+_h(jteT('priv.enable','🔒 開啟跨裝置加密同步'))+'</button> <a href="#" class="priv-link priv-learn">'+_h(jteT('priv.learn','了解隱私'))+'</a>';
      box.querySelector('.priv-btn').onclick=function(){JtePrivacy.enable().then(function(){renderTrend();}).catch(function(){});};
      _bindLearn(box);
      return;
    }
    if(!JtePrivacy.isUnlocked()){
      box.innerHTML='<button class="priv-btn">'+_h(jteT('priv.unlock','🔓 解鎖'))+'</button> <a href="#" class="priv-link priv-change">'+_h(jteT('priv.change','換密語'))+'</a> <a href="#" class="priv-link priv-learn">'+_h(jteT('priv.learn','了解隱私'))+'</a>';
      box.querySelector('.priv-btn').onclick=function(){JtePrivacy.unlock().then(function(){renderTrend();}).catch(function(){});};
      box.querySelector('.priv-change').onclick=function(ev){ev.preventDefault();JtePrivacy.changePassphrase().then(function(){renderTrend();}).catch(function(){});};
      _bindLearn(box);
      return;
    }
    box.innerHTML='<span class="priv-ok">'+_h(jteT('priv.synced','✓ 已加密同步'))+'</span> <a href="#" class="priv-link priv-lock">'+_h(jteT('priv.locked','鎖定'))+'</a> <a href="#" class="priv-link priv-learn">'+_h(jteT('priv.learn','了解隱私'))+'</a>';
    box.querySelector('.priv-lock').onclick=function(ev){ev.preventDefault();JtePrivacy.lock();renderTrend();};
    _bindLearn(box);
  }).catch(function(){box.innerHTML='';});
}
function _bindLearn(box){
  var el=box.querySelector('.priv-learn');
  if(el)el.onclick=function(ev){ev.preventDefault();if(window.showPrivacyInfo)showPrivacyInfo();};
}
const LEVEL_BADGE_ZH={good:'良好',mild:'輕度',moderate:'中度',severe:'重度'};
const LEVEL_BADGE_KEY={good:'badge.good',mild:'badge.mild',moderate:'badge.moderate',severe:'badge.severe'};
function _renderTrendBody(list,d){
  if(!list||!list.length){
    d.insertAdjacentHTML('beforeend','<p class="lead">'+_h(jteT('trend.empty','還沒有記錄。做一次測驗，把這一刻的溫度存下來吧。'))+'</p>');
    return;
  }
  // 折線圖（總分 0-20 over time）
  d.appendChild(_buildTrendSvg(list));
  // 卡片（最新在上）
  const sorted=list.slice().sort(function(a,b){return (b.ts||'').localeCompare(a.ts||'');});
  sorted.forEach(function(l){
    const card=document.createElement('div');card.className='hist-card';
    const lvl=(l.level||'').toString();
    const when=(l.ts||'').slice(0,16).replace('T',' ');
    const sc=(l.score!=null)?l.score:'—';
    const badgeLbl=jteT(LEVEL_BADGE_KEY[lvl]||'badge.'+lvl, LEVEL_BADGE_ZH[lvl]||'');
    const i6=Number(l.item6||0);
    const crisisFlag=( (Number(l.score)||0)>=15 || i6>=2 );
    card.innerHTML='<div class="hist-head"><span class="hist-badge b-'+_h(lvl)+'">'+_h(badgeLbl)+'</span>'+
      '<span class="hist-score">'+_h(String(sc))+' / 20</span>'+
      '<span class="hist-when">'+_h(when)+'</span></div>'+
      (crisisFlag?'<div class="hist-crisis">'+_h(jteT('hist.crisis.flag','⚠ 這次達到需要關注的程度。安心專線 1925 隨時都在。'))+'</div>':'')+
      '<div class="hist-ops"><button class="hist-del">'+_h(jteT('hist.del','刪除'))+'</button></div>';
    card.querySelector('.hist-del').onclick=function(){
      if(confirm(jteT('hist.del.confirm','確定刪除這筆記錄？'))){jteDeleteRecord(l.id);renderTrend();}
    };
    d.appendChild(card);
  });
}
function _buildTrendSvg(listAsc){
  // listAsc 已時間正序
  const wrap=document.createElement('div');wrap.className='trend-wrap';
  const W=520,H=160,padL=28,padR=14,padT=14,padB=22;
  const pts=listAsc.filter(function(l){return l.score!=null;}).map(function(l){return Number(l.score)||0;});
  if(pts.length===0){wrap.innerHTML='<p class="lead" style="margin:0">'+_h(jteT('trend.no.scores','尚無可繪製的分數（解鎖後可看見私密分數）。'))+'</p>';return wrap;}
  const n=pts.length;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  function x(i){return padL + (n===1?innerW/2:innerW*i/(n-1));}
  function y(v){return padT + innerH*(1 - v/20);}
  let grid='';
  [0,5,10,15,20].forEach(function(g){
    const gy=y(g);
    grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="#e3e8f0" stroke-width="1"/>'+
      '<text x="'+(padL-6)+'" y="'+(gy+3)+'" font-size="9" fill="#8a93a3" text-anchor="end">'+g+'</text>';
  });
  let path='';
  pts.forEach(function(v,i){path+=(i===0?'M':'L')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';});
  let dots='';
  pts.forEach(function(v,i){
    const col=v<=5?'#2e8b57':v<=9?'#b8860b':v<=14?'#c2631f':'#c0392b';
    dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.5" fill="'+col+'"/>';
  });
  wrap.innerHTML='<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    grid+'<path d="'+path.trim()+'" fill="none" stroke="#003D7C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
  return wrap;
}
