<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>jte-privacy tests</title>
<script src="jte-crypto.js"></script>
<script>window.__JTE_PRIVACY_TEST = true;</script>
<script src="jte-privacy.js"></script>
</head>
<body>
<pre id="out">running...</pre>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
const lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
function assert(c, m){ if(!c) throw new Error(m || 'assert failed'); }
function eq(a, b, m){ if(a !== b) throw new Error((m||'eq') + ' got['+a+'] want['+b+']'); }
async function check(name, fn){
  try { await fn(); pass++; log('PASS ' + name); }
  catch (e){ fail++; log('FAIL ' + name + ' :: ' + (e && e.message || e)); }
}

// fake Firestore：支援 .collection('users').doc(email).get()/.set(data,{merge})
function makeFakeDb(){
  const store = {}; // email -> doc data
  return {
    _store: store,
    collection(){ return {
      doc(id){ return {
        get(){ return Promise.resolve({ exists: id in store, data(){ return store[id]; } }); },
        set(data, opts){ store[id] = (opts && opts.merge) ? Object.assign({}, store[id], data) : data; return Promise.resolve(); }
      }; }
    }; }
  };
}

function freshPrivacy(seedBlob){
  const db = makeFakeDb();
  if (seedBlob) db._store['u@x.com'] = { crypto: seedBlob };
  JtePrivacy._reset();
  JtePrivacy._setBackend({ db: db, email: 'u@x.com' });
  return db;
}

async function run(){
  assert(typeof crypto !== 'undefined' && crypto.subtle, 'WebCrypto unavailable (need secure context)');
  assert(typeof JteCrypto === 'object', 'JteCrypto 應載入');
  assert(typeof JtePrivacy === 'object', 'JtePrivacy 應載入');

  // 測項於後續 Task 插入此處 —— 標記：TESTS_HERE
  await check('showInfo() 開出隱私聲明 modal、含關鍵承諾文字', async () => {
    var m0 = document.getElementById('jte-privacy-info'); if (m0) m0.remove();
    JtePrivacy.showInfo();
    const m = document.getElementById('jte-privacy-info');
    assert(m, 'modal 應存在');
    assert(/只有你看得到/.test(m.textContent), '含「只有你看得到」');
    assert(/連我們也解不開|不會上傳/.test(m.textContent), '含加密或本機承諾');
    assert(typeof window.showPrivacyInfo === 'function', 'window.showPrivacyInfo 已掛');
    m.remove();
  });

  // === Task 2: 啟用狀態＋Firestore blob 存取 ===
  await check('未啟用使用者 isEnabled()=false', async () => {
    freshPrivacy(null);
    eq(await JtePrivacy.isEnabled(), false, 'isEnabled');
  });
  await check('已有 crypto blob → isEnabled()=true', async () => {
    const s = await JteCrypto.setup('pw');
    freshPrivacy(s.blob);
    eq(await JtePrivacy.isEnabled(), true, 'isEnabled');
  });
  await check('未登入（email 空）→ isEnabled()=false 不丟例外', async () => {
    JtePrivacy._reset(); JtePrivacy._setBackend({ db: makeFakeDb(), email: '' });
    eq(await JtePrivacy.isEnabled(), false, '空 email');
  });

  // === Task 3: session DEK＋記住裝置＋核心啟用/解鎖/重設邏輯 ===
  const DEKKEY = 'jte_dek_u@x.com';
  function clearDekStores(){ sessionStorage.removeItem(DEKKEY); localStorage.removeItem(DEKKEY); }
  await check('_doEnable 設定密語→存 blob→isEnabled/isUnlocked 皆 true', async () => {
    const db = freshPrivacy(null); clearDekStores();
    const rec = await JtePrivacy._doEnable('pw-enable');
    assert(typeof rec === 'string' && rec.length >= 20, '應回傳恢復碼供顯示');
    eq(!!db._store['u@x.com'].crypto, true, 'blob 已存');
    eq(JtePrivacy.isUnlocked(), true, '啟用後即解鎖');
  });
  await check('_doUnlock 正確密語→解鎖；私密欄位可加解密', async () => {
    const s = await JteCrypto.setup('pw-x'); freshPrivacy(s.blob); clearDekStores();
    eq(JtePrivacy.isUnlocked(), false, '初始鎖定');
    await JtePrivacy._doUnlock('pw-x', false);
    eq(JtePrivacy.isUnlocked(), true, '解鎖成功');
  });
  await check('_doUnlock 錯密語→reject 且維持鎖定', async () => {
    const s = await JteCrypto.setup('right'); freshPrivacy(s.blob); clearDekStores();
    let threw = false;
    try { await JtePrivacy._doUnlock('wrong', false); } catch(e){ threw = true; }
    assert(threw, '錯密語應 reject');
    eq(JtePrivacy.isUnlocked(), false, '仍鎖定');
  });
  await check('記住裝置：remember=true 寫 localStorage；false 只寫 sessionStorage', async () => {
    const s = await JteCrypto.setup('pw'); freshPrivacy(s.blob); clearDekStores();
    await JtePrivacy._doUnlock('pw', false);
    eq(localStorage.getItem(DEKKEY), null, 'false 不寫 localStorage');
    assert(sessionStorage.getItem(DEKKEY), 'false 有寫 sessionStorage');
    clearDekStores(); JtePrivacy.lock();
    await JtePrivacy._doUnlock('pw', true);
    assert(localStorage.getItem(DEKKEY), 'true 寫 localStorage');
  });
  await check('lock() 清掉所有 DEK 快取且 isUnlocked=false', async () => {
    const s = await JteCrypto.setup('pw'); freshPrivacy(s.blob); clearDekStores();
    await JtePrivacy._doUnlock('pw', true);
    JtePrivacy.lock();
    eq(JtePrivacy.isUnlocked(), false, '鎖定');
    eq(localStorage.getItem(DEKKEY), null, 'localStorage 清掉');
    eq(sessionStorage.getItem(DEKKEY), null, 'sessionStorage 清掉');
  });
  await check('忘記密語：_doRecover 用恢復碼重設密語→新密語可解鎖', async () => {
    const db = freshPrivacy(null); clearDekStores();
    const rec = await JtePrivacy._doEnable('old-pw');
    JtePrivacy.lock(); clearDekStores();
    await JtePrivacy._doRecover(rec, 'brand-new-pw');
    JtePrivacy.lock(); clearDekStores();
    await JtePrivacy._doUnlock('brand-new-pw', false);
    eq(JtePrivacy.isUnlocked(), true, '新密語可解鎖');
  });

  // === Task 4: 私密欄位 encryptPrivate/decryptPrivate ===
  await check('encryptPrivate→decryptPrivate 還原多欄位', async () => {
    const s = await JteCrypto.setup('pw'); freshPrivacy(s.blob); clearDekStores();
    await JtePrivacy._doUnlock('pw', false);
    const enc = await JtePrivacy.encryptPrivate({ question: '我該換工作嗎？', note: '其實已經想很久了' });
    assert(enc.question && enc.question.iv && enc.question.ct, '欄位應為 {iv,ct}');
    const out = await JtePrivacy.decryptPrivate(enc);
    eq(out.question, '我該換工作嗎？', 'question 還原'); eq(out.note, '其實已經想很久了', 'note 還原');
  });
  await check('未解鎖時 encryptPrivate throw', async () => {
    const s = await JteCrypto.setup('pw'); freshPrivacy(s.blob); clearDekStores(); JtePrivacy.lock();
    let threw = false;
    try { await JtePrivacy.encryptPrivate({ a: 'x' }); } catch(e){ threw = true; }
    assert(threw, '鎖定時應 throw');
  });
  await check('decryptPrivate 跳過非 {iv,ct} 欄位（向後相容明文）', async () => {
    const s = await JteCrypto.setup('pw'); freshPrivacy(s.blob); clearDekStores();
    await JtePrivacy._doUnlock('pw', false);
    const out = await JtePrivacy.decryptPrivate({ plain: '舊明文', enc: (await JtePrivacy.encryptPrivate({ x: 'hi' })).x });
    eq(out.plain, '舊明文', '非密文欄位原樣保留'); eq(out.enc, 'hi', '密文欄位解開');
  });

  // === Task 5: DOM modal 串接核心（程式驅動測試鉤子）===
  await check('enable() 開出 modal 且含密語輸入與恢復碼流程節點', async () => {
    freshPrivacy(null); clearDekStores();
    const p = JtePrivacy.enable();               // 不 await（等使用者）
    await new Promise(r => setTimeout(r, 50));
    const modal = document.getElementById('jte-privacy-modal');
    assert(modal, 'modal 應存在');
    assert(modal.querySelector('input[type=password]'), '應有密語輸入');
    // 模擬填入並送出：用 modal 暴露的測試鉤子完成（兩步：送出密語→確認已存恢復碼）
    assert(typeof JtePrivacy._modalSubmitEnable === 'function', '應提供測試送出鉤子');
    assert(typeof JtePrivacy._modalConfirmRecoverySaved === 'function', '應提供恢復碼確認鉤子');
    await JtePrivacy._modalSubmitEnable('pw-via-modal', 'pw-via-modal');  // 第一步：顯示恢復碼畫面
    assert(document.getElementById('jte-rec'), '應顯示恢復碼閘門畫面');
    assert(document.getElementById('jte-privacy-modal'), '恢復碼確認前 modal 仍開著');
    await JtePrivacy._modalConfirmRecoverySaved();                        // 第二步：勾「我已保存」＋完成
    const rec = await p;                          // enable() resolve（恢復碼閘門已通過）
    eq(JtePrivacy.isUnlocked(), true, '啟用後解鎖');
    assert(!document.getElementById('jte-privacy-modal'), 'modal 完成後關閉');
  });
  await check('恢復碼閘門：未經 _modalConfirmRecoverySaved 不會 resolve（無繞過路徑）', async () => {
    freshPrivacy(null); clearDekStores();
    let resolved = false;
    const p = JtePrivacy.enable();
    p.then(() => { resolved = true; });
    await new Promise(r => setTimeout(r, 30));
    await JtePrivacy._modalSubmitEnable('pw-gate-8', 'pw-gate-8');  // 只送密語，未確認恢復碼
    await new Promise(r => setTimeout(r, 30));
    eq(resolved, false, '只送密語不應 resolve（閘門擋住）');
    assert(document.getElementById('jte-rec'), '恢復碼畫面仍在');
    await JtePrivacy._modalConfirmRecoverySaved();              // 通過閘門才完成
    await p;
    eq(resolved, true, '確認後才 resolve');
  });
  await check('unlock() 經 modal 鉤子輸入正確密語→解鎖', async () => {
    const s = await JteCrypto.setup('pw-u'); freshPrivacy(s.blob); clearDekStores();
    const p = JtePrivacy.unlock();
    await new Promise(r => setTimeout(r, 50));
    await JtePrivacy._modalSubmitUnlock('pw-u', false);
    await p;
    eq(JtePrivacy.isUnlocked(), true, '解鎖');
  });

  // === I2: 切帳號/登出殘留 DEK ===
  await check('lock() 掃除所有 jte_dek_* 含其他帳號（防跨帳號殘留）', async () => {
    const s = await JteCrypto.setup('pw'); freshPrivacy(s.blob); clearDekStores();
    await JtePrivacy._doUnlock('pw', true);
    // 模擬另一帳號殘留在兩種 storage
    sessionStorage.setItem('jte_dek_other@x.com', 'AAAA');
    localStorage.setItem('jte_dek_other@x.com', 'AAAA');
    JtePrivacy.lock();
    eq(sessionStorage.getItem(DEKKEY), null, '當前帳號 session DEK 清掉');
    eq(localStorage.getItem(DEKKEY), null, '當前帳號 local DEK 清掉');
    eq(sessionStorage.getItem('jte_dek_other@x.com'), null, '其他帳號 session DEK 也清掉');
    eq(localStorage.getItem('jte_dek_other@x.com'), null, '其他帳號 local DEK 也清掉');
    eq(JtePrivacy.isUnlocked(), false, 'lock 後鎖定');
  });

  // === I3: changePassphrase 覆蓋 ===
  await check('核心路徑：_doChange 換新密語→舊密語失效、新密語可解鎖', async () => {
    const db = freshPrivacy(null); clearDekStores();
    await JtePrivacy._doEnable('orig-pw');          // 啟用即解鎖
    await JtePrivacy._doChange('changed-pw');        // 換新密語
    JtePrivacy.lock(); clearDekStores();
    let oldThrew = false;
    try { await JtePrivacy._doUnlock('orig-pw', false); } catch(e){ oldThrew = true; }
    assert(oldThrew, '舊密語應失效');
    eq(JtePrivacy.isUnlocked(), false, '舊密語未解鎖');
    await JtePrivacy._doUnlock('changed-pw', false);
    eq(JtePrivacy.isUnlocked(), true, '新密語可解鎖');
  });
  await check('modal 路徑：changePassphrase() 經 _modalSubmitChange 完成', async () => {
    const s = await JteCrypto.setup('start-pw'); freshPrivacy(s.blob); clearDekStores();
    await JtePrivacy._doUnlock('start-pw', false);   // 先解鎖→changePassphrase 直接進換密語 modal
    assert(typeof JtePrivacy._modalSubmitChange === 'function', '應提供換密語送出鉤子');
    const p = JtePrivacy.changePassphrase();
    await new Promise(r => setTimeout(r, 50));
    assert(document.getElementById('jte-ch-p1'), '應顯示換密語 modal');
    await JtePrivacy._modalSubmitChange('newer-pw', 'newer-pw');
    await p;
    assert(!document.getElementById('jte-privacy-modal'), 'modal 完成後關閉');
    JtePrivacy.lock(); clearDekStores();
    await JtePrivacy._doUnlock('newer-pw', false);
    eq(JtePrivacy.isUnlocked(), true, '新密語可解鎖');
  });

  // === C1 驗證：測試鉤子只在旗標開啟時掛上（正式站不存在）===
  await check('C1：測試旗標已開→底線鉤子存在；公開 API 永遠在', async () => {
    eq(window.__JTE_PRIVACY_TEST, true, '測試頁旗標應為 true');
    eq(typeof JtePrivacy._setBackend, 'function', '旗標開→_setBackend 存在');
    eq(typeof JtePrivacy._doChange, 'function', '旗標開→_doChange 存在');
    // 公開 API 無條件導出
    ['isEnabled','isUnlocked','enable','unlock','changePassphrase','lock','encryptPrivate','decryptPrivate']
      .forEach(k => eq(typeof JtePrivacy[k], 'function', '公開 API ' + k + ' 應存在'));
  });

  log('---'); log('DONE pass=' + pass + ' fail=' + fail);
  document.title = fail ? ('FAIL ' + fail) : 'OK';
  window.__done = true;
  // 回報最終結果給 runner（POST /__result）；直接開檔時 404 忽略。
  // 用法：python3 jte-testrun.py jte-privacy.test.html
  try { await fetch('/__result', { method: 'POST', body: lines.join('\n') }); } catch (e) {}
}
window.__done = false;
run();
</script>
</body></html>
