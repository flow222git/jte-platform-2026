<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八態能格 · 動畫解說</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--light:#ecdcb8;--soft:#b7a888;--gold:#e8c07a;--warm:#f0cf90}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(130% 100% at 50% 30%,#2b2620 0%,#1c1812 50%,#120f0a 100%);
    color:var(--light);font-family:"Noto Sans TC",sans-serif;font-weight:300;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased;overflow:hidden}
  .eyebrow{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.34em;color:var(--soft);text-transform:uppercase;margin-bottom:10px;opacity:.7}
  svg{display:block;max-width:92vw}
  .cap{font-family:"Noto Serif TC",serif;font-weight:500;font-size:18.5px;line-height:1.85;text-align:center;
    color:var(--light);min-height:3.6em;max-width:380px;margin:18px auto 0;transition:opacity .6s;letter-spacing:.04em;font-feature-settings:"palt"}
  .cap .em{color:var(--warm)} .cap .ok{color:var(--gold)}
  .dots{display:flex;gap:8px;margin-top:16px}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(236,220,184,.22);transition:.4s}
  .dots i.on{background:var(--gold);width:18px;border-radius:3px;box-shadow:0 0 8px rgba(232,192,122,.6)}
  button{font-family:"Noto Serif TC",serif;font-size:13.5px;background:transparent;color:var(--light);border:1px solid rgba(236,220,184,.45);
    border-radius:999px;padding:8px 22px;cursor:pointer;letter-spacing:.1em;transition:.2s;margin-top:16px}
  button:hover{background:var(--light);color:#1c1812}
</style></head>
<body>
<div class="eyebrow">OCTENSO · 八態能格</div>
<svg id="svg" width="360" height="372" viewBox="0 0 360 372">
  <defs>
    <filter id="bloom" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="coreg"><stop offset="0%" stop-color="#f4dca0" stop-opacity=".9"/><stop offset="100%" stop-color="#f4dca0" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="rings"></g>
  <path id="curve" fill="none" stroke="#e8c07a" stroke-width="1.4" opacity="0" filter="url(#bloom)"></path>
  <path id="curve2" fill="none" stroke="#f0cf90" stroke-width="1" opacity="0"></path>
  <circle id="core" cx="180" cy="180" r="26" fill="url(#coreg)" opacity="0"/>
  <g id="rays"></g><g id="halos"></g><g id="pts"></g><g id="labels"></g>
  <text id="sys" x="180" y="176" text-anchor="middle" font-family="'Noto Serif TC',serif" font-size="16" font-weight="500" fill="#f0cf90" opacity="0"></text>
  <text id="sys2" x="180" y="197" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12" fill="#b7a888" opacity="0"></text>
</svg>
<div class="cap" id="cap"></div>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
<button id="replay" style="display:none">重看一次</button>

<script>
var CX=180,CY=180,R0=30,MAXOUT=112;
var E=[{sym:'☰',nm:'開創'},{sym:'☳',nm:'行動'},{sym:'☵',nm:'沉澱'},{sym:'☶',nm:'喊停'},
       {sym:'☷',nm:'承接'},{sym:'☴',nm:'拓展'},{sym:'☲',nm:'展現'},{sym:'☱',nm:'交流'}];
var GROUPS=[{nm:'天地 · 建構',sub:'開創 ↔ 承接',a:0,b:4},{nm:'雷風 · 推動',sub:'行動 ↔ 拓展',a:1,b:5},
            {nm:'水火 · 認知',sub:'沉澱 ↔ 展現',a:2,b:6},{nm:'山澤 · 調節',sub:'喊停 ↔ 交流',a:3,b:7}];
var NS='http://www.w3.org/2000/svg';
// 導引同心圓（會呼吸流動的底圖）
var ringEls=[], ringBase=[44,84,122];
ringBase.forEach(function(r){ var c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',CX);c.setAttribute('cy',CY);c.setAttribute('r',r);c.setAttribute('fill','none');
  c.setAttribute('stroke','rgba(240,207,144,.14)');c.setAttribute('stroke-width','1');document.getElementById('rings').appendChild(c); ringEls.push(c); });
var ringT0=performance.now();
(function flowRings(ts){
  ringEls.forEach(function(c,i){ var k=Math.sin((ts-ringT0)/4200*Math.PI*2 + i*1.4);
    c.setAttribute('r', ringBase[i] + k*6);
    c.setAttribute('stroke','rgba(240,207,144,'+(0.07+0.07*(k*.5+.5)).toFixed(3)+')'); });
  requestAnimationFrame(flowRings);
})(ringT0);
var rays=[],halos=[],pts=[],labs=[];
E.forEach(function(e,i){
  var ray=document.createElementNS(NS,'line'); ray.setAttribute('x1',CX);ray.setAttribute('y1',CY);
  ray.setAttribute('stroke','#f5e6c0');ray.setAttribute('stroke-width','0.7');ray.setAttribute('opacity','0');ray.setAttribute('stroke-linecap','round');
  document.getElementById('rays').appendChild(ray); rays.push(ray);
  var h=document.createElementNS(NS,'circle'); h.setAttribute('fill','#f0cf90');h.setAttribute('opacity','0');h.setAttribute('filter','url(#bloom)');
  document.getElementById('halos').appendChild(h); halos.push(h);
  var p=document.createElementNS(NS,'circle'); p.setAttribute('fill','#fbeec4');p.setAttribute('opacity','0');
  document.getElementById('pts').appendChild(p); pts.push(p);
  var l=document.createElementNS(NS,'text'); l.setAttribute('text-anchor','middle');l.setAttribute('font-family','"Noto Serif TC",serif');
  l.setAttribute('font-size','15');l.setAttribute('fill','#e6d6ad');l.setAttribute('opacity','0');l.textContent=e.sym;
  document.getElementById('labels').appendChild(l); labs.push(l);
});
// state: len(0-1) op(0-1) lum(0-1.3 光量)
var state=E.map(function(){return {len:.5,op:0,lum:.5};});
function tip(i,len){ var a=(-90+i*45)*Math.PI/180; return {x:CX+Math.cos(a)*(R0+len*MAXOUT), y:CY+Math.sin(a)*(R0+len*MAXOUT), a:a}; }
function render(){
  state.forEach(function(s,i){
    var t=tip(i,s.len);
    rays[i].setAttribute('x2',t.x);rays[i].setAttribute('y2',t.y);rays[i].setAttribute('opacity',s.op*.42);
    halos[i].setAttribute('cx',t.x);halos[i].setAttribute('cy',t.y);halos[i].setAttribute('r',5+s.lum*15);halos[i].setAttribute('opacity',s.op*.16*s.lum);
    pts[i].setAttribute('cx',t.x);pts[i].setAttribute('cy',t.y);pts[i].setAttribute('r',1.8+s.lum*2.6);pts[i].setAttribute('opacity',s.op);
    var lr=R0+s.len*MAXOUT+15; labs[i].setAttribute('x',CX+Math.cos(t.a)*lr);labs[i].setAttribute('y',CY+Math.sin(t.a)*lr+4);
  });
}
function curvePath(){ var p=state.map(function(s,i){return tip(i,s.len);}),n=8,d='';
  for(var i=0;i<n;i++){var p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    if(i===0)d+='M'+p1.x.toFixed(1)+','+p1.y.toFixed(1);
    d+='C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+','+(p1.y+(p2.y-p0.y)/6).toFixed(1)+' '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+','+(p2.y-(p3.y-p1.y)/6).toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);}
  return d+'Z'; }
// tween
var anims=[],_pending=null;
function tw(i,prop,to,dur,delay){anims.push({i:i,prop:prop,from:null,to:to,dur:dur,delay:delay||0,t0:null});}
function ez(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function loop(ts){var alive=false;
  anims.forEach(function(an){ if(an.t0===null)an.t0=ts+an.delay; if(ts<an.t0){alive=true;return;}
    if(an.from===null)an.from=state[an.i][an.prop]; var k=Math.min(1,(ts-an.t0)/an.dur);
    state[an.i][an.prop]=an.from+(an.to-an.from)*ez(k); if(k<1)alive=true; });
  anims=anims.filter(function(an){return an.t0===null||(ts-an.t0)/an.dur<1;});
  render(); if(curveOn)document.getElementById('curve').setAttribute('d',curvePath()),document.getElementById('curve2').setAttribute('d',curvePath());
  if(alive||anims.length)requestAnimationFrame(loop); else if(_pending){var p=_pending;_pending=null;p();}
}
var curveOn=false;
function play(){requestAnimationFrame(loop);}
function cap(h){var c=document.getElementById('cap');c.style.opacity=0;setTimeout(function(){c.innerHTML=h;c.style.opacity=1;},300);}
function dot(n){var ds=document.getElementById('dots').children;for(var i=0;i<ds.length;i++)ds[i].className=(i===n)?'on':'';}
function fade(id,o){document.getElementById(id).setAttribute('opacity',o);}

function beat1(){ dot(0); fade('core','1'); cap('幾千年前，古人用八卦，<br>觀察天地間運行的能量。');
  E.forEach(function(e,i){ tw(i,'op',.72,1100,i*120); tw(i,'lum',.7,1100,i*120);
    setTimeout(function(){labs[i].textContent=E[i].sym;labs[i].setAttribute('opacity','.78');},i*120); });
  play(); setTimeout(beat2,4200); }

function beat2(){ dot(1); cap('這些能量兩兩相對——<br>組成四組系統。'); var t=500;
  GROUPS.forEach(function(g){ setTimeout(function(){
      fade('sys','1');fade('sys2','1');document.getElementById('sys').textContent=g.nm;document.getElementById('sys2').textContent=g.sub;
      [g.a,g.b].forEach(function(i){ tw(i,'lum',.95,700,0); tw(i,'op',1,600,0);
        labs[i].textContent=E[i].sym+E[i].nm; labs[i].setAttribute('opacity','1'); });
      // 對待連線：兩極之間發光線（暫用 ray 的不適合，改用 curve? 簡化：兩點都亮即可表達一組）
      play();
    },t); t+=1450; });
  setTimeout(function(){ fade('sys','0');fade('sys2','0'); beat3(); }, t+200); }

function beat3(){ dot(2); var d=1; cap('而這八種能量，<br>也正在你的生活裡運作。');
  setTimeout(function(){ E.forEach(function(e,i){if(i!==d){tw(i,'op',.2,600,0);tw(i,'lum',.3,600,0);} labs[i].setAttribute('opacity', i===d?'1':'0');});
    tw(d,'lum',.25,700,0); cap('用得太少，它<span class="em">睡著</span>了；'); play(); },2200);
  setTimeout(function(){ tw(d,'lum',.9,700,0); cap('用得<span class="ok">剛好</span>，是你的養分；'); play(); },4200);
  setTimeout(function(){ tw(d,'lum',1.3,700,0); cap('用得<span class="em">太過</span>，反而刺眼、反而累。'); play(); },6000);
  setTimeout(function(){ cap('<b>能量八態，<span class="ok">過猶不及</span>。</b>'); },7900);
  setTimeout(beat4,9800); }

function beat4(){ dot(3); curveOn=true; fade('curve','.55');fade('curve2','.5');
  var prof=[{l:.78,u:1.0},{l:.96,u:1.3},{l:.36,u:.35},{l:.42,u:.4},{l:.66,u:.95},{l:.72,u:.95},{l:.8,u:1.0},{l:.6,u:.9}];
  E.forEach(function(e,i){ tw(i,'op',1,900,i*60); tw(i,'len',prof[i].l,1000,i*60); tw(i,'lum',prof[i].u,1000,i*60);
    setTimeout(function(){labs[i].setAttribute('opacity','0');},i*60); }); // 收掉標籤，留乾淨光圓
  cap('八股各自定到你的高低與分寸——<br>連成一個圓，<b>就是此刻的你</b>。'); play();
  setTimeout(function(){ cap('這不是占卜——<br>是古人的智慧，<span class="ok">照見當下的你</span>。'); breathe();
    document.getElementById('replay').style.display='inline-block'; },3600); }
var breathing=false;
function breathe(){ breathing=true; var base=state.map(function(s){return s.len;}),lb=state.map(function(s){return s.lum;}),t0=performance.now();
  (function b(ts){ if(!breathing)return; var k=Math.sin((ts-t0)/2600*Math.PI*2)*.5+.5;
    state.forEach(function(s,i){s.len=base[i]*(0.96+0.04*k);s.lum=lb[i]*(0.9+0.18*k);}); render();
    var d=curvePath();document.getElementById('curve').setAttribute('d',d);document.getElementById('curve2').setAttribute('d',d);
    requestAnimationFrame(b); })(t0); }
document.getElementById('replay').onclick=function(){ breathing=false;anims=[];curveOn=false;this.style.display='none';
  fade('curve','0');fade('curve2','0');fade('core','0');
  state=E.map(function(){return {len:.5,op:0,lum:.5};}); E.forEach(function(e,i){labs[i].setAttribute('opacity','0');labs[i].textContent=E[i].sym;}); render();
  setTimeout(beat1,300); };
render(); setTimeout(beat1,500);
</script>
</body></html>
