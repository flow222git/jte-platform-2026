<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>呼吸覺察 · 臉部相機 PoC</title>
<style>
  :root{--bg:#0f1117;--card:#1a1e27;--ink:#eef1f6;--mut:#8a93a3;--line:#2a2f3a;--g:#46c08a;--y:#d8b24a;--r:#d2654f;--ac:#5b9bd5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans TC",sans-serif;
    line-height:1.6;padding:16px;max-width:520px;margin:0 auto;-webkit-font-smoothing:antialiased}
  h1{font-size:18px;font-weight:600;margin-bottom:3px}
  .sub{font-size:12px;color:var(--mut);margin-bottom:14px}
  .stage{position:relative;width:100%;aspect-ratio:3/4;max-height:46vh;background:#000;border-radius:14px;overflow:hidden;margin-bottom:12px}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .box{position:absolute;left:50%;top:42%;width:46%;height:34%;transform:translate(-50%,-50%);
    border:2px dashed rgba(255,255,255,.7);border-radius:50%/40%;pointer-events:none}
  .box span{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:11px;color:#fff;white-space:nowrap;text-shadow:0 1px 3px #000}
  .wave{width:100%;height:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:block;margin-bottom:10px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .stat .k{font-size:11px;color:var(--mut)} .stat .v{font-size:21px;font-weight:600;margin-top:2px}
  .stat .v small{font-size:12px;color:var(--mut);font-weight:400}
  .hold .v{color:var(--y)} .hold.on .v{color:var(--r)}
  .q-good{color:var(--g)} .q-weak{color:var(--y)} .q-bad{color:var(--r)}
  button{font-family:inherit;font-size:15px;width:100%;background:var(--ac);color:#fff;border:none;border-radius:12px;padding:13px;cursor:pointer}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);margin-top:8px}
  .hint{font-size:12.5px;color:var(--mut);line-height:1.8;margin-top:6px}
  .err{background:#3a2020;border:1px solid var(--r);border-radius:11px;padding:12px;font-size:13px;margin-bottom:10px}
  ol{margin:6px 0 0 18px;font-size:12.5px;color:var(--mut)} li{margin-bottom:3px}
</style></head>
<body>
<h1>呼吸覺察 · 臉部相機 PoC</h1>
<div class="sub">立起手機、臉放進框 → 正常呼吸 → 看下方波形有沒有跟著起伏；中途試著<b style="color:#eef1f6">閉氣幾秒</b>看會不會被抓到。</div>

<div id="err"></div>

<div class="stage" id="stage" style="display:none">
  <video id="cam" playsinline muted autoplay></video>
  <div class="box"><span>臉（額頭+臉頰）放進框內</span></div>
</div>

<canvas class="wave" id="wave" style="display:none"></canvas>

<div class="stats" id="stats" style="display:none">
  <div class="stat"><div class="k">估計呼吸</div><div class="v"><span id="brpm">--</span> <small>次/分</small></div></div>
  <div class="stat hold" id="holdCard"><div class="k">屏息偵測</div><div class="v" id="hold">—</div></div>
  <div class="stat"><div class="k">脈搏(確認rPPG)</div><div class="v"><span id="bpm">--</span> <small>bpm</small></div></div>
  <div class="stat"><div class="k">訊號</div><div class="v" id="qual">—</div></div>
</div>

<button id="start">開始</button>
<button id="stop" class="ghost" style="display:none">停止</button>

<div class="hint" id="hint">
  PoC 目的：驗證「立著對臉」能不能抓到乾淨的呼吸節奏 + 屏息。
  <ol>
    <li>手機立穩、前鏡頭對臉，臉放進虛線框（額頭+臉頰）。</li>
    <li>光線充足、別大幅晃動（這階段先睜眼看波形）。</li>
    <li>正常呼吸約 20–30 秒，看綠色波形有沒有規律起伏。</li>
    <li>閉氣 5–8 秒，看「屏息偵測」會不會亮、波形會不會變平。</li>
  </ol>
</div>

<script>
var V=document.getElementById('cam'), W=document.getElementById('wave'), WX=W.getContext('2d');
var grab=document.createElement('canvas'), gx=grab.getContext('2d',{willReadFrequently:true});
grab.width=64; grab.height=64;
var stream=null, raf=null, prevROI=null;
var buf=[]; // {t, g(綠均), m(動量)}
var MAXSEC=26;

function showErr(m){ document.getElementById('err').innerHTML='<div class="err">'+m+'</div>'; }

document.getElementById('start').onclick=async function(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showErr('此裝置/瀏覽器不支援相機。請用手機 Chrome/Safari。'); return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}}); }
  catch(e){ showErr('無法開啟相機：'+(e.name||e)+'。請允許相機權限。'); return; }
  V.srcObject=stream;
  document.getElementById('start').style.display='none';
  document.getElementById('stop').style.display='block';
  ['stage','wave','stats'].forEach(function(id){document.getElementById(id).style.display='block';});
  sizeWave(); buf=[]; prevROI=null;
  loop();
};
document.getElementById('stop').onclick=function(){ stopCam(); document.getElementById('stop').style.display='none'; document.getElementById('start').style.display='block'; document.getElementById('start').textContent='重新開始'; };
function stopCam(){ if(raf)cancelAnimationFrame(raf); raf=null; if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;} }

function sizeWave(){ var dpr=window.devicePixelRatio||1; W.width=W.clientWidth*dpr; W.height=120*dpr; WX.scale(dpr,dpr); }

function loop(){
  raf=requestAnimationFrame(loop);
  if(!V.videoWidth) return;
  // 取畫面中央偏上（對應對位框：額頭+臉頰）
  gx.drawImage(V, V.videoWidth*0.27, V.videoHeight*0.22, V.videoWidth*0.46, V.videoHeight*0.40, 0,0,64,64);
  var d=gx.getImageData(0,0,64,64).data, gsum=0, msum=0, n=64*64;
  for(var i=0;i<d.length;i+=4){ gsum+=d[i+1]; if(prevROI){ msum+=Math.abs(d[i+1]-prevROI[i+1]); } }
  prevROI=d.slice ? d.slice() : new Uint8ClampedArray(d);
  var now=performance.now();
  buf.push({t:now, g:gsum/n, m:msum/n});
  while(buf.length && now-buf[0].t > MAXSEC*1000) buf.shift();
  if(buf.length>30) analyse();
}

function mean(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return a.length?s/a.length:0;}
function movavg(a,w){ var o=[],i,j; for(i=0;i<a.length;i++){var s=0,c=0; for(j=Math.max(0,i-w);j<=Math.min(a.length-1,i+w);j++){s+=a[j];c++;} o.push(s/c);} return o; }

function analyse(){
  var n=buf.length, dur=(buf[n-1].t-buf[0].t)/1000, fs=(n-1)/dur;
  if(fs<5) return;
  var g=buf.map(function(x){return x.g;});
  // 呼吸帶：先小窗平滑去掉脈搏(>~0.8Hz)，再大窗去趨勢 → 留 ~0.1–0.5Hz
  var hr=Math.max(2,Math.round(fs*0.5));      // 去脈搏
  var dr=Math.max(8,Math.round(fs*5));        // 去慢漂移
  var s1=movavg(g,hr), base=movavg(s1,dr), resp=[];
  for(var i=0;i<n;i++) resp.push(s1[i]-base[i]);
  // 振幅(近 6 秒) → 屏息：振幅塌下去
  var recentN=Math.min(n,Math.round(fs*6)), seg=resp.slice(n-recentN);
  var amp=0; for(i=0;i<seg.length;i++) amp+=Math.abs(seg[i]); amp/=seg.length;
  var allAmp=0; for(i=0;i<resp.length;i++) allAmp+=Math.abs(resp[i]); allAmp/=resp.length;
  // 呼吸率：數 resp 過零(正向)次數
  var cross=0; for(i=1;i<resp.length;i++){ if(resp[i-1]<=0&&resp[i]>0) cross++; }
  var brpm=Math.round(cross/dur*60);
  // 脈搏(確認 rPPG 有訊號)：g 去趨勢後過零
  var gd=[],gb=movavg(g,dr); for(i=0;i<n;i++) gd.push(g[i]-gb[i]);
  var pc=0; for(i=1;i<n;i++){ if(gd[i-1]<=0&&gd[i]>0) pc++; }
  var bpm=Math.round(pc/dur*60);
  // 訊號品質：呼吸振幅相對全段
  var qual = allAmp<0.15?'q-bad':(allAmp<0.4?'q-weak':'q-good');
  var qtxt = allAmp<0.15?'弱':(allAmp<0.4?'普通':'良好');
  var held = (amp < Math.max(0.12, allAmp*0.45)) && allAmp>0.2; // 近段振幅明顯低於整體
  // 顯示
  if(dur>8){
    document.getElementById('brpm').textContent=(brpm>=4&&brpm<=40)?brpm:'--';
    document.getElementById('bpm').textContent=(bpm>=40&&bpm<=160)?bpm:'--';
  }
  var hEl=document.getElementById('hold'), hc=document.getElementById('holdCard');
  hEl.textContent=held?'⚠️ 偵測到閉氣':'呼吸中';
  hc.className='stat hold'+(held?' on':'');
  var qEl=document.getElementById('qual'); qEl.textContent=qtxt; qEl.className='v '+qual;
  drawWave(resp, held);
}

function drawWave(resp, held){
  var w=W.clientWidth, h=120; WX.clearRect(0,0,w,h);
  if(resp.length<2) return;
  var mn=Infinity,mx=-Infinity; for(var i=0;i<resp.length;i++){var v=resp[i];if(v<mn)mn=v;if(v>mx)mx=v;}
  var rng=(mx-mn)||1;
  WX.beginPath(); WX.lineWidth=2.2; WX.strokeStyle=held?'#d8b24a':'#46c08a'; WX.lineJoin='round';
  for(i=0;i<resp.length;i++){ var x=w*i/(resp.length-1), y=h-8-(resp[i]-mn)/rng*(h-16); if(i===0)WX.moveTo(x,y);else WX.lineTo(x,y); }
  WX.stroke();
  // 中線
  WX.strokeStyle='rgba(255,255,255,.12)'; WX.lineWidth=1; WX.beginPath(); WX.moveTo(0,h/2);WX.lineTo(w,h/2);WX.stroke();
}
</script>
</body></html>
