# =====================================================
# 道理用透鏡層(三角形體檢)機器可讀定義
# daoliyong-lens-schema(版本以 meta.version 為準,現 0.3-draft)
# =====================================================
# 用途:八態鏡透鏡判讀之「⑤三角形體檢/⑥道理用參考」的唯一判準。
# 上游 spec:docs/superpowers/specs/2026-07-21-daoliyong-lens-integration-design.md
# 學理:吳怡「整體生命哲學三角形(道、理、用)」;萬物對應圖(真善美 × 元亨利貞 × 三才爻位)。
# 對齊北極星:meta A 同源/鏡子非算命/誠實邊界。
# 本檔只定「判準」;真善美/四德/三隅箴之 canonical 文本與八模式腳本在
# octenso/daoliyong-data.js(TRIANGLE/MODES),引用一律指名參照、不複寫內容。
# =====================================================

meta:
  version: "0.3.3-draft"
  date: "2026-07-23"
  status: "研究假設·待考"
  scope: "透鏡層⑤⑥段專用;G7 型素材(interview/observation)不適用,不輸出⑤⑥"
  guardrails_ref: "octenso-states-schema-v0.1.yaml#guardrails——G1–G8 全部適用於本檔判讀,凍結、不複製、不覆寫"
  canonical_ref: "octenso/daoliyong-data.js——TRIANGLE(真善美/四德/三隅箴文本)、MODES(八模式腳本)"
  verdicts_ref: "presence 值域沿用 states-schema:有料/薄/缺席(缺席=無資料,≠弱)"
  history: "v0.1 診斷層第一輪驗收完成(2 份真實素材+三值回饋,2026-07-21);v0.2-draft 新增判卦區塊(guapan),另計驗收;v0.3-draft 新增六爻子區塊(liuyao),v3 首判分歧(乾/兌)為立案案例;v0.3.1-draft 判讀紀律六律(雙盲#1 五缺口+Simon 以小觀大),博報堂裁定內坎(半象);v0.3.2-draft 雙盲#2 兩裁定入例句庫+道理用總綰入輸出(2026-07-22);v0.3.3-draft 邊界壓測四條回填(適用域宣告/主體同一性律/爻疑氾濫規則/法規理論文本次型,六案實證見 octenso/BOUNDARIES.md,Simon 2026-07-23 全收)"

# -----------------------------------------------------
# 三層定義(縱向:理→用→道)
# 注意:layers.li = 三角形之「理」,與八態卦 key 'li'(離)分屬不同 namespace
# -----------------------------------------------------
layers:
  li:
    名: "理"
    爻位: "地之位"
    價值: "真(客觀)"
    四德: "亨(事物通達)"
    核心提問: "真嗎?——主張憑什麼站得住"
    定位: "根基:客觀知識、理論、原則與內在修養"
    識別信號:
      語言線索:
        - "引出處與數據來源"
        - "方法論被說出(這個結論怎麼得到的)"
        - "原則與價值觀宣告:『我們的依據是…』『這是我們的底線』"
        - "主張與反駁靠證據不靠音量"
      行為線索:
        會議: "主張附根據;分歧以證據對決"
        文件/BP: "市場/技術根據、驗證邏輯、團隊專業累積可查"
        制度: "立法理由與原則條文"
    正例引文形狀: "『我們定這個價,是根據三個月的成本數據與兩輪訪談』"
    缺席判定:
      定義: "通篇主張無根、原則真空、憑感覺定案"
      注意: "缺席=無資料,不得推論為『沒學問』(G5)"
    混淆對照:
      vs_kan_八態: "坎問『真正的問題在哪』(向未知取料);理層問『已有的答案憑什麼』(根基實不實)"
      vs_li_八態: "離管講得清不清(成像);理層管講的東西有沒有根(地基)"
    禁止推論:
      - "理有料 ≠ 結論正確(G1)"
      - "理缺席 ≠ 沒學問,僅=本次素材無資料(G5)"

  yong:
    名: "用"
    爻位: "人之位"
    價值: "善(人間美德)"
    四德: "利與貞(造福與堅持)"
    核心提問: "善嗎?——理有沒有化為造福與堅持的實踐"
    定位: "貫通:理被轉化為實踐——決議化為分工、知識落為動作、原則落為程序"
    識別信號:
      語言線索:
        - "決議化為分工:『所以具體我們就…』"
        - "知識轉為動作、原則落為程序"
        - "應變與轉化安排(理論碰到現實時的調整)"
        - "落地條件被盤點(誰做、何時、缺什麼)"
      行為線索:
        會議: "理據討論後有落地安排"
        文件/BP: "執行路徑與資源對接具體可查"
        制度: "條文有可執行程序與對應機制"
    正例引文形狀: "『這套方法下週先在 A 店試,兩週後看數據調整』"
    缺席判定:
      定義: "自產病:滿紙理論、無一落地;原則喊得響、程序付之闕如"
      注意: "缺席=無資料,不得推論為『光說不練』(G4/G5——主詞是運作)"
    混淆對照:
      vs_zhen_kun_八態: "八態看功能有無(有沒有人啟動/承接,橫向);用層看貫通與否(理有沒有被轉成行動,縱向)。同一句引文可同時餵兩邊,判的是不同問題"
      vs_xun_八態: "手腕與滲透是巽的功能;用層只問『理→行』的橋在不在"
    禁止推論:
      - "用有料 ≠ 執行力強(G1)"
      - "用缺席 ≠ 光說不練的人,僅=本次素材無資料(G4/G5)"

  dao:
    名: "道"
    爻位: "天之位"
    價值: "大美"
    四德: "元(萬物創始)"
    核心提問: "美嗎?——格局有沒有和諧與生生不息"
    定位: "餘地:回歸自然的開放無私;任何理與用最終須反於道"
    識別信號:
      語言線索:
        - "退路與留白:『留兩成餘裕』『不做絕』"
        - "長期與自然視角:『十年後還撐得住嗎』"
        - "無私與公共考量(超出己方利害的估量)"
        - "對極端化的自我節制"
      行為線索:
        會議: "有人把『贏太滿』擋下來;輸贏之外的關係被顧到"
        文件/BP: "風險留白、永續安排、不吃乾抹淨的設計"
        制度: "例外通道、日落條款、退出機制"
    正例引文形狀: "『合約讓兩個點給對方,關係比這一單大』"
    缺席判定:
      定義: "盲目功利、零餘地、唯效率、極端化"
      注意: "缺席=無資料,不得推論為『唯利是圖』(G4/G5)"
    混淆對照:
      vs_gen_八態: "艮是喊停定界(功能動作);道層是整體格局的和諧與餘地(境界取向)"
      vs_kun_八態: "坤是接住人與事(承接動作);道層的無私是格局判斷,不是承接行為"
    禁止推論:
      - "道有料 ≠ 這個案子高尚(G1)"
      - "道缺席 ≠ 唯利是圖的人,僅=本次素材無資料(G4/G5)"

# -----------------------------------------------------
# 三隅箴警示(結構層警訊;三隅箴 canonical 文本見 TRIANGLE.*.jian;本節說法為判讀措辭,依 spec §2.2 定案)
# -----------------------------------------------------
sanyu_warnings:
  kongtan:
    名: "空談警示"
    觸發: "理缺席"
    說法: "道理懸空無根——高遠語彙滿場,主張查無依據"
  zichanbing:
    名: "自產病警示"
    觸發: "用缺席"
    說法: "理不落地——知識與原則未轉成任何實踐"
  weiyongwudao:
    名: "唯用無道警示"
    觸發: "道缺席,且理、用皆有料"
    說法: "韓非型結構:法則與操作推到極致而無餘地。原典明言此型走向僵化與危險;本鏡只指出結構,不預測此案結局(G1)"
    附註: "道缺席但理/用未皆強時,列一般『道層缺席』,不升級為本警示"

# -----------------------------------------------------
# 適用域宣告(v0.3.3 新增;邊界壓測六案實證,紀錄見 octenso/BOUNDARIES.md)
# -----------------------------------------------------
applicability:
  原則: "判讀對象=能積累行為、能回應回饋之單一運作主體;三條件缺一不判——單一運作主體 × 行為證據 × 同一時段"
  純文本不判: "純規範/理論文本(法典條文、理論體系)只有結構沒有運作,不判;轉列相關運作之理層素材,或補實踐素材(判決/執行/修法紀錄)後改宣告運作主體再判"
  語用檢查: "素材語用目的=對人評價/推薦/擇偶/錄取者,拒判並說明(G4/G6 延伸;G7 型素材照舊降級)"

# -----------------------------------------------------
# 輸出規格(⑤⑥段;①–④段規格在 states-schema,不動)
# -----------------------------------------------------
output_spec:
  第五段_三角形體檢:
    - "理/用/道逐層列 presence(有料/薄/缺席),一層不可省略"
    - "每層判定附逐字引文(G5);引不出來=缺席(無資料)"
    - "後接三隅箴警示(有則列、無則不列)"
  第六段_道理用參考:
    - "依⑤體檢+③強態圖景,對照 MODES 各模式之最佳應用與特徵,引用至多 2 個相應腳本"
    - "每次引用必含:模式名+副題、選用理由(附素材引文)、腳本要點、死角+防範(必附——憲法條文三)"
    - "措辭固定『此局面可考慮』(憲法條文四);相應性不足時明寫『本次無合適對策參考』,寧缺勿濫"
    - "禁止:預測結局(G1)、模式排名或優劣比較(G6)、『你/他是某模式的人』(G4——主詞永遠是這份運作)"
  適用範圍: "interview/observation 型(G7 降級)不輸出⑤⑥,明文註記『依 G7 不適用』"

# -----------------------------------------------------
# 驗收計畫(本檔何時算立起來;與 states-schema 的 v0.2 之路分開計算)
# -----------------------------------------------------
acceptance:
  - "step1: 三層定義與三隅箴由 Simon 逐條核准(2026-07-21 spec 流程已核)"
  - "step2: 至少 2 份真實素材試判⑤⑥"
  - "step3: 收使用者三值回饋(很像/部分像/不太像+最有感與最不服的判定),分歧回填混淆對照"
  - "step4: 收斂後才考慮正式立項"

# -----------------------------------------------------
# 判卦引擎(v0.2 新增,v0.3 增 liuyao 六爻子區塊;整塊=工作假說·待收斂)
# 本卦→變爻→之卦;剛=陽、柔=陰,卦由 daoliyong-data.js 之 MODES[].yao 反查(guaOf/bianOf,機械推導)
# -----------------------------------------------------
guapan:
  status: "工作假說·待收斂"
  聲明: "此卦由素材判讀推導,非起卦占斷;變爻是處方,不是預言。"
  四律:
    非占卜律: "爻由判讀而來(每爻附引文)、變由診斷與宣告而來——無一絲隨機;報告必附上方聲明"
    機械推導律: "AI 只判剛柔與安動,卦由 MODES[].yao 反查(guaOf/bianOf)自動得出;不得跳過判定直接『感覺是某卦』;同素材同判定必同卦"
    主詞律: "卦名給運作不給人——『此局呈乾象』可以,『你是乾卦』不行(G4)"
    不預測律: "之卦是參考路徑,不是『將會變成』;死角是結構警訊,不是命運(G1);收斂前不進正式產品文案"
  成卦門檻: "三爻皆判得出剛柔(各附逐字引文,G5);任一爻證據不足=不成卦,明文聲明+缺哪爻+補問;⑥退回 bestUse 對照引用"
  剛柔判準:
    li:
      剛: { 樣態: "立場鮮明、根基自信", 信號: ["明確原則與標準宣告", "方法論有主張(『我們的做法是』)", "依據直陳不繞"] }
      柔: { 樣態: "虛心開放、根基謙遜", 信號: ["承認知識邊界", "假設保持開放", "多引他山之石", "『還在學/還在驗證』姿態"] }
      亢: { 樣態: "教條僵化(剛過極,動)", 信號: ["依據不容質疑", "唯我獨真", "標準僵死不隨境調——理箴『勿死守僵化教條』的現場版"] }
      溺: { 樣態: "根基失守(柔過極,動)", 信號: ["無主見、立場隨人搖擺", "什麼都『再看看』", "根基借來的沒還(如:新場域仍全靠舊場域的據)"] }
    yong:
      剛: { 樣態: "強推直取", 信號: ["直接執行、高速輸出", "正面對決", "大開大闔的行動風格"] }
      柔: { 樣態: "柔性手腕", 信號: ["繞道鋪陳、借力使力", "彈性調整", "以退為進"] }
      亢: { 樣態: "出手過極(剛過極,動)", 信號: ["輸出停不下(『高輸出、低復原』)", "硬碰硬四處樹敵", "過勞執行——用箴『不可盲目功利』的現場版"] }
      溺: { 樣態: "出手失守(柔過極,動)", 信號: ["鋪陳無限、始終不進正題", "應變到失去主軸", "行動被環境完全牽走"] }
    dao:
      剛: { 樣態: "進取格局", 信號: ["擴張的願景", "成就導向的頂層追求", "把天花板往上頂"] }
      柔: { 樣態: "開闊留白", 信號: ["不做絕、留退路與餘裕", "和諧共生視角", "長期自然節奏"] }
      亢: { 樣態: "格局繃死(剛過極,動)", 信號: ["零餘地、唯效率、竭澤而漁", "『假期也不敢休』", "撐到裂"] }
      溺: { 樣態: "格局空掉(柔過極,動)", 信號: ["玄談不落地、願景無錨", "躺平無為失去生機——道箴『勿流於玄妙空談』的現場版"] }
  學理註腳: "三隅箴各是某爻過極的警語——理箴=理亢、用箴=用亢、道箴=道溺;亢/溺表把每爻兩側過極補齊,與三隅箴並存不衝突"
  變爻判定律:
    第一源_脈絡優先: "呈亢或溺之爻即動爻,附『何以見動』引文;方向不預設(初爻起/上爻爆/中爻卡皆可能),素材說了算"
    第二源_宣告校正: "有目標+TA 宣告:動爻與目標同向直接定;多個動爻或動爻與目標指向不同,以宣告裁決並列註明『脈絡動爻在 X,目標指向 Y』"
    第三源_菜單兜底: "無動爻無宣告:列三條一爻變路徑各附一句適用時機,選擇權還給使用者(G8 不猜)"
    一爻變: "一律一爻變,多爻變不做——一次給一個功課,才是可執行的處方"
  量形圖:
    頂點: "⑤ presence 三段:有料=長、薄=中、缺席=短——離散判定等級,非分數"
    形態:
      完整三角: "三層有料=完整格局"
      道頂縮: "趨韓非形(引唯用無道/道箴語彙;原典不完整三角形之視覺化)"
      理頂縮: "空談形"
      用頂縮: "自產病形"
      多頂縮: "依缺席清單並列敘述"
    輸出: "⑤段附一句量形描述(例『理長用長道中——趨韓非形之初』);判讀報告網頁版依三段長度繪三角形,縮頂以虛線"
  宣告體系:
    必宣告: ["素材類型(八型)", "判讀對象"]
    可選宣告: ["目標", "TA(素材的受眾,非判讀對象,不對 TA 做人的評價,G4)"]
    原則: "宣告越齊、⑥越準;未宣告不猜(G8)"
  剛柔判準註:
    絕對質性: "剛柔為絕對質性判定,非相對比較——不與他爻比強弱(相對形勢觀屬⑤量形圖);全剛/全柔之卦必須可達"
    亢溺判別: "亢與溺在過勞終點外觀相同(都停不下),判別=動力來源:自驅過極=亢(剛),被外牽走=溺(柔)"
  liuyao:
    status: "工作假說·待收斂(與 64 表 v0.1 待終審雙印章)"
    排法: "B:下卦=內在運作的理用道(初=內理/二=內用/三=內道)、上卦=對外運作的理用道(四=外理/五=外用/上=外道);六爻卦=內卦×外卦,以卦名(內·外)查 64 卦能量需求表"
    學理註: "排法 A(原典三才式:初二=理/三四=用/五六=天道,萬物對應圖之六爻對映)留作溯源註腳,不入引擎——同六判定不同堆法得不同卦,引擎寫死排法 B 以守機械推導律"
    真相源: "docs/superpowers/specs/2026-06-30-bagua-64-energy-demand-table.md(64 卦卦旨/時勢基調/召喚節制/經典依據;該表 v0.1 未經易學專家終審)"
    分池:
      內池: "判讀對象內部的運作——成員彼此如何對待、內部流程與制度、內部文化語言、自我要求與自我對話、內部資源調度(→內卦/下卦)"
      外池: "判讀對象對外部世界的運作——對客戶/市場/合作方/公眾的行為與姿態、對外承諾與表達、對外部環境變化的應對(→外卦/上卦)"
      歸池三原則:
