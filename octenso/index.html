<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script defer src="octenso-gate.js"></script>
<title>Octenso 八態能格 · 看見你的能量，選擇你的流動</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--light:#ecdcb8;--soft:#b7a888;--gold:#e8c07a;--warm:#f0cf90}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(130% 100% at 50% 30%,#2b2620 0%,#1c1812 50%,#120f0a 100%);
    color:var(--light);font-family:"Noto Sans TC",sans-serif;font-weight:300;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .home-link{position:fixed;top:16px;left:16px;font-family:"Jost",sans-serif;font-size:12px;letter-spacing:.1em;
    color:var(--soft);text-decoration:none;opacity:.65;z-index:5}
  .home-link:hover{opacity:1}
  .skip{position:fixed;top:15px;right:16px;font-family:"Jost",sans-serif;font-size:12px;letter-spacing:.1em;color:var(--soft);background:none;border:none;cursor:pointer;opacity:.65;z-index:5}
  .skip:hover{opacity:1;color:var(--light)}
  .eyebrow{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.34em;color:var(--soft);text-transform:uppercase;margin-bottom:10px;opacity:.7}
  svg.scene{display:block;max-width:min(456px,95vw)}
  .cap{font-family:"Noto Serif TC",serif;font-weight:500;font-size:18.5px;line-height:1.85;text-align:center;
    color:var(--light);min-height:3.6em;max-width:380px;margin:18px auto 0;transition:opacity .6s;letter-spacing:.04em;font-feature-settings:"palt"}
  .cap .em{color:var(--warm)} .cap .ok{color:var(--gold)}
  .dots{display:flex;gap:8px;margin-top:14px}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(236,220,184,.22);transition:.4s}
  .dots i.on{background:var(--gold);width:18px;border-radius:3px;box-shadow:0 0 8px rgba(232,192,122,.6)}
  .cta-wrap{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transition:opacity 1s}
  .cta{font-family:"Noto Serif TC",serif;font-size:15px;letter-spacing:.08em;text-decoration:none;border-radius:999px;padding:11px 30px;transition:.2s}
  .cta.primary{background:var(--gold);color:#1c1812;border:1px solid var(--gold)}
  .cta.primary:hover{background:var(--warm)}
  .cta.ghost{background:transparent;color:var(--light);border:1px solid rgba(236,220,184,.4);font-size:13px;padding:9px 24px}
  .cta.ghost:hover{border-color:var(--light)}
  .wb{font-size:12.5px;color:var(--soft);margin-top:2px}
  .wb a{color:var(--light);text-decoration:none;border-bottom:1px solid rgba(236,220,184,.35);padding-bottom:1px}
  .replay{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.12em;color:var(--soft);background:none;border:none;cursor:pointer;margin-top:4px;opacity:.7}
  .replay:hover{opacity:1;color:var(--light)}
</style></head>
<body>
<a class="home-link" href="../index.html">← 練息場</a>
<button class="skip" id="skip" style="display:none">跳過 →</button>
<div class="eyebrow">OCTENSO · 八態能格</div>
<svg class="scene" id="svg" width="456" height="471" viewBox="0 0 360 372">
  <defs>
    <filter id="bloom" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="coreg"><stop offset="0%" stop-color="#f4dca0" stop-opacity=".9"/><stop offset="100%" stop-color="#f4dca0" stop-opacity="0"/></radialGradient>
    <radialGradient id="scrimg"><stop offset="0%" stop-color="#181410" stop-opacity=".96"/><stop offset="58%" stop-color="#181410" stop-opacity=".86"/><stop offset="100%" stop-color="#181410" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="rings"></g>
  <path id="curve" fill="none" stroke="#e8c07a" stroke-width="1.4" opacity="0" filter="url(#bloom)"></path>
  <path id="curve2" fill="none" stroke="#f0cf90" stroke-width="1" opacity="0"></path>
  <circle id="core" cx="180" cy="180" r="26" fill="url(#coreg)" opacity="0"/>
  <g id="rays"></g><g id="halos"></g><g id="pts"></g><g id="labels"></g>
  <ellipse id="scrim" cx="180" cy="187" rx="116" ry="56" fill="url(#scrimg)" opacity="0"></ellipse>
  <text id="sys" x="180" y="176" text-anchor="middle" font-family="'Noto Serif TC',serif" font-size="16" font-weight="500" fill="#f0cf90" opacity="0"></text>
  <text id="sys2" x="180" y="197" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12" fill="#b7a888" opacity="0"></text>
</svg>
<div class="cap" id="cap"></div>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
<div class="cta-wrap" id="ctaWrap">
  <a class="cta primary" href="bagua-persona.html">開始認識你的八態 →</a>
  <a class="cta ghost" href="bagua-map.html">先認識八種能量</a>
  <div class="wb" id="wb" style="display:none">歡迎回來 · <a href="bagua-persona.html">看我的能量盤</a> · <a href="bagua-records.html">我的記錄</a></div>
  <button class="replay" id="replay">重看一次</button>
</div>

<script>
var CX=180,CY=180,R0=30,MAXOUT=112;
var E=[{sym:'☰',nm:'開創'},{sym:'☳',nm:'行動'},{sym:'☵',nm:'沉澱'},{sym:'☶',nm:'喊停'},
       {sym:'☷',nm:'承接'},{sym:'☴',nm:'拓展'},{sym:'☲',nm:'明現'},{sym:'☱',nm:'交流'}];
var GROUPS=[{nm:'天地 · 建構',sub:'開創 ↔ 承接',a:0,b:4},{nm:'雷風 · 推動',sub:'行動 ↔ 拓展',a:1,b:5},
            {nm:'水火 · 認知',sub:'沉澱 ↔ 明現',a:2,b:6},{nm:'山澤 · 調節',sub:'喊停 ↔ 交流',a:3,b:7}];
var NS='http://www.w3.org/2000/svg';
function smoothClosed(pts){ var n=pts.length,d=''; for(var i=0;i<n;i++){var p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  if(i===0)d+='M'+p1.x.toFixed(1)+','+p1.y.toFixed(1);
  d+='C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+','+(p1.y+(p2.y-p0.y)/6).toFixed(1)+' '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+','+(p2.y-(p3.y-p1.y)/6).toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);} return d+'Z'; }
function wobbly(R,ph){ var pts=[],N=44; for(var i=0;i<N;i++){var a=i/N*Math.PI*2;
  var w=Math.sin(a*3+ph)*1.8+Math.sin(a*5+ph*1.6)*1.1+Math.sin(a*2+ph*.4)*1.4;
  pts.push({x:CX+Math.cos(a)*(R+w),y:CY+Math.sin(a)*(R+w)});} return smoothClosed(pts); }
var ringEls=[], ringBase=[44,84,122], ringPhase=[0.5,2.2,3.9];
ringBase.forEach(function(r){ var p=document.createElementNS(NS,'path'); p.setAttribute('fill','none');
  p.setAttribute('stroke','rgba(240,207,144,.13)');p.setAttribute('stroke-width','1');p.setAttribute('stroke-linejoin','round');
  document.getElementById('rings').appendChild(p); ringEls.push(p); });
var ringT0=performance.now();
(function flowRings(ts){ ringEls.forEach(function(p,i){ var k=Math.sin((ts-ringT0)/4600*Math.PI*2 + i*1.4);
  p.setAttribute('d', wobbly(ringBase[i]+k*5, ringPhase[i]));
  p.setAttribute('stroke','rgba(240,207,144,'+(0.07+0.06*(k*.5+.5)).toFixed(3)+')'); });
  requestAnimationFrame(flowRings);
})(ringT0);
var rays=[],halos=[],pts=[],labs=[];
E.forEach(function(e,i){
  var ray=document.createElementNS(NS,'line'); ray.setAttribute('x1',CX);ray.setAttribute('y1',CY);
  ray.setAttribute('stroke','#f5e6c0');ray.setAttribute('stroke-width','0.7');ray.setAttribute('opacity','0');ray.setAttribute('stroke-linecap','round');
  document.getElementById('rays').appendChild(ray); rays.push(ray);
  var h=document.createElementNS(NS,'circle'); h.setAttribute('fill','#f0cf90');h.setAttribute('opacity','0');h.setAttribute('filter','url(#bloom)');
  document.getElementById('halos').appendChild(h); halos.push(h);
  var p=document.createElementNS(NS,'circle'); p.setAttribute('fill','#fbeec4');p.setAttribute('opacity','0');
  document.getElementById('pts').appendChild(p); pts.push(p);
  var l=document.createElementNS(NS,'text'); l.setAttribute('text-anchor','middle');l.setAttribute('font-family','"Noto Serif TC",serif');
  l.setAttribute('font-size','15');l.setAttribute('fill','#e6d6ad');l.setAttribute('opacity','0');l.textContent=e.sym;
  document.getElementById('labels').appendChild(l); labs.push(l);
});
var state=E.map(function(){return {len:.5,op:0,lum:.5};});
function tip(i,len){ var a=(-90+i*45)*Math.PI/180; return {x:CX+Math.cos(a)*(R0+len*MAXOUT), y:CY+Math.sin(a)*(R0+len*MAXOUT), a:a}; }
function render(){ state.forEach(function(s,i){ var t=tip(i,s.len);
  rays[i].setAttribute('x2',t.x);rays[i].setAttribute('y2',t.y);rays[i].setAttribute('opacity',s.op*.42);
  halos[i].setAttribute('cx',t.x);halos[i].setAttribute('cy',t.y);halos[i].setAttribute('r',5+s.lum*15);halos[i].setAttribute('opacity',s.op*.16*s.lum);
  pts[i].setAttribute('cx',t.x);pts[i].setAttribute('cy',t.y);pts[i].setAttribute('r',1.8+s.lum*2.6);pts[i].setAttribute('opacity',s.op);
  var lr=R0+s.len*MAXOUT+15; labs[i].setAttribute('x',CX+Math.cos(t.a)*lr);labs[i].setAttribute('y',CY+Math.sin(t.a)*lr+4); }); }
function curvePath(){ return smoothClosed(state.map(function(s,i){return tip(i,s.len);})); }
var anims=[],_pending=null,curveOn=false;
var aborted=false, tos=[];
function later(fn,ms){ var id=setTimeout(function(){ if(!aborted) fn(); }, ms); tos.push(id); return id; }
var PROF=[{l:.74,u:1.0},{l:.86,u:1.3},{l:.55,u:.4},{l:.58,u:.45},{l:.68,u:.95},{l:.72,u:.95},{l:.77,u:1.0},{l:.64,u:.9}];
function tw(i,prop,to,dur,delay){anims.push({i:i,prop:prop,from:null,to:to,dur:dur,delay:delay||0,t0:null});}
function ez(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function loop(ts){var alive=false;
  anims.forEach(function(an){ if(an.t0===null)an.t0=ts+an.delay; if(ts<an.t0){alive=true;return;}
    if(an.from===null)an.from=state[an.i][an.prop]; var k=Math.min(1,(ts-an.t0)/an.dur);
    state[an.i][an.prop]=an.from+(an.to-an.from)*ez(k); if(k<1)alive=true; });
  anims=anims.filter(function(an){return an.t0===null||(ts-an.t0)/an.dur<1;});
  render(); if(curveOn){var d=curvePath();document.getElementById('curve').setAttribute('d',d);document.getElementById('curve2').setAttribute('d',d);}
  if(alive||anims.length)requestAnimationFrame(loop); else if(_pending){var p=_pending;_pending=null;p();}
}
function play(){requestAnimationFrame(loop);}
function cap(h){var c=document.getElementById('cap');c.style.opacity=0;setTimeout(function(){c.innerHTML=h;c.style.opacity=1;},300);}
function dot(n){var ds=document.getElementById('dots').children;for(var i=0;i<ds.length;i++)ds[i].className=(i===n)?'on':'';}
function fade(id,o){document.getElementById(id).setAttribute('opacity',o);}

function beat1(){ dot(0); fade('core','1'); cap('幾千年前，古人用八卦，<br>觀察天地間運行的能量。');
  E.forEach(function(e,i){ tw(i,'op',.72,1100,i*120); tw(i,'lum',.7,1100,i*120);
    later(function(){labs[i].textContent=E[i].sym;labs[i].setAttribute('opacity','.78');},i*120); });
  play(); later(beat2,4200); }
function beat2(){ dot(1); fade('core','.12'); fade('scrim','1'); cap('這些能量兩兩相對——<br>組成四組系統。'); var t=500;
  E.forEach(function(e,i){ labs[i].setAttribute('opacity','0'); });
  GROUPS.forEach(function(g){ later(function(){
      fade('sys','1');fade('sys2','1');document.getElementById('sys').textContent=g.nm;document.getElementById('sys2').textContent=g.sub;
      E.forEach(function(e,i){ if(i!==g.a&&i!==g.b){ tw(i,'lum',.5,500,0); tw(i,'op',.5,500,0); } });
      [g.a,g.b].forEach(function(i){ tw(i,'lum',1,700,0); tw(i,'op',1,600,0); });
      play();
    },t); t+=1500; });
  later(function(){ fade('sys','0');fade('sys2','0'); beat3(); }, t+200); }
function beat3(){ dot(2); fade('scrim','0'); fade('core','.85'); var d=1; cap('而這八種能量，<br>也正在你的生活裡運作。');
  later(function(){ labs[d].textContent=E[d].sym+E[d].nm; E.forEach(function(e,i){if(i!==d){tw(i,'op',.2,600,0);tw(i,'lum',.3,600,0);} labs[i].setAttribute('opacity', i===d?'1':'0');});
    tw(d,'lum',.25,700,0); cap('用得太少，它<span class="em">睡著</span>了；'); play(); },2200);
  later(function(){ tw(d,'lum',.9,700,0); cap('用得<span class="ok">剛好</span>，是你的養分；'); play(); },4200);
  later(function(){ tw(d,'lum',1.3,700,0); cap('用得<span class="em">太過</span>，反而刺眼、反而累。'); play(); },6000);
  later(function(){ cap('<b>能量八態，<span class="ok">過猶不及</span>。</b>'); },7900);
  later(beat4,9800); }
function beat4(){ dot(3); curveOn=true; fade('curve','.55');fade('curve2','.5');
  E.forEach(function(e,i){ tw(i,'op',1,900,i*60); tw(i,'len',PROF[i].l,1000,i*60); tw(i,'lum',PROF[i].u,1000,i*60); later(function(){labs[i].setAttribute('opacity','0');},i*60); });
  cap('八股各自定到你的高低與分寸——<br>連成一個圓，<b>就是此刻的你</b>。'); play();
  later(function(){ cap('這不是占卜——<br>是古人的智慧，<span class="ok">照見當下的你</span>。'); breathe();
    document.getElementById('ctaWrap').style.opacity='1'; document.getElementById('skip').style.display='none'; },3600); }
// 跳過 → 直接到結尾（你的圓＋選單）
function jumpToEnd(){ aborted=true; tos.forEach(clearTimeout); tos=[]; anims=[]; breathing=false;
  dot(3); document.getElementById('sys').setAttribute('opacity','0'); document.getElementById('sys2').setAttribute('opacity','0');
  fade('scrim','0'); fade('core','.85'); curveOn=true; fade('curve','.55'); fade('curve2','.5');
  state=PROF.map(function(p){return {len:p.l,op:1,lum:p.u};}); E.forEach(function(e,i){labs[i].setAttribute('opacity','0');}); render();
  var c=document.getElementById('cap'); c.innerHTML='這不是占卜——<br>是古人的智慧，<span class="ok">照見當下的你</span>。'; c.style.opacity=1;
  breathe(); document.getElementById('ctaWrap').style.opacity='1'; document.getElementById('skip').style.display='none'; }
document.getElementById('skip').onclick=jumpToEnd;
var breathing=false;
function breathe(){ breathing=true; var base=state.map(function(s){return s.len;}),lb=state.map(function(s){return s.lum;}),t0=performance.now();
  (function b(ts){ if(!breathing)return; var k=Math.sin((ts-t0)/2600*Math.PI*2)*.5+.5;
    state.forEach(function(s,i){s.len=base[i]*(0.96+0.04*k);s.lum=lb[i]*(0.9+0.18*k);}); render();
    var d=curvePath();document.getElementById('curve').setAttribute('d',d);document.getElementById('curve2').setAttribute('d',d); requestAnimationFrame(b); })(t0); }
document.getElementById('replay').onclick=function(){ aborted=false;tos=[];breathing=false;anims=[];curveOn=false;
  document.getElementById('skip').style.display='';
  document.getElementById('ctaWrap').style.opacity='0';
  fade('curve','0');fade('curve2','0');fade('core','0');fade('scrim','0');
  state=E.map(function(){return {len:.5,op:0,lum:.5};}); E.forEach(function(e,i){labs[i].setAttribute('opacity','0');labs[i].textContent=E[i].sym;}); render();
  setTimeout(beat1,300); };
try{ if(localStorage.getItem('bagua_persona_v1')) document.getElementById('wb').style.display='block'; }catch(e){}

// 登入閘 reveal 後才開始（鎖過又解鎖＝登入完成；從沒鎖過＝無閘/已放行→保險啟動）
render();
var started=false; function go(){ if(started)return; started=true; document.getElementById('skip').style.display=''; setTimeout(beat1,250); }
var gphase=0, giv=setInterval(function(){ var locked=document.documentElement.style.overflow==='hidden';
  if(locked) gphase=1; if(!locked && gphase===1){ clearInterval(giv); go(); } },120);
setTimeout(function(){ if(gphase===0){ try{clearInterval(giv);}catch(e){} go(); } },1700);
</script>
</body></html>
