<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>corpus tests</title></head><body>
<pre id="log"></pre>
<div id="mount"></div>
<div id="frames"></div>
<script src="octenso-corpus.js"></script>
<script>
(function(){
'use strict';
var pass=0, fail=0, log=document.getElementById('log');
function t(name, ok){ if(ok){pass++;} else {fail++; log.textContent+='FAIL: '+name+'\n';} }
function finish(){ document.title='RESULT pass='+pass+' fail='+fail;
  log.textContent='RESULT pass='+pass+' fail='+fail+'\n'+log.textContent; }
var C=window.OctensoCorpus;

// ── 模組 API ──
C.clear();
t('clear→count 0', C.count()===0);
t('add empty refused', C.add({text:'   '}).ok===false && C.add({text:''}).reason==='empty');
var r1=C.add({source:'ven-i-WenYi',label:'工作·乾',text:'自由書寫:最近一直想開新案子\n感想:原來我在逃收尾'});
t('add ok', r1.ok===true && r1.count===1);
t('list entry fields', (function(){var e=C.list()[0];
  return e.id===r1.id && e.source==='ven-i-WenYi' && e.label==='工作·乾' && e.text.indexOf('逃收尾')>0 && /^\d{4}-/.test(e.ts);})());
var longText=new Array(9002).join('字'); // 9001 chars
var r2=C.add({source:'ven-i-BuYi',label:'乾→坤',text:longText});
t('overlong truncated with marker', (function(){var e=C.list()[1];
  return r2.ok && e.text.length<=C.MAX_TEXT+10 && e.text.indexOf('…(超長截斷)')>0;})());
var r2b=C.add({source:'ven-i-BuYi',label:'坎→離',text:'問題:test',context:'本卦:坎——險中有信\nAI 解讀:\n先穩住再走'});
t('context stored', (function(){var e=C.list()[2];
  return r2b.ok && e.context && e.context.indexOf('AI 解讀')>0;})());
t('context optional', !C.list()[0].context);
C.remove(r2b.id);
t('totalChars>0', C.totalChars()>100);
C.remove(r2.id);
t('remove works', C.count()===1 && C.list()[0].id===r1.id);
// 滿倉:直接灌到上限
(function(){
  var list=C.list();
  for(var i=list.length;i<C.MAX_ENTRIES;i++) list.push({id:'x'+i,ts:'2026-07-18T00:00:00Z',source:'t',label:'',text:'x'});
  localStorage.setItem(C.KEY,JSON.stringify(list));
})();
t('full refused', C.add({text:'再一段'}).reason==='full');
C.clear();

// ── mountOptIn ──
var mount=document.getElementById('mount');
var txt='';
var box1=C.mountOptIn(mount,{source:'ven-i-WenYi',label:'測',getText:function(){return txt;},viewerHref:'bagua-corpus.html'});
box1.querySelector('.oc-yes').click();
t('optin empty→提示不收', box1.querySelector('.oc-done').textContent.indexOf('沒有寫下文字')>=0 && C.count()===0);
txt='問題:要不要接這個案子\n感想:我其實已經想拒絕了';
box1.querySelector('.oc-yes').click();
t('optin add→已收進+連結', (function(){var d=box1.querySelector('.oc-done');
  return d.textContent.indexOf('已收進素材倉')>=0 && d.innerHTML.indexOf('bagua-corpus.html')>=0 && C.count()===1;})());
var box2=C.mountOptIn(mount,{source:'ven-i-BuYi',label:'x',getText:function(){return 'y';}});
box2.querySelector('.oc-no').click();
t('optin 先不用→不收', box2.querySelector('.oc-done').textContent.indexOf('這次不收')>=0 && C.count()===1);
t('optin 文案含不上傳承諾', box1.textContent.indexOf('不上傳')>=0 && box1.textContent.indexOf('隨時可看、可刪')>=0);

// ── ven-i 整合(原始碼檢查)──
var done=0, DONE_N=2;
function part(){ if(++done===DONE_N) finish(); }
fetch('../ven-i/index.html').then(function(r){return r.text();}).then(function(src){
  t('ven-i 載入 corpus 模組', src.indexOf('octenso/octenso-corpus.js')>=0);
  t('ven-i 掛 mountOptIn', src.indexOf('OctensoCorpus.mountOptIn')>=0);
  t('ven-i 兩模式皆傳 corpus 參數', src.split('getBaseText').length>=4); // 定義處+WenYi+BuYi
  t('ven-i 收錄含感想欄', src.indexOf("'感想:'+note")>=0);
  t('ven-i 完整儲存(兩模式皆有 getContext)', src.split('getContext:function').length>=3);
  t('ven-i 脈絡含 AI 解讀', src.indexOf("'AI 解讀:\\n'+ai.innerText.trim()")>=0);
}).catch(function(){ t('ven-i 原始碼可讀', false); }).then(function(){
  return fetch('../ven-i/worker.js').then(function(r){return r.text();}).then(function(src){
    t('worker /lens-me 路由', src.indexOf("pathname === '/lens-me'")>=0);
    t('worker 個人照鏡鐵則(主詞/誠實分級/引文)', src.indexOf('禁說「你是開創型的人」')>=0
      && src.indexOf('素材誠實分級')>=0 && src.indexOf('錨題自評(若有)只做並列')>=0);
    t('worker lensme 獨立限流', src.indexOf('`lensme:${ip}:${today}`')>=0);
    t('worker 回饋收 personal', src.indexOf("ctype !== 'personal'")>=0);
  });
}).catch(function(){ t('ven-i 原始碼可讀', false); }).then(part);

// ── 檢視頁 iframe(閘門在 iframe 內自動跳過)──
C.clear();
localStorage.removeItem('octenso_anchor_v1');
C.add({source:'ven-i-WenYi',label:'工作·乾',text:'A段'});
C.add({source:'ven-i-BuYi',label:'乾→坤',text:'B段',context:'本卦:乾\n重點:\n測試脈絡\nAI 解讀:\n這段不可入鏡'});
C.add({source:'bagua-dialogue',label:'對談·工作',text:'C段:我不想跳票'});
localStorage.setItem('octenso_anchor_v1',JSON.stringify([{ts:'2026-07-19T01:00:00Z',bank:'v2-fq',scores:{qian:{v:1,t:'經常'}}}]));
var f=document.createElement('iframe');
f.style.cssText='width:800px;height:600px';
f.src='bagua-corpus.html';
document.getElementById('frames').appendChild(f);
var tries=0;
var timer=setInterval(function(){
  tries++;
  var doc=null, ready=false;
  try{ doc=f.contentDocument; ready=doc&&doc.body&&doc.body.getAttribute('data-ready')==='1'; }catch(e){}
  if(ready||tries>100){
    clearInterval(timer);
    var txtAll=ready?doc.body.innerText:'';
    var CV=ready?f.contentWindow.CORPUS_VIEW:null;
    t('檢視頁渲染 3 段', txtAll.indexOf('共 3 段')>=0);
    t('檢視頁來源標籤', txtAll.indexOf('問易')>=0 && txtAll.indexOf('卜易')>=0 && txtAll.indexOf('乾→坤')>=0);
    t('檢視頁誠實文案', txtAll.indexOf('不上傳')>=0 && txtAll.indexOf('localStorage')>=0 && txtAll.indexOf('由你裁決')>=0);
    t('檢視頁脈絡點開區', ready&&!!doc.querySelector('.card details .ctx') && doc.body.innerHTML.indexOf('卦象與解讀紀錄')>=0);
    // 照一下:素材組裝與 gating
    var bm=CV?CV.buildMaterial():{material:''};
    t('照鏡素材=只收本人的字', bm.material.indexOf('不想跳票')>=0 && bm.material.indexOf('這段不可入鏡')<0);
    t('照鏡素材含錨題紀錄', bm.material.indexOf('錨題自評紀錄')>=0 && bm.material.indexOf('經常')>=0);
    t('滿 3 段照鏡解鎖', ready && !doc.getElementById('mirror').disabled);
    // 備份:匯出/匯入
    var bk=CV?CV.buildBackup():null;
    t('備份含素材+錨題', !!bk && bk.kind==='octenso-corpus-backup' && bk.corpus.length===3 && bk.anchor.length===1);
    var imp=CV?CV.importData({kind:'octenso-corpus-backup',version:1,
      corpus:[bk.corpus[0],{id:'newX',ts:'2026-07-18T00:00:00Z',source:'ven-i-BuYi',label:'新',text:'D段'}],
      anchor:[{ts:'2026-07-19T01:00:00Z'},{ts:'2026-07-20T02:00:00Z',scores:{}}]}):null;
    t('匯入去重合併', !!imp && imp.ok && imp.added===1 && imp.anchorAdded===1 && window.OctensoCorpus.count()===4);
    t('匯入不是備份檔會拒絕', CV && CV.importData({foo:1}).ok===false);
    // 照一下:mock 解讀 API 走完整鏈
    CV.setReadApi(function(material,schema){
      t('照鏡帶 schema(YAML 單一真相源)', typeof schema==='string' && schema.indexOf('guardrails')>=0);
      return Promise.resolve('①素材概況:4 段\n②八態逐列:乾 有料「不想跳票」\n個人照鏡 v0.1');
    });
    doc.getElementById('mirror').click();
    var tries2=0,t2=setInterval(function(){
      tries2++;
      var shown=doc.getElementById('mirwrap').style.display==='block';
      if(shown||tries2>80){
        clearInterval(t2);
        t('照鏡報告渲染', shown && doc.getElementById('mirreport').textContent.indexOf('八態逐列')>=0);
        t('照鏡三值回饋在場', shown && doc.querySelectorAll('#mirfb .fbv').length===3);
        try{
          doc.querySelector('.del').click();
          t('檢視頁刪除一段', window.OctensoCorpus.count()===3);
        }catch(e){ t('檢視頁刪除一段', false); }
        C.clear();
        localStorage.removeItem('octenso_anchor_v1');
        f.parentNode.removeChild(f);
        part();
      }
    },100);
  }
},150);
})();
</script>
</body></html>
