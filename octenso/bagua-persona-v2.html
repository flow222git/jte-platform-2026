<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<title>Octenso 八態能格 · 完整版體驗(題本 v2)</title>
<style>
  :root{--bg:#f4efe4;--surface:#f8f4ec;--surface2:#efe9dc;--ink:#23241f;--ink-soft:#3a3a32;--muted:#6f6657;
    --line:#d2c7b4;--hair:#bcb09a;--pine:#35614f;--cinnabar:#9d4b34;--gold:#a9823b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink-soft);font-family:"Noto Sans TC",ui-sans-serif,system-ui,sans-serif;
    font-weight:300;line-height:1.9;font-size:15.5px;max-width:640px;margin:0 auto;padding:26px 20px 90px}
  body.big{font-size:17.5px;line-height:2}
  .serif{font-family:"Songti TC","Noto Serif TC",serif}
  .eyebrow{font-family:"Jost",ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.26em;color:var(--muted);
    text-transform:uppercase;text-align:center;margin-bottom:10px}
  h1{font-weight:200;font-size:26px;letter-spacing:.14em;color:var(--ink);text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.05em;margin-bottom:14px}
  .draft{display:block;width:fit-content;margin:0 auto 8px;text-align:center;font-size:11.5px;color:var(--cinnabar);
    border:1px solid var(--cinnabar);border-radius:999px;padding:3px 14px;letter-spacing:.1em}
  .fontbtns{text-align:center;margin-bottom:22px}
  .fbtn{font-size:12px;border:1px solid var(--hair);background:transparent;color:var(--muted);
    border-radius:999px;padding:3px 12px;cursor:pointer;margin:0 3px}
  .fbtn.on{border-color:var(--ink);color:var(--ink)}
  .rule{height:1px;background:var(--line);margin:34px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px}
  .btn{display:inline-block;font-size:14.5px;font-weight:300;letter-spacing:.08em;padding:12px 30px;cursor:pointer;
    border:1px solid var(--ink);border-radius:999px;color:var(--ink);background:transparent;transition:.2s;text-decoration:none}
  .btn:hover{background:var(--ink);color:var(--bg)}
  .btn.ghost{border-color:var(--hair);color:var(--muted)}
  .btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:transparent}
  .center{text-align:center}
  .guide{padding-left:16px;border-left:1px solid var(--hair);font-size:14px;color:var(--ink-soft);
    line-height:2;margin:20px 0 26px}
  .honest{font-size:12.5px;color:var(--muted);line-height:1.95;padding-left:15px;border-left:1px solid var(--hair);margin-top:20px}
  /* quiz */
  .stage{font-family:"Jost",ui-sans-serif,sans-serif;font-size:10.5px;letter-spacing:.22em;color:var(--gold);
    text-transform:uppercase;text-align:center;margin-bottom:8px}
  .prog{height:3px;background:var(--surface2);border-radius:2px;margin:16px 0 26px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--pine);border-radius:2px;transition:width .25s}
  .qnum{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;letter-spacing:.08em}
  .qhint{font-size:12.5px;color:var(--muted);text-align:center;margin:-4px auto 14px;max-width:28em}
  .qtext{font-size:17.5px;color:var(--ink);text-align:center;line-height:1.9;margin:0 auto 22px;max-width:30em;
    text-wrap:balance;font-weight:300}
  body.big .qtext{font-size:19.5px}
  .abrow{max-width:380px;margin:0 auto 22px;font-size:14.5px;line-height:2}
  .abrow .ab{display:flex;gap:10px;align-items:baseline}
  .abrow .tagab{flex:none;font-family:"Jost",sans-serif;font-size:12px;color:var(--gold);letter-spacing:.1em;width:1.4em}
  .opts{display:flex;flex-direction:column;gap:9px;max-width:340px;margin:0 auto}
  .opts.fc{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:420px}
  .opt{font-family:inherit;font-weight:300;font-size:15px;letter-spacing:.06em;padding:11px 14px;cursor:pointer;
    border:1px solid var(--hair);border-radius:999px;background:transparent;color:var(--ink-soft);transition:.15s}
  .opts.fc .opt{font-size:13.5px;padding:9px 6px;white-space:nowrap;text-align:center}
  .opt:hover{border-color:var(--ink);color:var(--ink)}
  .opt.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .navrow{display:flex;justify-content:space-between;align-items:center;max-width:340px;margin:22px auto 0}
  .navlink{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;letter-spacing:.06em;padding:6px}
  .navlink:hover{color:var(--ink)}
  /* report */
  .r-head{text-align:center;margin:8px 0 6px}
  .r-sym{font-family:"Songti TC","Noto Serif TC",serif;font-size:34px;color:var(--ink);line-height:1.15}
  .r-title{font-family:"Songti TC","Noto Serif TC",serif;font-weight:500;font-size:22px;letter-spacing:.18em;
    color:var(--ink);padding-left:.18em;margin-top:6px}
  .r-sub{font-size:12.5px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
  .r-ess{font-family:"Songti TC","Noto Serif TC",serif;font-size:16px;color:var(--ink);line-height:2.1;
    text-align:center;max-width:30em;margin:18px auto 0;text-wrap:balance}
  .felt{font-size:12.5px;color:var(--muted);text-align:center;letter-spacing:.06em;margin:16px 0 6px}
  .seclabel{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:400;margin:0 0 14px}
  .band-list{margin:8px 0}
  .band-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0 0}
  .band-brief{font-size:11.5px;color:var(--muted);line-height:1.8;padding:1px 0 7px;border-bottom:1px solid var(--surface2)}
  .band-row .nm{flex:none;width:96px;color:var(--ink)}
  .band-row .sc{flex:none;width:28px;text-align:right;color:var(--muted);font-family:"Jost",sans-serif;font-size:12px}
  .band-row .bl{flex:1}
  .band-row .bl.like{color:var(--pine)}
  .band-row .bl.unlike{color:var(--muted)}
  .band-row .conf{flex:none;font-size:11px;letter-spacing:.08em}
  .conf.sure{color:var(--gold)} .conf.mixed{color:var(--muted)}
  .radar{display:block;margin:10px auto}
  .pair{margin:20px 0}
  .pair .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink);margin-bottom:5px}
  .pair .track{position:relative;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
  .pair .fl,.pair .fr{position:absolute;top:0;bottom:0;background:var(--pine);opacity:.55}
  .pair .fl{left:0;border-radius:5px 0 0 5px}
  .pair .fr{right:0;border-radius:0 5px 5px 0}
  .pair .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--hair)}
  .pair .verdict{font-size:12.5px;color:var(--muted);margin-top:6px}
  .pair .verdict b{font-weight:400;color:var(--ink)}
  .pair .verdict.tension b{color:var(--cinnabar)}
  .pair .gq{font-size:13.5px;color:var(--ink);margin-bottom:10px}
  .pair .gq b{font-weight:400;color:var(--pine);letter-spacing:.06em}
  .pole-row{display:flex;align-items:center;gap:10px;margin:6px 0}
  .pole-row .pl{flex:none;width:5em;font-size:13px;color:var(--ink)}
  .pole-row .pbar{flex:1;height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}
  .pole-row .pbar i{display:block;height:100%;border-radius:5px;background:var(--hair);opacity:.75}
  .pole-row .pbar i.on{background:var(--pine);opacity:.8}
  .pole-row .pbar i.on.tens{background:var(--cinnabar)}
  .pole-row .ps{flex:none;width:2em;text-align:right;font-family:"Jost",sans-serif;font-size:11.5px;color:var(--muted)}
  .pair .plain{font-size:13.5px;color:var(--ink-soft);margin-top:8px}
  .pair .cnote{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
  .pair .fcnote{font-size:12.5px;margin-top:4px;padding-left:14px;border-left:1px solid var(--hair);color:var(--ink-soft)}
  .pair .fcnote.gap{border-left-color:var(--gold)}
  .cost-row{padding:14px 0;border-bottom:1px solid var(--surface2)}
  .cost-row .ch{font-size:13.5px;letter-spacing:.08em;margin-bottom:4px}
  .st-over{color:var(--cinnabar)} .st-under{color:var(--gold)} .st-mid{color:var(--pine)}
  .cost-row p{font-size:13.5px;margin:0}
  h4.blk{display:flex;align-items:center;gap:12px;font-family:"Songti TC","Noto Serif TC",serif;font-weight:500;
    font-size:14.5px;letter-spacing:.12em;color:var(--ink);margin:28px 0 8px}
  h4.blk::after{content:"";flex:1;height:1px;background:var(--line)}
  .bandtag{font-size:11px;font-weight:300;font-family:"Noto Sans TC",sans-serif;letter-spacing:.1em;color:var(--muted)}
  .bandtag.mid{color:var(--pine)} .bandtag.over{color:var(--cinnabar)} .bandtag.under{color:var(--gold)}
  .blktxt{font-size:14.5px;line-height:2.05}
  details{border-top:1px solid var(--line);padding:10px 0}
  details.last{border-bottom:1px solid var(--line)}
  summary{cursor:pointer;font-size:14px;color:var(--ink);letter-spacing:.05em;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"＋";color:var(--hair);font-size:12px}
  details[open] summary::before{content:"－"}
  .d-band{font-size:11px;letter-spacing:.08em;color:var(--muted)}
  .c-text{font-size:13.5px;line-height:2;margin-top:8px;white-space:pre-line}
  .codebox{display:flex;gap:8px;max-width:380px;margin:14px auto 0}
  .input{flex:1;background:transparent;border:1px solid var(--hair);border-radius:10px;padding:11px 13px;
    color:var(--ink);font-size:14px;font-family:"Jost",monospace}
  .input:focus{outline:none;border-color:var(--ink)}
  .mycode{font-family:"Jost",monospace;font-size:15px;letter-spacing:.14em;color:var(--ink);
    background:var(--surface2);border-radius:8px;padding:8px 14px;display:inline-block;margin:8px 0}
  .hide{display:none}
  .botbox{border:1px solid var(--hair);border-radius:12px;padding:16px;margin-top:14px}
  .botmsgs{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;margin-bottom:12px}
  .bm{font-size:13.5px;line-height:1.95;white-space:pre-line;max-width:88%;padding:9px 13px;border-radius:12px}
  .bm.bot{background:var(--surface2);align-self:flex-start;border-top-left-radius:3px}
  .bm.user{border:1px solid var(--hair);align-self:flex-end;border-top-right-radius:3px}
  .bm.crisis{background:var(--surface2);border:1px solid var(--cinnabar);align-self:flex-start}
  .botrow{display:flex;gap:8px}
  .ask{margin:30px 0 0;padding:14px 0 14px 18px;border-left:1px solid var(--pine)}
  .ask .ah{font-family:"Songti TC","Noto Serif TC",serif;color:var(--pine);font-size:13.5px;letter-spacing:.12em;margin-bottom:6px}
  .ask ol{padding-left:1.3em;font-size:13px;line-height:2}
  a{color:var(--pine)}
</style>
</head><body>

<div class="eyebrow">Octenso · Persona V2 · Experience</div>
<h1>八態能格 · 完整版</h1>
<div class="sub">題本 v2(微場景×頻率×二選一)+ 能格校準 → 峰名 × 四對 × 篤定 × 能格 × 型錄章節</div>
<span class="draft">體驗版 · 題本 v2 試測 · 與正式版並行,分數不可與 v1 互比</span>
<div class="fontbtns">字級 <button class="fbtn on" id="fA">A</button><button class="fbtn" id="fAp">A⁺</button></div>

<!-- ═ 入口 ═ -->
<div id="scr-intro">
  <div class="card">
    <div class="stage">第一段 · 底色</div>
    <p class="guide" id="guide-intro"></p>
    <div class="center"><button class="btn" id="btn-start">開始施測</button></div>
    <div class="honest" id="honest-intro"></div>
  </div>
  <div class="rule"></div>
  <div class="seclabel">已經有分享碼?</div>
  <p style="font-size:13.5px;color:var(--muted)">貼上 B2 碼(本頁測完給的)或正式版 B1 碼,直接看完整版報告。<br>
  <span style="font-size:12px">※ B1 碼只有八態分數(v1 題本),報告以中正樣貌為主、無二選一對照;兩版分數不可互比。</span></p>
  <div class="codebox"><input class="input" id="code-in" placeholder="B2×××××××××××××××××××× 或 B1…" maxlength="22">
  <button class="btn ghost" id="btn-code">看報告</button></div>
  <p id="code-err" class="center hide" style="color:var(--cinnabar);font-size:13px;margin-top:8px">這組碼讀不懂——B1 應為 18 碼、B2 應為 22 碼。</p>
</div>

<!-- ═ 測驗 ═ -->
<div id="scr-quiz" class="hide">
  <div class="stage" id="quiz-stage">第一段 · 底色</div>
  <div class="prog"><i id="prog-i" style="width:0%"></i></div>
  <div class="qnum" id="q-num"></div>
  <div class="qhint hide" id="q-hint"></div>
  <div class="qtext" id="q-text"></div>
  <div class="abrow hide" id="q-ab"></div>
  <div class="opts" id="q-opts"></div>
  <div class="navrow">
    <button class="navlink" id="btn-back">← 上一題</button>
    <button class="navlink" id="btn-restart">重新開始</button>
  </div>
</div>

<!-- ═ 中場 ═ -->
<div id="scr-interlude" class="hide">
  <div class="card">
    <div class="stage">第二段 · 能格校準</div>
    <p class="guide" id="guide-cost"></p>
    <p style="font-size:13.5px;color:var(--muted)" id="interlude-note"></p>
    <div class="center" style="margin-top:14px"><button class="btn" id="btn-cost-start">繼續</button></div>
  </div>
</div>

<!-- ═ 報告 ═ -->
<div id="scr-report" class="hide"></div>

<script src="bagua-data.js"></script>
<script src="profile.js"></script>
<script src="bagua-v2-data.js"></script>
<script src="bagua-catalog-data.js"></script>
<script src="bagua-catalog-t1.js"></script>
<script src="bagua-catalog-combos.js"></script>
<script>
(function(){
'use strict';
var B=window.OCTENSO_BAGUA, P=window.OctensoProfile, V=window.OCTENSO_V2, C=window.OCTENSO_CATALOG;
var EKEYS=['qian','li','zhen','dui','kun','kan','gen','xun'];
var SMAX=5, LS='bagua_v2b_exp';
var NB=V.ITEMS.length, NF=V.FC_ITEMS.length, NT=NB+NF; // 24+4=28
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');};
var $=function(id){return document.getElementById(id);};

$('fA').onclick=function(){document.body.classList.remove('big');$('fA').classList.add('on');$('fAp').classList.remove('on');};
$('fAp').onclick=function(){document.body.classList.add('big');$('fAp').classList.add('on');$('fA').classList.remove('on');};

$('guide-intro').textContent=V.GUIDE.intro;
$('guide-cost').textContent=V.GUIDE.cost;
$('honest-intro').textContent=B.HONEST;

var S={answers:new Array(NB).fill(null), fcAns:new Array(NF).fill(null), idx:0,
       flags:[], costQ:[], costAns:[], costIdx:0, phase:'intro'};
function save(){ try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} }
function load(){ try{var d=JSON.parse(localStorage.getItem(LS));
  if(d&&d.answers&&d.answers.length===NB) S=d;}catch(e){} }

function show(id){['scr-intro','scr-quiz','scr-interlude','scr-report'].forEach(function(x){$(x).classList.toggle('hide',x!==id);});window.scrollTo(0,0);}

// ── 計分(24 題;頻率題分值已內建反向)──
function computeScores(){
  var sum={},n={};
  EKEYS.forEach(function(k){sum[k]=0;n[k]=0;});
  V.ITEMS.forEach(function(q,i){
    var v=S.answers[i]; if(v==null) return;
    sum[q.k]+=v; n[q.k]++;
  });
  var sc={};
  EKEYS.forEach(function(k){ sc[k]=n[k]?Math.round(sum[k]/n[k]/SMAX*100):0; });
  return sc;
}
function confidence(){
  var by={}; V.ITEMS.forEach(function(q,i){
    var v=S.answers[i]; if(v==null) return; (by[q.k]=by[q.k]||[]).push(v);
  });
  var out={};
  EKEYS.forEach(function(k){ var a=by[k]||[]; if(!a.length){out[k]=null;return;}
    var spread=Math.max.apply(null,a)-Math.min.apply(null,a);
    out[k]=spread<=1?'sure':(spread>=3?'mixed':'normal');
  });
  return out;
}
// B2='B2'+16 位態分+4 位二選一(0–5;9=無);相容讀 B1
function encodeCode(sc,fc){
  var s='B2';
  EKEYS.forEach(function(k){var v=Math.max(0,Math.min(99,Math.round(sc[k]||0)));s+=(v<10?'0':'')+v;});
  for(var i=0;i<NF;i++){ var f=fc&&fc[i]!=null?fc[i]:9; s+=String(f); }
  return s;
}
function decodeCode(str){
  str=(str||'').trim().toUpperCase().replace(/\s/g,'');
  var sc={}, i;
  if(str.indexOf('B1')===0 && str.length===18 && /^[0-9]{16}$/.test(str.slice(2))){
    for(i=0;i<8;i++) sc[EKEYS[i]]=parseInt(str.substr(2+i*2,2),10);
    return {sc:sc, fc:null, bank:'v1'};
  }
  if(str.indexOf('B2')===0 && str.length===22 && /^[0-9]{20}$/.test(str.slice(2))){
    for(i=0;i<8;i++) sc[EKEYS[i]]=parseInt(str.substr(2+i*2,2),10);
    var fc=[];
    for(i=0;i<4;i++){ var d=parseInt(str.charAt(18+i),10); fc.push(d<=5?d:null); }
    return {sc:sc, fc:fc, bank:'v2'};
  }
  return null;
}

// ── 測驗(0–23 量表題;24–27 二選一)──
function renderQ(){
  var i=S.idx;
  $('prog-i').style.width=Math.round(i/NT*100)+'%';
  if(i<NB){
    var q=V.ITEMS[i], opts=q.kind==='fq'?V.FREQ_OPTS:V.OPTS;
    $('quiz-stage').textContent='第一段 · 底色';
    $('q-num').textContent='第 '+(i+1)+' / '+NT+' 題';
    $('q-hint').classList.add('hide');
    $('q-ab').classList.add('hide');
    $('q-text').textContent=q.t;
    var box=$('q-opts'); box.className='opts'; box.innerHTML='';
    opts.forEach(function(o){
      var b=document.createElement('button'); b.className='opt'+(S.answers[i]===o.v?' sel':'');
      b.textContent=o.t;
      b.onclick=function(){ S.answers[i]=o.v; save(); S.idx++; renderQ(); };
      box.appendChild(b);
    });
  } else if(i<NT){
    var j=i-NB, f=V.FC_ITEMS[j];
    $('quiz-stage').textContent='第一段 · 底色(二選一)';
    $('q-num').textContent='二選一 '+(j+1)+' / '+NF+'　·　第 '+(i+1)+' / '+NT+' 題';
    $('q-hint').textContent=V.FC_HINT; $('q-hint').classList.remove('hide');
    $('q-text').textContent=f.t;
    $('q-ab').innerHTML='<div class="ab"><span class="tagab">A</span><span>'+esc(f.a)+'</span></div>'
      +'<div class="ab"><span class="tagab">B</span><span>'+esc(f.b)+'</span></div>';
    $('q-ab').classList.remove('hide');
    var box2=$('q-opts'); box2.className='opts fc'; box2.innerHTML='';
    V.FC_OPTS.forEach(function(o){
      var b=document.createElement('button'); b.className='opt'+(S.fcAns[j]===o.v?' sel':'');
      b.textContent=o.t;
      b.onclick=function(){ S.fcAns[j]=o.v; save();
        if(S.idx<NT-1){S.idx++;renderQ();} else finishBase(); };
      box2.appendChild(b);
    });
  } else { finishBase(); return; }
  $('btn-back').style.visibility=i>0?'visible':'hidden';
  $('btn-back').onclick=function(){ if(S.idx>0){S.idx--;renderQ();} };
}
$('btn-restart').onclick=function(){ if(confirm('確定重新開始?會清掉這次的作答。')){
  S={answers:new Array(NB).fill(null),fcAns:new Array(NF).fill(null),idx:0,flags:[],costQ:[],costAns:[],costIdx:0,phase:'quiz'};
  save(); renderQ(); } };

// ── 能格 ──
function pickFlags(sc){
  var flags=[];
  EKEYS.forEach(function(k){
    if(sc[k]>=V.COST_HI) flags.push({k:k,dir:'over',ext:sc[k]-V.COST_HI});
    else if(sc[k]<=V.COST_LO) flags.push({k:k,dir:'under',ext:V.COST_LO-sc[k]});
  });
  flags.sort(function(a,b){return b.ext-a.ext;});
  return flags.slice(0,V.COST_MAX_FLAGS);
}
function finishBase(){
  var sc=computeScores();

  if(!S.flags.length){ S.phase='report'; save(); renderReport(sc,{},confidence(),S.fcAns); return; }
  S.costQ=[]; S.flags.forEach(function(f){ (V.COST[f.k][f.dir]||[]).forEach(function(t){S.costQ.push({k:f.k,dir:f.dir,t:t});}); });

function renderCostQ(){

  $('q-hint').classList.add('hide'); $('q-ab').classList.add('hide');

  V.OPTS.forEach(function(o){
    var b=document.createElement('button'); b.className='opt'+(S.costAns[i]===o.v?' sel':'');
    b.textContent=o.t;
    b.onclick=function(){ S.costAns[i]=o.v; save();
      if(S.costIdx<S.costQ.length-1){S.costIdx++;renderCostQ();} else finishCost(); };
    box.appendChild(b);
  });
  $('btn-back').style.visibility=i>0?'visible':'hidden';
  $('btn-back').onclick=function(){ if(S.costIdx>0){S.costIdx--;renderCostQ();} };
}
function costVerdicts(){
  var st={};
  S.flags.forEach(function(f){
    var vals=[]; S.costQ.forEach(function(q,i){ if(q.k===f.k && S.costAns[i]!=null) vals.push(S.costAns[i]); });
    if(!vals.length) return;
    var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length;
    var cost=avg>=V.COST_AGREE;
    st[f.k]= f.dir==='over' ? (cost?'over':'midHi') : (cost?'under':'midLo');
  });
  return st;
}

// ── 報告 ──
function radarSVG(sc){
  // 依圓周相鄰方位連線(canonical POLAR 幾何順序;艮/巽 已於 2026-07-05 對調座標,不可用 EKEYS 順序連)
  var RING=['qian','li','zhen','dui','kun','kan','xun','gen'];
  var pts=RING.map(function(k){var p=B.POLAR[k];
    var r=(sc[k]||0)/100; return [200+(p.x-200)*r, 200+(p.y-200)*r];});
  var frame=RING.map(function(k){var p=B.POLAR[k];return p.x+','+p.y;}).join(' ');
  var half=RING.map(function(k){var p=B.POLAR[k];return (200+(p.x-200)*.5)+','+(200+(p.y-200)*.5);}).join(' ');
  var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var labels=EKEYS.map(function(k){var p=B.POLAR[k],g=B.get(k);
    var lx=200+(p.x-200)*1.22, ly=200+(p.y-200)*1.22+4;
    return '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+g.fnShort+'者</text>';}).join('');
  return '<svg class="radar" viewBox="0 0 400 400" width="300" role="img" aria-label="八態雷達">'
    +'<polygon points="'+frame+'" fill="none" stroke="var(--line)"/>'
    +'<polygon points="'+half+'" fill="none" stroke="var(--surface2)"/>'
    +EKEYS.map(function(k){var p=B.POLAR[k];return '<line x1="200" y1="200" x2="'+p.x+'" y2="'+p.y+'" stroke="var(--surface2)"/>';}).join('')
    +'<polygon points="'+poly+'" fill="rgba(53,97,79,.16)" stroke="var(--pine)" stroke-width="1.4"/>'
    +pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="var(--pine)"/>';}).join('')
    +labels+'</svg>';
}
function signatureCard(pf){
  var sig=pf.signature,k=sig.keys;
  if(sig.kind==='single'){var g=B.get(k[0]);
    return {sym:g.sym,title:g.title,sub:'單一主峰',ess:C.T1[k[0]].aura};}
  if(sig.kind==='dual'){var a=B.get(k[0]),b=B.get(k[1]);
    return {sym:a.sym+' '+b.sym,title:a.nm+'×'+b.nm+' · '+a.fnShort+'與'+b.fnShort+'並重',
      sub:'兩個並重的主調,輪流主導',ess:''};}
  if(sig.kind==='multi'){
    return {sym:k.map(function(x){return B.get(x).sym;}).join(' '),
      title:k.map(function(x){return B.get(x).nm;}).join('×')+' · 多主調型',sub:k.length+' 個主調並重',ess:''};}
  var lv=pf.level.band, nm=lv==='high'?'高能多面型':lv==='low'?'低調蓄能型':'均衡型';
  return {sym:B.get(pf.leads[0]).sym,title:nm,sub:'沒有單一主峰,以整體格局描述',ess:''};
}
var BANDS_TXT={sure:'篤定',mixed:'兩可'};
// 顯示層:先「者」後卦(2026-07-12 使用者回饋);canonical title 原樣不動
function reTitle(s){return String(s).replace(/([乾坤震巽離坎艮兌])·([^×\s()]+)/g,'$2·$1');}
function pn(k){var g=B.get(k);return g.fnShort+'者('+g.nm+')';}
function catalogSections(k,costSt){
  var over=costSt[k]==='over';
  var secs=[['aura','神韻',''],['crowd','在人群中的樣子','']];
  secs.push(['work'+(over?'Over':'Mid'),'工作樣貌',over?'over':'mid']);
  secs.push(['love'+(over?'Over':'Mid'),'愛情與親密',over?'over':'mid']);
  if(over) secs.push(['stress','壓力訊號','over']);
  secs.push(['growth','成長方向','']);
  secs.push(['others','給身邊人','']);
  return {secs:secs,over:over,
    alt:over?[['workMid','工作樣貌','mid'],['loveMid','愛情與親密','mid']]
            :[['workOver','工作樣貌','over'],['loveOver','愛情與親密','over'],['stress','壓力訊號','over']]};
}
// 二選一 × 量表偏向 對照(標註式,不入分)
function fcCompareNote(ax, fcVal){
  if(fcVal==null) return '';
  var pickLeft=fcVal<=2;
  var pickName=pickLeft?ax.ln:ax.rn, scaleName=ax.lean==='left'?ax.ln:ax.rn;
  var tpl;
  if(ax.lean==='even') tpl=V.FC_READ.evenPick;
  else if((ax.lean==='left')===pickLeft) tpl=V.FC_READ.agree;
  else tpl=V.FC_READ.disagree;
  var txt=tpl.replace('{X}',pickName).replace('{Y}',scaleName);
  var gap=(ax.lean!=='even') && ((ax.lean==='left')!==pickLeft);
  return '<div class="fcnote'+(gap?' gap':'')+'">'+esc(txt)+'</div>';
}

        +'<p style="font-size:13px;line-height:1.95">'+esc(C.T2[mainK][d.key][l.key])+'</p>';
    });
    h+='</details>';
  });
  // 接下來 · 三個方向(好好用=主峰中正發揮;留意收=能格亢的建議;值得練=缺口潛的第一步)
  h+='<div class="rule"></div><div class="seclabel">接下來 · 三個方向</div>';
  pf.leads.slice(0,2).forEach(function(k){
    h+='<div class="cost-row"><div class="ch"><span class="st-mid">好好用</span> <span style="color:var(--ink)">'+pn(k)+'</span></div><p>'+esc(V.DIRECTIONS[k].use)+'</p></div>';
  });
  var oversH=Object.keys(costSt).filter(function(k){return costSt[k]==='over';});
  if(oversH.length){ oversH.forEach(function(k){
    h+='<div class="cost-row"><div class="ch"><span class="st-over">留意收</span> <span style="color:var(--ink)">'+pn(k)+'</span></div><p>'+esc(V.COST[k].aOver)+'</p></div>';
  }); } else {
    h+='<div class="cost-row"><div class="ch"><span class="st-over">留意收</span></div><p style="color:var(--muted)">這次校準沒有出現過用訊號——先放心用你的本錢。</p></div>';
  }
  if(pf.gaps.length){ var gkD=pf.gaps[0];
    h+='<div class="cost-row"><div class="ch"><span class="st-under">值得練</span> <span style="color:var(--ink)">'+pn(gkD)+'</span></div><p>'+esc(V.COST[gkD].aUnder)+'</p></div>';
  }
  h+='<div class="rule"></div><div class="seclabel">對照與分享</div>'
    +'<p style="font-size:13.5px">你的分享碼(題本 v2):<span class="mycode">'+code+'</span><br>'
    +'<a class="btn ghost" style="margin-top:8px" href="bagua-persona.html">打開正式版對照 →</a>'
    +'<span style="display:block;font-size:12px;color:var(--muted);margin-top:6px">※ 兩版題本不同,分數請勿直接互比——比的是「報告像不像你」。</span></p>';
  // 八態伴讀(結果頁內嵌聊天;url 為空則隱藏整段)
  if(V.COMPANION_BOT && V.COMPANION_BOT.url){
    var CB=V.COMPANION_BOT;
    h+='<div class="rule"></div><div class="seclabel">'+esc(CB.title)+'</div>'
      +'<p style="font-size:13.5px">'+esc(CB.desc)+'</p>'
      +'<p style="font-size:12px;color:var(--muted)">'+esc(CB.privacy)+'</p>'
      +'<p class="center" id="bot-startrow" style="margin:14px 0 6px"><button class="btn" id="bot-start">'+esc(CB.startBtn)+'</button></p>'
      +'<div class="botbox hide" id="bot-box">'
      +  '<div class="botmsgs" id="bot-msgs"></div>'
      +  '<div class="botrow"><input class="input" id="bot-in" placeholder="'+esc(CB.placeholder)+'">'
      +  '<button class="btn" id="bot-send">'+esc(CB.sendBtn)+'</button></div>'
      +  '<p class="center" style="margin:12px 0 0"><button class="btn ghost" id="bot-end">'+esc(CB.endBtn)+'</button></p>'
      +'</div>'
      +'<p class="center" style="font-size:12px;color:var(--muted);margin-top:8px">'+esc(CB.note)+'</p>';
  }
  h+='<div class="ask"><div class="ah">題本 v2 試測 · 想聽你的感覺</div><ol>'
    +'<li>這次的題目好答嗎?「很不像/幾乎不曾」那端,你用到了嗎?</li>'
    +'<li>二選一的四題——有沒有哪題兩邊都像、很難選?</li>'
    +'<li>報告裡「二選一對照」的落差(如果有),你覺得哪邊更貼近你?</li>'
    +'<li>整份報告,哪一句最中?哪一句最不像你?</li></ol></div>';
  h+='<div class="honest" style="margin-top:26px">'+esc(B.HONEST)+' 這是體驗版(題本 v2 試測):內容為草稿,你的作答只存在這台裝置上、不上傳。</div>';
  $('scr-report').innerHTML=h;
  wireBot(pf,sc,costSt,conf,fc);
  show('scr-report');
}

// ── 八態伴讀:結果頁內嵌聊天(走與問易同一個 Cloudflare Worker 代理,金鑰不在前端)──
// 報告在本機組好帶過去;開場白本機生成(零網路);對話歷史只留在頁面記憶體。
function wireBot(pf,sc,costSt,conf,fc){
  var CB=(V||{}).COMPANION_BOT, st=$('bot-start');
  if(!CB||!CB.url||!st) return;
  var report=buildReportText(pf,sc,costSt,conf,fc);
  var sig=signatureCard(pf);
  var msgs=[], busy=false, started=false;
  function msg(t,cls){ var d=document.createElement('div'); d.className='bm '+cls; d.textContent=t;
    $('bot-msgs').appendChild(d); d.scrollIntoView({block:'nearest'}); return d; }
  function api(body){ return fetch(CB.url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }
  st.onclick=function(){
    if(started) return; started=true;
    var opening=CB.opening.replace('{peak}',sig.title+'('+sig.sub+')');
    msgs.push({role:'assistant',content:opening});
    $('bot-startrow').classList.add('hide');
    $('bot-box').classList.remove('hide');
    msg(opening,'bot');
    $('bot-in').focus();
  };
  function send(){
    var t=$('bot-in').value.trim();
    if(!t||busy||!started) return;
    $('bot-in').value=''; msg(t,'user');
    // 危機關鍵字:本機攔截,直接給求助資源,不呼叫 AI
    var norm=t.replace(/\s+/g,'');
    if(CB.crisisKeys.some(function(k){return norm.indexOf(k)>=0;})){ msg(CB.crisis,'crisis'); return; }
    msgs.push({role:'user',content:t});
    busy=true; var w=msg(CB.thinking,'bot');
    api({report:report,messages:msgs,mode:'chat'}).then(function(d){
      if(!d.reply) throw new Error(d.error||'empty');
      w.textContent=d.reply;
      msgs.push({role:'assistant',content:d.reply});
    }).catch(function(){ w.textContent=CB.offline; msgs.pop(); }).then(function(){ busy=false; });
  }
  $('bot-send').onclick=send;
  // Enter 送出;但輸入法組字中(中文選字未定)或按住 Shift 時不送——避免還沒打完就被送出
  $('bot-in').addEventListener('keydown',function(e){
    if(e.key!=='Enter' || e.shiftKey) return;
    if(e.isComposing || e.keyCode===229) return;
    e.preventDefault(); send();
  });
  $('bot-end').onclick=function(){
    if(!started||busy||msgs.length<3) return;
    busy=true; var w=msg(CB.thinking,'bot');
    api({report:report,messages:msgs,mode:'feedback'}).then(function(d){
      if(!d.summary) throw new Error(d.error||'empty');
      w.textContent=CB.endTitle+'\n'+d.summary+'\n\n'+CB.endThanks;
    }).catch(function(){ w.textContent=CB.offline; }).then(function(){ busy=false; });
  };
}

// ── 入口 ──
$('btn-start').onclick=function(){ S.phase='quiz'; save(); show('scr-quiz'); renderQ(); };
$('btn-code').onclick=function(){
  var d=decodeCode($('code-in').value);
  if(!d){ $('code-err').classList.remove('hide'); return; }
  $('code-err').classList.add('hide');
  renderReport(d.sc,{},null,d.fc);
};
(function(){
  var m=(location.hash||'').match(/[#&]r=(B[12][0-9]{16,20})/i);
  if(m){ var d=decodeCode(m[1]); if(d){ renderReport(d.sc,{},null,d.fc); return; } }
  load();
  if(S.phase==='quiz'&&(S.answers.some(function(a){return a!=null;})||S.fcAns.some(function(a){return a!=null;}))){ show('scr-quiz'); renderQ(); }
  else if(S.phase==='cost'&&S.costQ.length){ show('scr-quiz'); renderCostQ(); }
  else if(S.phase==='interlude'&&S.flags.length){ $('interlude-note').textContent='繼續剛才的第二段(共 '+S.costQ.length+' 題)。'; show('scr-interlude'); }
  else show('scr-intro');
})();
})();
