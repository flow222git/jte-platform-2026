# =====================================================
# Octenso 八態機器可讀定義(Define 層)
# octenso-states-schema v0.1-draft
# =====================================================
# 用途:所有 AI 應用(伴讀/透鏡閱讀/未來 agent)的唯一判讀依據。
#   同一份定義 → 不同 agent 判讀同一素材應收斂(評分者間信度)。
# 結構參考:R/GA Intelligent Brand System Playbook 的
#   Define → Encode → Deploy 三層(僅借架構,內容無涉)。
# 對齊北極星:meta A 同源/鏡子非算命/並列不捏因果。
# 狀態標記:所有 phrasing 沿用素材倉狀態(原始/已翻譯/待審閱/已上線)。
# =====================================================

meta:
  version: "0.1-draft"
  date: "2026-07-15"
  scope: "透鏡層(會議紀錄/BP/制度/個人觀察筆記)優先;伴讀引用需另過語氣憲章"
  filled: ["kan", "li"]          # 本版完整示範:坎、離
  stub: ["qian", "kun", "zhen", "xun", "gen", "dui"]

# -----------------------------------------------------
# 全域護欄(硬規則,編進定義層,任何 agent 不可覆寫)
# -----------------------------------------------------
guardrails:
  - id: G1
    rule: "只診斷能量分佈,不預測成敗"
    enforce: "禁止輸出:成功機率、成敗預言、『這樣下去會…』句式"
  - id: G2
    rule: "缺席優先於失衡,失衡優先於滿格"
    enforce: "報告順序:先列無資料的態,再列失衡疑似,最後才是強態"
  - id: G3
    rule: "前瞻檢查表為主,回溯敘事僅供教學且需標明"
    enforce: "對歷史素材的判讀一律加註『回溯性閱讀,不構成因果宣稱』"
  - id: G4
    rule: "分析單位是『運作』,主詞永遠不是『這種人』"
    enforce: "合法主詞:某分支/某個態/這份文件/這場會議;禁用:你是/他是/X型人"
  - id: G5
    rule: "無證據即無判定"
    enforce: "每一條判定必須附至少一句素材原文引文;引不出來 → 判『缺席(無資料)』"
  - id: G6
    rule: "禁止輸出清單"
    enforce: "總分、排名、錄取/投資建議、相性分數、人格標籤,一律不得出現"
  - id: G7
    rule: "面試/人事場景降級為觀察筆記"
    enforce: "僅輸出『已收集到資料的態/尚無資料的態』清單,提示面試官補問,不做評價"
  - id: G8
    rule: "時間視角可用,因果推移禁止"
    enforce: "允許:使用者自行標記所處階段後,展示該階段的常見提問;禁止:系統主動宣稱『某態之後將走向某態』或任何態序推移預測"

# -----------------------------------------------------
# 判定值域(所有態共用)
# -----------------------------------------------------
verdicts:
  presence:
    - "有料"        # 有多處具體證據
    - "薄"          # 有零星證據,不足以成像
    - "缺席"        # 無資料。注意:≠ 弱。缺席=素材沒給,弱=素材給了且顯示低
  flags:
    - "失衡疑似"    # 僅內部標記;對外文案需過審閱後語彙(見各態 imbalance,均標待審閱)
  units: ["個人", "會議", "文件/BP", "制度/流程", "團隊"]

# =====================================================
# 態定義:坎(完整示範)
# =====================================================
kan:
  卦: "☵ 坎"
  主稱呼: "沉澱者(坎)"        # Route A 語境用(能格/配置)
  雅稱: "探索"                  # Route B/透鏡語境用(態/運作)
  英文候選: "Explore"           # 未定案,不上線
  系統: "認知系統(坎⇄離)"
  分支角色: "向未知取料——往深處走,供給離成像的原料"
  一句話: "深入未知,找到真正的路"
  核心提問: "真正的問題在哪裡?"

  識別信號:
    語言線索:                    # 素材中出現這類話語 → 坎活躍的證據
      - "真正的問題是不是…/我們還不知道…"
      - "先弄清楚再說/有沒有可能其實是…"
      - "承認不確定:『這裡我沒把握』『這是假設不是事實』"
      - "對既有答案追問第二層(為什麼會這樣?)"
    行為線索:
      會議: "有人點名未知、檢驗假設、把『大家以為的共識』拆開來問"
      文件/BP: "有驗證資料、失敗紀錄、迭代史;風險段寫的是真實的未知而非模板"
      制度: "存在探索預算/實驗機制/允許失敗的通道"
    正例引文形狀: "『我們試了三版都失敗,第四版才發現問題其實在 X』"

  缺席判定:
    定義: "素材中完全沒有對未知的承認或探問"
    文件/BP 特別規則: "沒有任何驗證資料、失敗紀錄或被承認的未知 → 缺席,列首位警示(G2)"
    注意: "缺席=無資料,不得推論為『此人/此案坎弱』(G5)"

  低載信號: "無人問問題;假設未經檢驗直接當前提;把未知當已知寫進結論"

  失衡信號:                      # 狀態:待審閱,僅內部標記用,不進對外文案
    描述: "坎分支過度激活:分析迴圈不收斂、決策延宕、風險清單無限增生但無對應行動"
    素材形狀: "同一問題反覆重開、每次會議都在重新定義問題、no-go 從未被說出口"

  成熟表現:                      # 狀態:待審閱
    描述: "能面對不確定而不失方向——未知被命名、被排序,而不是被消滅或被迴避"

  混淆對照:                      # 判讀分歧最常發生的邊界,寫死以助收斂
    vs_離: "坎問『真正的問題在哪』(往深),離問『真正看見了嗎』(往明)。挖掘=坎,詮釋=離"
    vs_艮: "都可能表現為『停下來』。入未知而停=坎(還在動,往內動);設界而停=艮(定住,守住)"
    vs_乾: "都面向未來。開一條新路=乾(定向),探一條沒人走過的路徑=坎(未知本身)"

  禁止推論:
    - "坎有料 ≠ 這個人聰明/這個案子可行(G1)"
    - "坎缺席 ≠ 不會思考,僅=本次素材無資料(G5)"

# =====================================================
# 態定義:離(完整示範)
# =====================================================
li:
  卦: "☲ 離"
  主稱呼: "明現者(離)"
  雅稱: "照見"
  英文候選: "Illuminate"
  系統: "認知系統(坎⇄離)"
  分支角色: "使已知成像——把坎取回的原料變成可傳遞的理解"
  一句話: "讓事物真正被理解"
  核心提問: "真正看見了嗎?"

  識別信號:
    語言線索:
      - "換句話說…/讓我把這件事說清楚"
      - "精確命名:給模糊的現象一個準確的詞"
      - "綜整:把散落的資訊收成一個可複述的結構"
      - "資料呈現時同時交代『這代表什麼、不代表什麼』"
    行為線索:
      會議: "有人做即時綜整;散會時結論可被在場者複述"
      文件/BP: "機制講得清楚(不只講願景);不利資料誠實呈現並解讀"
      制度: "存在把照見制度化的機制(覆盤、教學、文件化)"
    正例引文形狀: "『大家講的其實是兩件事:A 是…,B 是…,我們先分開處理』"

  缺席判定:
    定義: "素材中無任何說明、定義、綜整行為"
    會議特別規則: "資訊大量流動但無人收攏、結論無法被複述 → 離缺席(即使坎很活躍)"

  低載信號: "有資料無人詮釋;名詞從頭到尾未被定義;會議結束沒有人說得出結論"

  失衡信號:                      # 狀態:待審閱
    描述: "離分支過度激活:表達多於理解——形式光鮮但機制不明,用清晰的包裝運送未經檢驗的內容"
    素材形狀: "簡報完美但答不出第二層追問;每個問題都有流利的答案、沒有一個附證據"
    典型結構: "離過載+坎缺席=最高風險組合(說得極清楚的東西,沒有被真正探究過),列 G2 首位警示"

  成熟表現:                      # 狀態:待審閱
    描述: "照亮別人,也照亮自己——清晰服務於真實,而不是服務於說服"

  混淆對照:
    vs_坎: "同系統雙分支:坎供料、離成像。雙強=既深又亮(T3 坎離組即此形)"
    vs_兌: "都涉及表達。為了被理解而說=離,為了共鳴連結而說=兌。檢驗:拿掉聽眾情緒,內容還成立嗎?成立=離"
    vs_巽: "都能改變他人想法。以澄清改變=離(你看清了),以滲透改變=巽(你被帶動了)"

  禁止推論:
    - "離有料 ≠ 內容為真(G1;Theranos 型風險:清晰≠真實)"
    - "表達不佳 ≠ 離缺席,需先確認是否只是無表達場景(G5)"

# =====================================================
# 待填 stub(欄位同上,回 Claude Code 依素材倉量產)
# =====================================================
# =====================================================
# 態定義:乾
# =====================================================
qian:
  卦: "☰ 乾"
  主稱呼: "開創者(乾)"
  雅稱: "展行"
  英文候選: "Manifest"          # 未定案,不上線
  系統: "建構系統(乾⇄坤)"
  分支角色: "定方向開新局——使不存在的開始存在,交給坤接住長成"
  一句話: "讓原本不存在的可能開始存在"
  核心提問: "未來可以成為什麼?"

  識別信號:                      # 狀態:原始(依學理憲法卦德「健·始」推導)
    語言線索:
      - "開局宣告:『我們來開一個新的…/這件事該由我們先做』"
      - "定方向:『目標是 X,往這裡走』,並說得出為什麼是這條路"
      - "把未來講成可著手的事,不是空願景"
      - "拍板並具名承擔:『就這麼定,結果我負責』"
    行為線索:
      會議: "有人定調、開局,把發散的討論收成一個方向決定"
      文件/BP: "有清楚的方向選擇(為何走這條路而非那條);開創主張有具名的拍板者"
      制度: "存在明確的決策權設計、新提案的立項通道"
    正例引文形狀: "『這個市場還沒人做,我們定第一版規格,三個月後上』"

  缺席判定:
    定義: "素材中無人定向、無開局主張"
    文件/BP 特別規則: "只有跟隨式敘述(別人做了所以我們做)而無自己的定向 → 缺席"
    注意: "缺席=無資料,不得推論為『此運作缺乏領導』(G5)"

  低載信號: "會而不決;方向由慣性決定;沒有人說得出『我們要去哪』"

  失衡信號:                      # 狀態:待審閱(A-11 過翻譯規則)
    描述: "乾分支過度激活:方向由單點壟斷、異見無入口;選項未攤開就收斂(急於拍板)"
    素材形狀: "會議紀錄只有結論沒有選項;每次定向都來自同一個聲音"

  成熟表現:                      # 狀態:待審閱
    描述: "開始,也懂得交棒——開局之後把方向交給承接,而不是抓住所有起點"

  混淆對照:
    vs_坤: "同系統雙分支:乾定方向、坤接住長成。開局=乾,落地=坤"
    vs_震: "都表現為『發動』。定向開創(往哪去)=乾,破局啟動(先動起來)=震"
    vs_巽: "都推進改變。開一個新局=乾(從無到有),把改變鋪進系統=巽(從有到深)"
    vs_坎: "都面向未來。開一條新路=乾(定向),探一條沒人走過的路徑=坎(未知本身)"

  禁止推論:
    - "乾有料 ≠ 這個案子有前景(G1)"
    - "乾缺席 ≠ 沒有企圖心,僅=本次素材無資料(G5)"

# =====================================================
# 態定義:坤
# =====================================================
kun:
  卦: "☷ 坤"
  主稱呼: "承接者(坤)"
  雅稱: "承載"
  英文候選: "Nurture"           # 未定案,不上線
  系統: "建構系統(乾⇄坤)"
  分支角色: "接住開始——讓乾開出的局落地、被撐住、長成"
  一句話: "讓開始真正長成"
  核心提問: "如何讓它真正落地?"

  識別信號:                      # 狀態:原始(依卦德「順·載物」推導)
    語言線索:
      - "承接宣告:『這塊我接/我來扛』"
      - "把決定翻成執行安排(誰做、何時、怎麼落地)"
      - "照顧到人:『這樣一線同事跑得動嗎?』"
      - "盤點現實條件:『要落地還缺什麼?』"
    行為線索:
      會議: "決定之後有人接走、化成分工與時程;較弱的聲音被接住"
      文件/BP: "營運與執行段落具體(不只講願景);資源盤點誠實"
      制度: "有承接與托底機制(新人導引、出事有人接、支援通道)"
    正例引文形狀: "『這案子我接,先盤人力,下週給落地版』"

  缺席判定:
    定義: "素材中全是方向與亮點,無人談怎麼接住、誰來扛"
    文件/BP 特別規則: "無營運計畫、無執行路徑 → 缺席,列警示(G2)"
    注意: "缺席=無資料,不得推論為『執行力差』(G5)"

  低載信號: "決而不行;每個決定都懸空;沒有人問執行細節"

  失衡信號:                      # 狀態:待審閱(A-11 過翻譯規則;「自我犧牲」屬臨床邊緣語彙,對外不用)
    描述: "坤分支過度激活:無界線地承接、來者不拒,主體性讓位"
    素材形狀: "同一單位承接所有新增工作;『好,我來』的頻率遠高於『這我接不了』"

  成熟表現:                      # 狀態:待審閱
    描述: "承載而不失去自己——接住之前,先看得見自己的界線"

  混淆對照:
    vs_乾: "同系統雙分支:乾定方向、坤接住長成。開局=乾,落地=坤"
    vs_艮: "都表現為『守』。守住界線把事擋在外=艮(定界),守住裡面把人事撐起來=坤(承載)"
    vs_兌: "都接住人。接住工作與現實=坤(承載),接住感受與話語=兌(回應)"

  禁止推論:
    - "坤有料 ≠ 這個團隊執行力強(G1)"
    - "坤缺席 ≠ 不肯付出,僅=本次素材無資料(G5)"
zhen: { 卦: "☳ 震", 雅稱: "啟動", 系統: "推動系統(震⇄巽)", status: "TODO" }
xun:  { 卦: "☴ 巽", 雅稱: "滲透", 系統: "推動系統(震⇄巽)", status: "TODO" }
gen:  { 卦: "☶ 艮", 雅稱: "定界", 系統: "調節系統(艮⇄兌)", status: "TODO" }
dui:  { 卦: "☱ 兌", 雅稱: "共鳴", 系統: "調節系統(艮⇄兌)", status: "TODO" }

# -----------------------------------------------------
# 輸出規格(Deploy 層吃這個格式)
# -----------------------------------------------------
output_spec:
  每態輸出:
    - "presence 判定(有料/薄/缺席)+ 逐字證據引文(G5)"
    - "失衡疑似 flag(如有),僅內部;對外語彙待審閱"
  報告結構: "①缺席清單(含補問建議)→ ②失衡疑似 → ③強態圖景 → ④系統層小結(四系統各一句:這一段的流動狀況)"
  語氣: "過 speak-human-tw 校對;負面清單(罐頭同理心/說教深度腔/金句公式)適用"
  絕不輸出: "總分/排名/建議錄取/投資建議/成敗預測/人格標籤(G6)"

# -----------------------------------------------------
# 工作假說(素材倉層級,未立項,不進判讀邏輯)
# -----------------------------------------------------
working_hypotheses:
  - id: WH1
    name: "歷時軸(元亨利貞四拍)"
    content: >
      共時八格之外存在一條合規的時間視角:由使用者自行標記專案/週期
      所處之拍(發端/展開/成熟/收藏),框架僅提供該拍的常見提問。
      主詞是使用者的判斷,系統不做推移預測(受 G8 管轄)。
      血統優勢:與八態同出易學母體,銜接無違和。
    status: "素材倉,未立項"

# -----------------------------------------------------
# 驗收計畫(schema 何時算立起來)
# -----------------------------------------------------
acceptance:
  - "step1: 坎離兩態規格由 Simon 確認 → 回 Claude Code 量產其餘六態"
  - "step2: 同一份真實素材(會議紀錄或 BP)由兩個獨立 agent 各自依本 schema 判讀"
  - "step3: 收斂度檢查——presence 判定一致率、引文重疊度;分歧處回頭補『混淆對照』欄"
  - "step4: 收斂達標後,schema 升 v0.2,透鏡層正式立項"
