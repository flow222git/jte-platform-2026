<!--

  右=提案寫法:標籤列 / 喜歡·不耐煩對照 / 系統三段式 / 音量條教學 / 測量品質聲明
  分數與判讀一律走真引擎(profile.js),不手工假造;右欄新增文案為草稿,

<style>
  :root{--bg:#f4efe4;--surface:#f8f4ec;--surface2:#efe9dc;--ink:#23241f;--ink-soft:#3a3a32;--muted:#6f6657;

  *{box-sizing:border-box;margin:0;padding:0}

  .eyebrow{font-family:"Jost",ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.26em;color:var(--muted);
    text-transform:uppercase;text-align:center;margin-bottom:10px}
  h1{font-weight:200;font-size:24px;letter-spacing:.14em;color:var(--ink);text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .draft{display:block;width:fit-content;margin:0 auto 18px;text-align:center;font-size:11.5px;color:var(--cinnabar);
    border:1px solid var(--cinnabar);border-radius:999px;padding:3px 14px;letter-spacing:.1em}
  .switch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
  .sw{font-family:inherit;font-weight:300;font-size:13px;letter-spacing:.04em;padding:8px 16px;cursor:pointer;
    border:1px solid var(--hair);border-radius:999px;background:transparent;color:var(--muted);transition:.15s}
  .sw:hover{border-color:var(--ink);color:var(--ink)}
  .sw.on{border-color:var(--ink);color:var(--ink);background:var(--surface)}
  .cols{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:900px){.cols{grid-template-columns:1fr 1fr;gap:22px}}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 24px}
  .col.now{background:transparent;border-style:dashed}
  .ctag{font-family:"Jost",sans-serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px}
  .ctitle{font-size:14px;color:var(--ink);letter-spacing:.06em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .msg{font-size:13.5px;line-height:1.95;white-space:pre-line;background:var(--bg);border:1px solid var(--line);
    border-radius:11px;padding:10px 13px;margin-bottom:9px}
  .col.now .msg{background:var(--surface)}
  .lbl{font-size:11px;letter-spacing:.16em;color:var(--gold);margin:16px 0 6px;font-family:"Jost",sans-serif;text-transform:uppercase}
  /* 提案:峰名卡 */
  .pcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;margin-bottom:10px}
  .pcard .pt{font-family:"Songti TC","Noto Serif TC",serif;font-weight:500;font-size:21px;letter-spacing:.1em;color:var(--ink)}
  .pcard .ps{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11.5px;letter-spacing:.06em;color:var(--pine);border:1px solid var(--hair);
    border-radius:999px;padding:2px 11px;background:var(--surface)}
  /* 提案:喜歡/不耐煩 */
  .pref{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
  .pref th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:400;text-align:left;padding:4px 8px 6px;border-bottom:1px solid var(--line)}
  .pref td{padding:7px 8px;vertical-align:top;border-bottom:1px solid var(--surface2);line-height:1.8}
  .pref td.k{white-space:nowrap;color:var(--ink);font-size:12.5px}
  .pref td.y{color:var(--pine)} .pref td.n{color:var(--cinnabar)}
  .pref .sc{font-family:"Jost",sans-serif;font-size:11px;color:var(--muted);margin-left:4px}
  /* 提案:系統三段式 */
  .sys{border-left:2px solid var(--pine);padding:2px 0 2px 13px;margin:12px 0}
  .sys .sh{font-size:13.5px;color:var(--ink);letter-spacing:.05em;margin-bottom:7px}
  .sys .sh b{font-weight:400;color:var(--pine)}
  .sys .row{font-size:13px;line-height:1.85;margin-bottom:5px}
  .sys .row i{font-style:normal;color:var(--muted);font-size:11.5px;letter-spacing:.1em;margin-right:6px}
  .bars{margin:8px 0 4px}
  .bar{display:flex;align-items:center;gap:9px;margin:5px 0}
  .bar .bl{flex:none;width:4.6em;font-size:12.5px;color:var(--ink)}
  .bar .bt{flex:1;height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}
  .bar .bt i{display:block;height:100%;border-radius:5px;background:var(--hair)}
  .bar .bt i.on{background:var(--pine)}
  .bar .bv{flex:none;width:2em;text-align:right;font-family:"Jost",sans-serif;font-size:11px;color:var(--muted)}
  .teach{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:6px}
  .quo{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .quo .q{display:flex;gap:10px;align-items:baseline;margin:4px 0;flex-wrap:wrap}
  .quo .qt{font-size:13.5px;color:var(--ink)}
  .quo .qw{font-size:11.5px;color:var(--muted)}
  /* 提案:測量品質 */
  .qual{border:1px solid var(--gold);border-radius:11px;padding:11px 14px;margin-bottom:10px;background:var(--bg)}
  .qual .qh{font-size:12px;letter-spacing:.1em;color:var(--gold);margin-bottom:4px}
  .qual .qb{font-size:13px;line-height:1.9}
  .dissent{margin-top:8px;font-size:12px;color:var(--muted)}

    border-radius:8px;padding:7px 11px;font-family:inherit;font-size:12.5px;color:var(--ink)}
  .note{font-size:12px;color:var(--muted);line-height:1.9;padding-left:14px;border-left:1px solid var(--hair);margin-top:26px}
  .scores{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px;font-family:"Jost",sans-serif;letter-spacing:.04em}
</style>

// 系統三段式:在做什麼 / 優勢 / 代價(依系統×狀態)
var SYS3={
  build:{
    leanL:{d:'事情來了,你先想「往哪走」——方向定下來,大家才動得了。',
           a:'局面越亂你越清楚;別人還在觀望,你已經拍板。',

    mid:{d:'帶頭還是接住,你看場合決定。',a:'兩種位置你都站得住,調度空間大。',c:'沒有固定招牌,別人可能不確定該把哪種角色交給你。'}
  },

  regulate:{

var BAR_TEACH='每個系統有兩條——它們不是二選一,可以同時亮、也可以同時暗。條子長=此刻用得多。';

// ── 範例(用真引擎判讀,不手工假造)──
var CASES=[
  {id:'clear', nm:'範例一 · 形狀清楚',
   sc:{qian:88,zhen:68,li:64,dui:56,xun:52,kun:44,gen:36,kan:28}},
  {id:'flat', nm:'範例二 · 形狀很平(前三名幾乎同分)',
   sc:{qian:58,li:56,dui:55,zhen:53,kun:52,xun:51,kan:49,gen:47}}
];

function nowHtml(pf,sc){
  var h='', kind=pf.signature.kind, lead0=pf.leads[0];
  h+='<div class="lbl">峰名段</div>';
  h+='<div class="msg">先看此刻最亮的地方——</div>';
  h+='<div class="msg">'+esc(kind==='single'?SP.peakLead[lead0]:(SP.peakKind[kind]||SP.peakKind.pattern))+'</div>';
  // 系統段(主峰所在)
  var ax=null;
  pf.axes.forEach(function(a){P.PAIRS.forEach(function(p){if(p.key===a.key&&(p.l===lead0||p.r===lead0))ax=a;});});
  if(!ax)ax=pf.axes[0];
  var st=axState(ax);
  var plain=(ax.key==='drive'&&st==='bothHigh')?GT.tension
    :GT.state[st].replace(/\{L\}/g,GT.pole[ax.l]).replace(/\{R\}/g,GT.pole[ax.r]);
  h+='<div class="lbl">系統段</div>';
  h+='<div class="msg">再往裡看一層——這股峰,在你內在的四大系統裡住在哪:</div>';
  h+='<div class="msg">'+esc(SP.gateIntro.replace('{G}',GT.name[ax.key])+'\n'
      +(GT.mission&&GT.mission[ax.key]?GT.mission[ax.key]+'\n':'')
      +'這個系統'+GT.q[ax.key]+'\n此刻的運作:'+plain)+'</div>';
  // 電量段
  var on=0,off=0;
  EK.forEach(function(k){ if(sc[k]>=P.TUNE.RES)on++; else if(sc[k]<=P.TUNE.GAP)off++; });
  h+='<div class="lbl">電量段</div>';
  h+='<div class="msg">然後看整體的電量——</div>';
  h+='<div class="msg">'+esc((SP.level[pf.level.band]||SP.level.mid).replace('{ON}',on).replace('{OFF}',off))+'</div>';
  return h;
}
function axState(ax){
  return ax.intensity==='both-high'?'bothHigh':ax.intensity==='both-low'?'bothLow'
    :ax.intensity==='single'?(ax.lean==='left'?'leanL':'leanR'):'mid';
}
function pn(k){var g=B.get(k);return g.fnShort+'者('+g.nm+')';}

function newHtml(pf,sc){
  var h='', kind=pf.signature.kind, rk=pf.ranked, lead0=pf.leads[0];
  // ① 測量品質聲明
  var gap=rk[0].v-rk[1].v, clear=(kind==='single');
  h+='<div class="lbl">① 測量品質聲明(新)</div>';
  h+='<div class="qual"><div class="qh">這次照得清不清楚</div><div class="qb">'
    +(clear
      ? '這次的形狀蠻清楚的——'+pn(rk[0].k)+'比第二名高出 '+gap+' 分,主峰站得住。'
      : '這次的形狀很平——前三名只差 '+(rk[0].v-rk[2].v)+' 分,幾乎是平手。可能你本來就均衡,也可能今天答得比較保守。<b>下面的主峰判讀,請放輕一點看。</b>')
    +'</div>'
    +'<div class="dissent">'+(clear?'覺得不像?下面每一段都可以告訴我們。'
      :'如果三個都不像你,直接告訴我們你覺得自己是哪一種(不會改變這次結果):')
    +(clear?'':'<input placeholder="例如:我覺得我比較像 承接者">')+'</div></div>';
  // ② 峰名卡+標籤列
  h+='<div class="lbl">② 峰名卡 + 標籤列(新)</div>';
  var leads=pf.leads.slice(0,kind==='single'?1:3);
  var tg=[];leads.forEach(function(k){ (TAGS[k]||[]).forEach(function(t){ if(tg.indexOf(t)<0)tg.push(t); }); });
  h+='<div class="pcard"><div class="pt">'+esc(leads.map(pn).join(' × '))+'</div>'
    +'<div class="ps">'+esc(kind==='single'?'單一主峰':kind==='dual'?'雙峰並立':kind==='multi'?'多峰同行':'看整體格局')+' · 此刻的快照</div>'
    +'<div class="tags">'+tg.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div></div>';
  // ③ 喜歡/不耐煩
  h+='<div class="lbl">③ 你偏好什麼 / 什麼會讓你不耐煩(新)</div>';
  h+='<table class="pref"><tr><th style="width:7.5em">最亮的幾股</th><th>你偏好</th><th>會讓你不耐煩</th></tr>';
  rk.slice(0,3).forEach(function(o){
    h+='<tr><td class="k">'+esc(B.get(o.k).fnShort)+'<span class="sc">'+o.v+'</span></td>'
      +'<td class="y">'+esc(PREF[o.k].y)+'</td><td class="n">'+esc(PREF[o.k].n)+'</td></tr>';
  });
  var last=rk[rk.length-1];
  h+='<tr><td class="k" style="color:var(--muted)">'+esc(B.get(last.k).fnShort)+'<span class="sc">'+last.v+'</span></td>'
    +'<td colspan="2" style="color:var(--muted)">此刻收得最多的一股——上面那組「偏好」,你目前比較少去要。</td></tr>';
  h+='</table>';
  // ④ 系統三段式 + 音量條教學
  var ax=null;
  pf.axes.forEach(function(a){P.PAIRS.forEach(function(p){if(p.key===a.key&&(p.l===lead0||p.r===lead0))ax=a;});});
  if(!ax)ax=pf.axes[0];
  var st=axState(ax), s3=SYS3[ax.key][st];
  h+='<div class="lbl">④ 系統段:固定三段式(新)</div>';
  h+='<div class="teach">'+esc(BAR_TEACH)+'</div>';
  h+='<div class="bars">'
    +bar(GT.pole[ax.l],sc[ax.l],st==='leanL'||st==='bothHigh')
    +bar(GT.pole[ax.r],sc[ax.r],st==='leanR'||st==='bothHigh')+'</div>';
  h+='<div class="sys"><div class="sh"><b>'+esc(GT.name[ax.key])+'</b>——'+esc(GT.pole[ax.l])+' ⇄ '+esc(GT.pole[ax.r])+'</div>'
    +'<div class="row"><i>在做什麼</i>'+esc(s3.d)+'</div>'
    +'<div class="row"><i>你的優勢</i>'+esc(s3.a)+'</div>'
    +'<div class="row"><i>要留意</i>'+esc(s3.c)+'</div></div>';
  // ⑤ 最想聽到的話(台詞)
  h+='<div class="lbl">⑤ 你最想聽到的話(新)</div>';
  h+='<div class="quo">';
  (LINES[rk[0].k]||[]).concat(LINES[rk[1].k]||[]).slice(0,3).forEach(function(x){
    h+='<div class="q"><span class="qt">「'+esc(x[0])+'」</span><span class="qw">'+esc(x[1])+'</span></div>';
  });
  h+='</div>';
  return h;
}
function bar(nm,v,on){
  return '<div class="bar"><span class="bl">'+esc(nm)+'</span><span class="bt"><i class="'+(on?'on':'')+'" style="width:'+v+'%"></i></span><span class="bv">'+v+'</span></div>';
}

function render(i){
  var c=CASES[i], pf=P.build(c.sc);
  $('scores').textContent=P.EKEYS.map(function(k){return B.get(k).fnShort+' '+c.sc[k];}).join(' · ');
  $('now').innerHTML=nowHtml(pf,c.sc);
  $('new').innerHTML=newHtml(pf,c.sc);
  [].slice.call($('sw').children).forEach(function(b,j){ b.className='sw'+(j===i?' on':''); });
  document.body.setAttribute('data-case',c.id);
}
CASES.forEach(function(c,i){
  var b=document.createElement('button');b.className='sw';b.textContent=c.nm;
  b.onclick=function(){render(i);};
  $('sw').appendChild(b);
});
$('note').textContent=B.HONEST+' 這是比稿用 demo:兩欄的分數與判讀都走同一個引擎(profile.js),差別只在文案寫法。右欄的標籤、偏好對照、系統三段式為草稿文案,若採用須移入 canonical 資料檔。';
render(0);
document.body.setAttribute('data-ready','1');
window.DEMO={cases:CASES,render:render};
})();
</script>
</body></html>
