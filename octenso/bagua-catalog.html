<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script defer src="octenso-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<title>Octenso 八態能格 · 型錄(草稿·未上線)</title>
<style>
  :root{--bg:#f4efe4;--surface:#f8f4ec;--surface2:#efe9dc;--ink:#23241f;--ink-soft:#3a3a32;--muted:#6f6657;
    --line:#d2c7b4;--hair:#bcb09a;--pine:#35614f;--cinnabar:#9d4b34;--gold:#a9823b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink-soft);font-family:"Noto Sans TC",ui-sans-serif,system-ui,sans-serif;
    font-weight:300;line-height:1.95;font-size:15px;max-width:680px;margin:0 auto;padding:30px 20px 80px}
  .eyebrow{font-family:"Jost",ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.26em;color:var(--muted);
    text-transform:uppercase;text-align:center;margin-bottom:12px}
  h1{font-weight:200;font-size:28px;letter-spacing:.14em;color:var(--ink);text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.06em;margin-bottom:16px}
  .draft{max-width:430px;margin:0 auto 34px;text-align:center;font-size:12px;color:var(--cinnabar);
    border:1px solid var(--cinnabar);border-radius:999px;padding:5px 14px;letter-spacing:.1em}
  .felt{font-size:12.5px;color:var(--muted);text-align:center;letter-spacing:.06em;margin-bottom:30px}
  .rule{height:1px;background:var(--line);margin:46px 0}
  .seclabel{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:400;margin:0 0 16px}
  /* 卦 selector */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:30px}
  .tab{font-family:inherit;font-weight:300;font-size:13px;letter-spacing:.04em;padding:8px 14px;cursor:pointer;
    border:1px solid var(--hair);border-radius:999px;background:transparent;color:var(--muted);transition:.2s}
  .tab .sym{font-family:"Songti TC","Noto Serif TC",serif;margin-right:4px}
  .tab:hover{border-color:var(--ink);color:var(--ink)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  /* portrait */
  .p-head{text-align:center;margin:34px 0 8px}
  .p-sym{font-family:"Songti TC","Noto Serif TC",serif;font-size:34px;color:var(--ink);line-height:1.1}
  .p-title{font-weight:200;font-size:22px;letter-spacing:.2em;color:var(--ink);padding-left:.2em;margin-top:6px}
  .p-fn{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-top:2px}
  h3.blk{display:flex;align-items:center;gap:12px;font-weight:400;font-size:14.5px;letter-spacing:.12em;
    color:var(--ink);margin:34px 0 8px}
  h3.blk::after{content:"";flex:1;height:1px;background:var(--line)}
  .band{font-size:11px;font-weight:300;letter-spacing:.1em;color:var(--muted)}
  .band.mid{color:var(--pine)}.band.over{color:var(--cinnabar)}.band.under{color:var(--gold)}
  .blktxt{font-size:14.5px;line-height:2.05}
  /* T2 grid */
  details{border-top:1px solid var(--line);padding:10px 0}
  details:last-of-type{border-bottom:1px solid var(--line)}
  summary{cursor:pointer;font-size:14px;color:var(--ink);letter-spacing:.05em;list-style:none;display:flex;gap:10px;align-items:baseline}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"＋";color:var(--hair);font-size:12px}
  details[open] summary::before{content:"－"}
  .lv{margin:12px 0 6px;padding-left:15px;border-left:1px solid var(--hair)}
  .lv .lvh{font-size:12px;letter-spacing:.1em;margin-bottom:3px}
  .lv .lvh.mid{color:var(--pine)}.lv .lvh.over{color:var(--cinnabar)}.lv .lvh.under{color:var(--gold)}
  .lv p{font-size:13.5px;line-height:1.95}
  /* combos & patterns & relations */
  .c-title{font-weight:400;font-size:15px;color:var(--ink);letter-spacing:.08em}
  .c-tag{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-left:8px}
  .c-tag.tension{color:var(--cinnabar)}
  .c-text{font-size:13.5px;line-height:2;margin-top:8px;white-space:pre-line}
  .honest{margin-top:60px;padding-left:15px;border-left:1px solid var(--hair);font-size:12.5px;color:var(--muted);line-height:1.95}
</style>
</head><body>

<div class="eyebrow">Octenso · Catalog</div>
<h1>八態能量型錄</h1>
<div class="sub">八股能量在各場域、各能格下的顯相圖鑑——主峰是入口,格局是本體</div>
<div class="draft">草稿 v0.1 · 未上線——未接任何現行頁面與導覽</div>
<div class="felt" id="felt"></div>

<div class="tabs" id="tabs"></div>
<div id="portrait"></div>

<div class="rule"></div>
<div class="seclabel">場域 × 能格 · 速查(此峰)</div>
<div id="t2"></div>

<div class="rule"></div>
<div class="seclabel">雙峰組合 · 四對待(其餘組合以並存句式呈現)</div>
<div id="t3"></div>

<div class="rule"></div>
<div class="seclabel">格局型 · 無單一主峰時</div>
<div id="t4"></div>

<div class="rule"></div>
<div class="seclabel">關係合盤 · 十二組(錯卦四組+同峰八組)</div>
<div id="t5"></div>

<div class="honest" id="honest"></div>

<script src="bagua-data.js"></script>
<script src="bagua-catalog-data.js"></script>
<script src="bagua-catalog-t1.js"></script>
<script src="bagua-catalog-combos.js"></script>
<script>
(function(){
  var B=window.OCTENSO_BAGUA, C=window.OCTENSO_CATALOG;
  var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');};
  document.getElementById('felt').textContent=C.FELT;
  document.getElementById('honest').textContent=B.HONEST;

  var cur='qian';
  var tabs=document.getElementById('tabs');
  B.ORDER.forEach(function(k){
    var g=B.get(k), b=document.createElement('button');
    b.className='tab'; b.dataset.k=k;
    b.innerHTML='<span class="sym">'+g.sym+'</span>'+g.nm+'·'+g.fnShort;
    b.onclick=function(){cur=k;render();};
    tabs.appendChild(b);
  });

  var BANDCLS={'中正':'mid','亢':'over','亢的階梯':'over','潛':'under'};
  function render(){
    Array.prototype.forEach.call(tabs.children,function(b){b.classList.toggle('on',b.dataset.k===cur);});
    var g=B.get(cur), p=C.T1[cur];
    var h='<div class="p-head"><div class="p-sym">'+g.sym+'</div>'
      +'<div class="p-title">'+g.title+'</div>'
      +'<div class="p-fn">'+esc(g.fn)+' · '+esc(g.titleEn)+'</div></div>';
    C.T1_SECTIONS.forEach(function(s){
      var band=s.band?('<span class="band '+(BANDCLS[s.band]||'')+'">'+s.band+'</span>'):'';
      h+='<h3 class="blk">'+s.nm+band+'</h3><p class="blktxt">'+esc(p[s.key])+'</p>';
    });
    document.getElementById('portrait').innerHTML=h;

    var t2=C.T2[cur], hh='';
    C.DOMAINS.forEach(function(d){
      hh+='<details><summary>'+d.nm+'</summary>';
      C.LEVELS.forEach(function(l){
        hh+='<div class="lv"><div class="lvh '+l.key+'">'+l.nm+' · '+l.note+'</div><p>'+esc(t2[d.key][l.key])+'</p></div>';
      });
      hh+='</details>';
    });
    document.getElementById('t2').innerHTML=hh;
  }

  var h3='';
  Object.keys(C.T3).forEach(function(k){
    var c=C.T3[k];
    h3+='<details><summary><span class="c-title">'+c.title+'</span>'
      +'<span class="c-tag'+(c.tension?' tension':'')+'">'+c.pair+' · '+c.character+'</span></summary>'
      +'<p class="c-text">'+esc(c.text)+'</p></details>';
  });
  h3+='<p style="font-size:12.5px;color:var(--muted);margin-top:12px">其餘 24 種非對待雙峰:'+esc(C.T3_FALLBACK)+'(俟上線頻率資料再逐對擴寫)</p>';
  document.getElementById('t3').innerHTML=h3;

  var h4='';
  ['high','low','mid'].forEach(function(k){
    var c=C.T4[k];
    h4+='<details><summary><span class="c-title">'+c.nm+'</span></summary><p class="c-text">'+esc(c.text)+'</p></details>';
  });
  document.getElementById('t4').innerHTML=h4;

  var h5='';
  Object.keys(C.T5).forEach(function(k){
    var c=C.T5[k];
    h5+='<details><summary><span class="c-title">'+c.nm+'</span><span class="c-tag">'+c.kind+'</span></summary>'
      +'<p class="c-text">'+esc(c.text)+'</p></details>';
  });
  document.getElementById('t5').innerHTML=h5;

  render();
})();
</script>
</body></html>
