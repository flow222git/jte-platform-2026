<style>

  .intro{font-size:clamp(14.5px,3.9vw,16.5px);color:var(--ink-soft);letter-spacing:.1em;line-height:2;

  .trigrams{font-size:clamp(20px,5.5vw,25px);letter-spacing:.2em;margin:40px 0 38px;color:var(--ink);
    opacity:0;animation:rise 1s .85s ease-out forwards}

  .nav-links{display:flex;gap:clamp(20px,6vw,40px);justify-content:center;flex-wrap:wrap;
    opacity:0;animation:rise 1s 1.05s ease-out forwards}
  .tlink{font-family:"Noto Sans TC",sans-serif;font-weight:300;font-size:15.5px;letter-spacing:.06em;color:var(--ink);

  .tlink:hover{border-bottom-color:var(--ink)}
  .tlink.sub{color:var(--muted)}
  .tlink.sub:hover{color:var(--ink)}

  .foot{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-family:"Jost",sans-serif;
    font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;line-height:2;
    opacity:0;animation:rise 1s 1.3s ease-out forwards}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
