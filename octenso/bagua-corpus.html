<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script defer src="octenso-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<title>八態素材倉 · 練息場</title>
<!--
  八態素材倉(對境迴圈 M1,2026-07-18)
  內容=使用者在問易/卜易等處 opt-in 收進來的「自己寫下的字」。
  全部存本機 localStorage(octenso_corpus_v1),不上傳;刪了就沒了。
  之後個人八態鏡(M4)從這裡讀素材照跨次規律。
-->
<style>
  :root{--bg:#f4efe4;--surface:#f8f4ec;--surface2:#efe9dc;--ink:#23241f;--ink-soft:#3a3a32;--muted:#6f6657;
    --line:#d2c7b4;--hair:#bcb09a;--pine:#35614f;--cinnabar:#9d4b34;--gold:#a9823b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink-soft);font-family:"Noto Sans TC",ui-sans-serif,system-ui,sans-serif;
    font-weight:300;line-height:1.9;font-size:15px;max-width:640px;margin:0 auto;padding:26px 20px 80px}
  .eyebrow{font-family:"Jost",ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.26em;color:var(--muted);
    text-transform:uppercase;text-align:center;margin-bottom:10px}
  h1{font-weight:200;font-size:24px;letter-spacing:.14em;color:var(--ink);text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.05em;margin-bottom:8px}
  #meta{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:20px;min-height:1.6em}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-top:12px}
  .card .top{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
  .tag{font-family:"Jost",sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .tag.wy{color:var(--pine);border-color:var(--pine)}
  .tag.by{color:var(--gold);border-color:var(--gold)}
  .lab{font-size:13px;color:var(--ink)}
  .time{font-family:"Jost",sans-serif;font-size:11px;color:var(--hair)}
  .del{margin-left:auto;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;
    text-decoration:underline;font-family:inherit;padding:2px}
  .del:hover{color:var(--cinnabar)}
  .body{white-space:pre-line;font-size:13.5px;line-height:1.95}
  .card details{margin-top:8px;border-top:1px solid var(--surface2);padding-top:6px}
  .card summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
  .card summary::-webkit-details-marker{display:none}
  .card summary::before{content:"＋ ";color:var(--hair)}
  .card details[open] summary::before{content:"－ "}
  .ctx{white-space:pre-line;font-size:12.5px;color:var(--muted);line-height:1.9;margin-top:6px}
  #empty{text-align:center;color:var(--muted);font-size:13.5px;margin-top:36px;line-height:2.1}
  .foot{text-align:center;margin-top:26px}
  .clear{font-size:12.5px;color:var(--muted);background:none;border:1px solid var(--hair);border-radius:999px;
    padding:7px 18px;cursor:pointer;font-family:inherit}
  .clear:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
  .honest{font-size:12px;color:var(--muted);line-height:1.95;padding-left:14px;border-left:1px solid var(--hair);margin-top:30px}
</style></head>
<body>
<div class="eyebrow">Octenso · Corpus · Local Only</div>
<h1>八態素材倉</h1>
<div class="sub">你在問易/卜易按「收進素材」留下的話,只存在這台裝置</div>
<div id="meta"></div>
<div id="list"></div>
<p id="empty" style="display:none">倉裡還沒有素材。<br>去問易或卜易走一輪,結尾按「收進素材」,這裡就會開始累積。</p>
<div class="foot"><button class="clear" id="clearall" style="display:none">全部清空</button></div>

<div class="honest">素材倉存在此裝置的瀏覽器(localStorage),不上傳、換裝置不同步、清瀏覽器資料會消失。
積累夠了之後,可以用八態鏡照出跨次的個人規律(規劃中)——照之前也會先問你。</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var SRC={'ven-i-WenYi':['問易','wy'],'ven-i-BuYi':['卜易','by']};
function esc(s){return String(s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
function fmtTime(ts){return String(ts).slice(0,16).replace('T',' ');}
function render(){
  var C=window.OctensoCorpus;
  var list=C?C.list():[];
  var box=$('list');box.innerHTML='';
  $('empty').style.display=list.length?'none':'block';
  $('clearall').style.display=list.length?'inline-block':'none';
  $('meta').textContent=list.length?('共 '+list.length+' 段 · 約 '+C.totalChars()+' 字'):'';
  list.slice().reverse().forEach(function(e){
    var s=SRC[e.source]||[e.source||'其他',''];
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<div class="top"><span class="tag '+s[1]+'">'+esc(s[0])+'</span>'
      +(e.label?'<span class="lab">'+esc(e.label)+'</span>':'')
      +'<span class="time">'+esc(fmtTime(e.ts))+'</span>'
      +'<button class="del" data-id="'+esc(e.id)+'">刪除</button></div>'
      +'<div class="body">'+esc(e.text)+'</div>'
      +(e.context?('<details><summary>卦象與解讀紀錄</summary><div class="ctx">'+esc(e.context)+'</div></details>'):'');
    d.querySelector('.del').onclick=function(){ OctensoCorpus.remove(e.id); render(); };
    box.appendChild(d);
  });
}
$('clearall').onclick=function(){
  if(confirm('確定清空素材倉?共 '+OctensoCorpus.count()+' 段,清了就沒了。')){ OctensoCorpus.clear(); render(); }
};
function boot(){
  if(window.OctensoCorpus){ render(); document.body.setAttribute('data-ready','1'); }
  else setTimeout(boot,60);
}
boot();
window.CORPUS_VIEW={render:render};
})();
</script>
<script defer src="octenso-corpus.js"></script>
</body></html>
