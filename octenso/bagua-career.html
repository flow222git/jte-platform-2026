// ── 底色（人格）讀取 ─────────────────────────────────────
function getBase(){
  try{ var raw=localStorage.getItem('bagua_persona_v1'); if(!raw) return null; var o=JSON.parse(raw); return (o&&o.scores)?o:null; }
  catch(e){ return null; }
}
function topKeyOf(sc){ var t=EKEYS[0]; EKEYS.forEach(function(k){ if((sc[k]||0)>(sc[t]||0)) t=k; }); return t; }
function energyLabel(k){ return E[k].fn; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

// ════════════════════════════════════════════════════════════
//  你 × 局／職業 引擎（直接重用 bagua-field 的邏輯）
// ════════════════════════════════════════════════════════════
function fitScore(you,field){
  var sw=0,sc=0;
  EKEYS.forEach(function(k){
    var fv=field[k]||0; var yv=you[k]||0;
    var coverage=Math.min(yv,fv)/Math.max(fv,1);
    sw+=fv; sc+=fv*coverage;
  });
  return sw===0?0:Math.round(sc/sw*100);
}
function fitSentence(fit){
  if(fit>=70) return '你大致具備這個職業要的能量——它要什麼，你身上多半有。上手不會太吃力。';
  if(fit>=45) return '你有它要的一部分，也有缺口——能做，但某些地方得多花力氣或找人補。';
  return '它要的能量你比較缺——不是做不來，而是要常常動用你不擅長的部分，要留意別硬撐。';
}
function shinePoints(you,field){
  return EKEYS.filter(function(k){ return (field[k]||0)>=55 && (you[k]||0)>=55; })
    .sort(function(a,b){ return (field[b]+you[b])-(field[a]+you[a]); });
}
function forcedWeak(you,field){
  return EKEYS.filter(function(k){ return (field[k]||0)>=55 && (you[k]||0)<=40; })
    .sort(function(a,b){ return (field[b]-you[b])-(field[a]-you[a]); });
}
function idleStrength(you,field){
  return EKEYS.filter(function(k){ return (you[k]||0)>=60 && (field[k]||0)<=35; })
    .sort(function(a,b){ return (you[b]-field[b])-(you[a]-field[a]); });
}
var shengNext={wood:'fire',fire:'earth',earth:'metal',metal:'water',water:'wood'};
var keNext={wood:'earth',earth:'water',water:'fire',fire:'metal',metal:'wood'};
function topElement(sc){ return E[topKeyOf(sc)].wx; }
function elementFlow(fieldEl,youEl){
  if(fieldEl===youEl) return {type:'same',
    text:'這個職業的主能量是「'+WLAB[fieldEl]+'」，你的主能量也是「'+WLAB[youEl]+'」——<b>同調</b>：好上手，但也容易和它一起偏。'};
  if(keNext[fieldEl]===youEl) return {type:'fieldKeYou',
    text:'這個職業的「'+WLAB[fieldEl]+'」<span class="arrow">剋→</span>你的「'+WLAB[youEl]+'」：<b>它的調性會壓到你的主場，留意被消耗。</b>'};
  if(keNext[youEl]===fieldEl) return {type:'youKeField',
    text:'你的「'+WLAB[youEl]+'」<span class="arrow">剋→</span>這個職業的「'+WLAB[fieldEl]+'」：<b>你的主能量能壓住它，你能主導它。</b>'};
  if(shengNext[fieldEl]===youEl) return {type:'fieldShengYou',
    text:'這個職業的「'+WLAB[fieldEl]+'」<span class="arrow">生→</span>你的「'+WLAB[youEl]+'」：<b>它會滋養你，待在這裡你會長。</b>'};
  if(shengNext[youEl]===fieldEl) return {type:'youShengField',
    text:'你的「'+WLAB[youEl]+'」<span class="arrow">生→</span>這個職業的「'+WLAB[fieldEl]+'」：<b>你會一直餵養它，小心過度付出。</b>'};
  return {type:'same',text:'你和這個職業的主能量彼此呼應。'};
}

// ── Radar wheel（直接沿用 bagua-field 的 buildRadar） ──
function buildRadar(sc,topKey,overlay){
  var cx=200,cy=200,baseR=140;
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-54 -46 508 500');
  [0.25,0.5,0.75,1].forEach(function(f){
    var pts=EKEYS.map(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      return (cx+ux*baseR*f)+','+(cy+uy*baseR*f);
    }).join(' ');
    var poly=document.createElementNS(NS,'polygon');
    poly.setAttribute('points',pts);
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke','var(--line)');
    poly.setAttribute('stroke-width',f===1?1.4:1);
    poly.setAttribute('opacity',f===1?0.9:0.5);
    svg.appendChild(poly);
  });
  EKEYS.forEach(function(k){
    var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
    var ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',cx);ln.setAttribute('y1',cy);
    ln.setAttribute('x2',cx+ux*baseR);ln.setAttribute('y2',cy+uy*baseR);
    ln.setAttribute('stroke','var(--line)');ln.setAttribute('stroke-width',1);ln.setAttribute('opacity',0.5);
    svg.appendChild(ln);
  });
  function rOf(s){return 30+(s/100)*110;}
  var sp=EKEYS.map(function(k){
    var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
    var r=rOf(sc[k]);
    return (cx+ux*r)+','+(cy+uy*r);
  }).join(' ');
  var area=document.createElementNS(NS,'polygon');
  area.setAttribute('points',sp);
  area.setAttribute('fill','rgba(53,97,79,.16)');
  area.setAttribute('stroke','var(--pine)');
  area.setAttribute('stroke-width',2);
  svg.appendChild(area);
  if(overlay){
    var np=EKEYS.map(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      var r=rOf(overlay[k]||0);
      return (cx+ux*r)+','+(cy+uy*r);
    }).join(' ');
    var narea=document.createElementNS(NS,'polygon');
    narea.setAttribute('points',np);
    narea.setAttribute('fill','rgba(169,130,59,.10)');
    narea.setAttribute('stroke','var(--gold)');
    narea.setAttribute('stroke-width',2);
    narea.setAttribute('stroke-dasharray','5 4');
    svg.appendChild(narea);
    EKEYS.forEach(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      var r=rOf(overlay[k]||0);
      var nd=document.createElementNS(NS,'circle');
      nd.setAttribute('cx',cx+ux*r);nd.setAttribute('cy',cy+uy*r);
      nd.setAttribute('r',3.5);nd.setAttribute('fill','var(--gold)');nd.setAttribute('stroke','#fff');nd.setAttribute('stroke-width',1);
      svg.appendChild(nd);
    });
  }
  EKEYS.forEach(function(k){
    var b=E[k];
    var ux=(b.pos.x-cx)/baseR, uy=(b.pos.y-cy)/baseR;
    var r=rOf(sc[k]);
    var px=cx+ux*r, py=cy+uy*r;
    var dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',px);dot.setAttribute('cy',py);
    dot.setAttribute('r',k===topKey?7:5);
    dot.setAttribute('fill',W[b.wx]);
    dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width',1.5);
    svg.appendChild(dot);
    var lr=baseR+22;
    var lx=cx+ux*lr, ly=cy+uy*lr;
    var anchor = ux>0.35?'start':(ux<-0.35?'end':'middle');
    if(anchor==='start') lx+=2; else if(anchor==='end') lx-=2;
    ly += uy>0.35?12:(uy<-0.35?-6:4);
    var tx=document.createElementNS(NS,'text');
    tx.setAttribute('class','rlabel'+(k===topKey?' top':''));
    tx.setAttribute('x',lx);tx.setAttribute('y',ly);tx.setAttribute('text-anchor',anchor);
    tx.textContent=b.nm+'·'+b.fn.split('／')[0];
    svg.appendChild(tx);
    var ts=document.createElementNS(NS,'text');
    ts.setAttribute('class','rscore');
    ts.setAttribute('x',lx);ts.setAttribute('y',ly+13);ts.setAttribute('text-anchor',anchor);
    ts.textContent=sc[k];
    svg.appendChild(ts);
  });
  return svg;
}

// ── Cover：底色提示 + 控制按鈕 ────────────────────────────
function renderCover(){
  var bs=document.getElementById('base-status');
  var btn=document.getElementById('start-btn');
  var base=getBase();
  if(base){
    var tk=base.top||topKeyOf(base.scores);
    bs.innerHTML='<div class="base-ok">✓ 已有你的底色（'+escapeHtml(base.title||E[tk].nm)+'）——可以開始配對。</div>';
    btn.disabled=false;
  } else {
    bs.innerHTML='<div class="base-hint">要先測你的<b>人格底色</b>，才能做配對。'
      +'<a href="bagua-persona.html">先測你的底色 →</a></div>';
    btn.disabled=true;
  }
}

// ── 排序：依 fitScore ─────────────────────────────────────
function rankedCareers(you){
  return CAREERS.map(function(c){ return {c:c, fit:fitScore(you,c.scores)}; })
    .sort(function(a,b){ return b.fit-a.fit; });
}

// ── 結果列表 ──────────────────────────────────────────────
function showResult(){
  var base=getBase();
  var r=document.getElementById('result');
  if(!base){
    // 沒底色不算配對（理論上按鈕已 disabled，保險）
    r.innerHTML='<div class="block"><h3>要先測你的人格底色</h3>'
      +'<div style="font-family:ui-sans-serif,sans-serif;font-size:13px;color:var(--ink);line-height:1.85">'
      +'配對需要你的底色。<a href="bagua-persona.html" style="color:var(--pine);font-weight:700">去測你的底色 →</a></div></div>';
    document.getElementById('cover').style.display='none';
    r.style.display='block'; window.scrollTo(0,0);
    return;
  }
  var you=base.scores;
  var ranked=rankedCareers(you);
  var top=ranked.slice(0,6);
  var worst=ranked.slice(-3).reverse(); // fit 最低 3 個（高→低呈現）
  var btk=base.top||topKeyOf(you);

  var html=''
   +'<div class="res-head">'
     +'<div class="eyebrow">YOUR MATCHES</div>'
     +'<h2>你的職業能量配對</h2>'
     +'<div class="sub">以你的底色（<b>'+escapeHtml(base.title||E[btk].nm)+'</b>）和每個職業的能量需求比對</div>'
   +'</div>';

  // 比較合的方向
  html+='<div class="seclab">能量比較合的方向</div><div class="cardlist">';
  top.forEach(function(o){
    html+=careerCard(o.c,o.fit,you,false);
  });
  html+='</div>';

  // 可能比較耗你的
  html+='<div class="seclab warn">可能比較耗你的</div>'
    +'<div class="warn-frame">這幾個不是「不能做」，而是<b>要刻意調適、找方法補位</b>——'
    +'它們要的能量跟你的底色落差較大，硬撐容易累。列出來是為了誠實，不是勸退。</div>'
    +'<div class="cardlist">';
  worst.forEach(function(o){
    html+=careerCard(o.c,o.fit,you,true);
  });
  html+='</div>';

  // 誠實框架
  html+='<div class="block" style="margin-top:22px;border-left:4px solid var(--gold)"><h3>讀這份配對前，先記得</h3>'
    +'<div style="font-family:ui-sans-serif,sans-serif;font-size:13px;color:var(--ink);line-height:1.95">'
    +'這是一面認識自己的<b>鏡子</b>、是啟發性的探索方向，不是性向測驗、不是命定。真正適合一份工作，還牽涉興趣、能力、價值觀、市場與機運——'
    +'能量合只是其中一個角度。能量也會成長，沒有哪個職業是你「不能」做的。</div></div>';

  html+='<div class="resbtns">'
    +'<button class="cbtn" onclick="resetCover()">回封面</button>'
    +'<a class="cbtn ghost" href="bagua-persona.html">回人格測驗</a>'
  +'</div>'
  +'<div class="resbtns">'
    +'<a class="cbtn ghost" href="bagua-records.html">📒 我的記錄</a>'
    +'<a class="cbtn ghost" href="index.html">🧭 八卦能量</a>'
  +'</div>'
  +'<div class="foot">Octenso ｜ 八態能格 · 練息場 Join to Enjoy</div>';

  r.innerHTML=html;
  document.getElementById('cover').style.display='none';
  r.style.display='block';
  window.scrollTo(0,0);
}

function careerCard(c,fit,you,isWarn){
  var topk=topKeyOf(c.scores);
  var accent=W[E[topk].wx];
  var shine=shinePoints(you,c.scores);
  var shineHtml='';
  if(!isWarn){
    if(shine.length){
      shineHtml='<div class="cc-shine">你會發光的點：『<span class="em">'+energyLabel(shine[0])+'</span>』——你和它都高。</div>';
    } else {
      shineHtml='<div class="cc-shine">它要的能量裡，沒有特別落在你最強那幾項——得均勻使力。</div>';
    }
  }
  return '<div class="ccard'+(isWarn?' warn':'')+'" style="--accent:'+accent+'" onclick="showDetail(\''+c.id+'\')">'
    +'<div class="cc-top">'
      +'<span class="cc-ic">'+c.ic+'</span>'
      +'<span class="cc-body"><span class="cc-nm">'+escapeHtml(c.nm)+'</span>'
        +'<span class="cc-blurb">'+escapeHtml(c.blurb)+'</span></span>'
      +'<span class="cc-fit"><span class="cc-fitnum">'+fit+'%</span><br><span class="cc-fitlab">適配度</span></span>'
    +'</div>'
    +shineHtml
    +'<div class="cc-arr">點開看詳情 →</div>'
  +'</div>';
}

// ── 詳情（你 × 這個職業）——重用 field 的解讀邏輯 ─────────
function showDetail(id){
  var c=null; CAREERS.forEach(function(x){ if(x.id===id) c=x; }); if(!c) return;
  var base=getBase(); var you=base?base.scores:null;
  var sc=c.scores;
  var topK=topKeyOf(sc);
  var top=E[topK];
  var accent=W[top.wx];
  var nm=escapeHtml(c.nm);

  var html=''
   +'<div class="res-head"><div class="eyebrow">CAREER DETAIL</div></div>'
   +'<div class="typecard" style="--accent:'+accent+'">'
     +'<div class="tc-eyebrow">這個職業最吃的能量</div>'
     +'<div class="tc-sym" style="color:'+accent+'">'+c.ic+'</div>'
     +'<div class="tc-title">'+nm+'</div>'
     +'<div class="tc-essence">這個職業最需要的是『<b>'+top.nm+'·'+top.fn+'</b>』。'
       +(you?'下面看它和你的底色合不合。':'測一下你的底色，就能看你和它合不合。')+'</div>'
   +'</div>'
   +'<div class="radar-wrap" id="radar-wrap"></div>'
   +'<div class="legend">'
     +'<span><i style="background:var(--pine)"></i>松綠＝這個職業的需求</span>'
     +(you?'<span><i class="dash"></i>金虛線＝你的底色</span>':'')
   +'</div>';

  if(you){
    var fit=fitScore(you,sc);
    var shine=shinePoints(you,sc);
    var fw=forcedWeak(you,sc);
    var idle=idleStrength(you,sc);

    html+='<div class="fit-card">'
      +'<div class="fc-num">'+fit+'%</div>'
      +'<div class="fc-lab">適配度 · 你 × '+nm+'</div>'
      +'<div class="fc-sub">'+fitSentence(fit)+'</div>'
    +'</div>';

    html+='<div class="block"><h3>✦ 你會在哪發光</h3>';
    if(shine.length){
      html+=shine.map(function(k){
        return '<div class="pt-line shine">這個職業需要『<span class="em">'+energyLabel(k)+'</span>』，正是你的強項——你會發光。</div>';
      }).join('');
    } else {
      html+='<div class="pt-line">這個職業要的能量裡，沒有特別落在你最強的那幾項——但也不代表你不行，只是得均勻使力、慢慢累積亮點。</div>';
    }
    html+='</div>';

    var drainLines=[];
    fw.forEach(function(k){
      drainLines.push('<div class="dn-line">這個職業很吃『<b>'+energyLabel(k)+'</b>』，但那不是你慣用的——長期容易耗你。</div>');
    });
    idle.forEach(function(k){
      drainLines.push('<div class="dn-line">你的『<b>'+energyLabel(k)+'</b>』很強卻用不太到，可能會悶。</div>');
    });
    if(drainLines.length){
      html+='<div class="drain-note"><div class="dn-h">消耗訊號</div>'+drainLines.join('')+'</div>';
    } else {
      html+='<div class="drain-ok">沒看到明顯的消耗點——這個職業要的，你大致接得住；你的強項也用得上，能量用起來算自然。</div>';
    }

    html+='<div class="block"><h3>🧭 應對策略</h3>';
    if(fw.length){
      fw.forEach(function(k){
        html+='<div class="strat-line">面對『<span class="em">'+energyLabel(k)+'</span>』：找人補位／刻意排恢復，別硬撐；用你的強項繞道完成。</div>';
      });
    }
    if(idle.length){
      idle.forEach(function(k){
        html+='<div class="strat-line">關於閒置的『<span class="em">'+energyLabel(k)+'</span>』：在這個職業裡找地方發揮它，或到別處釋放它。</div>';
      });
    }
    if(!fw.length && !idle.length){
      html+='<div class="strat-line">你和這個職業之間沒有明顯的拉扯——順著做就好，把你的強項放到它最需要的地方，會更省力。</div>';
    }
    html+='</div>';

    var flow=elementFlow(topElement(sc), topElement(you));
    html+='<div class="block"><h3>五行能量流向</h3>'
      +'<div class="flowline">'+flow.text+'</div>'
      +'<div style="font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7">'
        +'生未必是好（一直給也會洩）；剋未必是壞（適度的約束反而把人接住）。方向只是描述能量怎麼走。</div>'
    +'</div>';
  } else {
    html+='<div class="block"><h3>想看「你 × 這個職業」？</h3>'
      +'<div style="font-family:ui-sans-serif,sans-serif;font-size:13px;color:var(--ink);line-height:1.85">你還沒測過<b>你的底色</b>——'
      +'<a href="bagua-persona.html" style="color:var(--pine);font-weight:700">去測你的底色 →</a></div></div>';
  }

  html+='<div class="block" style="border-left:4px solid var(--gold)"><h3>提醒</h3>'
    +'<div style="font-family:ui-sans-serif,sans-serif;font-size:12.5px;color:var(--ink);line-height:1.9">'
    +'能量合只是一個角度——興趣、能力、價值觀、市場與機運同樣重要。沒有哪個職業是你「不能」做的。</div></div>';

  html+='<div class="resbtns">'
    +'<button class="cbtn" onclick="showResult()">← 回列表</button>'
    +'<a class="cbtn ghost" href="bagua-persona.html">回人格測驗</a>'
  +'</div>'
  +'<div class="foot">Octenso ｜ 八態能格 · 練息場 Join to Enjoy</div>';

  var r=document.getElementById('result');
  r.innerHTML=html;
  document.getElementById('cover').style.display='none';
  r.style.display='block';
  document.getElementById('radar-wrap').appendChild(buildRadar(sc, topK, you));
  window.scrollTo(0,0);
}

function resetCover(){
  document.getElementById('result').style.display='none';
  document.getElementById('cover').style.display='block';
  renderCover();
  window.scrollTo(0,0);
}

// 供測試呼叫
window.__career={CAREERS:CAREERS,EKEYS:EKEYS,fitScore:fitScore,rankedCareers:rankedCareers,
  showResult:showResult,showDetail:showDetail,getBase:getBase};

renderCover();
</script>
