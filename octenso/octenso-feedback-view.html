<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script defer src="octenso-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<title>回饋後台 · 練息場(內部)</title>
<!--
  回饋後台(2026-07-16;內部,Simon 專用,未接導覽)
  資料源=Worker /feedback-list(需通行密語,對應 Worker Secret FEEDBACK_VIEW_KEY)。
  fb:    = 伴讀「結束今天」回饋摘要(turns+summary)
  fblens:= 八態鏡三值回饋(ctype+verdict+comment)
-->
<style>
  :root{--bg:#f4efe4;--surface:#f8f4ec;--surface2:#efe9dc;--ink:#23241f;--ink-soft:#3a3a32;--muted:#6f6657;
    --line:#d2c7b4;--hair:#bcb09a;--pine:#35614f;--cinnabar:#9d4b34;--gold:#a9823b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink-soft);font-family:"Noto Sans TC",ui-sans-serif,system-ui,sans-serif;
    font-weight:300;line-height:1.9;font-size:15px;max-width:680px;margin:0 auto;padding:26px 20px 80px}
  .eyebrow{font-family:"Jost",ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.26em;color:var(--muted);
    text-transform:uppercase;text-align:center;margin-bottom:10px}
  h1{font-weight:200;font-size:24px;letter-spacing:.14em;color:var(--ink);text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.05em;margin-bottom:22px}
  .row{display:flex;gap:8px}
  .input{flex:1;background:var(--surface);border:1px solid var(--hair);border-radius:10px;
    padding:10px 13px;color:var(--ink);font-size:14px;font-family:inherit}
  .input:focus{outline:none;border-color:var(--ink)}
  .btn{font-size:13.5px;font-weight:300;letter-spacing:.06em;padding:9px 20px;cursor:pointer;
    border:1px solid var(--ink);border-radius:999px;color:var(--ink);background:transparent;transition:.2s;font-family:inherit}
  .btn:hover{background:var(--ink);color:var(--bg)}
  .btn:disabled{opacity:.4;cursor:default}
  #status{font-size:12.5px;color:var(--muted);margin-top:10px;min-height:1.6em}
  #status.err{color:var(--cinnabar)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
  .card .meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
  .card .tag{font-family:"Jost",sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .tag.hy{color:var(--pine);border-color:var(--pine)}
  .tag.lens{color:var(--gold);border-color:var(--gold)}
  .tag.v-like{color:var(--pine);border-color:var(--pine)}
  .tag.v-part{color:var(--gold);border-color:var(--gold)}
  .tag.v-unlike{color:var(--cinnabar);border-color:var(--cinnabar)}
  .card .time{font-family:"Jost",sans-serif;font-size:11px;color:var(--hair)}
  .card .body{white-space:pre-line;font-size:14px;line-height:2}
  .honest{font-size:12px;color:var(--muted);line-height:1.9;padding-left:14px;border-left:1px solid var(--hair);margin-top:26px}
</style></head>
<body>
<div class="eyebrow">Octenso · Feedback · Internal</div>
<h1>回饋後台</h1>
<div class="sub">伴讀「結束今天」摘要+八態鏡三值回饋,新到舊</div>

<div class="row">
  <input class="input" id="vkey" type="password" placeholder="通行密語(只需輸入一次,記在此裝置)">
  <button class="btn" id="load">載入回饋</button>
</div>
<div id="status"></div>
<div id="list"></div>

<div class="honest">此頁為內部後台:通行密語對應 Worker 端 Secret,回饋內容不含使用者素材與對話逐字(伴讀=結束摘要;八態鏡=評價與留言)。密語只存在此裝置。</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var API='https://calm-sunset-97f8.simon-ec6.workers.dev/feedback-list';
var KEYSTORE='octenso_view_key';
var VERDICT={like:'很像',part:'部分像',unlike:'不太像'};
var CTYPES={brainstorm:'動腦會',decision:'決策會',retro:'覆盤會',routine:'例行會',
  bp:'BP/提案',policy:'制度文件',interview:'面試筆記',observation:'觀察筆記'};
function esc(s){return String(s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
function timeOf(key){var t=key.slice(key.indexOf(':')+1);return t.slice(0,16).replace('T',' ');}
function render(items){
  var box=$('list');box.innerHTML='';
  if(!items.length){$('status').textContent='目前沒有回饋。';return;}
  $('status').textContent='共 '+items.length+' 筆。';
  items.forEach(function(it){
    var d=document.createElement('div');d.className='card';
    var v=it.value||{};
    if(it.key.indexOf('fblens:')===0){
      d.innerHTML='<div class="meta"><span class="tag lens">八態鏡</span>'
        +'<span class="tag v-'+esc(v.verdict||'')+'">'+esc(VERDICT[v.verdict]||v.verdict||'?')+'</span>'
        +'<span class="tag">'+esc(CTYPES[v.ctype]||v.ctype||'')+'</span>'
        +'<span class="time">'+esc(timeOf(it.key))+'</span></div>'
        +'<div class="body">'+(v.comment?esc(v.comment):'(沒有留言)')+'</div>';
    } else {
      d.innerHTML='<div class="meta"><span class="tag hy">伴讀</span>'
        +'<span class="tag">'+esc(String(v.turns||'?'))+' 輪</span>'
        +'<span class="time">'+esc(timeOf(it.key))+'</span></div>'
        +'<div class="body">'+esc(v.summary||v.raw||'')+'</div>';
    }
    box.appendChild(d);
  });
}
function load(){
  var key=$('vkey').value.trim()||localStorage.getItem(KEYSTORE)||'';
  if(!key){$('status').textContent='先輸入通行密語。';$('status').className='err';return;}
  $('load').disabled=true;$('status').className='';$('status').textContent='載入中……';
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-view-key':key},body:'{}'})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.error)throw new Error(d.error);
    try{localStorage.setItem(KEYSTORE,key);}catch(e){}
    render(d.items||[]);
  })
  .catch(function(e){$('status').textContent=e.message||'載入失敗';$('status').className='err';})
  .then(function(){$('load').disabled=false;});
}
$('load').onclick=load;
$('vkey').addEventListener('keydown',function(e){if(e.key==='Enter')load();});
try{ if(localStorage.getItem(KEYSTORE)){ $('vkey').placeholder='已記住密語,直接按載入'; } }catch(e){}
document.body.setAttribute('data-ready','1');
})();
</script>
</body></html>
