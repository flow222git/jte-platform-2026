<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>v2 tests</title></head><body>
<pre id="log"></pre>
<div id="frames"></div>
<script src="bagua-data.js"></script>
<script src="profile.js"></script>
<script src="bagua-v2-data.js"></script>
<script src="bagua-catalog-data.js"></script>
<script src="bagua-catalog-t1.js"></script>
<script src="bagua-catalog-combos.js"></script>
<script>
(function(){
  var pass=0, fail=0, log=document.getElementById('log');
  function t(name, ok){ if(ok){pass++;} else {fail++; log.textContent+='FAIL: '+name+'\n';} }
  var V=window.OCTENSO_V2, P=window.OctensoProfile;
  var KEYS=['qian','li','zhen','dui','kun','kan','gen','xun'];

  // ── 題本 v2 完整性 ──
  t('bank v2', V.bank==='v2' && V.codePrefix==='B2');
  t('24 items', V.ITEMS.length===24);
  KEYS.forEach(function(k){
    var sc=V.ITEMS.filter(function(q){return q.k===k&&q.kind==='sc';}).length;
    var fq=V.ITEMS.filter(function(q){return q.k===k&&q.kind==='fq';}).length;
    t(k+' sc=2 fq=1', sc===2 && fq===1);
  });
  t('freq items say 過去一個月', V.ITEMS.filter(function(q){return q.kind==='fq';}).every(function(q){return q.t.indexOf('過去一個月')===0;}));
  t('OPTS 6-point', V.OPTS.length===6);
  t('FREQ_OPTS 6-point reverse', V.FREQ_OPTS.length===6 && V.FREQ_OPTS[0].t==='幾乎總是' && V.FREQ_OPTS[0].v===0 && V.FREQ_OPTS[5].v===5);
  // 四對強迫選擇:配對與極性對齊 profile.js PAIRS
  t('FC 4 items', V.FC_ITEMS.length===4);
  P.PAIRS.forEach(function(p){
    var f=null; V.FC_ITEMS.forEach(function(x){ if(x.pair===p.key) f=x; });
    t('FC '+p.key+' poles', !!f && f.aK===p.l && f.bK===p.r && f.a.length>5 && f.b.length>5);
  });
  t('FC_OPTS bipolar 6', V.FC_OPTS.length===6 && V.FC_OPTS[0].t.indexOf('A')>0 && V.FC_OPTS[5].t.indexOf('B')>0);
  t('FC_READ templates', ['agree','disagree','evenPick'].every(function(k){return V.FC_READ[k]&&V.FC_READ[k].indexOf('{X}')>=0;}));
  t('guide anchors 最近一個月', V.GUIDE.intro.indexOf('最近一個月')>=0);
  t('COMPANION_BOT config', !!V.COMPANION_BOT && typeof V.COMPANION_BOT.url==='string' && V.COMPANION_BOT.desc.length>20
    && ['privacy','opening','startBtn','placeholder','sendBtn','endBtn','endTitle','endThanks','offline','crisis','note'].every(function(k){return V.COMPANION_BOT[k]&&V.COMPANION_BOT[k].length>1;}));
    t('BRIEF ×8(六級一句定義)', KEYS.every(function(k){return V.BRIEF[k]&&V.BRIEF[k].length>8;}));
  t('COMPANION_BOT opening has {peak}', V.COMPANION_BOT.opening.indexOf('{peak}')>=0);
  // 四道門白話層(canonical,報告+晶體共用)
  t('GATES structure', !!V.GATES && V.GATES.intro.length>20 && V.GATES.anchor.indexOf('{P}')>=0 && V.GATES.anchor.indexOf('{G}')>=0);
  t('GATES name+q ×4', ['build','drive','aware','regulate'].every(function(k){return V.GATES.name[k]&&V.GATES.q[k]&&V.GATES.q[k].length>10;}));
  t('GATES mission ×4(核心命題問句)', ['build','drive','aware','regulate'].every(function(k){return V.GATES.mission[k]&&V.GATES.mission[k].indexOf('?')>=0;}));
  t('GATES 調節命題無撞詞(不含「沉澱」)', V.GATES.mission.regulate.indexOf('沉澱')<0 && V.GATES.mission.regulate.indexOf('停下')>=0);
  t('ELEGANT ×8(二字雅稱)', KEYS.every(function(k){return V.ELEGANT[k]&&V.ELEGANT[k].length===2;}));
  t('GATES pole ×8', KEYS.every(function(k){return V.GATES.pole[k]&&V.GATES.pole[k].length>=2;}));
  t('GATES state ×5 + tension', ['bothHigh','leanL','leanR','bothLow','mid'].every(function(k){return V.GATES.state[k]&&V.GATES.state[k].length>8;}) && V.GATES.tension.length>10);
  t('COMPANION_BOT crisis list+lines', Array.isArray(V.COMPANION_BOT.crisisKeys) && V.COMPANION_BOT.crisisKeys.length>=8
    && ['1925','1995','1980'].every(function(n){return V.COMPANION_BOT.crisis.indexOf(n)>=0;}));
  // 三個方向 + AI 伴讀
  KEYS.forEach(function(k){ t('DIRECTIONS '+k, !!V.DIRECTIONS[k] && V.DIRECTIONS[k].use.length>15); });
  t('COMPANION fields', !!V.COMPANION && [V.COMPANION.title,V.COMPANION.desc,V.COMPANION.privacy,V.COMPANION.prompt,V.COMPANION.promptEnd].every(function(s){return s&&s.length>10;}));
  t('COMPANION guardrails', V.COMPANION.prompt.indexOf('不是算命師')>=0 && V.COMPANION.prompt.indexOf('快照')>=0 && V.COMPANION.prompt.indexOf('不要發明')>=0);

  // COST/SYSTEM_READ(照舊)
  KEYS.forEach(function(k){
    var c=V.COST[k];
    t('COST '+k, !!c && c.over.length===2 && c.under.length===2 && [c.aOver,c.aUnder,c.aMidHi,c.aMidLo].every(function(s){return s&&s.length>10;}));
  });
  ['build','drive','aware','regulate'].forEach(function(sys){
    ['bothHigh','leanL','leanR','bothLow','mid'].forEach(function(st){
      t('SYSTEM_READ '+sys+'.'+st, !!V.SYSTEM_READ[sys][st] && V.SYSTEM_READ[sys][st].desc.length>10);
    });
  });

  // ── 引擎期望 ──
  var mk=function(o){ var sc={}; KEYS.forEach(function(k){sc[k]=o[k]!=null?o[k]:(o.rest!=null?o.rest:50);}); return sc; };
  t('single expect', P.build(mk({qian:90,rest:50})).signature.kind==='single');
  var dual=P.build(mk({kan:85,li:82,rest:45})).signature;
  t('dual expect', dual.kind==='dual' && dual.keys.indexOf('kan')>=0 && dual.keys.indexOf('li')>=0);
  t('pattern expect', P.build(mk({qian:54,rest:49})).signature.kind==='pattern');

  // ── iframe 渲染(B1 相容 + B2 含二選一)──
  // v3.2 換裝(2026-07 起):報告本體改走共用 renderer(heroHtml/radarHtml/narrativeHtml/systemsHtml)
  // + 保留的分享碼/按鈕列/PDF/伴讀/回饋問卷/誠實印章;舊有「每態六級」「四大系統(GATES)」
  // 「你的章節/雙峰組合/你的格局/還沒長開/場域速查」「能格·用得剛不剛好」「接下來三個方向」
  // 「二選一對照」「能量晶體」等特色段全數退場,故下列 expects/dom 對應改寫。
  var CASES=[
    {code:'B19050505050505050', name:'B1-single-qian', expects:['開創者(乾)','整體的你','四個系統 · 你怎麼運作','對照與分享']},
    {code:'B29050505050505050'+'0523', name:'B2-single-fc', expects:['開創者(乾)','題本 v2','八態伴讀','開始伴讀','就在這裡聊','建構','調節','小練習'],
     dom:[{n:'狀態分區小平面已移除(舊殘留斷言,恆真)', f:function(doc){return doc.querySelectorAll('svg.splane').length===0;}},
          {n:'存成 PDF 按鈕存在且在 noprint 區', f:function(doc){var b=doc.getElementById('btn-pdf');return !!b && !!b.closest('.noprint') && typeof b.onclick==='function';}},
          {n:'列印樣式存在(@media print 隱藏互動元件)', f:function(doc){var css='';var ss=doc.querySelectorAll('style');for(var i=0;i<ss.length;i++)css+=ss[i].textContent;return css.indexOf('@media print')>=0 && css.indexOf('.noprint{display:none')>=0;}},
          {n:'伴讀與回饋問卷包在 noprint', f:function(doc){var bs=doc.getElementById('bot-startrow'),ask=doc.querySelector('.ask');return !!bs && !!bs.closest('.noprint') && !!ask && ask.classList.contains('noprint');}},
          // v3.2 換裝:核心四塊(渲染容器 id='scr-report')
          {n:'v3.2 核心四塊出現(narrative-block+sys-detail)', f:function(doc){var H=doc.getElementById('scr-report').innerHTML; return H.indexOf('narrative-block')>=0 && H.indexOf('sys-detail')>=0;}},
          {n:'v3.2 canonical 者名出現(開創者(乾))', f:function(doc){return doc.getElementById('scr-report').innerHTML.indexOf('開創者(乾)')>=0;}},
          {n:'v3.2 漂移名退場(明現者/交流者/拓展者不出現)', f:function(doc){var H=doc.getElementById('scr-report').innerHTML; return H.indexOf('明現者')<0 && H.indexOf('交流者')<0 && H.indexOf('拓展者')<0;}},
          {n:'v3.2 二選一對照段退場(報告容器內,不含頁面其他區的二選一題本文案)', f:function(doc){return doc.getElementById('scr-report').innerHTML.indexOf('二選一')<0;}},
          {n:'v3.2 晶體連結退場(報告容器內)', f:function(doc){return doc.getElementById('scr-report').innerHTML.indexOf('bagua-crystal')<0;}},
          {n:'v3.2 雷達互動(8 個 rgrp)', f:function(doc){return doc.querySelectorAll('#radar-wrap g.rgrp').length===8;}},
          {n:'v3.2 conf=null(分享碼重建)→ 無可信度句', f:function(doc){return doc.getElementById('scr-report').innerText.indexOf('答得乾脆')<0;}}],
     click:'bot-start', expectsAfter:['我讀完你的報告了','結束伴讀 · 整理回饋']},
    {code:'B14582454545854545', name:'B1-dual-kan-li', expects:['並重','沉潛者(坎)','洞見者(離)'],
     dom:[{n:'v3.2 雙峰組合段退場(T3 特色段已併入共用 narrative)', f:function(doc){return doc.getElementById('scr-report').innerHTML.indexOf('雙峰組合')<0;}}]}
  ];
  var done=0;
  function checkFrame(cs){
    var f=document.createElement('iframe');
    f.style.cssText='width:900px;height:600px';
    f.src='bagua-persona-v2.html#r='+cs.code;
    document.getElementById('frames').appendChild(f);
    var tries=0;
    var timer=setInterval(function(){
      tries++;
      var txt='';
      try{ txt=f.contentDocument.body.innerText||''; }catch(e){}
      var ready=txt.indexOf('對照與分享')>=0;
      if(ready || tries>200){
        clearInterval(timer);
        cs.expects.forEach(function(s){ t(cs.name+' has 「'+s+'」', txt.indexOf(s)>=0); });
        (cs.dom||[]).forEach(function(d){ var ok=false; try{ ok=!!d.f(f.contentDocument); }catch(e){} t(cs.name+' dom '+d.n, ok); });
        if(cs.click){
          try{ f.contentDocument.getElementById(cs.click).click(); }catch(e){}
          var txt2=''; try{ txt2=f.contentDocument.body.innerText||''; }catch(e){}
          (cs.expectsAfter||[]).forEach(function(s){ t(cs.name+' after click has 「'+s+'」', txt2.indexOf(s)>=0); });
        }
        f.parentNode.removeChild(f);
        done++;
        if(done===CASES.length){
          runConfDrivenCase();
        } else {
          checkFrame(CASES[done]);
        }
      }
    },150);
  }

  // v3.2 sure→firm:走真實測驗(非分享碼)才會有 conf 物件;每態三題(2 scale + 1 頻率)都點選同一個
  // 選項位置(index 2),讓每態三題原始值落在 spread<=1 → confidence() 全部給 'sure';分數因此也全部
  // 落在中段、不觸發能格追問,直達報告——這樣可以確定性地驗證 conf 真的有東西時,narrativeHtml 的
  // 可信度句會出現(對照 CASES 走分享碼、conf 恆為 null 的「無可信度句」斷言,見上面 dom 檢查)。
  function runConfDrivenCase(){
    var f=document.createElement('iframe');
    f.style.cssText='width:900px;height:600px';
    f.src='bagua-persona-v2.html';
    document.getElementById('frames').appendChild(f);
    var tries=0;
    var timer=setInterval(function(){
      tries++;
      var d=null;
      try{ d=f.contentDocument; }catch(e){}
      var ready = d && d.getElementById('btn-start');
      if(ready || tries>200){
        clearInterval(timer);
        var ok1=false, ok2=false;
        try{
          d.getElementById('btn-start').click();
          for(var i=0;i<32;i++){
            var opts=d.querySelectorAll('#q-opts .opt');
            if(!opts.length) break;
            (opts[2]||opts[opts.length-1]).click();
          }
          var H=d.getElementById('scr-report').innerHTML;
          ok1 = H.indexOf('答得乾脆')>=0;
          var g=d.querySelector('#radar-wrap g.rgrp');
          if(g) g.dispatchEvent(new d.defaultView.Event('click',{bubbles:true}));
          var detail=d.getElementById('radar-detail')?d.getElementById('radar-detail').innerHTML:'';
          ok2 = detail.indexOf('篤定')>=0;
        }catch(e){}
        t('v3.2 conf 真值(sure)渲染 → 可信度句出現', ok1);
        t('v3.2 sure→firm 映射:雷達詳解顯示「篤定」', ok2);
        f.parentNode.removeChild(f);
        document.title='RESULT pass='+pass+' fail='+fail;
        log.textContent='RESULT pass='+pass+' fail='+fail+'\n'+log.textContent;
      }
    },100);
  }
  checkFrame(CASES[0]);
})();
</script>
</body></html>
