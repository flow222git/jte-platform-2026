<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八態能格 · 你的能量圓 demo</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#efe8d8;--ink:#2c2a22;--muted:#7c735f;--line:#d6cab2;--gold:#a9823b;--deepgold:#7d5e26}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(125% 95% at 50% 18%,#f7f1e3 0%,#efe8d8 54%,#e3d9c4 100%);color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:26px 16px;-webkit-font-smoothing:antialiased}
  .eyebrow{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .cap{font-family:"Noto Serif TC",serif;font-weight:600;font-size:18px;line-height:1.7;text-align:center;max-width:380px;margin-bottom:6px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
  svg{display:block}
  .who{font-family:"Noto Serif TC",serif;font-size:14px;color:var(--deepgold);min-height:1.4em;margin-top:4px;transition:opacity .4s}
  button{font-family:"Noto Serif TC",serif;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--ink);
    border-radius:999px;padding:8px 22px;cursor:pointer;letter-spacing:.06em;transition:.2s;margin-top:14px}
  button:hover{background:var(--ink);color:#f7f1e3}
  .gallery{display:flex;gap:14px;margin-top:26px;align-items:center}
  .gcell{text-align:center}
  .gcell .gl{font-size:11px;color:var(--muted);margin-top:2px}
  .galtitle{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-top:24px}
</style></head>
<body>
<div class="eyebrow">OCTENSO · 你的能量圓</div>
<div class="cap">圓，是你的能量樣態 ＋ 流動</div>
<div class="sub">每個人的圓，都不一樣</div>

<svg id="main" width="300" height="300" viewBox="0 0 300 300">
  <defs><filter id="ink" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".5"/></filter></defs>
  <g id="mg">
    <path id="fill" fill="rgba(169,130,59,.10)" stroke="none"></path>
    <path id="ring" fill="none" stroke="#2c2a22" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)"></path>
    <path id="ring2" fill="none" stroke="#a9823b" stroke-width="2" stroke-linecap="round" opacity=".55"></path>
  </g>
</svg>
<div class="who" id="who"></div>
<button id="next">換一個人 →</button>

<div class="galtitle">同一個圓 · 很多種樣子</div>
<div class="gallery" id="gallery"></div>

<script>
// 八態順序：開創 行動 沉澱 喊停 承接 拓展 展現 交流（對角＝四對待）
var PEOPLE=[
 {nm:'衝刺行動派', sc:[.80,.96,.34,.40,.60,.72,.78,.60]},
 {nm:'內斂沉澱者', sc:[.42,.34,.92,.70,.72,.46,.40,.52]},
 {nm:'均衡彈性型', sc:[.60,.56,.58,.52,.60,.54,.60,.56]},
 {nm:'社交展現者', sc:[.58,.60,.40,.34,.56,.66,.88,.92]},
 {nm:'開創領導型', sc:[.95,.72,.52,.62,.50,.60,.66,.54]}
];
function ptsFrom(sc,cx,cy,minR,maxR){
  return sc.map(function(s,i){ var a=(-90+i*45)*Math.PI/180, r=minR+s*(maxR-minR);
    return {x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r}; });
}
function smoothClosed(p){ // Catmull-Rom → 封閉平滑曲線
  var n=p.length,d='';
  for(var i=0;i<n;i++){ var p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    if(i===0)d+='M'+p1.x.toFixed(1)+','+p1.y.toFixed(1);
    var c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+='C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);
  } return d+'Z';
}
function drawInto(ringIds, sc, cx, cy, minR, maxR){
  var d=smoothClosed(ptsFrom(sc,cx,cy,minR,maxR));
  ringIds.forEach(function(id){ document.getElementById(id).setAttribute('d',d); });
}
// —— 主圓：呼吸＋緩轉＋換人morph ——
var cur=PEOPLE[0].sc.slice(), idx=0, t0=performance.now();
function frame(ts){
  var k=Math.sin((ts-t0)/2600*Math.PI*2)*0.5+0.5, breath=0.955+0.045*k;
  var sc=cur.map(function(v){return v*breath;});
  var d=smoothClosed(ptsFrom(sc,150,150,52,118));
  document.getElementById('ring').setAttribute('d',d);
  document.getElementById('ring2').setAttribute('d',d);
  document.getElementById('fill').setAttribute('d',d);
  document.getElementById('mg').setAttribute('transform','rotate('+(((ts-t0)/120)%360)+' 150 150)');
  requestAnimationFrame(frame);
}
var morph=null;
function setPerson(i){
  idx=i; document.getElementById('who').textContent='— '+PEOPLE[i].nm;
  var from=cur.slice(), to=PEOPLE[i].sc, s=performance.now();
  morph=function(ts){ var k=Math.min(1,(ts-s)/700), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    cur=from.map(function(v,j){return v+(to[j]-v)*e;}); if(k<1)requestAnimationFrame(morph); };
  requestAnimationFrame(morph);
}
document.getElementById('next').onclick=function(){ setPerson((idx+1)%PEOPLE.length); };
document.getElementById('who').textContent='— '+PEOPLE[0].nm;
requestAnimationFrame(frame);

// —— 小圖庫：三個不同的人，靜態，凸顯「很多種圓」——
var gal=document.getElementById('gallery');
[1,2,3].forEach(function(pi){
  var c=document.createElement('div'); c.className='gcell';
  var s='<svg width="84" height="84" viewBox="0 0 84 84">'
    +'<path fill="rgba(169,130,59,.10)" d="'+smoothClosed(ptsFrom(PEOPLE[pi].sc,42,42,15,34))+'"/>'
    +'<path fill="none" stroke="#2c2a22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="'+smoothClosed(ptsFrom(PEOPLE[pi].sc,42,42,15,34))+'"/></svg>';
  c.innerHTML=s+'<div class="gl">'+PEOPLE[pi].nm+'</div>';
  gal.appendChild(c);
});
</script>
</body></html>
