<style>
  :root{
    --bg:#f3efe7; --ink:#2f3338; --sub:#7c8088; --faint:#a8aab0; --line:#e5e0d4;
    --hub:#3f5a55; --hub2:#557a72; --awc:#5a8f86; --xqc:#d98a63;
    --shadow:0 14px 36px -20px rgba(50,70,60,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;line-height:1.75;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:30px 20px}
  .serif{font-family:"Noto Serif TC","Songti TC",serif}
  .en{font-family:"Cormorant Garamond",serif;letter-spacing:3px}
  .wrap{max-width:640px;width:100%;text-align:center}
  .kicker{font-size:12px;color:var(--sub);letter-spacing:5px;margin:0 0 14px}
  h1{font-size:30px;font-weight:700;margin:0 0 8px;letter-spacing:3px}
  .tagline{color:var(--sub);font-size:13.5px;margin:0 0 32px}
  .tagline .en{font-size:12px}

  .doc-list{display:flex;flex-direction:column;gap:14px;text-align:left}
  a.doc{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);
    border-top:5px solid var(--ac,var(--hub));border-radius:16px;padding:18px 20px;text-decoration:none;
    color:var(--ink);box-shadow:var(--shadow);transition:.18s}
  a.doc:hover{transform:translateY(-2px);border-color:var(--ac,var(--hub2))}
  a.doc .emoji{font-size:26px;flex:none}
  a.doc .body{flex:1}
  a.doc .t{font-size:17px;font-weight:700;letter-spacing:1px;margin-bottom:3px}
  a.doc .d{font-size:13px;color:var(--sub)}
  a.doc .arw{color:var(--faint);font-size:20px}

  .foot{margin-top:36px;font-size:12px;color:var(--faint);line-height:1.9}
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">練息場 · JOIN TO ENJOY</p>
    <h1 class="serif">內部交付文件</h1>
    <p class="tagline">照顧自己的家　·　鏡子非算命　·　<span class="en">ONE PAUSE · ONE PEACE</span></p>

    <div class="doc-list">
      <a class="doc" href="breath-awareness-xiaoqi.html" style="--ac:var(--awc)">
        <span class="emoji">🫁</span>
        <span class="body">
          <span class="t">呼吸覺察 × 小憩 · 白皮書 v0.1</span>

        </span>

    <div class="foot">
      練息場 · Join to Enjoy　|　內部交付文件，供團隊討論<br>
      靈魂在中央 · 覺察與小憩是每天回來的心跳
    </div>
  </div>
