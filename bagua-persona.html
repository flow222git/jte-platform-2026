<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>八卦能量人格 · 測驗</title>
<style>
  :root{--bg:#f4efe4;--surface:#fffdf6;--surface2:#f0eadb;--ink:#22322c;--muted:#766f63;--line:#d8cdbc;
    --pine:#35614f;--cinnabar:#9d4b34;--gold:#a9823b;--blue:#4d6b86;
    --metal:#b0996a;--wood:#5f7d4a;--water:#4d6b86;--fire:#9d4b34;--earth:#a98238;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Songti TC","Noto Serif TC",ui-serif,serif;
    padding:22px 18px 48px;max-width:600px;margin:0 auto;line-height:1.75}
  .sans{font-family:ui-sans-serif,sans-serif}
  .home-link{display:inline-block;font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);
    text-decoration:none;margin-bottom:14px;padding:5px 12px;border:1px solid var(--line);border-radius:999px}
  .home-link:hover{background:var(--surface)}

  /* ── Cover ── */
  #cover{text-align:center;padding:8px 0}
  #cover .eyebrow{font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.24em;color:var(--gold);
    text-transform:uppercase;margin-bottom:14px}
  #cover h1{font-size:27px;letter-spacing:.08em;margin-bottom:10px}
  #cover .lead{font-size:14px;color:var(--ink);max-width:380px;margin:0 auto 8px;line-height:1.9}
  #cover .trigrams{font-size:26px;color:var(--pine);letter-spacing:.18em;margin:18px 0 6px;opacity:.85}
  .start-btn{display:inline-block;background:var(--pine);color:#fff;border:none;font-family:"Songti TC","Noto Serif TC",serif;
    font-size:16px;letter-spacing:.1em;padding:13px 40px;border-radius:999px;cursor:pointer;margin:18px 0 10px;
    box-shadow:0 8px 24px rgba(53,97,79,.22);transition:transform .15s}
  .start-btn:hover{transform:translateY(-2px)}
  .meta-line{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);margin-bottom:18px}
  .honest{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);background:var(--surface);
    border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:11px 15px;text-align:left;
    max-width:430px;margin:14px auto 0;line-height:1.85}

  /* ── Quiz ── */
  #quiz{display:none}
  #facet-banner{display:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:0 12px 12px 0;padding:11px 15px;margin-bottom:20px}
  #facet-banner .fb-h{font-family:ui-sans-serif,sans-serif;font-size:13px;font-weight:700;color:var(--pine);
    letter-spacing:.04em;margin-bottom:3px}
  #facet-banner .fb-h .fb-ic{margin-right:6px}
  #facet-banner .fb-f{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);line-height:1.7}
  .prog-wrap{margin-bottom:26px}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;font-family:ui-sans-serif,sans-serif;
    font-size:12px;color:var(--muted);margin-bottom:7px}
  .prog-bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
  .prog-fill{height:100%;background:var(--pine);border-radius:999px;transition:width .3s ease;width:0}
  .q-num{font-family:ui-sans-serif,sans-serif;font-size:12px;letter-spacing:.18em;color:var(--gold);
    text-transform:uppercase;margin-bottom:10px}
  .q-text{font-size:21px;line-height:1.7;letter-spacing:.02em;margin-bottom:30px;min-height:2.6em}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:15px 20px;
    font-family:"Songti TC","Noto Serif TC",serif;font-size:16px;color:var(--ink);cursor:pointer;text-align:left;
    transition:all .15s;display:flex;align-items:center;gap:13px}
  .opt:hover{border-color:var(--pine);background:#fff;transform:translateX(3px)}
  .opt .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);flex:none}
  .opt:hover .dot{border-color:var(--pine)}
  .opt.sel{border-color:var(--pine);background:#eef3ee}
  .opt.sel .dot{background:var(--pine);border-color:var(--pine)}
  .back-btn{margin-top:24px;background:none;border:none;font-family:ui-sans-serif,sans-serif;font-size:13px;
    color:var(--muted);cursor:pointer;padding:6px 4px}
  .back-btn:hover{color:var(--ink)}
  .back-btn[disabled]{opacity:.3;cursor:default}

  /* ── Result ── */
  #result{display:none}
  .share-hint{text-align:center;font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .typecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 22px 20px;
    box-shadow:0 14px 38px rgba(74,62,44,.1);position:relative;overflow:hidden;text-align:center;margin-bottom:18px}
  .typecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,var(--pine))}
  .tc-eyebrow{font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.2em;color:var(--muted);
    text-transform:uppercase;margin-bottom:6px}
  .tc-sym{font-size:48px;line-height:1;margin-bottom:6px;color:var(--accent,var(--pine))}
  .tc-title{font-size:25px;letter-spacing:.08em;margin-bottom:9px}
  .tc-essence{font-size:14.5px;color:var(--ink);line-height:1.85;max-width:400px;margin:0 auto}

  .radar-wrap{max-width:380px;margin:6px auto 4px}
  .radar-wrap svg{width:100%;height:auto;display:block}
  .rlabel{font-size:13px;font-family:ui-sans-serif,sans-serif;fill:var(--muted)}
  .rlabel.top{fill:var(--pine);font-weight:700}
  .rscore{font-size:10px;font-family:ui-sans-serif,sans-serif;fill:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:5px 13px;justify-content:center;font-size:11.5px;color:var(--muted);
    font-family:ui-sans-serif,sans-serif;margin:2px 0 20px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

  .block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .block h3{font-family:ui-sans-serif,sans-serif;font-size:13px;letter-spacing:.06em;color:var(--pine);
    margin-bottom:12px;font-weight:700}
  .trait-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.7}
  .trait-row:last-child{border-bottom:none}
  .trait-row b{flex:none;width:46px;font-family:ui-sans-serif,sans-serif;font-size:12.5px;font-weight:700}
  .trait-row.s b{color:var(--pine)} .trait-row.b b{color:var(--cinnabar)} .trait-row.g b{color:var(--gold)}
  .portrait{font-size:14px;line-height:1.95;color:var(--ink)}
  .portrait .em{color:var(--pine);font-weight:600}
  .portrait-close{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-style:italic;
    color:var(--pine);font-size:13.5px;line-height:1.8}

  .tool{display:flex;align-items:center;gap:13px;background:var(--surface2);border-radius:12px;padding:12px 14px;
    margin-bottom:9px;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
  .tool:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(74,62,44,.1)}
  .tool .tic{font-size:22px;flex:none;width:30px;text-align:center}
  .tool .tbody{flex:1}
  .tool .tnm{font-family:ui-sans-serif,sans-serif;font-size:13.5px;font-weight:700;color:var(--pine)}
  .tool .tds{font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-top:1px}
  .tool .tarr{color:var(--muted);font-size:16px}

  .cta-now{background:linear-gradient(120deg,#35614f,#2c5142);color:#fff;border-radius:14px;padding:17px 19px;
    margin-bottom:14px}
  .cta-now .cn-h{font-family:ui-sans-serif,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    opacity:.8;margin-bottom:6px}
  .cta-now .cn-t{font-size:15px;line-height:1.8;margin-bottom:13px}
  .cta-now a{display:inline-block;background:#fff;color:var(--pine);text-decoration:none;font-family:ui-sans-serif,sans-serif;
    font-size:13px;font-weight:700;padding:9px 22px;border-radius:999px}
  .retake{display:block;margin:6px auto 16px;background:none;border:1px solid var(--line);border-radius:999px;
    font-family:ui-sans-serif,sans-serif;font-size:13px;color:var(--muted);padding:9px 24px;cursor:pointer}
  .retake:hover{background:var(--surface)}
  .foot{font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);line-height:1.85;text-align:center;
    border-top:1px solid var(--line);padding-top:16px}

  /* ── Compat (雙人合盤) ── */
  #compat{display:none}
  #compat h2{font-size:23px;letter-spacing:.06em;text-align:center;margin-bottom:8px}
  .compat-eyebrow{font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.2em;color:var(--gold);
    text-transform:uppercase;text-align:center;margin-bottom:6px}
  .codebox{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:17px;letter-spacing:.12em;
    background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    text-align:center;color:var(--ink);word-break:break-all;user-select:all}
  .compat-input{width:100%;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:16px;letter-spacing:.1em;
    background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);
    text-align:center;text-transform:uppercase}
  .compat-input:focus{outline:none;border-color:var(--pine);background:#fff}
  .cbtn{display:inline-block;background:var(--pine);color:#fff;border:none;
    font-family:ui-sans-serif,sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;
    padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .15s}
  .cbtn:hover{transform:translateY(-2px)}
  .cbtn.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:400}
  .cbtn.ghost:hover{background:var(--surface);transform:none}
  .compat-err{color:var(--cinnabar);font-family:ui-sans-serif,sans-serif;font-size:12.5px;margin-top:8px;
    min-height:1.2em;text-align:center}
  .readcards{display:flex;gap:12px;margin-bottom:14px}
  .readcard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:15px 12px;text-align:center}
  .readcard .rc-num{font-size:34px;line-height:1;color:var(--pine);font-family:ui-sans-serif,sans-serif;font-weight:700}
  .readcard .rc-lab{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--ink);font-weight:700;margin-top:6px}
  .readcard .rc-sub{font-family:ui-sans-serif,sans-serif;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.6}
  .flowline{font-size:15px;line-height:1.9;color:var(--ink)}
  .flowline .arrow{color:var(--gold);font-weight:700;margin:0 4px}

  /* ── 多場域側寫 (Facets) ── */
  .facet-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .facet-row:last-child{border-bottom:none}
  .facet-row .fr-ic{font-size:22px;flex:none;width:30px;text-align:center}
  .facet-row .fr-body{flex:1;min-width:0}
  .facet-row .fr-nm{font-family:ui-sans-serif,sans-serif;font-size:14px;font-weight:700;color:var(--ink)}
  .facet-row .fr-st{font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-top:1px}
  .facet-row .fr-st.done{color:var(--pine)}
  .facet-row .fr-btn{flex:none;background:none;border:1px solid var(--line);border-radius:999px;
    font-family:ui-sans-serif,sans-serif;font-size:12.5px;color:var(--pine);padding:7px 16px;cursor:pointer;
    transition:all .15s}
  .facet-row .fr-btn:hover{background:var(--surface2);transform:translateY(-1px)}
  .facet-map-btn{display:block;width:100%;margin-top:14px;background:var(--pine);color:#fff;border:none;
    font-family:ui-sans-serif,sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.04em;
    padding:11px 0;border-radius:999px;cursor:pointer;transition:transform .15s}
  .facet-map-btn:hover{transform:translateY(-2px)}
  .gap-line{font-size:14.5px;line-height:1.9;color:var(--ink)}
  .gap-line .up{color:var(--pine);font-weight:600}
  .gap-line .down{color:var(--cinnabar);font-weight:600}
  .drain-note{background:linear-gradient(120deg,#9d4b34,#823a28);color:#fff;border-radius:14px;
    padding:15px 18px;font-size:14px;line-height:1.85;margin-bottom:14px}
  .drain-note .dn-h{font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.82;margin-bottom:6px}
  .drain-ok{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pine);
    border-radius:0 12px 12px 0;padding:13px 16px;font-size:14px;line-height:1.85;color:var(--ink);margin-bottom:14px}
  .smgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
  .smcell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 6px}
  .smcell .sm-radar svg{width:100%;height:auto;display:block}
  .smcell .sm-nm{text-align:center;font-family:ui-sans-serif,sans-serif;font-size:12.5px;font-weight:700;
    color:var(--pine);margin-top:4px}
  .smcell.base .sm-nm{color:var(--gold)}
  .facet-btns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:16px 0 10px}

  /* ── 分享 / QR ── */
  .qr-wrap{text-align:center;margin:6px 0 12px}
  .qr-wrap img{width:172px;height:172px;image-rendering:pixelated;border:1px solid var(--line);
    border-radius:12px;background:#fff;padding:8px}
  .share-btns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:10px 0 4px}
  .share-which{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:2px 0 12px}
  .swbtn{font-family:ui-sans-serif,sans-serif;font-size:12.5px;color:var(--muted);background:var(--surface2);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:all .15s}
  .swbtn:hover{background:#fff}
  .swbtn.on{background:var(--pine);color:#fff;border-color:var(--pine)}
  .share-which-lab{font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);
    width:100%;text-align:center;margin-bottom:4px}
  .upload-row{text-align:center;margin-top:10px}
  .upload-btn{display:inline-block;background:none;color:var(--pine);border:1px solid var(--line);
    font-family:ui-sans-serif,sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;
    padding:10px 22px;border-radius:999px;cursor:pointer;transition:all .15s}
  .upload-btn:hover{background:var(--surface2);transform:translateY(-1px)}
  .code-fallback{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:13px;letter-spacing:.08em;
    color:var(--muted);text-align:center;margin-top:10px;word-break:break-all;user-select:all}
  .or-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:ui-sans-serif,sans-serif;
    font-size:11.5px;margin:14px 0 12px}
  .or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--line)}
</style></head>

<!-- ───────── COVER ───────── -->
<div id="cover">
  <div class="eyebrow">BAGUA ENERGY · PERSONA</div>
  <h1>八卦能量人格</h1>
  <p class="lead">古人用八卦描述天地間八種基本能量。<br>其實，它們也住在你身上——<br>你慣用哪幾種？又有哪些還沒長開？</p>
  <div class="trigrams">☰ ☱ ☲ ☴ ☳ ☵ ☶ ☷</div>
  <button class="start-btn" onclick="startQuiz()">開始測驗</button>
  <div class="meta-line">24 題 · 約 3 分鐘 · 不需登入</div>
  <a href="bagua-records.html" style="display:inline-block;font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin-bottom:6px">📒 我的記錄</a>
  <div class="honest">
    這測的是你的<b>「底色」</b>——你習慣動用的內在能量，是一種傾向，不是固定標籤。
    能量會流動、可以成長；今天的你和半年後的你，可能不一樣。
    這不是算命，是一面認識自己的鏡子。
  </div>
  <button onclick="resetMyBagua()" style="margin:18px auto 0;display:block;background:none;border:none;font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);text-decoration:underline;cursor:pointer">清空我的八卦紀錄（重新體驗一輪）</button>
</div>

<!-- ───────── QUIZ ───────── -->
<div id="quiz">
  <div id="facet-banner">
    <div class="fb-h"><span class="fb-ic" id="fb-ic"></span><span id="fb-nm"></span></div>
    <div class="fb-f" id="fb-frame"></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-top"><span id="prog-label" class="sans">第 1 / 24 題</span><span id="prog-pct" class="sans">4%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div class="q-num" id="q-num">Q1</div>
  <div class="q-text" id="q-text"></div>
  <div class="opts" id="opts"></div>
  <button class="back-btn" id="back-btn" onclick="goBack()">← 上一題</button>
</div>

<!-- ───────── RESULT ───────── -->
<div id="result"></div>

<!-- ───────── COMPAT (雙人合盤) ───────── -->
<div id="compat"></div>

<!-- QR 編碼/解碼（本機庫，相對路徑，同源；iframe onload 會等載完） -->

<script src="lib/jsQR.js"></script>

var W={metal:'#b0996a',wood:'#5f7d4a',water:'#4d6b86',fire:'#9d4b34',earth:'#a98238'};

 qian:{sym:'☰',nm:'乾',wx:'metal',fn:'創造／決策',state:'規劃、領導、創造',

 li:{sym:'☲',nm:'離',wx:'fire',fn:'顯現／覺察',state:'洞察、理解、看見',

 zhen:{sym:'☳',nm:'震',wx:'wood',fn:'啟動／突破',state:'行動、冒險、開始',

function computeScores(){
  var raw={},cnt={};
  Object.keys(E).forEach(function(k){raw[k]=0;cnt[k]=0;});
  QUESTIONS.forEach(function(q,i){
    var v=answers[i]==null?0:answers[i];
    raw[q.k]+=v; cnt[q.k]++;
  });
  var sc={};
  Object.keys(E).forEach(function(k){ sc[k]=Math.round(raw[k]/(cnt[k]*3)*100); });
  return sc;
}

// ── Radar wheel ──────────────────────────────────────────
function buildRadar(sc,topKey,nowNorm){
  var cx=200,cy=200,baseR=140;
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-54 -46 508 500');
  // grid octagons
  [0.25,0.5,0.75,1].forEach(function(f){
    var pts=EKEYS.map(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      return (cx+ux*baseR*f)+','+(cy+uy*baseR*f);
    }).join(' ');
    var poly=document.createElementNS(NS,'polygon');
    poly.setAttribute('points',pts);
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke','var(--line)');
    poly.setAttribute('stroke-width',f===1?1.4:1);
    poly.setAttribute('opacity',f===1?0.9:0.5);
    svg.appendChild(poly);
  });
  // spokes
  EKEYS.forEach(function(k){
    var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
    var ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',cx);ln.setAttribute('y1',cy);
    ln.setAttribute('x2',cx+ux*baseR);ln.setAttribute('y2',cy+uy*baseR);
    ln.setAttribute('stroke','var(--line)');ln.setAttribute('stroke-width',1);ln.setAttribute('opacity',0.5);
    svg.appendChild(ln);
  });
  // score polygon (radius 30..140)
  function rOf(s){return 30+(s/100)*110;}
  var sp=EKEYS.map(function(k){
    var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
    var r=rOf(sc[k]);
    return (cx+ux*r)+','+(cy+uy*r);
  }).join(' ');
  var area=document.createElementNS(NS,'polygon');
  area.setAttribute('points',sp);
  area.setAttribute('fill','rgba(53,97,79,.16)');
  area.setAttribute('stroke','var(--pine)');
  area.setAttribute('stroke-width',2);
  svg.appendChild(area);
  // 此刻 overlay polygon (gold dashed)
  if(nowNorm){
    var np=EKEYS.map(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      var r=rOf(nowNorm[k]||0);
      return (cx+ux*r)+','+(cy+uy*r);
    }).join(' ');
    var narea=document.createElementNS(NS,'polygon');
    narea.setAttribute('points',np);
    narea.setAttribute('fill','rgba(169,130,59,.10)');
    narea.setAttribute('stroke','var(--gold)');
    narea.setAttribute('stroke-width',2);
    narea.setAttribute('stroke-dasharray','5 4');
    svg.appendChild(narea);
    EKEYS.forEach(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      var r=rOf(nowNorm[k]||0);
      var nd=document.createElementNS(NS,'circle');
      nd.setAttribute('cx',cx+ux*r);nd.setAttribute('cy',cy+uy*r);
      nd.setAttribute('r',3.5);nd.setAttribute('fill','var(--gold)');nd.setAttribute('stroke','#fff');nd.setAttribute('stroke-width',1);
      svg.appendChild(nd);
    });
  }
  // dots + labels
  EKEYS.forEach(function(k){
    var b=E[k];
    var ux=(b.pos.x-cx)/baseR, uy=(b.pos.y-cy)/baseR;
    var r=rOf(sc[k]);
    var px=cx+ux*r, py=cy+uy*r;
    var dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',px);dot.setAttribute('cy',py);
    dot.setAttribute('r',k===topKey?7:5);
    dot.setAttribute('fill',W[b.wx]);
    dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width',1.5);
    svg.appendChild(dot);
    // label outside
    var lr=baseR+22;
    var lx=cx+ux*lr, ly=cy+uy*lr;
    var anchor = ux>0.35?'start':(ux<-0.35?'end':'middle');
    if(anchor==='start') lx+=2; else if(anchor==='end') lx-=2;
    ly += uy>0.35?12:(uy<-0.35?-6:4);
    var tx=document.createElementNS(NS,'text');
    tx.setAttribute('class','rlabel'+(k===topKey?' top':''));
    tx.setAttribute('x',lx);tx.setAttribute('y',ly);tx.setAttribute('text-anchor',anchor);
    tx.textContent=b.nm+'·'+b.fn.split('／')[0];
    svg.appendChild(tx);
    var ts=document.createElementNS(NS,'text');
    ts.setAttribute('class','rscore');
    ts.setAttribute('x',lx);ts.setAttribute('y',ly+13);ts.setAttribute('text-anchor',anchor);
    ts.textContent=sc[k];
    svg.appendChild(ts);
  });
  return svg;
}

// ── 此刻（問易快照）讀取與對照 ────────────────────────────
function readNow(){
  try{
    var raw=localStorage.getItem('bagua_now_v1');
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o||!o.scores) return null;
    var vals=Object.keys(E).map(function(k){return (typeof o.scores[k]==='number')?o.scores[k]:0;});
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    var norm={};
    Object.keys(E).forEach(function(k){
      var v=(typeof o.scores[k]==='number')?o.scores[k]:0;
      norm[k]=(mx===mn)?50:Math.round((v-mn)/(mx-mn)*100);
    });
    return {norm:norm,raw:o.scores,mainHex:o.mainHex||'',ts:o.ts||''};
  }catch(e){ return null; }
}
function relTimeStr(ts){
  try{
    var then=new Date(ts).getTime(); if(isNaN(then)) return '';
    var days=Math.floor((Date.now()-then)/86400000);
    if(days<=0) return '今天'; if(days===1) return '昨天';
    if(days<7) return days+' 天前';
    if(days<30) return Math.floor(days/7)+' 週前';
    return Math.floor(days/30)+' 個月前';
  }catch(e){ return ''; }
}
function ctaBlock(sc,now){
  if(!now){
    return '<div class="cta-now">'
      +'<div class="cn-h">底色 vs 此刻</div>'
      +'<div class="cn-t">這張側寫是你的<b>「底色」</b>——你慣用的能量。<br>想看你<b>「此刻」</b>的能量狀態嗎？問易會依你當下的提問算出此刻卦象，回到這頁就會自動疊上對照。</div>'
      +'<a href="ven-i/">去問易看此刻 →</a></div>';
  }
  var base=Object.keys(E).slice().sort(function(a,b){return sc[b]-sc[a];});
  var nowSorted=Object.keys(E).slice().sort(function(a,b){return (now.raw[b]||0)-(now.raw[a]||0);});
  var rb={},rn={};
  base.forEach(function(k,i){rb[k]=i;}); nowSorted.forEach(function(k,i){rn[k]=i;});
  var deltas=Object.keys(E).map(function(k){return {k:k,d:rb[k]-rn[k]};});
  deltas.sort(function(a,b){return b.d-a.d;});
  var up=deltas[0], down=deltas[deltas.length-1];
  var sentence;
  if(up.d<=0 && down.d>=0){
    sentence='你此刻的能量輪廓和底色蠻接近的——狀態挺穩。';
  } else {
    var parts=[];
    if(up.d>0) parts.push('此刻你的「<b>'+E[up.k].fn+'</b>」比平常更突出');
    if(down.d<0) parts.push('「<b>'+E[down.k].fn+'</b>」比平常收斂');
    sentence='和你的底色相比，'+parts.join('、')+'。';
  }
  var rt=relTimeStr(now.ts);
  var hexpart=now.mainHex?('此刻卦象：<b>'+now.mainHex+'</b>'+(rt?'（'+rt+'的問易）':'')):'';
  return '<div class="cta-now">'
    +'<div class="cn-h">底色 vs 此刻</div>'
    +'<div class="cn-t">雷達上的<b>金色虛線</b>＝你<b>此刻</b>的能量輪廓。'+(hexpart?'<br>'+hexpart:'')+'<br>'+sentence+'</div>'
    +'<a href="ven-i/">重新去問易更新此刻 →</a></div>';
}

// ── 落差分析：場域 - 底色（同 0–100，可直接相減）────────────
// 回 {ups:[{k,d}...], downs:[...]}（依差值排序）
function facetDeltas(facetSc, baseSc){
  var arr=EKEYS.map(function(k){ return {k:k,d:(facetSc[k]||0)-(baseSc[k]||0)}; });
  var ups=arr.slice().sort(function(a,b){return b.d-a.d;});   // 最大正差在前
  var downs=arr.slice().sort(function(a,b){return a.d-b.d;}); // 最大負差在前
  return {ups:ups,downs:downs};
}
function energyLabel(k){ return E[k].fn; } // 含「／」全名，例「啟動／突破」

// 落差句
function gapSentence(facetId, facetSc, baseSc){
  var f=FACET_BY_ID[facetId];
  var dl=facetDeltas(facetSc,baseSc);
  var up=dl.ups[0], down=dl.downs[0];
  var parts=[];
  if(up.d>0) parts.push('拉高了『<span class="up">'+energyLabel(up.k)+'</span>』');
  if(down.d<0) parts.push('壓低了『<span class="down">'+energyLabel(down.k)+'</span>』');
  if(!parts.length) return '【'+f.nm+'】和你的底色幾乎一樣——在這個場域，你大致還是平常的你。';
  return '【'+f.nm+'】和你的底色相比，'+parts.join('、')+'。';
}

// 消耗訊號（L3 預覽）：壓抑底色強項 或 硬撐底色弱項
function drainSignal(facetId, facetSc, baseSc){
  var f=FACET_BY_ID[facetId];
  var baseSorted=EKEYS.slice().sort(function(a,b){return (baseSc[b]||0)-(baseSc[a]||0);});
  var top3=baseSorted.slice(0,3), bot3=baseSorted.slice(-3);
  var suppressed=null, forced=null; // 被壓的強項、被硬拉的弱項
  top3.forEach(function(k){ var d=(facetSc[k]||0)-(baseSc[k]||0); if(d<=-20 && (!suppressed||d<suppressed.d)) suppressed={k:k,d:d}; });
  bot3.forEach(function(k){ var d=(facetSc[k]||0)-(baseSc[k]||0); if(d>=20 && (!forced||d>forced.d)) forced={k:k,d:d}; });
  if(!suppressed && !forced) return null;
  var clauses=[];
  if(suppressed) clauses.push('壓抑『'+energyLabel(suppressed.k)+'』');
  if(forced) clauses.push('硬撐『'+energyLabel(forced.k)+'』');
  return '在【'+f.nm+'】，這個場域要你'+clauses.join('、')+'——長期這樣比較容易耗電，記得找地方把它補回來。';
}

// ════════════════════════════════════════════════════════════
//  雙人合盤 (Compat) — 關係動態的鏡子，不是相容度評分

// ── 合盤碼：編碼 / 解碼 ───────────────────────────────────
function encodeCode(scores){
  var s='B1';
  EKEYS.forEach(function(k){ var v=Math.max(0,Math.min(99,Math.round(scores[k]||0))); s+=(v<10?'0':'')+v; });
  return s; // 'B1' + 16 位數字
}
function decodeCode(str){
  str=(str||'').trim().toUpperCase().replace(/\s/g,'');
  if(str.indexOf('B1')!==0 || str.length!==18) return null;
  var d=str.slice(2); if(!/^[0-9]{16}$/.test(d)) return null;
  var sc={}; EKEYS.forEach(function(k,i){ sc[k]=parseInt(d.substr(i*2,2),10); });
  return sc;
}

// ── 分享網址 / 解析（純函式，方便測試） ──────────────────
function shareURL(code){ return location.origin + location.pathname + '#c=' + code; }
// 從一段字串(純碼、或含 #c= / ?c= 的網址、或 QR 解出的文字)抽出合盤碼
function extractCode(str){
  str=(str||'').trim();
  var m=str.match(/[#?&]c=([A-Za-z0-9]+)/); if(m) return m[1].toUpperCase();
  var s=str.toUpperCase().replace(/\s/g,''); return /^B1[0-9]{16}$/.test(s)?s:null;
}

// ── QR 編碼 / 影像解碼 ────────────────────────────────────
function makeQRDataURL(text){
  var qr=qrcode(0,'M'); qr.addData(text); qr.make();
  return qr.createDataURL(5,12); // data:image/gif;base64,...
}
// 從 ImageData 解出合盤碼（可測）→ code | null
function decodeCodeFromImageData(imageData){
  try{
    if(typeof jsQR==='undefined' || !imageData) return null;
    var res=jsQR(imageData.data, imageData.width, imageData.height);
    if(!res || !res.data) return null;
    return extractCode(res.data);
  }catch(e){ return null; }
}

// ── 合盤計算（四個讀數） ──────────────────────────────────
// 同頻度：cosine（分數皆非負 → 0..1）
function cosineSim(a,b){var dot=0,na=0,nb=0;EKEYS.forEach(function(k){dot+=a[k]*b[k];na+=a[k]*a[k];nb+=b[k]*b[k];});return(na===0||nb===0)?0:dot/(Math.sqrt(na)*Math.sqrt(nb));}
// 互補度：缺口被補率（雙向）
function complementarity(a,b){var sw=0,sc=0;EKEYS.forEach(function(k){var wa=(100-a[k])/100;sw+=wa;sc+=wa*(b[k]/100);var wb=(100-b[k])/100;sw+=wb;sc+=wb*(a[k]/100);});return sw===0?0:sc/sw;}

// 五行生剋
var shengNext={wood:'fire',fire:'earth',earth:'metal',metal:'water',water:'wood'};
var keNext={wood:'earth',earth:'water',water:'fire',fire:'metal',metal:'wood'};

function topElement(sc){
  var bestK=EKEYS[0];
  EKEYS.forEach(function(k){ if(sc[k]>sc[bestK]) bestK=k; });
  return E[bestK].wx;
}
// 回傳 {type, text}；type: 'same'|'aToB'|'bToA'|'aKeB'|'bKeA'
function elementFlow(elemA,elemB){
  if(elemA===elemB) return {type:'same',
    text:'你們最強的能量都落在「'+WLAB[elemA]+'」——這是<b>比和（共鳴）</b>：頻率相近、容易一拍即合，但也可能一起偏執、少了不同的聲音。'};
  if(shengNext[elemA]===elemB) return {type:'aToB',
    text:'你的「'+WLAB[elemA]+'」<span class="arrow">生→</span>他的「'+WLAB[elemB]+'」：<b>你滋養他</b>。你的能量往他那兒去、托住他。'};
  if(shengNext[elemB]===elemA) return {type:'bToA',
    text:'他的「'+WLAB[elemB]+'」<span class="arrow">生→</span>你的「'+WLAB[elemA]+'」：<b>他滋養你</b>。他的能量往你這兒來、托住你。'};
  if(keNext[elemA]===elemB) return {type:'aKeB',
    text:'你的「'+WLAB[elemA]+'」<span class="arrow">剋→</span>他的「'+WLAB[elemB]+'」：<b>你會制約／壓到他</b>。你的力道容易蓋過他的步調。'};
  if(keNext[elemB]===elemA) return {type:'bKeA',
    text:'他的「'+WLAB[elemB]+'」<span class="arrow">剋→</span>你的「'+WLAB[elemA]+'」：<b>他會制約你</b>。他的力道容易蓋過你的步調。'};
  return {type:'same',text:'你們的主能量彼此呼應。'};
}

    if(showPicker){
      whichHtml='<div class="share-which" id="share-which">'
        +'<span class="share-which-lab">分享哪張盤？</span>'
        +pickable.map(function(p,i){ return '<button class="swbtn'+(i===0?' on':'')+'" data-fid="'+p.id+'" onclick="selectShareFacet(\''+p.id+'\')">'+p.nm+'</button>'; }).join('')
        +'</div>';
    }
    html+='<div class="block">'
      +'<h3>你的盤 · 分享給對方</h3>'
      +whichHtml
      +'<div class="qr-wrap"><img id="share-qr" alt="合盤 QR"></div>'
      +'<div class="share-btns">'
        +'<button class="cbtn" onclick="copyShareLink()">複製連結</button>'
        +'<button class="cbtn ghost" onclick="downloadShareImage()">下載合盤圖</button>'
        +'<span id="copy-tip" style="font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--pine)"></span>'
      +'</div>'
      +'<div class="code-fallback">合盤碼（備用）：<span id="my-code">'+encodeCode(mine)+'</span></div>'
      +'<div style="font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.7">'
        +'對方掃 QR、點連結、或丟這張圖／貼這段碼，就能直接合盤。</div>'
      +'<div class="honest" style="max-width:none;margin:12px 0 0">'
        +'分享連結＝把你的八卦數值（8 個數字、無個資）給對方。</div>'
    +'</div>';
  } else {
    html+='<div class="block">'
      +'<h3>你的盤 · 分享給對方</h3>'
      +'<div style="font-size:14px;line-height:1.85">要合盤，得先測你自己的<b>底色</b>——這樣才有你的盤可以分享。</div>'
      +'<div style="text-align:center;margin-top:14px"><button class="cbtn" onclick="startQuiz()">去測驗</button></div>'
    +'</div>';
  }

  html+='<div class="block">'
    +'<h3>合對方的盤</h3>'
    +'<div class="upload-row" style="margin-top:0;margin-bottom:6px">'
      +'<input type="file" id="qr-file" accept="image/*" style="display:none" onchange="onQRFile(event)">'
      +'<button class="upload-btn" onclick="document.getElementById(\'qr-file\').click()">📷 上傳對方的圖（含 QR）</button>'
    +'</div>'
    +'<div class="or-divider">或貼上連結／合盤碼</div>'
    +'<input class="compat-input" id="other-code" placeholder="貼網址或 B1xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">'
    +'<div style="text-align:center;margin-top:12px"><button class="cbtn" onclick="runCompat()">合盤</button></div>'
    +'<div class="compat-err" id="compat-err"></div>'
  +'</div>'
  +'<div id="compat-out"></div>';

  var c=document.getElementById('compat');
  c.innerHTML=html;
  c.style.display='block';
  if(mine){ shareFacetId='__base__'; refreshShare(); }
  // 若有人先分享了盤、你剛測完底色 → 自動帶入對方的碼
  if(mine && pendingShareCode){
    var oc=document.getElementById('other-code'); if(oc) oc.value=pendingShareCode;
  }
  window.scrollTo(0,0);
}

// ── 分享盤狀態：哪張盤（底色 / 某場域） ───────────────────
var shareFacetId='__base__';
function shareScores(){
  if(shareFacetId && shareFacetId!=='__base__'){
    var f=getFacets(); if(f[shareFacetId]&&f[shareFacetId].scores) return f[shareFacetId].scores;
  }
  var b=getBase(); return b?b.scores:null;
}
function shareLabel(){
  if(shareFacetId && shareFacetId!=='__base__' && FACET_BY_ID[shareFacetId]) return FACET_BY_ID[shareFacetId].nm;
  return '整體底色';
}
function selectShareFacet(id){
  shareFacetId=id;
  var wrap=document.getElementById('share-which');
  if(wrap){ Array.prototype.forEach.call(wrap.querySelectorAll('.swbtn'),function(b){
    b.classList.toggle('on', b.getAttribute('data-fid')===id);
  }); }
  refreshShare();
}
function refreshShare(){
  var sc=shareScores(); if(!sc) return;
  var code=encodeCode(sc);
  var mc=document.getElementById('my-code'); if(mc) mc.textContent=code;
  var img=document.getElementById('share-qr');
  if(img){ try{ img.src=makeQRDataURL(shareURL(code)); }catch(e){} }
}
function copyShareLink(){
  var sc=shareScores(); if(!sc) return;
  var link=shareURL(encodeCode(sc));
  var tip=document.getElementById('copy-tip');
  function done(){ if(tip){ tip.textContent='連結已複製 ✓'; setTimeout(function(){tip.textContent='';},2000);} }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(done,function(){ selectFallback(link,done); });
  } else { selectFallback(link,done); }
}

// 下載合盤圖：canvas 畫 QR ＋下方小標題 → PNG
function downloadShareImage(){
  var sc=shareScores(); if(!sc) return;
  var code=encodeCode(sc);
  var b=getBase();
  var typeTitle=(b&&E[b.top])?E[b.top].title:'';
  if(shareFacetId && shareFacetId!=='__base__'){
    var tk=topKeyOf(sc); typeTitle=E[tk].title;
  }
  var img=new Image();
  img.onload=function(){
    var W0=520, pad=46, qrSize=380;
    var H0=pad + qrSize + 96;
    var cv=document.createElement('canvas'); cv.width=W0; cv.height=H0;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#fffdf6'; ctx.fillRect(0,0,W0,H0);
    ctx.imageSmoothingEnabled=false;
    var qx=(W0-qrSize)/2;
    ctx.drawImage(img, qx, pad, qrSize, qrSize);
    ctx.textAlign='center'; ctx.fillStyle='#35614f';
    ctx.font='700 22px ui-sans-serif,sans-serif';
    ctx.fillText('八卦能量人格 · 掃我合盤', W0/2, pad+qrSize+38);
    ctx.fillStyle='#766f63'; ctx.font='16px ui-sans-serif,sans-serif';
    var sub=shareLabel()+(typeTitle?' · '+typeTitle:'');
    ctx.fillText(sub, W0/2, pad+qrSize+66);
    var fname='八卦合盤_'+code+'.png';
    function trigger(url){ var a=document.createElement('a'); a.href=url; a.download=fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); }
    if(cv.toBlob){ cv.toBlob(function(blob){ var u=URL.createObjectURL(blob); trigger(u);
      setTimeout(function(){URL.revokeObjectURL(u);},4000); },'image/png'); }
    else { trigger(cv.toDataURL('image/png')); }
  };
  img.src=makeQRDataURL(shareURL(code));
}

// 上傳對方的圖：讀檔 → canvas → getImageData → jsQR → extractCode → 填入並合盤
function onQRFile(ev){
  var err=document.getElementById('compat-err'); if(err) err.textContent='';
  var file=ev.target.files && ev.target.files[0];
  ev.target.value=''; // 允許再次選同檔
  if(!file){ return; }
  var img=new Image();
  img.onload=function(){
    try{
      var cv=document.createElement('canvas');
      var maxW=900, scale=img.width>maxW?maxW/img.width:1;
      cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
      var ctx=cv.getContext('2d');
      ctx.drawImage(img,0,0,cv.width,cv.height);
      var data=ctx.getImageData(0,0,cv.width,cv.height);
      var code=decodeCodeFromImageData(data);
      if(!code){ if(err) err.textContent='這張圖裡找不到合盤碼——試試更清楚的截圖，或改貼連結／合盤碼。'; return; }
      var oc=document.getElementById('other-code'); if(oc) oc.value=code;
      runCompat();
    }catch(e){ if(err) err.textContent='讀這張圖時出了點問題——換一張或改貼連結／合盤碼。'; }
  };
  img.onerror=function(){ if(err) err.textContent='這個檔讀不出來——請確認是圖片檔。'; };
  var fr=new FileReader();
  fr.onload=function(){ img.src=fr.result; };
  fr.onerror=function(){ if(err) err.textContent='讀檔失敗——換一張試試。'; };
  fr.readAsDataURL(file);
}

function backToResult(){
  document.getElementById('compat').style.display='none';
  document.getElementById('quiz').style.display='none';
  var r=document.getElementById('result');
  if(r.innerHTML.trim()){ r.style.display='block'; renderFacetMenu(); }
  else { document.getElementById('cover').style.display='block'; }
  window.scrollTo(0,0);
}

function copyMyCode(){
  var code=document.getElementById('my-code').textContent;
  var tip=document.getElementById('copy-tip');
  function done(){ if(tip){ tip.textContent='已複製 ✓'; setTimeout(function(){tip.textContent='';},2000);} }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done,function(){ selectFallback(code,done); });
  } else { selectFallback(code,done); }
}
function selectFallback(code,done){
  try{
    var ta=document.createElement('textarea');
    ta.value=code; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){ var tip=document.getElementById('copy-tip'); if(tip) tip.textContent='請手動選取複製'; }
}

function runCompat(){
  var err=document.getElementById('compat-err');
  err.textContent='';
  var mine=null;
  try{ var raw=localStorage.getItem('bagua_persona_v1'); if(raw){ var o=JSON.parse(raw); if(o&&o.scores) mine=o.scores; } }catch(e){}
  if(!mine){ err.textContent='還沒有你的底色——請先測驗。'; return; }
  var code=extractCode(document.getElementById('other-code').value);
  var other=code?decodeCode(code):null;
  if(!other){ err.textContent='讀不到對方的盤。可以貼合盤碼（B1 開頭 16 位數字）、整段分享連結，或上傳含 QR 的圖。'; return; }

  // 四個讀數
  var sim=Math.round(cosineSim(mine,other)*100);
  var comp=Math.round(complementarity(mine,other)*100);

  // 存一筆合盤紀錄（本機；unshift、上限 20）
  try{
    var otherTop=topKeyOf(other);
    var rec={ts:new Date().toISOString(),otherCode:code,otherTop:otherTop,otherTitle:E[otherTop].title,sim:sim,comp:comp};
    var hist=[];
    try{ var rawH=localStorage.getItem('bagua_compat_v1'); if(rawH){ var a=JSON.parse(rawH); if(Array.isArray(a)) hist=a; } }catch(e2){}
    hist.unshift(rec); if(hist.length>20) hist=hist.slice(0,20);
    localStorage.setItem('bagua_compat_v1', JSON.stringify(hist));
  }catch(e1){}

  // 共同盲點：兩人都 <50，依 (a+b) 由小到大取前 1–2
  var blind=EKEYS.filter(function(k){ return mine[k]<50 && other[k]<50; })
    .sort(function(a,b){ return (mine[a]+other[a])-(mine[b]+other[b]); }).slice(0,2);
  // 摩擦點：|a-b| 最大前 1–2
  var fric=EKEYS.slice().sort(function(a,b){ return Math.abs(mine[b]-other[b])-Math.abs(mine[a]-other[a]); }).slice(0,2);
  // 五行流向
  var flow=elementFlow(topElement(mine),topElement(other));
  // 合成人物
  var merged={}; EKEYS.forEach(function(k){ merged[k]=Math.round((mine[k]+other[k])/2); });
  var mSorted=Object.keys(E).slice().sort(function(a,b){ return merged[b]-merged[a]; });
  var mTop=E[mSorted[0]];
  var port=buildPortrait(merged,mSorted);

  var blindTxt = blind.length
    ? '你們都偏低「'+blind.map(function(k){return E[k].nm+'／'+E[k].fn.split('／')[0];}).join('』『')+'」——這是兩人<b>共同的空白處</b>，這段關係容易在這裡一起卡住、少了這份能量。'
    : '沒有明顯的共同盲點——你們在低分項上不太重疊，常能互相補位。';
  var fricTxt = '差最多的是「'+fric.map(function(k){return E[k].nm+'／'+E[k].fn.split('／')[0]+'」（你 '+mine[k]+'、他 '+other[k];}).join('）、「')+'）。這些落差可能是互補的養分，也可能是步調上的摩擦——看你們怎麼用它。';

  var out=''
   +'<div class="block">'
     +'<h3>雙人能量雷達</h3>'
     +'<div class="radar-wrap" id="compat-radar"></div>'
     +'<div class="legend">'
       +'<span><i style="background:var(--pine)"></i>松綠實線＝你</span>'
       +'<span><i style="background:var(--gold)"></i>金色虛線＝對方</span>'
     +'</div>'
   +'</div>'
   +'<div class="readcards">'
     +'<div class="readcard"><div class="rc-num">'+sim+'%</div><div class="rc-lab">同頻度</div><div class="rc-sub">能量輪廓有多相近</div></div>'
     +'<div class="readcard"><div class="rc-num">'+comp+'%</div><div class="rc-lab">互補度</div><div class="rc-sub">彼此補上對方的缺口</div></div>'
   +'</div>'
   +'<div class="share-hint" style="margin:-6px 0 14px">兩個是<b>各自獨立</b>的讀數——高或低都沒有好壞，只是不同的關係樣貌。</div>'
   +'<div class="block"><h3>共同盲點</h3><div style="font-size:14px;line-height:1.85">'+blindTxt+'</div></div>'
   +'<div class="block"><h3>摩擦點</h3><div style="font-size:14px;line-height:1.85">'+fricTxt+'</div></div>'
   +'<div class="block"><h3>五行能量流向</h3>'
     +'<div class="flowline">'+flow.text+'</div>'
     +'<div style="font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7">'
       +'生未必是好（一直給，也會洩）；剋未必是壞（適度的約束，反而把人接住）。方向只是描述能量怎麼走。</div>'
   +'</div>'
   +'<div class="block">'
     +'<h3>你們這一對</h3>'
     +'<div class="typecard" style="--accent:'+W[mTop.wx]+';box-shadow:none;margin-bottom:0">'
       +'<div class="tc-eyebrow">合成型 · 兩人能量平均</div>'
       +'<div class="tc-sym">'+mTop.sym+'</div>'
       +'<div class="tc-title">'+mTop.title+'</div>'
     +'</div>'
     +'<div class="portrait" style="margin-top:14px">'+port.p+'</div>'
     +'<div class="portrait-close">'+port.close+'</div>'
   +'</div>'
   +'<div style="text-align:center;margin:18px 0 10px"><button class="cbtn ghost" onclick="backToResult()">返回我的結果</button></div>'
   +'<div class="foot">合盤是理解關係的鏡子，不是配對評分。<br>能量會流動，關係也會——這只是此刻的一張側寫。<br><br>八卦能量人格 · 練息場 Join to Enjoy</div>';

  var ow=document.getElementById('compat-out');
  ow.innerHTML=out;
  // 雙人雷達：我的分數實線、我的 top、對方分數金虛線
  var myTop=EKEYS[0]; EKEYS.forEach(function(k){ if(mine[k]>mine[myTop]) myTop=k; });
  document.getElementById('compat-radar').appendChild(buildRadar(mine,myTop,other));
  ow.scrollIntoView({behavior:'smooth',block:'start'});
}

// ── 連結直達合盤（load 時檢查 #c=CODE） ──────────────────
var pendingShareCode=null; // 沒有底色時暫存，測完可合
function initFromHash(){
  var code=extractCode(location.hash||'');
  if(!code) return; // 正常無 hash 開啟不受影響
  // 清掉 hash，避免重測時重觸發
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; }
  if(getBase()){
    // 有自己的底色 → 直接合盤
    showCompat();
    var oc=document.getElementById('other-code'); if(oc) oc.value=code;
    runCompat();
  } else {
    // 還沒測 → 先提示測底色，暫存對方的碼
    pendingShareCode=code;
    showCompat();
    var box=document.getElementById('compat');
    var notice=document.createElement('div');
    notice.className='honest';
    notice.style.cssText='max-width:none;margin:0 0 16px;border-left-color:var(--pine)';
    notice.innerHTML='<b>有人分享了他的盤給你 ☯</b><br>先測你自己的底色，就能跟他合盤。'
      +'<div style="text-align:center;margin-top:12px"><button class="cbtn" onclick="startQuiz()">去測驗</button></div>';
    var firstBlock=box.querySelector('.block');
    if(firstBlock&&firstBlock.parentNode){ firstBlock.parentNode.insertBefore(notice,firstBlock); }
    else { box.appendChild(notice); }
  }
}
// 測完底色回到結果後，若有暫存的分享碼，showCompat 時自動帶入由使用者按合盤
// （pendingShareCode 在 runCompat/showCompat 不主動消費，避免打斷正常流程；
//  使用者測完看結果→點「和別人合盤」→貼上即可，或重開連結。）

initFromHash();
</script>
