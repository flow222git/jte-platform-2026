<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>測一個局 · 八卦能量盤</title>
<style>
  :root{--bg:#f4efe4;--surface:#fffdf6;--surface2:#f0eadb;--ink:#22322c;--muted:#766f63;--line:#d8cdbc;
    --pine:#35614f;--cinnabar:#9d4b34;--gold:#a9823b;--blue:#4d6b86;
    --metal:#b0996a;--wood:#5f7d4a;--water:#4d6b86;--fire:#9d4b34;--earth:#a98238;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Songti TC","Noto Serif TC",ui-serif,serif;
    padding:22px 18px 48px;max-width:600px;margin:0 auto;line-height:1.75}
  .sans{font-family:ui-sans-serif,sans-serif}
  .home-link{display:inline-block;font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);
    text-decoration:none;margin-bottom:14px;padding:5px 12px;border:1px solid var(--line);border-radius:999px}
  .home-link:hover{background:var(--surface)}

  /* ── Cover ── */
  #cover{text-align:center;padding:8px 0}
  #cover .eyebrow{font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.24em;color:var(--gold);
    text-transform:uppercase;margin-bottom:14px}
  #cover h1{font-size:27px;letter-spacing:.08em;margin-bottom:10px}
  #cover .lead{font-size:14px;color:var(--ink);max-width:400px;margin:0 auto 8px;line-height:1.9}
  #cover .trigrams{font-size:26px;color:var(--pine);letter-spacing:.18em;margin:18px 0 6px;opacity:.85}
  .name-input{width:100%;max-width:400px;font-family:"Songti TC","Noto Serif TC",serif;font-size:16px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;color:var(--ink);
    text-align:center;margin:6px auto 0;display:block}
  .name-input:focus{outline:none;border-color:var(--pine);background:#fff}
  .name-lab{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);margin:18px 0 0;display:block}
  .start-btn{display:inline-block;background:var(--pine);color:#fff;border:none;font-family:"Songti TC","Noto Serif TC",serif;
    font-size:16px;letter-spacing:.1em;padding:13px 40px;border-radius:999px;cursor:pointer;margin:18px 0 10px;
    box-shadow:0 8px 24px rgba(53,97,79,.22);transition:transform .15s}
  .start-btn:hover{transform:translateY(-2px)}
  .meta-line{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);margin-bottom:18px}
  .honest{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);background:var(--surface);
    border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:11px 15px;text-align:left;
    max-width:440px;margin:14px auto 0;line-height:1.85}
  .base-hint{font-family:ui-sans-serif,sans-serif;font-size:12.5px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-left:4px solid var(--pine);border-radius:0 12px 12px 0;
    padding:12px 15px;text-align:left;max-width:440px;margin:16px auto 0;line-height:1.8}
  .base-hint a{color:var(--pine);font-weight:700}
  .base-ok{font-family:ui-sans-serif,sans-serif;font-size:12.5px;color:var(--pine);margin:14px auto 0;max-width:440px}

  /* 你測過的局 */
  .past-box{max-width:440px;margin:22px auto 0;text-align:left}
  .past-box h3{font-family:ui-sans-serif,sans-serif;font-size:13px;letter-spacing:.06em;color:var(--pine);
    margin-bottom:10px;font-weight:700;text-align:center}
  .past-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .past-row:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(74,62,44,.1)}
  .past-row .pr-ic{font-size:20px;flex:none;width:26px;text-align:center;color:var(--pine)}
  .past-row .pr-body{flex:1;min-width:0}
  .past-row .pr-nm{font-family:ui-sans-serif,sans-serif;font-size:14px;font-weight:700;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .past-row .pr-st{font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-top:1px}
  .past-row .pr-arr{color:var(--muted);font-size:16px}

  /* ── Quiz ── */
  #quiz{display:none}
  .prog-wrap{margin-bottom:26px}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;font-family:ui-sans-serif,sans-serif;
    font-size:12px;color:var(--muted);margin-bottom:7px}
  .prog-bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
  .prog-fill{height:100%;background:var(--pine);border-radius:999px;transition:width .3s ease;width:0}
  .field-banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:0 12px 12px 0;padding:11px 15px;margin-bottom:20px}
  .field-banner .fb-h{font-family:ui-sans-serif,sans-serif;font-size:13px;font-weight:700;color:var(--pine);
    letter-spacing:.04em}
  .field-banner .fb-f{font-family:ui-sans-serif,sans-serif;font-size:12px;color:var(--muted);line-height:1.7;margin-top:2px}
  .q-num{font-family:ui-sans-serif,sans-serif;font-size:12px;letter-spacing:.18em;color:var(--gold);
    text-transform:uppercase;margin-bottom:10px}
  .q-text{font-size:20px;line-height:1.7;letter-spacing:.02em;margin-bottom:30px;min-height:2.6em}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:15px 20px;
    font-family:"Songti TC","Noto Serif TC",serif;font-size:16px;color:var(--ink);cursor:pointer;text-align:left;
    transition:all .15s;display:flex;align-items:center;gap:13px}
  .opt:hover{border-color:var(--pine);background:#fff;transform:translateX(3px)}
  .opt .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);flex:none}
  .opt:hover .dot{border-color:var(--pine)}
  .opt.sel{border-color:var(--pine);background:#eef3ee}
  .opt.sel .dot{background:var(--pine);border-color:var(--pine)}
  .back-btn{margin-top:24px;background:none;border:none;font-family:ui-sans-serif,sans-serif;font-size:13px;
    color:var(--muted);cursor:pointer;padding:6px 4px}
  .back-btn:hover{color:var(--ink)}
  .back-btn[disabled]{opacity:.3;cursor:default}

  /* ── Result ── */
  #result{display:none}
  .share-hint{text-align:center;font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .typecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 22px 20px;
    box-shadow:0 14px 38px rgba(74,62,44,.1);position:relative;overflow:hidden;text-align:center;margin-bottom:18px}
  .typecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,var(--pine))}
  .tc-eyebrow{font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.2em;color:var(--muted);
    text-transform:uppercase;margin-bottom:6px}
  .tc-sym{font-size:46px;line-height:1;margin-bottom:6px;color:var(--accent,var(--pine))}
  .tc-title{font-size:24px;letter-spacing:.06em;margin-bottom:9px}
  .tc-essence{font-size:14px;color:var(--ink);line-height:1.85;max-width:400px;margin:0 auto}

  .radar-wrap{max-width:380px;margin:6px auto 4px}
  .radar-wrap svg{width:100%;height:auto;display:block}
  .rlabel{font-size:13px;font-family:ui-sans-serif,sans-serif;fill:var(--muted)}
  .rlabel.top{fill:var(--pine);font-weight:700}
  .rscore{font-size:10px;font-family:ui-sans-serif,sans-serif;fill:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:5px 13px;justify-content:center;font-size:11.5px;color:var(--muted);
    font-family:ui-sans-serif,sans-serif;margin:2px 0 20px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .legend i.dash{width:14px;height:0;border-radius:0;border-top:2px dashed var(--gold);vertical-align:3px}

  .block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .block h3{font-family:ui-sans-serif,sans-serif;font-size:13px;letter-spacing:.06em;color:var(--pine);
    margin-bottom:12px;font-weight:700}
  .fit-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;
    text-align:center;margin-bottom:14px;box-shadow:0 10px 30px rgba(74,62,44,.08)}
  .fit-card .fc-num{font-size:46px;line-height:1;color:var(--pine);font-family:ui-sans-serif,sans-serif;font-weight:700}
  .fit-card .fc-lab{font-family:ui-sans-serif,sans-serif;font-size:13px;color:var(--ink);font-weight:700;margin-top:6px;letter-spacing:.06em}
  .fit-card .fc-sub{font-size:14px;color:var(--ink);line-height:1.85;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto}
  .pt-line{font-size:14.5px;line-height:1.95;color:var(--ink);padding:7px 0;border-bottom:1px solid var(--line)}
  .pt-line:last-child{border-bottom:none}
  .pt-line .em{color:var(--pine);font-weight:600}
  .pt-line.shine::before{content:"✦ ";color:var(--pine)}
  .drain-note{background:linear-gradient(120deg,#9d4b34,#823a28);color:#fff;border-radius:14px;
    padding:15px 18px;font-size:14px;line-height:1.85;margin-bottom:14px}
  .drain-note .dn-h{font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.82;margin-bottom:6px}
  .drain-note .dn-line{padding:4px 0}
  .drain-ok{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pine);
    border-radius:0 12px 12px 0;padding:13px 16px;font-size:14px;line-height:1.85;color:var(--ink);margin-bottom:14px}
  .strat-line{font-size:14px;line-height:1.9;color:var(--ink);padding:5px 0}
  .strat-line .em{color:var(--pine);font-weight:600}
  .flowline{font-size:15px;line-height:1.95;color:var(--ink)}
  .flowline .arrow{color:var(--gold);font-weight:700;margin:0 4px}
  .nobase-note{font-family:ui-sans-serif,sans-serif;font-size:13px;color:var(--ink);line-height:1.85}
  .nobase-note a{color:var(--pine);font-weight:700}

  .resbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 10px}
  .cbtn{display:inline-block;background:var(--pine);color:#fff;border:none;
    font-family:ui-sans-serif,sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;
    padding:11px 24px;border-radius:999px;cursor:pointer;transition:transform .15s;text-decoration:none}
  .cbtn:hover{transform:translateY(-2px)}
  .cbtn.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:400}
  .cbtn.ghost:hover{background:var(--surface);transform:none}
  .foot{font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);line-height:1.85;text-align:center;
    border-top:1px solid var(--line);padding-top:16px}
</style></head>
<body>
<a class="home-link" href="index.html">← 回練息場</a>

<!-- ───────── COVER ───────── -->
<div id="cover">
  <div class="eyebrow">BAGUA ENERGY · FIELD</div>
  <h1>測一個局</h1>
  <p class="lead">一份新工作、一段新關係、一個專案……<br>測測它需要哪些能量，和你合不合、會不會耗你。</p>
  <div class="trigrams">☰ ☱ ☲ ☴ ☳ ☵ ☶ ☷</div>
  <label class="name-lab" for="field-name">這個局叫什麼？（可留空）</label>
  <input class="name-input" id="field-name" placeholder="例：新工作 · 產品經理" autocomplete="off" spellcheck="false">
  <button class="start-btn" onclick="startQuiz()">開始測這個局</button>
  <div class="meta-line">16 題 · 約 2 分鐘 · 不需登入</div>
  <div id="base-status"></div>
  <div class="honest">
    一個「局」也是一張八卦能量盤——它代表這個情境<b>需要、要求</b>哪些能量（不是它的好壞）。
    再和你的<b>底色</b>合盤，就能看出：你會在哪發光、哪裡容易被它消耗。
  </div>
  <div class="past-box" id="past-box"></div>
</div>

<!-- ───────── QUIZ ───────── -->
<div id="quiz">
  <div class="field-banner">
    <div class="fb-h" id="fb-nm">這個局</div>
    <div class="fb-f">每一題請想著：<b>這個局</b>需不需要這種能量？</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-top"><span id="prog-label" class="sans">第 1 / 16 題</span><span id="prog-pct" class="sans">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div class="q-num" id="q-num">Q1</div>
  <div class="q-text" id="q-text"></div>
  <div class="opts" id="opts"></div>
  <button class="back-btn" id="back-btn" onclick="goBack()">← 上一題</button>
</div>

<!-- ───────── RESULT ───────── -->
<div id="result"></div>

<script>
var W={metal:'#b0996a',wood:'#5f7d4a',water:'#4d6b86',fire:'#9d4b34',earth:'#a98238'};
var WLAB={metal:'金',wood:'木',water:'水',fire:'火',earth:'土'};
var NS='http://www.w3.org/2000/svg';

// 8 energies — 精簡版（局頁只需 nm/fn/wx/pos，外加 sym 供標題用）
var E={
 qian:{sym:'☰',nm:'乾',wx:'metal',fn:'創造／決策',pos:{x:200,y:60}},
 li:  {sym:'☲',nm:'離',wx:'fire', fn:'顯現／覺察',pos:{x:299,y:101}},
 zhen:{sym:'☳',nm:'震',wx:'wood', fn:'啟動／突破',pos:{x:340,y:200}},
 dui: {sym:'☱',nm:'兌',wx:'metal',fn:'交流／分享',pos:{x:299,y:299}},
 kun: {sym:'☷',nm:'坤',wx:'earth',fn:'承載／滋養',pos:{x:200,y:340}},
 kan: {sym:'☵',nm:'坎',wx:'water',fn:'收藏／恢復',pos:{x:101,y:299}},
 gen: {sym:'☶',nm:'艮',wx:'earth',fn:'停止／界線',pos:{x:60,y:200}},
 xun: {sym:'☴',nm:'巽',wx:'wood', fn:'擴散／連結',pos:{x:101,y:101}}
};
var EKEYS=['qian','li','zhen','dui','kun','kan','gen','xun']; // clockwise from top

// 16 questions, 2 per energy, interleaved across the 8 (測「這個局的需求」)
var QUESTIONS=[
 {k:'qian',t:'這個局需要我獨立做決定、扛起方向。'},
 {k:'dui', t:'這個局需要大量與人互動、社交。'},
 {k:'li',  t:'這個局需要看清狀況、分析判斷。'},
 {k:'xun', t:'這個局需要協調、串連不同的人或資源。'},
 {k:'zhen',t:'這個局步調快、需要快速行動。'},
 {k:'kan', t:'這個局需要獨立深入、長時間專注鑽研。'},
 {k:'gen', t:'這個局需要守規矩、設界線、把關品質。'},
 {k:'kun', t:'這個局需要照顧、支持別人、承接需求。'},
 {k:'qian',t:'這個局需要開創新東西、從無到有。'},
 {k:'dui', t:'這個局需要我清楚對外表達、溝通。'},
 {k:'li',  t:'這個局需要敏銳覺察細節與變化。'},
 {k:'xun', t:'這個局需要彈性、順勢調整。'},
 {k:'zhen',t:'這個局常要冒險、突破、面對未知。'},
 {k:'kan', t:'這個局需要耐得住沉潛、不急著要成果。'},
 {k:'gen', t:'這個局需要穩定、按部就班、不躁進。'},
 {k:'kun', t:'這個局需要耐心、長期穩定地承擔。'}
];
var OPTS=[{t:'很需要',v:3},{t:'有點需要',v:2},{t:'不太需要',v:1},{t:'完全不需要',v:0}];

var answers=new Array(QUESTIONS.length).fill(null);
var idx=0;
var fieldName='這個局';

// ── 底色（人格）讀取 ─────────────────────────────────────
function getBase(){
  try{ var raw=localStorage.getItem('bagua_persona_v1'); if(!raw) return null; var o=JSON.parse(raw); return (o&&o.scores)?o:null; }
  catch(e){ return null; }
}
function topKeyOf(sc){ var t=EKEYS[0]; EKEYS.forEach(function(k){ if((sc[k]||0)>(sc[t]||0)) t=k; }); return t; }
function energyLabel(k){ return E[k].fn; }
function energyName(k){ return E[k].nm; } // 「乾」等

// ── 局庫（bagua_fields_v1）讀寫 ──────────────────────────
function getFields(){
  try{ var raw=localStorage.getItem('bagua_fields_v1'); if(!raw) return []; var a=JSON.parse(raw); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function saveField(name,scores){
  try{ var all=getFields(); all.unshift({name:name,scores:scores,ts:new Date().toISOString()});
    if(all.length>30) all=all.slice(0,30);
    localStorage.setItem('bagua_fields_v1',JSON.stringify(all)); }
  catch(e){}
}

// ── Cover：底色提示 + 你測過的局 ─────────────────────────
function renderCover(){
  var bs=document.getElementById('base-status');
  var base=getBase();
  if(base){
    var tk=base.top||topKeyOf(base.scores);
    bs.innerHTML='<div class="base-ok">✓ 已有你的底色（'+(base.title||E[tk].nm)+'）——測完局會自動和你合盤。</div>';
  } else {
    bs.innerHTML='<div class="base-hint">還沒測過你的<b>人格底色</b>？'
      +'<a href="bagua-persona.html">先測你的底色 →</a><br>'
      +'（沒底色也能單測這個局，只是少了「你 × 局」的對照。）</div>';
  }
  var box=document.getElementById('past-box');
  var fields=getFields();
  if(!fields.length){ box.innerHTML=''; return; }
  var rows=fields.map(function(f,i){
    var tk=topKeyOf(f.scores);
    return '<div class="past-row" onclick="reopenField('+i+')">'
      +'<span class="pr-ic">'+E[tk].sym+'</span>'
      +'<span class="pr-body"><span class="pr-nm">'+escapeHtml(f.name||'這個局')+'</span>'
      +'<span class="pr-st">最吃『'+energyLabel(tk)+'』 · '+relTimeStr(f.ts)+'</span></span>'
      +'<span class="pr-arr">→</span></div>';
  }).join('');
  box.innerHTML='<h3>你測過的局</h3>'+rows;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function relTimeStr(ts){
  try{ var then=new Date(ts).getTime(); if(isNaN(then)) return '';
    var days=Math.floor((Date.now()-then)/86400000);
    if(days<=0) return '今天'; if(days===1) return '昨天';
    if(days<7) return days+' 天前'; if(days<30) return Math.floor(days/7)+' 週前';
    return Math.floor(days/30)+' 個月前';
  }catch(e){ return ''; }
}
function reopenField(i){
  var f=getFields()[i]; if(!f) return;
  fieldName=f.name||'這個局';
  showResult(f.scores, false); // false = 不再存檔（避免重複）
}

// ── Quiz ─────────────────────────────────────────────────
function startQuiz(){
  var nm=(document.getElementById('field-name').value||'').trim();
  fieldName=nm||'這個局';
  document.getElementById('cover').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  document.getElementById('fb-nm').textContent=fieldName;
  answers=new Array(QUESTIONS.length).fill(null);
  idx=0; renderQ();
  window.scrollTo(0,0);
}
function renderQ(){
  var q=QUESTIONS[idx];
  var n=QUESTIONS.length;
  document.getElementById('prog-label').textContent='第 '+(idx+1)+' / '+n+' 題';
  var pct=Math.round((idx)/n*100);
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('q-num').textContent='Q'+(idx+1);
  document.getElementById('q-text').textContent=q.t;
  var ow=document.getElementById('opts'); ow.innerHTML='';
  OPTS.forEach(function(o){
    var b=document.createElement('button');
    b.className='opt'+(answers[idx]===o.v?' sel':'');
    b.innerHTML='<span class="dot"></span>'+o.t;
    b.onclick=function(){ answers[idx]=o.v; advance(); };
    ow.appendChild(b);
  });
  document.getElementById('back-btn').disabled = idx===0;
}
function advance(){
  renderQ();
  if(idx<QUESTIONS.length-1){
    setTimeout(function(){ idx++; renderQ(); window.scrollTo(0,0); },180);
  } else {
    setTimeout(function(){ showResult(computeScores(), true); },200);
  }
}
function goBack(){ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} }

// ── Scoring：每能量兩題加總 /(2*3)*100 ──────────────────
function computeScores(){
  var raw={},cnt={};
  EKEYS.forEach(function(k){raw[k]=0;cnt[k]=0;});
  QUESTIONS.forEach(function(q,i){
    var v=answers[i]==null?0:answers[i];
    raw[q.k]+=v; cnt[q.k]++;
  });
  var sc={};
  EKEYS.forEach(function(k){ sc[k]=Math.round(raw[k]/(cnt[k]*3)*100); });
  return sc;
}

// ── Radar wheel（直接沿用 bagua-persona 的 buildRadar） ──
function buildRadar(sc,topKey,overlay){
  var cx=200,cy=200,baseR=140;
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-54 -46 508 500');
  [0.25,0.5,0.75,1].forEach(function(f){
    var pts=EKEYS.map(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      return (cx+ux*baseR*f)+','+(cy+uy*baseR*f);
    }).join(' ');
    var poly=document.createElementNS(NS,'polygon');
    poly.setAttribute('points',pts);
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke','var(--line)');
    poly.setAttribute('stroke-width',f===1?1.4:1);
    poly.setAttribute('opacity',f===1?0.9:0.5);
    svg.appendChild(poly);
  });
  EKEYS.forEach(function(k){
    var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
    var ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',cx);ln.setAttribute('y1',cy);
    ln.setAttribute('x2',cx+ux*baseR);ln.setAttribute('y2',cy+uy*baseR);
    ln.setAttribute('stroke','var(--line)');ln.setAttribute('stroke-width',1);ln.setAttribute('opacity',0.5);
    svg.appendChild(ln);
  });
  function rOf(s){return 30+(s/100)*110;}
  var sp=EKEYS.map(function(k){
    var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
    var r=rOf(sc[k]);
    return (cx+ux*r)+','+(cy+uy*r);
  }).join(' ');
  var area=document.createElementNS(NS,'polygon');
  area.setAttribute('points',sp);
  area.setAttribute('fill','rgba(53,97,79,.16)');
  area.setAttribute('stroke','var(--pine)');
  area.setAttribute('stroke-width',2);
  svg.appendChild(area);
  if(overlay){
    var np=EKEYS.map(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      var r=rOf(overlay[k]||0);
      return (cx+ux*r)+','+(cy+uy*r);
    }).join(' ');
    var narea=document.createElementNS(NS,'polygon');
    narea.setAttribute('points',np);
    narea.setAttribute('fill','rgba(169,130,59,.10)');
    narea.setAttribute('stroke','var(--gold)');
    narea.setAttribute('stroke-width',2);
    narea.setAttribute('stroke-dasharray','5 4');
    svg.appendChild(narea);
    EKEYS.forEach(function(k){
      var ux=(E[k].pos.x-cx)/baseR, uy=(E[k].pos.y-cy)/baseR;
      var r=rOf(overlay[k]||0);
      var nd=document.createElementNS(NS,'circle');
      nd.setAttribute('cx',cx+ux*r);nd.setAttribute('cy',cy+uy*r);
      nd.setAttribute('r',3.5);nd.setAttribute('fill','var(--gold)');nd.setAttribute('stroke','#fff');nd.setAttribute('stroke-width',1);
      svg.appendChild(nd);
    });
  }
  EKEYS.forEach(function(k){
    var b=E[k];
    var ux=(b.pos.x-cx)/baseR, uy=(b.pos.y-cy)/baseR;
    var r=rOf(sc[k]);
    var px=cx+ux*r, py=cy+uy*r;
    var dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',px);dot.setAttribute('cy',py);
    dot.setAttribute('r',k===topKey?7:5);
    dot.setAttribute('fill',W[b.wx]);
    dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width',1.5);
    svg.appendChild(dot);
    var lr=baseR+22;
    var lx=cx+ux*lr, ly=cy+uy*lr;
    var anchor = ux>0.35?'start':(ux<-0.35?'end':'middle');
    if(anchor==='start') lx+=2; else if(anchor==='end') lx-=2;
    ly += uy>0.35?12:(uy<-0.35?-6:4);
    var tx=document.createElementNS(NS,'text');
    tx.setAttribute('class','rlabel'+(k===topKey?' top':''));
    tx.setAttribute('x',lx);tx.setAttribute('y',ly);tx.setAttribute('text-anchor',anchor);
    tx.textContent=b.nm+'·'+b.fn.split('／')[0];
    svg.appendChild(tx);
    var ts=document.createElementNS(NS,'text');
    ts.setAttribute('class','rscore');
    ts.setAttribute('x',lx);ts.setAttribute('y',ly+13);ts.setAttribute('text-anchor',anchor);
    ts.textContent=sc[k];
    svg.appendChild(ts);
  });
  return svg;
}

// ════════════════════════════════════════════════════════════
//  你 × 局 分析
// ════════════════════════════════════════════════════════════

// ── 適配度：依 field 需求加權的覆蓋率 ───────────────────
function fitScore(you,field){
  var sw=0,sc=0;
  EKEYS.forEach(function(k){
    var fv=field[k]||0; var yv=you[k]||0;
    var coverage=Math.min(yv,fv)/Math.max(fv,1); // 0..1
    sw+=fv; sc+=fv*coverage;
  });
  return sw===0?0:Math.round(sc/sw*100);
}
function fitSentence(fit){
  if(fit>=70) return '你大致具備這個局要的能量——它要什麼，你身上多半有。上手不會太吃力。';
  if(fit>=45) return '你有它要的一部分，也有缺口——能做，但某些地方得多花力氣或找人補。';
  return '它要的能量你比較缺——不是做不來，而是要常常動用你不擅長的部分，要留意別硬撐。';
}

// ── 發揮點：field≥55 且 you≥55 ──────────────────────────
function shinePoints(you,field){
  return EKEYS.filter(function(k){ return (field[k]||0)>=55 && (you[k]||0)>=55; })
    .sort(function(a,b){ return (field[b]+you[b])-(field[a]+you[a]); });
}
// ── 消耗點：①硬撐弱項 field≥55 & you≤40　②強項閒置 you≥60 & field≤35 ──
function forcedWeak(you,field){
  return EKEYS.filter(function(k){ return (field[k]||0)>=55 && (you[k]||0)<=40; })
    .sort(function(a,b){ return (field[b]-you[b])-(field[a]-you[a]); });
}
function idleStrength(you,field){
  return EKEYS.filter(function(k){ return (you[k]||0)>=60 && (field[k]||0)<=35; })
    .sort(function(a,b){ return (you[b]-field[b])-(you[a]-field[a]); });
}

// ── 五行流向 ─────────────────────────────────────────────
var shengNext={wood:'fire',fire:'earth',earth:'metal',metal:'water',water:'wood'};
var keNext={wood:'earth',earth:'water',water:'fire',fire:'metal',metal:'wood'};
function topElement(sc){ return E[topKeyOf(sc)].wx; }
// 回 {type,text}；type: same | fieldKeYou | youKeField | fieldShengYou | youShengField
function elementFlow(fieldEl,youEl){
  if(fieldEl===youEl) return {type:'same',
    text:'這個局的主能量是「'+WLAB[fieldEl]+'」，你的主能量也是「'+WLAB[youEl]+'」——<b>同調</b>：好上手，但也容易和它一起偏。'};
  if(keNext[fieldEl]===youEl) return {type:'fieldKeYou',
    text:'這個局的「'+WLAB[fieldEl]+'」<span class="arrow">剋→</span>你的「'+WLAB[youEl]+'」：<b>這個局的調性會壓到你的主場，留意被消耗。</b>'};
  if(keNext[youEl]===fieldEl) return {type:'youKeField',
    text:'你的「'+WLAB[youEl]+'」<span class="arrow">剋→</span>這個局的「'+WLAB[fieldEl]+'」：<b>你的主能量能壓住這個局，你能主導它。</b>'};
  if(shengNext[fieldEl]===youEl) return {type:'fieldShengYou',
    text:'這個局的「'+WLAB[fieldEl]+'」<span class="arrow">生→</span>你的「'+WLAB[youEl]+'」：<b>這個局會滋養你，待在這裡你會長。</b>'};
  if(shengNext[youEl]===fieldEl) return {type:'youShengField',
    text:'你的「'+WLAB[youEl]+'」<span class="arrow">生→</span>這個局的「'+WLAB[fieldEl]+'」：<b>你會一直餵養這個局，小心過度付出。</b>'};
  return {type:'same',text:'你和這個局的主能量彼此呼應。'};
}

// ── Render result ────────────────────────────────────────
function showResult(fieldSc, doSave){
  var topK=topKeyOf(fieldSc);
  var top=E[topK];
  var accent=W[top.wx];
  var base=getBase();
  var you=base?base.scores:null;
  var nm=escapeHtml(fieldName);

  if(doSave){ saveField(fieldName, fieldSc); }

  var html=''
   +'<div class="share-hint">↓ 這是「'+nm+'」的能量盤 · 歡迎截圖</div>'
   +'<div class="typecard" style="--accent:'+accent+'">'
     +'<div class="tc-eyebrow">這個局最吃的能量</div>'
     +'<div class="tc-sym">'+top.sym+'</div>'
     +'<div class="tc-title">'+nm+'</div>'
     +'<div class="tc-essence">這個局最需要的是『<b>'+top.nm+'·'+top.fn+'</b>』。'
       +(you?'下面看它和你的底色合不合。':'測一下你的底色，就能看你和它合不合。')+'</div>'
   +'</div>'
   +'<div class="radar-wrap" id="radar-wrap"></div>'
   +'<div class="legend">'
     +'<span><i style="background:var(--pine)"></i>松綠＝這個局的需求</span>'
     +(you?'<span><i class="dash"></i>金虛線＝你的底色</span>':'')
   +'</div>';

  if(you){
    var fit=fitScore(you,fieldSc);
    var shine=shinePoints(you,fieldSc);
    var fw=forcedWeak(you,fieldSc);
    var idle=idleStrength(you,fieldSc);

    // 適配度
    html+='<div class="fit-card">'
      +'<div class="fc-num">'+fit+'%</div>'
      +'<div class="fc-lab">適配度 · 你 × 這個局</div>'
      +'<div class="fc-sub">'+fitSentence(fit)+'</div>'
    +'</div>';

    // 發揮點
    html+='<div class="block"><h3>✦ 你會在哪發光</h3>';
    if(shine.length){
      html+=shine.map(function(k){
        return '<div class="pt-line shine">這個局需要『<span class="em">'+energyLabel(k)+'</span>』，正是你的強項——你會發光。</div>';
      }).join('');
    } else {
      html+='<div class="pt-line">這個局要的能量裡，沒有特別落在你最強的那幾項——但也不代表你不行，只是得均勻使力、慢慢累積亮點。</div>';
    }
    html+='</div>';

    // 消耗點
    var drainLines=[];
    fw.forEach(function(k){
      drainLines.push('<div class="dn-line">這個局很吃『<b>'+energyLabel(k)+'</b>』，但那不是你慣用的——長期容易耗你。</div>');
    });
    idle.forEach(function(k){
      drainLines.push('<div class="dn-line">你的『<b>'+energyLabel(k)+'</b>』很強卻用不太到，可能會悶。</div>');
    });
    if(drainLines.length){
      html+='<div class="drain-note"><div class="dn-h">消耗訊號</div>'+drainLines.join('')+'</div>';
    } else {
      html+='<div class="drain-ok">沒看到明顯的消耗點——這個局要的，你大致接得住；你的強項也用得上，能量用起來算自然。</div>';
    }

    // 應對策略
    html+='<div class="block"><h3>🧭 應對策略</h3>';
    if(fw.length){
      fw.forEach(function(k){
        html+='<div class="strat-line">面對『<span class="em">'+energyLabel(k)+'</span>』：找人補位／刻意排恢復，別硬撐；用你的強項繞道完成。</div>';
      });
    }
    if(idle.length){
      idle.forEach(function(k){
        html+='<div class="strat-line">關於閒置的『<span class="em">'+energyLabel(k)+'</span>』：在這個局裡找地方發揮它，或到別處釋放它。</div>';
      });
    }
    if(!fw.length && !idle.length){
      html+='<div class="strat-line">你和這個局之間沒有明顯的拉扯——順著做就好，把你的強項放到它最需要的地方，會更省力。</div>';
    }
    html+='</div>';

    // 五行流向
    var flow=elementFlow(topElement(fieldSc), topElement(you));
    html+='<div class="block"><h3>五行能量流向</h3>'
      +'<div class="flowline">'+flow.text+'</div>'
      +'<div style="font-family:ui-sans-serif,sans-serif;font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7">'
        +'生未必是好（一直給也會洩）；剋未必是壞（適度的約束反而把人接住）。方向只是描述能量怎麼走。</div>'
    +'</div>';
  } else {
    html+='<div class="block"><h3>想看「你 × 這個局」？</h3>'
      +'<div class="nobase-note">你還沒測過<b>你的底色</b>——測了之後，這裡就會把你的底色疊在這個局上，'
      +'算出適配度、你會在哪發光、哪裡容易被它消耗。<br><br>'
      +'<a href="bagua-persona.html">去測你的底色 →</a></div></div>';
  }

  html+='<div class="resbtns">'
    +'<button class="cbtn" onclick="resetCover()">再測一個局</button>'
    +'<a class="cbtn ghost" href="bagua-persona.html">回人格測驗</a>'
  +'</div>'
  +'<div class="foot">這是幫你預想『你和這個局的能量合不合』的參考，不是吉凶判斷；'
    +'局可以適應、你也會成長。<br><br>八卦能量盤 · 練息場 Join to Enjoy</div>';

  var r=document.getElementById('result');
  r.innerHTML=html;
  document.getElementById('quiz').style.display='none';
  document.getElementById('cover').style.display='none';
  r.style.display='block';
  document.getElementById('radar-wrap').appendChild(buildRadar(fieldSc, topK, you));
  window.scrollTo(0,0);
}

function resetCover(){
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='none';
  document.getElementById('field-name').value='';
  document.getElementById('cover').style.display='block';
  renderCover();
  window.scrollTo(0,0);
}

renderCover();
</script>
