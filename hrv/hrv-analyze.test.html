<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>hrv-analyze tests</title>
<script src="hrv-analyze.js"></script>
</head>
<body>
<pre id="out">running...</pre>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
const lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
function assert(c, m){ if(!c) throw new Error(m || 'assert failed'); }
function eq(a, b, m){ if(a !== b) throw new Error((m||'eq') + ' got['+a+'] want['+b+']'); }
function near(a,b,tol,m){ if(Math.abs(a-b)>tol) throw new Error((m||'near')+' got '+a+' want '+b+'±'+tol); }
async function check(name, fn){
  try { await fn(); pass++; log('PASS ' + name); }
  catch (e){ fail++; log('FAIL ' + name + ' :: ' + (e && e.message || e)); }
}

// 合成 PPG：fs Hz、durSec 秒、bpm 心率的正弦（可加雜訊）
function synthPpg(bpm, durSec, fs, noise){
  fs=fs||30; durSec=durSec||20; noise=noise||0;
  var s=[], f=bpm/60, n=Math.round(durSec*fs);
  for(var i=0;i<n;i++){ var t=i*1000/fs; var v=Math.sin(2*Math.PI*f*t/1000) + (noise?(Math.random()-0.5)*noise:0); s.push({t:t,v:v}); }
  return s;
}
// 合成 PPG：開頭一個大暫態（手指安定的凹陷，幅度遠大於脈搏）＋穩定脈搏 —— 重現真機「波形開頭大凹陷」狀況
function synthArtifact(bpm, durSec, fs){
  fs=fs||30; var s=[], f=bpm/60, n=Math.round(durSec*fs);
  for(var i=0;i<n;i++){
    var t=i*1000/fs;
    var pulse=Math.sin(2*Math.PI*f*t/1000);
    var settle = t<1200 ? -7*Math.exp(-t/350) : 0;       // 開頭安定凹陷
    var spike = (t>3000 && t<3130) ? 9 : 0;              // 中途尖銳大正向動作雜訊 → 撐高全域最大值
    var noise=(Math.random()-0.5)*0.12;
    s.push({t:t, v: 50 + pulse + settle + spike + noise});
  }
  return s;
}

// 合成 PPG（含重搏切跡 dicrotic notch）：主收縮峰 + 主峰後一個較矮次波 → 重現真機「HR 被多算偏快」
function synthPpgNotch(bpm, durSec, fs){
  fs=fs||30; durSec=durSec||20; var s=[], n=Math.round(durSec*fs), per=60000/bpm;
  for(var i=0;i<n;i++){
    var t=i*1000/fs, ph=(t%per)/per;                       // 0..1 週期相位
    var main=Math.exp(-Math.pow((ph-0.15)/0.07,2));        // 主收縮峰
    var notch=0.6*Math.exp(-Math.pow((ph-0.50)/0.07,2));   // 重搏切跡（較矮、約 0.35 週期後 → 主峰後 ~350ms）
    s.push({t:t, v: main+notch});
  }
  return s;
}

async function run(){
  assert(typeof HrvAnalyze === 'object', 'HrvAnalyze 應載入');

  // === Task 1: 指標計算核心 ===
  await check('metricsFromRr：等距 RR → hr=60、rmssd=0、sdnn=0', async () => {
    const m = HrvAnalyze.metricsFromRr([1000,1000,1000,1000]);
    near(m.hr,60,0.01,'hr'); near(m.rmssd,0,0.01,'rmssd'); near(m.sdnn,0,0.01,'sdnn');
  });
  await check('metricsFromRr：交替 800/1200 → hr=60、rmssd=400、sdnn=200', async () => {
    const m = HrvAnalyze.metricsFromRr([800,1200,800,1200]);
    near(m.hr,60,0.01,'hr'); near(m.rmssd,400,0.01,'rmssd'); near(m.sdnn,200,0.01,'sdnn');
  });
  await check('cleanRr 偽差校正：漏拍倍長＋大跳動 RR 剔除，RMSSD 不被灌爆', async () => {
    var rr=[800,810,790,1600,805,795,800,810,1580,800]; // 中間兩個倍長(漏拍)
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.cleanRr(rr));
    assert(m.rmssd < 60, 'RMSSD 應落合理範圍（偽差移除），實得 '+m.rmssd);
    near(m.hr, 75, 10, 'hr 仍合理');
  });
  await check('classify：rmssd 高→放鬆、中→平衡、低→緊繃', async () => {
    eq(HrvAnalyze.classify({rmssd:60,hr:65}).state,'relaxed','高');
    eq(HrvAnalyze.classify({rmssd:35,hr:70}).state,'balanced','中');
    eq(HrvAnalyze.classify({rmssd:15,hr:80}).state,'tense','低');
    assert(HrvAnalyze.classify({rmssd:60,hr:65}).advice,'有建議文字');
  });

  // === Task 2: 脈搏偵測 + RR + 訊號品質 ===
  await check('detectBeats：60bpm 合成訊號 → hr≈60', async () => {
    var s=synthPpg(60,20,30,0.05);
    var beats=HrvAnalyze.detectBeats(s);
    var rr=HrvAnalyze.rrFromBeats(beats);
    var m=HrvAnalyze.metricsFromRr(rr);
    near(m.hr,60,4,'hr≈60');
  });
  await check('重搏切跡：60bpm 含次波 → 不被多算、hr≈60（防 HR 偏快）', async () => {
    var s=synthPpgNotch(60,20,30);
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(s)));
    near(m.hr,60,6,'hr 不應被切跡灌快，實得 '+Math.round(m.hr));
  });
  await check('重搏切跡 50bpm（切跡落在 380ms 之後）：動態不應期不被多算、hr≈50', async () => {
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(synthPpgNotch(50,24,30))));
    near(m.hr,50,6,'hr 不應被晚切跡灌快，實得 '+Math.round(m.hr));
  });
  await check('detectBeats：75bpm 合成訊號 → hr≈75', async () => {
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(synthPpg(75,20,30,0.05))));
    near(m.hr,75,5,'hr≈75');
  });
  await check('次幀內插：67bpm@30fps(不整除幀格) → RMSSD 不被量化灌大', async () => {
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(synthPpg(67,30,30,0))));
    near(m.hr,67,4,'hr≈67');
    assert(m.rmssd<15,'RMSSD 應因次幀內插而小(真值≈0)，無內插約 ~30ms；實得 '+Math.round(m.rmssd));
  });
  await check('rrFromBeats 偽差過濾：剔除超出 300-2000ms 的間隔', async () => {
    var beats=[0,1000,2000,2100,3100]; // 2000→2100=100ms（太短）應剔除
    var rr=HrvAnalyze.rrFromBeats(beats);
    assert(rr.indexOf(100)===-1,'100ms 被剔除');
  });
  await check('signalQuality：乾淨脈動→green、平坦雜訊→red', async () => {
    eq(HrvAnalyze.signalQuality(synthPpg(60,8,30,0.05)),'green','乾淨');
    var flat=[]; for(var i=0;i<240;i++) flat.push({t:i*33.3,v:(Math.random()-0.5)*0.02});
    eq(HrvAnalyze.signalQuality(flat),'red','平坦雜訊');
  });
  await check('開頭大擾動＋64bpm：仍偵測多數心跳、hr≈64、品質非紅（重現真機）', async () => {
    var s=synthArtifact(64,16,30);
    var beats=HrvAnalyze.detectBeats(s);
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(beats));
    assert(beats.length>=12, '應偵測 >=12 拍，實得 '+beats.length);
    near(m.hr,64,6,'hr≈64');
    assert(HrvAnalyze.signalQuality(s)!=='red','品質不應紅，實得 '+HrvAnalyze.signalQuality(s));
  });
  // 結尾一個大暫態（手指尾段移動）＋整段乾淨脈搏 —— 重現真機「beats 13/好脈搏卻 per=0 紅燈」
  function synthEndDrop(bpm,durSec,fs){
    fs=fs||60; var s=[], f=bpm/60, n=Math.round(durSec*fs);
    for(var i=0;i<n;i++){ var t=i*1000/fs; var pulse=Math.sin(2*Math.PI*f*t/1000);
      var drop=(i>n-8 && i<n-2)?-15:0; s.push({t:t, v:50+pulse+drop+(Math.random()-0.5)*0.1}); }
    return s;
  }
  await check('結尾大暫態＋乾淨脈搏：週期性穩健、品質非紅（重現真機 per=0 紅燈）', async () => {
    var s=synthEndDrop(74,12,60);
    assert(HrvAnalyze.signalQuality(s)!=='red','品質不應紅，實得 '+HrvAnalyze.signalQuality(s));
  });
  // 長錄音、振幅由弱漸強 —— 重現真機「2分鐘進階量測，全域門檻漏掉弱段心跳→被把關擋下」
  function synthLong(bpm, durSec, fs){
    fs=fs||30; var s=[], f=bpm/60, n=Math.round(fs*durSec);
    for(var i=0;i<n;i++){ var t=i*1000/fs; var amp=0.3+0.7*(i/n); s.push({t:t, v:50+amp*Math.sin(2*Math.PI*f*t/1000)+(Math.random()-0.5)*0.08}); }
    return s;
  }
  await check('detectBeatsWindowed：長錄音變幅下偵測到多數心跳（多於單次全域門檻）', async () => {
    var s=synthLong(67,80,30);
    var single=HrvAnalyze.detectBeats(s).length;
    var win=HrvAnalyze.detectBeatsWindowed(s,30).length;
    assert(win>=single, 'windowed 不少於單次（win='+win+' single='+single+'）');
    assert(win>=70, 'windowed 應抓到多數心跳（80s×67bpm≈89），實得 '+win);
  });
  await check('cleanRrGentle：去粗大偽差但保留逐拍變異（頻域用）', async () => {
    var rr=[800,950,820,1600,900,780,1580,850]; // 1600/1580 為漏拍倍長
    var g=HrvAnalyze.cleanRrGentle(rr);
    assert(g.indexOf(1600)===-1 && g.indexOf(1580)===-1, '倍長被剔除');
    assert(g.length>=5, '保留多數變異（未被連續差濾掉），實得 '+g.length);
  });
  // 混合錄音：好時段(脈搏)＋壞時段(雜訊) —— 驗證只收好時段、壞時段不污染 HR
  function synthMixed(){
    var s=[], fs=30, f=67/60;
    for(var i=0;i<fs*60;i++){ var t=i*1000/fs;
      var v=(t>=30000&&t<45000) ? 50+(Math.random()-0.5)*0.05 : 50+Math.sin(2*Math.PI*f*t/1000)+(Math.random()-0.5)*0.08;
      s.push({t:t,v:v}); }
    return s;
  }
  await check('rrFromGoodWindows：只收好時段心跳、壞時段丟掉、HR 不被污染', async () => {
    var gw=HrvAnalyze.rrFromGoodWindows(synthMixed(), 15);
    assert(gw.good>=2, '應有好時段，實得 good='+gw.good);
    assert(gw.bad>=1, '應偵測壞時段，實得 bad='+gw.bad);
    var sum=0; for(var i=0;i<gw.rr.length;i++) sum+=gw.rr[i];
    var hr=gw.rr.length?60000/(sum/gw.rr.length):0;
    near(hr, 67, 9, '好時段聚合 HR 合理，實得 '+Math.round(hr));
  });

  // 頻域用「最長連續好窗」：不跨壞窗拼接（拼接會在 tachogram 接縫注入假低頻、污染 LF）
  function synthSplit(){   // 乾淨45s | 雜訊30s | 乾淨45s（窗界對齊；兩段乾淨各 45s）
    var s=[], fs=30, f=66/60;
    for(var i=0;i<fs*120;i++){ var t=i*1000/fs; var bad=(t>=45000&&t<75000);
      var v=bad ? 50+(Math.random()-0.5)*0.03 : 50+Math.sin(2*Math.PI*f*t/1000)+(Math.random()-0.5)*0.06;
      s.push({t:t,v:v}); }
    return s;
  }
  await check('rrFromLongestGoodRun：只取最長連續段、不跨壞窗拼接', async () => {
    var sig=synthSplit();
    var run=HrvAnalyze.rrFromLongestGoodRun(sig, 15);
    var gw=HrvAnalyze.rrFromGoodWindows(sig, 15);
    var stitched=0; for(var i=0;i<gw.rr.length;i++) stitched+=gw.rr[i];
    assert(run.spanMs>0, '應找到連續好段，實得 spanMs='+Math.round(run.spanMs));
    assert(run.bad>=1, '中間雜訊應中斷連續段，實得 bad='+run.bad);
    assert(run.spanMs < stitched, '最長段('+Math.round(run.spanMs)+') 應短於拼接好窗總和('+Math.round(stitched)+')，證明未跨壞窗拼接');
  });

  await check('coverageScore：手指蓋住鏡頭→高分、沒蓋/邊緣漏景/近黑→低分', async () => {
    var C=HrvAnalyze.coverageScore;
    assert(C(200,40,0.08) >= 0.8, '覆蓋+閃光燈應高分，實得 '+C(200,40,0.08).toFixed(2));
    assert(C(70,30,0.15)  >= 0.55,'覆蓋無燈微暗應過門檻，實得 '+C(70,30,0.15).toFixed(2));
    assert(C(120,110,0.5) <  0.4, '室內場景(沒蓋)應低分，實得 '+C(120,110,0.5).toFixed(2));
    assert(C(10,8,0.4)    <  0.4, '近黑(暗房沒蓋)應低分，實得 '+C(10,8,0.4).toFixed(2));
    assert(C(90,70,0.35)  <  0.4, '部分蓋到邊緣漏景應低分，實得 '+C(90,70,0.35).toFixed(2));
    // 可傳入 cfg 覆寫門檻：更嚴的 rg 端點 → 同一輸入分數更低（證明集中設定生效）
    var strict={ rgLo:2, rgHi:3, cvHi:0.30, cvLo:0.10, brLo:20, brHi:60, wRg:0.45, wUni:0.40, wBr:0.15, min:0.6 };
    assert(C(70,30,0.15,strict) < C(70,30,0.15), 'cfg 覆寫應改變分數');
    assert(typeof HrvAnalyze.COV_CFG.min==='number', 'COV_CFG.min 應可讀（集中門檻）');
  });

  // === 準確度：已知 RR → 相機式 PPG（出幀抖動＋重複幀）→ 完整結果頁管線 ===
  // 固定種子 PRNG，測試可重現
  function rng(seed){ var s=seed>>>0; return function(){ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
  function gauss(R){ var u=R()||1e-9, v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function rmssdOf(rr){ var sq=0; for(var i=1;i<rr.length;i++){ var d=rr[i]-rr[i-1]; sq+=d*d; } return Math.sqrt(sq/(rr.length-1)); }
  function meanOf(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
  // 平均 800ms、逐拍獨立高斯，再把偏差縮放到 RMSSD 恰為 target（預設 40ms）
  function makeRr(n, R, target){
    target=target||40; var dev=[]; for(var i=0;i<n;i++) dev.push(28*gauss(R));
    var k=target/rmssdOf(dev); return dev.map(function(d){ return 800+d*k; });
  }
  // 由 RR 產生 PPG 並模擬相機取樣：fs 標稱 30；記錄時間＝真實出幀時間＋U(±jit)ms；
  // dupP 機率重複上一張影格（值相同、時間戳是新的，＝rAF 重複讀到同一幀）。
  // opt.redSat：紅通道飽和（平頂 254.5＋雜訊、無脈搏），只有綠通道有脈搏。
  function synthCam(rr, R, opt){
    opt=opt||{}; var fs=30, jit=opt.jit==null?3:opt.jit, dupP=opt.dupP==null?0.1:opt.dupP;
    var beats=[], tb=600; for(var i=0;i<rr.length;i++){ beats.push(tb); tb+=rr[i]; } beats.push(tb);
    var dur=tb+600, out=[], prev=null, j0=0;
    for(var k=0; k*1000/fs<dur; k++){
      var tt=k*1000/fs, p=0;
      while(j0<beats.length-1 && beats[j0]<tt-1200) j0++;
      for(var j=j0;j<beats.length && beats[j]<tt+400;j++){
        var dt=tt-beats[j];
        p+=Math.exp(-Math.pow(dt/70,2)) + 0.35*Math.exp(-Math.pow((dt-320)/90,2)); // 收縮峰＋重搏波
      }
      var drift=2*Math.sin(2*Math.PI*0.07*tt/1000);                                    // 慢漂移（壓力/呼吸）
      var red=opt.redSat ? 254.5+(R()-0.5)*1.0 : 150+drift+3*p+(R()-0.5)*0.15;
      var green=60+drift*0.5+1.5*p+(R()-0.5)*0.15;
      var trec=tt+(R()*2-1)*jit;
      if(prev && R()<dupP) out.push({ t:trec, v:prev.v, g:prev.g });                  // 重複幀
      else { prev={ t:trec, v:red, g:green }; out.push(prev); }
    }
    for(var z=1;z<out.length;z++){ if(out[z].t<=out[z-1].t) out[z].t=out[z-1].t+0.5; } // 抖動不致時間倒退
    return { samples:out, beats:beats };
  }
  // 與 index.html 結果頁相同的管線：去重複幀 → 選通道 → 標記版好窗 → metricsFromMarked
  function pipeline(raw){
    var A=HrvAnalyze, ded=A.dropDuplicateFrames(raw), ch=A.pickChannel(ded);
    var mk=A.rrMarkedFromGoodWindows(ch.samples,15);
    return { ch:ch, ded:ded, mk:mk, m:A.metricsFromMarked(mk.rr, mk.valid) };
  }
  function oldPipeline(raw){ var A=HrvAnalyze, gw=A.rrFromGoodWindows(raw,15); return A.metricsFromRr(A.cleanRr(gw.rr)); }

  await check('準確度：已知 RR（800ms/RMSSD≈40）＋±3ms 抖動＋10% 重複幀 → 拍數±1、HR±1、RMSSD±3', async () => {
    var R=rng(12345), rr=makeRr(150,R), truth=rmssdOf(rr), hrTrue=60000/meanOf(rr);
    var sy=synthCam(rr,R), res=pipeline(sy.samples);
    eq(res.ch.channel,'r','未飽和應選紅');
    // 拍數：detectBeats 會修掉開頭 1.5 秒 → 真值只數修剪後到結尾前的拍
    var d=HrvAnalyze.detectBeats(res.ch.samples), t0=res.ch.samples[0].t, tE=res.ch.samples[res.ch.samples.length-1].t;
    var nTrue=sy.beats.filter(function(b){ return b>=t0+1500 && b<=tE; }).length;
    var old=oldPipeline(HrvAnalyze.dropDuplicateFrames(sy.samples));
    log('    真值 RMSSD '+truth.toFixed(1)+' HR '+hrTrue.toFixed(1)+' 拍 '+nTrue+
        ' | 新 RMSSD '+res.m.rmssd.toFixed(1)+' HR '+res.m.hr.toFixed(1)+' 拍 '+d.length+' art '+(res.m.artifactRate*100).toFixed(1)+'% pairs '+res.m.pairs+
        ' | 舊管線 RMSSD '+old.rmssd.toFixed(1));
    assert(Math.abs(d.length-nTrue)<=1, '拍數誤差應 ≤1：偵測 '+d.length+' 真值 '+nTrue);
    near(res.m.hr, hrTrue, 1, 'HR');
    near(res.m.rmssd, truth, 3, 'RMSSD');
  });
  await check('準確度：RR 中插入 2 個漏拍（倍長間隔）→ RMSSD±5、artifactRate>0', async () => {
    var R=rng(777), base=makeRr(152,R), truth=rmssdOf(base);
    var rr=base.slice(); rr.splice(100,2,rr[100]+rr[101]); rr.splice(40,2,rr[40]+rr[41]); // 兩處兩拍併一拍
    var sy=synthCam(rr,R), res=pipeline(sy.samples);
    var old=oldPipeline(HrvAnalyze.dropDuplicateFrames(sy.samples));
    log('    真值 RMSSD '+truth.toFixed(1)+' | 新 RMSSD '+res.m.rmssd.toFixed(1)+' art '+(res.m.artifactRate*100).toFixed(1)+'% pairs '+res.m.pairs+' | 舊管線 RMSSD '+old.rmssd.toFixed(1));
    near(res.m.rmssd, truth, 5, 'RMSSD');
    assert(res.m.artifactRate>0, 'artifactRate 應 >0，實得 '+res.m.artifactRate);
  });
  await check('pickChannel：紅光飽和（平坦＋雜訊）、綠光有脈搏 → 選 g', async () => {
    var R=rng(4242), rr=makeRr(40,R), sy=synthCam(rr,R,{redSat:true});
    var ch=HrvAnalyze.pickChannel(HrvAnalyze.dropDuplicateFrames(sy.samples));
    log('    scoreR '+ch.scoreR.toFixed(2)+' scoreG '+ch.scoreG.toFixed(2));
    eq(ch.channel,'g','應選綠');
    assert(ch.samples.length && ch.samples[0].v>50 && ch.samples[0].v<80, '回傳的 v 應為綠通道值');
  });
  await check('pickChannel：兩通道都好（分數相近）→ 選 r', async () => {
    var R=rng(99), sy=synthCam(makeRr(40,R),R,{dupP:0});
    eq(HrvAnalyze.pickChannel(sy.samples).channel,'r');
  });
  await check('markRr/metricsFromMarked：漏拍標無效、RMSSD 只算相鄰皆有效的連續差', async () => {
    var beats=[0,800,1620,3220,4030,4830,5640]; // 第 3 個間隔 1600＝漏拍
    var mk=HrvAnalyze.markRr(beats);
    eq(mk.rr.length,6,'rr 長度保留'); eq(mk.valid[2],false,'倍長應無效');
    var m=HrvAnalyze.metricsFromMarked(mk.rr, mk.valid);
    eq(m.n,5,'有效數'); eq(m.pairs,3,'跨漏拍的兩組連續差不算');
    near(m.artifactRate,1/6,1e-9,'artifactRate');
    near(m.rmssd, Math.sqrt((20*20+10*10+10*10)/3), 1e-9, 'RMSSD');
  });
  await check('metricsFromMarked：NaN 斷點切斷相鄰但不算偽差', async () => {
    var m=HrvAnalyze.metricsFromMarked([800,820,NaN,900,880],[true,true,false,true,true]);
    eq(m.pairs,2); eq(m.artifactRate,0); eq(m.n,4);
  });
  await check('interpolateMarked：無效間隔以前後有效值線性內插、兩端取最近值', async () => {
    var out=HrvAnalyze.interpolateMarked([1600,800,1600,1000,300],[false,true,false,true,false]);
    eq(out.join(','),'800,800,900,1000,1000');
  });
  await check('markRr：錨點偏掉時連續 3 次擋下後重新起錨，不整串誤殺', async () => {
    var rr=[1000]; for(var i=0;i<20;i++) rr.push(800); // 首拍偏長（仍在中位數 ±30% 內）
    var beats=[0]; rr.forEach(function(x){ beats.push(beats[beats.length-1]+x); });
    var m=HrvAnalyze.metricsFromMarked.apply(null,(function(k){ return [k.rr,k.valid]; })(HrvAnalyze.markRr(beats)));
    assert(m.n>=17, '應保留大部分 800ms 間隔，實得有效 '+m.n);
  });
  await check('dropDuplicateFrames：值完全相同或時間不遞增的幀被丟棄', async () => {
    var s=[{t:0,v:1,g:2},{t:33,v:1,g:2},{t:66,v:1.1,g:2},{t:60,v:3,g:3},{t:99,v:1.1,g:2.1}];
    eq(HrvAnalyze.dropDuplicateFrames(s).map(function(x){return x.t;}).join(','),'0,66,99');
  });

  log('---'); log('DONE pass=' + pass + ' fail=' + fail);
  document.title = fail ? ('FAIL ' + fail) : 'OK';
  window.__done = true;
  try { await fetch('/__result', { method: 'POST', body: lines.join('\n') }); } catch (e) {}
}
window.__done = false;
run();
</script>
