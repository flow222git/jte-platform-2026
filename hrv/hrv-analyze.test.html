<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>hrv-analyze tests</title>
<script src="hrv-analyze.js"></script>
</head>
<body>
<pre id="out">running...</pre>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
const lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
function assert(c, m){ if(!c) throw new Error(m || 'assert failed'); }
function eq(a, b, m){ if(a !== b) throw new Error((m||'eq') + ' got['+a+'] want['+b+']'); }
function near(a,b,tol,m){ if(Math.abs(a-b)>tol) throw new Error((m||'near')+' got '+a+' want '+b+'±'+tol); }
async function check(name, fn){
  try { await fn(); pass++; log('PASS ' + name); }
  catch (e){ fail++; log('FAIL ' + name + ' :: ' + (e && e.message || e)); }
}

// 合成 PPG：fs Hz、durSec 秒、bpm 心率的正弦（可加雜訊）
function synthPpg(bpm, durSec, fs, noise){
  fs=fs||30; durSec=durSec||20; noise=noise||0;
  var s=[], f=bpm/60, n=Math.round(durSec*fs);
  for(var i=0;i<n;i++){ var t=i*1000/fs; var v=Math.sin(2*Math.PI*f*t/1000) + (noise?(Math.random()-0.5)*noise:0); s.push({t:t,v:v}); }
  return s;
}
// 合成 PPG：開頭一個大暫態（手指安定的凹陷，幅度遠大於脈搏）＋穩定脈搏 —— 重現真機「波形開頭大凹陷」狀況
function synthArtifact(bpm, durSec, fs){
  fs=fs||30; var s=[], f=bpm/60, n=Math.round(durSec*fs);
  for(var i=0;i<n;i++){
    var t=i*1000/fs;
    var pulse=Math.sin(2*Math.PI*f*t/1000);
    var settle = t<1200 ? -7*Math.exp(-t/350) : 0;       // 開頭安定凹陷
    var spike = (t>3000 && t<3130) ? 9 : 0;              // 中途尖銳大正向動作雜訊 → 撐高全域最大值
    var noise=(Math.random()-0.5)*0.12;
    s.push({t:t, v: 50 + pulse + settle + spike + noise});
  }
  return s;
}

// 合成 PPG（含重搏切跡 dicrotic notch）：主收縮峰 + 主峰後一個較矮次波 → 重現真機「HR 被多算偏快」
function synthPpgNotch(bpm, durSec, fs){
  fs=fs||30; durSec=durSec||20; var s=[], n=Math.round(durSec*fs), per=60000/bpm;
  for(var i=0;i<n;i++){
    var t=i*1000/fs, ph=(t%per)/per;                       // 0..1 週期相位
    var main=Math.exp(-Math.pow((ph-0.15)/0.07,2));        // 主收縮峰
    var notch=0.6*Math.exp(-Math.pow((ph-0.50)/0.07,2));   // 重搏切跡（較矮、約 0.35 週期後 → 主峰後 ~350ms）
    s.push({t:t, v: main+notch});
  }
  return s;
}

async function run(){
  assert(typeof HrvAnalyze === 'object', 'HrvAnalyze 應載入');

  // === Task 1: 指標計算核心 ===
  await check('metricsFromRr：等距 RR → hr=60、rmssd=0、sdnn=0', async () => {
    const m = HrvAnalyze.metricsFromRr([1000,1000,1000,1000]);
    near(m.hr,60,0.01,'hr'); near(m.rmssd,0,0.01,'rmssd'); near(m.sdnn,0,0.01,'sdnn');
  });
  await check('metricsFromRr：交替 800/1200 → hr=60、rmssd=400、sdnn=200', async () => {
    const m = HrvAnalyze.metricsFromRr([800,1200,800,1200]);
    near(m.hr,60,0.01,'hr'); near(m.rmssd,400,0.01,'rmssd'); near(m.sdnn,200,0.01,'sdnn');
  });
  await check('cleanRr 偽差校正：漏拍倍長＋大跳動 RR 剔除，RMSSD 不被灌爆', async () => {
    var rr=[800,810,790,1600,805,795,800,810,1580,800]; // 中間兩個倍長(漏拍)
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.cleanRr(rr));
    assert(m.rmssd < 60, 'RMSSD 應落合理範圍（偽差移除），實得 '+m.rmssd);
    near(m.hr, 75, 10, 'hr 仍合理');
  });
  await check('classify：rmssd 高→放鬆、中→平衡、低→緊繃', async () => {
    eq(HrvAnalyze.classify({rmssd:60,hr:65}).state,'relaxed','高');
    eq(HrvAnalyze.classify({rmssd:35,hr:70}).state,'balanced','中');
    eq(HrvAnalyze.classify({rmssd:15,hr:80}).state,'tense','低');
    assert(HrvAnalyze.classify({rmssd:60,hr:65}).advice,'有建議文字');
  });

  // === Task 2: 脈搏偵測 + RR + 訊號品質 ===
  await check('detectBeats：60bpm 合成訊號 → hr≈60', async () => {
    var s=synthPpg(60,20,30,0.05);
    var beats=HrvAnalyze.detectBeats(s);
    var rr=HrvAnalyze.rrFromBeats(beats);
    var m=HrvAnalyze.metricsFromRr(rr);
    near(m.hr,60,4,'hr≈60');
  });
  await check('重搏切跡：60bpm 含次波 → 不被多算、hr≈60（防 HR 偏快）', async () => {
    var s=synthPpgNotch(60,20,30);
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(s)));
    near(m.hr,60,6,'hr 不應被切跡灌快，實得 '+Math.round(m.hr));
  });
  await check('重搏切跡 50bpm（切跡落在 380ms 之後）：動態不應期不被多算、hr≈50', async () => {
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(synthPpgNotch(50,24,30))));
    near(m.hr,50,6,'hr 不應被晚切跡灌快，實得 '+Math.round(m.hr));
  });
  await check('detectBeats：75bpm 合成訊號 → hr≈75', async () => {
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(synthPpg(75,20,30,0.05))));
    near(m.hr,75,5,'hr≈75');
  });
  await check('次幀內插：67bpm@30fps(不整除幀格) → RMSSD 不被量化灌大', async () => {
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(HrvAnalyze.detectBeats(synthPpg(67,30,30,0))));
    near(m.hr,67,4,'hr≈67');
    assert(m.rmssd<15,'RMSSD 應因次幀內插而小(真值≈0)，無內插約 ~30ms；實得 '+Math.round(m.rmssd));
  });
  await check('rrFromBeats 偽差過濾：剔除超出 300-2000ms 的間隔', async () => {
    var beats=[0,1000,2000,2100,3100]; // 2000→2100=100ms（太短）應剔除
    var rr=HrvAnalyze.rrFromBeats(beats);
    assert(rr.indexOf(100)===-1,'100ms 被剔除');
  });
  await check('signalQuality：乾淨脈動→green、平坦雜訊→red', async () => {
    eq(HrvAnalyze.signalQuality(synthPpg(60,8,30,0.05)),'green','乾淨');
    var flat=[]; for(var i=0;i<240;i++) flat.push({t:i*33.3,v:(Math.random()-0.5)*0.02});
    eq(HrvAnalyze.signalQuality(flat),'red','平坦雜訊');
  });
  await check('開頭大擾動＋64bpm：仍偵測多數心跳、hr≈64、品質非紅（重現真機）', async () => {
    var s=synthArtifact(64,16,30);
    var beats=HrvAnalyze.detectBeats(s);
    var m=HrvAnalyze.metricsFromRr(HrvAnalyze.rrFromBeats(beats));
    assert(beats.length>=12, '應偵測 >=12 拍，實得 '+beats.length);
    near(m.hr,64,6,'hr≈64');
    assert(HrvAnalyze.signalQuality(s)!=='red','品質不應紅，實得 '+HrvAnalyze.signalQuality(s));
  });
  // 結尾一個大暫態（手指尾段移動）＋整段乾淨脈搏 —— 重現真機「beats 13/好脈搏卻 per=0 紅燈」
  function synthEndDrop(bpm,durSec,fs){
    fs=fs||60; var s=[], f=bpm/60, n=Math.round(durSec*fs);
    for(var i=0;i<n;i++){ var t=i*1000/fs; var pulse=Math.sin(2*Math.PI*f*t/1000);
      var drop=(i>n-8 && i<n-2)?-15:0; s.push({t:t, v:50+pulse+drop+(Math.random()-0.5)*0.1}); }
    return s;
  }
  await check('結尾大暫態＋乾淨脈搏：週期性穩健、品質非紅（重現真機 per=0 紅燈）', async () => {
    var s=synthEndDrop(74,12,60);
    assert(HrvAnalyze.signalQuality(s)!=='red','品質不應紅，實得 '+HrvAnalyze.signalQuality(s));
  });
  // 長錄音、振幅由弱漸強 —— 重現真機「2分鐘進階量測，全域門檻漏掉弱段心跳→被把關擋下」
  function synthLong(bpm, durSec, fs){
    fs=fs||30; var s=[], f=bpm/60, n=Math.round(fs*durSec);
    for(var i=0;i<n;i++){ var t=i*1000/fs; var amp=0.3+0.7*(i/n); s.push({t:t, v:50+amp*Math.sin(2*Math.PI*f*t/1000)+(Math.random()-0.5)*0.08}); }
    return s;
  }
  await check('detectBeatsWindowed：長錄音變幅下偵測到多數心跳（多於單次全域門檻）', async () => {
    var s=synthLong(67,80,30);
    var single=HrvAnalyze.detectBeats(s).length;
    var win=HrvAnalyze.detectBeatsWindowed(s,30).length;
    assert(win>=single, 'windowed 不少於單次（win='+win+' single='+single+'）');
    assert(win>=70, 'windowed 應抓到多數心跳（80s×67bpm≈89），實得 '+win);
  });
  await check('cleanRrGentle：去粗大偽差但保留逐拍變異（頻域用）', async () => {
    var rr=[800,950,820,1600,900,780,1580,850]; // 1600/1580 為漏拍倍長
    var g=HrvAnalyze.cleanRrGentle(rr);
    assert(g.indexOf(1600)===-1 && g.indexOf(1580)===-1, '倍長被剔除');
    assert(g.length>=5, '保留多數變異（未被連續差濾掉），實得 '+g.length);
  });
  // 混合錄音：好時段(脈搏)＋壞時段(雜訊) —— 驗證只收好時段、壞時段不污染 HR
  function synthMixed(){
    var s=[], fs=30, f=67/60;
    for(var i=0;i<fs*60;i++){ var t=i*1000/fs;
      var v=(t>=30000&&t<45000) ? 50+(Math.random()-0.5)*0.05 : 50+Math.sin(2*Math.PI*f*t/1000)+(Math.random()-0.5)*0.08;
      s.push({t:t,v:v}); }
    return s;
  }
  await check('rrFromGoodWindows：只收好時段心跳、壞時段丟掉、HR 不被污染', async () => {
    var gw=HrvAnalyze.rrFromGoodWindows(synthMixed(), 15);
    assert(gw.good>=2, '應有好時段，實得 good='+gw.good);
    assert(gw.bad>=1, '應偵測壞時段，實得 bad='+gw.bad);
    var sum=0; for(var i=0;i<gw.rr.length;i++) sum+=gw.rr[i];
    var hr=gw.rr.length?60000/(sum/gw.rr.length):0;
    near(hr, 67, 9, '好時段聚合 HR 合理，實得 '+Math.round(hr));
  });

  log('---'); log('DONE pass=' + pass + ' fail=' + fail);
  document.title = fail ? ('FAIL ' + fail) : 'OK';
  window.__done = true;
  try { await fetch('/__result', { method: 'POST', body: lines.join('\n') }); } catch (e) {}
}
window.__done = false;
run();
</script>
</body></html>
