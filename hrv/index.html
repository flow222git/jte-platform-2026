<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>心率變異 HRV · 練息場</title>
<meta name="description" content="手指輕貼後鏡頭，約一分鐘，用相機量心率與心率變異（HRV），看看身體現在偏放鬆還是緊繃。健康參考，非醫療診斷。">
<meta property="og:title" content="心率變異 HRV · 練息場">
<meta property="og:description" content="手指貼鏡頭，一分鐘量身體狀態。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<!-- 登入＋記錄：沿用練息場平台的 Google 登入 + Firebase/Firestore -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#23252b; --ink-soft:#5b6270; --ink-faint:#8a93a3;
    --paper:#f4f6fa; --card:#ffffff; --line:#e3e8f0;
    --accent:#003D7C; --accent-soft:#eaf0f7;
    --relaxed:#2e8b57; --relaxed-soft:#e6f3ec;
    --balanced:#b8860b; --balanced-soft:#fbf2dd;
    --tense:#c2631f; --tense-soft:#fbeede;
    --green:#2e8b57; --yellow:#c9a227; --red:#c0392b;
    --radius:16px; --maxw:560px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;
    font-weight:300;line-height:1.7;letter-spacing:.01em;padding:0 18px env(safe-area-inset-bottom)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:54px 0 130px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .logo{font-family:"Noto Serif TC",serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--accent)}
  .sub{font-size:11px;color:var(--ink-faint);letter-spacing:.18em}
  .tagline{font-size:13px;color:var(--ink-soft);margin:0 0 24px;line-height:1.6}
  .step{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .lead{font-size:14px;color:var(--ink-soft);line-height:1.8;margin:0 0 18px}
  .home-link{display:inline-block;background:none;border:none;color:var(--ink-faint);font-family:inherit;font-size:13px;cursor:pointer;padding:0 0 12px}
  .home-link:active{color:var(--accent)}

  .btn{border:none;border-radius:999px;padding:15px;font-family:"Noto Sans TC",sans-serif;font-weight:700;
    font-size:15.5px;letter-spacing:.04em;cursor:pointer;transition:.18s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:disabled{background:var(--line);color:var(--ink-faint);cursor:not-allowed}
  .btn-primary:active:not(:disabled){transform:scale(.98)}
  .btn-ghost{background:none;border:none;color:var(--ink-faint);font-size:14px;cursor:pointer;padding:15px 4px;font-family:inherit}

  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 72%,transparent)}
  .bar-inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;align-items:center}
  .bar-inner .btn{flex:1}
  .bar-inner .btn-ghost{flex:none}

  /* —— 說明卡 —— */
  .guide-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,61,124,.04)}
  .guide-card h3{font-family:"Noto Serif TC",serif;font-weight:500;font-size:15px;margin:0 0 10px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .guide-list{list-style:none;margin:0;padding:0}
  .guide-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7;color:var(--ink-soft);margin-bottom:9px}
  .guide-list li:last-child{margin-bottom:0}
  .guide-list i{color:var(--accent);font-size:18px;flex:none;margin-top:2px}

  /* —— 量測 —— */
  .cam-stage{position:relative;background:#11151c;border-radius:var(--radius);overflow:hidden;margin-bottom:16px;aspect-ratio:1/1;max-height:42vh;display:flex;align-items:center;justify-content:center}
  .cam-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25}
  .cam-overlay{position:relative;z-index:2;text-align:center;color:#fff;padding:18px}
  .ring{position:relative;width:120px;height:120px;margin:0 auto 12px}
  .ring svg{transform:rotate(-90deg)}
  .ring .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .ring-num .n{font-family:"Noto Serif TC",serif;font-size:34px;font-weight:700;line-height:1}
  .ring .ring-num .u{font-size:10px;letter-spacing:.1em;opacity:.8;margin-top:2px}
  .quality{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border-radius:999px;padding:7px 14px;font-size:13px}
  .qdot{width:11px;height:11px;border-radius:50%;background:var(--red);transition:.3s;box-shadow:0 0 0 0 rgba(255,255,255,.0)}
  .qdot.green{background:var(--green)} .qdot.yellow{background:var(--yellow)} .qdot.red{background:var(--red)}
  .hr-live{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:14px}
  .hr-live .hb{font-size:18px;color:#ff6b81}
  .hr-live .v{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:700}
  .hr-live .u{font-size:12px;opacity:.8}
  .wave-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 6px;margin-bottom:14px}
  .wave-card canvas{width:100%;height:70px;display:block}
  .cam-hint{font-size:13px;color:var(--ink-soft);line-height:1.7;text-align:center;margin:0 0 4px;min-height:2.6em}
  .cam-hint.warn{color:var(--tense)}

  .err-card{background:var(--tense-soft);border:1px solid var(--tense);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .err-card h3{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--tense);margin:0 0 8px}
  .err-card p{font-size:13.5px;color:var(--ink);line-height:1.75;margin:0}

  .disclaimer{font-size:11.5px;color:var(--ink-faint);text-align:center;margin:18px 0 0;line-height:1.7;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

  /* —— 結果頁 —— */
  .state-card{color:#fff;border-radius:var(--radius);padding:24px 22px;margin-bottom:16px}
  .state-card.s-relaxed{background:var(--relaxed)} .state-card.s-balanced{background:var(--balanced)} .state-card.s-tense{background:var(--tense)}
  .state-card .lab{font-size:11.5px;letter-spacing:.18em;opacity:.85;margin-bottom:10px}
  .state-card .big{font-family:"Noto Serif TC",serif;font-size:38px;font-weight:700;line-height:1.1}
  .state-card .adv{font-size:14px;line-height:1.8;margin-top:10px;opacity:.97}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .panel h3{font-family:"Noto Serif TC",serif;font-weight:500;font-size:15px;margin:0 0 10px;color:var(--accent)}
  .metric-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
  .metric-row:last-child{border-bottom:none}
  .metric-row .mt{color:var(--ink-soft)} .metric-row .mt small{color:var(--ink-faint);font-size:11px}
  .metric-row .mv{font-family:"Noto Serif TC",serif;color:var(--accent);font-weight:500;font-size:16px}
  details.metrics summary{cursor:pointer;color:var(--accent);font-size:13.5px;padding:6px 0;list-style:none}
  details.metrics summary::-webkit-details-marker{display:none}
  details.metrics summary::before{content:'▸ ';}
  details.metrics[open] summary::before{content:'▾ ';}

  /* —— 細項等級膠囊（恢復力／平靜）—— */
  .idx-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;margin-bottom:12px}
  .idx-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .idx-name{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:500;color:var(--ink)}
  .idx-lv{font-size:12px;font-weight:500;padding:2px 11px;border-radius:999px;color:#fff}
  .idx-lv.high{background:var(--relaxed)} .idx-lv.mid{background:var(--balanced)} .idx-lv.low{background:var(--ink-faint)}
  .idx-bar{height:9px;background:var(--paper);border-radius:999px;overflow:hidden;margin-bottom:9px}
  .idx-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .5s}
  .idx-fill.high{background:var(--relaxed)} .idx-fill.mid{background:var(--balanced)} .idx-fill.low{background:var(--ink-faint)}
  .idx-adv{font-size:13px;color:var(--ink-soft);line-height:1.7}
  .idx-score{font-family:"Noto Serif TC",serif;font-size:13px;color:var(--ink-faint);margin-left:6px}

  .save-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;margin-top:18px}
  .save-title{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:6px}
  .save-sub{font-size:12px;color:var(--ink-faint);margin-bottom:12px}
  .save-actions{display:flex;gap:10px}
  .save-actions button{flex:1;border-radius:999px;padding:12px;font-size:14px;font-family:inherit;cursor:pointer;border:1px solid var(--line)}
  .save-skip{background:transparent;color:var(--ink-faint)}
  .save-do{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
  .save-actions button:active{transform:scale(.98)}
  .save-done{font-size:13.5px;color:var(--accent);line-height:1.7}
  .save-done .save-view{color:var(--accent);text-decoration:underline;cursor:pointer}

  /* —— 趨勢 —— */
  .trend-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 14px 10px;margin-bottom:16px}
  .trend-svg{width:100%;height:170px;display:block}
  .hist-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;margin-bottom:10px}
  .hist-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hist-badge{font-size:10.5px;padding:2px 9px;border-radius:999px;font-weight:500;color:#fff}
  .hist-badge.s-relaxed{background:var(--relaxed)} .hist-badge.s-balanced{background:var(--balanced)} .hist-badge.s-tense{background:var(--tense)}
  .hist-hr{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;color:var(--ink)}
  .hist-when{margin-left:auto;font-size:11px;color:var(--ink-faint)}
  .hist-ops{display:flex;gap:14px;margin-top:8px}
  .hist-ops button{background:none;border:none;font-family:inherit;font-size:12.5px;cursor:pointer;padding:0}
  .hist-del{color:var(--tense)}

  /* —— Google 登入 modal —— */
  #jte-login-modal{display:none;position:fixed;inset:0;background:rgba(20,28,40,.45);z-index:9999;align-items:center;justify-content:center;padding:18px}
  #jte-login-modal .jm-box{background:var(--card);border-radius:20px;padding:26px 22px 24px;width:100%;max-width:380px;box-shadow:0 16px 48px rgba(0,0,0,.22)}
  #jte-login-modal .jm-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px}
  #jte-login-modal .jm-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:18px}
  #jte-gsi-btn{display:flex;justify-content:center;margin-bottom:12px;min-height:40px}
  #jte-login-modal .jm-skip{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px;font-size:12.5px;color:var(--ink-faint);cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo">心率變異 HRV</span><span class="sub">CAMERA PPG</span></header>
  <p class="tagline">手指貼鏡頭，一分鐘量身體狀態。</p>
  <div id="app"></div>
</div>
<div class="bar" id="bar"></div>

<script>
/* ============================================================
   心率變異 HRV（相機 PPG）· 說明 → 量測（即時回饋）→ 結果 → 趨勢
   訊號處理純邏輯在 hrv-analyze.js（window.HrvAnalyze）
   記錄走平台 users/{email}/daily linked[]，source:'HRV'，明文一般記錄（不加密）。
   ============================================================ */
const app=document.getElementById('app');
const bar=document.getElementById('bar');
const STATE_LABEL={ relaxed:'放鬆', balanced:'平衡', tense:'緊繃' };
const QUICK_SEC=60;         // 品質轉綠後量測秒數（單一 ~60 秒流程）
const KEEP_SEC=12;          // 即時分析用的最近樣本視窗（秒）
function measureSec(){ return QUICK_SEC; }

const session={ mode:'intro', stream:null, track:null, raf:null,
  samples:[], measuring:false, countdownStart:0, lastUi:0, lastResult:null };

function clearAll(){ app.innerHTML=''; bar.innerHTML=''; }
function backHomeLink(){
  const b=document.createElement('button');b.className='home-link';b.textContent='← 回練息場平台';
  b.onclick=function(){location.href='https://flow222git.github.io/jte-platform-2026/';};
  return b;
}
// HTML 跳脫（卡片用 innerHTML 組裝時，使用者/雲端資料插入前都要跳脫，防 XSS）
function _h(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

const DISCLAIMER='本工具以手機相機估算心率與心率變異，為健康與放鬆的參考，'+
  '受光線、姿勢與裝置影響，並非醫療診斷。若有健康疑慮，請諮詢專業醫療人員。';
// 身體能量免責（常駐）：分數是跟你自己平常比的「相對參考」，不是醫療診斷。
const ENERGY_DISCLAIMER='「身體能量」是跟你自己平常的數值比出來的相對參考，看自己的趨勢就好，不是醫療診斷。'+
  '相機量測受光線與晃動影響，數值會浮動。';

/* —— 入口／說明 —— */
function renderIntro(){
  session.mode='intro'; stopCamera(); clearAll();
  const d=document.createElement('div');d.className='step';
  d.appendChild(backHomeLink());
  d.insertAdjacentHTML('beforeend','<p class="lead">用手機後鏡頭量心率與心率變異（HRV），看看身體現在偏放鬆還是緊繃。<br>需要約一分鐘，找個能坐穩、放鬆的地方。</p>');

  const g=document.createElement('div');g.className='guide-card';
  g.innerHTML='<h3><i class="ti ti-hand-finger"></i>怎麼量</h3>'+
    '<ul class="guide-list">'+
    '<li><i class="ti ti-camera"></i>手指輕輕蓋住手機<b>後鏡頭</b>（含旁邊的閃光燈），不要壓太用力。</li>'+
    '<li><i class="ti ti-armchair"></i>手與身體保持靜止，正常呼吸，不要說話。</li>'+
    '<li><i class="ti ti-bulb"></i>iPhone 若無法開閃光燈，請在<b>光線充足</b>的地方量。</li>'+
    '<li><i class="ti ti-clock-hour-4"></i>畫面品質燈轉綠後，會開始約一分鐘的倒數。</li>'+
    '</ul>';
  d.appendChild(g);

  d.insertAdjacentHTML('beforeend','<p class="disclaimer">'+_h(DISCLAIMER)+'</p>');
  app.appendChild(d);

  const inner=document.createElement('div');inner.className='bar-inner';
  const start=document.createElement('button');start.className='btn btn-primary';start.textContent='開始量測';
  start.onclick=function(){ renderMeasure(); };
  const hist=document.createElement('button');hist.className='btn-ghost';hist.textContent='看趨勢';
  hist.onclick=function(){ renderTrend(); };
  inner.appendChild(hist);inner.appendChild(start);
  bar.appendChild(inner);
}

/* —— 量測（相機 + 即時回饋）—— */
let waveCanvas=null, waveCtx=null;
function renderMeasure(){
  session.mode='measure'; clearAll();
  session.samples=[]; session.measuring=false; session.countdownStart=0;
  const d=document.createElement('div');d.className='step';
  d.appendChild(backHomeLink());

  d.insertAdjacentHTML('beforeend',
    '<div class="cam-stage">'+
      '<video id="cam" playsinline muted autoplay></video>'+
      '<div class="cam-overlay">'+
        '<div class="ring">'+
          '<svg width="120" height="120" viewBox="0 0 120 120">'+
            '<circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/>'+
            '<circle id="ringProg" cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>'+
          '</svg>'+
          '<div class="ring-num"><span class="n" id="ringSec">'+measureSec()+'</span><span class="u">秒</span></div>'+
        '</div>'+
        '<div class="quality"><span class="qdot red" id="qdot"></span><span id="qlabel">偵測訊號中…</span></div>'+
        '<div class="hr-live"><span class="hb">♥</span><span class="v" id="hrLive">--</span><span class="u">bpm</span></div>'+
      '</div>'+
    '</div>');

  d.insertAdjacentHTML('beforeend','<div class="wave-card"><canvas id="wave"></canvas></div>');
  d.insertAdjacentHTML('beforeend','<p class="cam-hint" id="camHint">把手指輕輕蓋住後鏡頭，保持靜止…</p>');
  d.insertAdjacentHTML('beforeend','<div id="camErr"></div>');
  d.insertAdjacentHTML('beforeend','<p class="disclaimer">'+_h(DISCLAIMER)+'</p>');
  app.appendChild(d);

  const inner=document.createElement('div');inner.className='bar-inner';
  const cancel=document.createElement('button');cancel.className='btn btn-ghost';cancel.style.flex='1';cancel.textContent='取消';
  cancel.onclick=function(){ renderIntro(); };
  inner.appendChild(cancel);
  bar.appendChild(inner);

  waveCanvas=document.getElementById('wave');
  if(waveCanvas){
    const dpr=window.devicePixelRatio||1;
    waveCanvas.width=Math.round(waveCanvas.clientWidth*dpr)||600;
    waveCanvas.height=Math.round(70*dpr);
    waveCtx=waveCanvas.getContext('2d');
    if(waveCtx)waveCtx.scale(dpr,dpr);
  }
  startCamera();
}

function showCamError(title,msg){
  const box=document.getElementById('camErr'); if(!box)return;
  box.innerHTML='<div class="err-card"><h3>'+_h(title)+'</h3><p>'+_h(msg)+'</p></div>';
  const hint=document.getElementById('camHint'); if(hint)hint.style.display='none';
}

let _video=null, _grabCanvas=null, _grabCtx=null;
async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showCamError('這個裝置不支援相機量測','請改用支援相機的手機瀏覽器（建議 Chrome 或 Safari）再試一次。');
    return;
  }
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } });
  }catch(e){
    if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')){
      showCamError('需要相機權限','請允許使用相機才能量測。你可以在網址列或設定中開啟相機權限，再回來重試。');
    }else if(e&&e.name==='NotFoundError'){
      showCamError('找不到相機','這個裝置似乎沒有可用的相機。請改用有後鏡頭的手機。');
    }else{
      showCamError('無法開啟相機','相機暫時無法使用，請重新整理或換個瀏覽器再試一次。');
    }
    return;
  }
  // 多鏡頭機種（iPhone Pro 等）：facingMode:environment 常給「自動切換」的虛擬鏡頭，
  // 手指貼近時會在主鏡頭/超廣角/微距間跳動→畫面斷續→掉訊號。鎖定單一主後鏡頭（Back Camera）。
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cams=devs.filter(function(d){ return d.kind==='videoinput'; });
    const isBack=function(l){ return /back|rear|environment|後置|後|背/i.test(l||''); };
    const isVirtual=function(l){ return /dual|triple|雙|三/i.test(l||''); }; // 含「雙/三」＝自動切換虛擬鏡頭
    const isUltra=function(l){ return /超廣角|ultra[\s-]*wide/i.test(l||''); };
    // 1) 超廣角單鏡頭最優先：保證單一實體、又最會對焦近物（手指貼著），iPhone 近物本就用它→不切走。
    //    （之前鎖「後置相機」實測沒生效，active 仍是雙廣角虛擬鏡頭→改鎖超廣角這顆真．單一鏡頭）
    let pick=cams.filter(function(d){ return isUltra(d.label)&&!isVirtual(d.label); })[0];
    // 2) 否則純主鏡頭「後置相機 / Back Camera」；3) 任一非虛擬後置鏡頭；4) 最短 label 後置鏡頭
    if(!pick) pick=cams.filter(function(d){ return /^\s*(後置相機|back camera)\s*$/i.test(d.label||''); })[0];
    if(!pick) pick=cams.filter(function(d){ return isBack(d.label)&&!isVirtual(d.label); })[0];
    if(!pick){ const backs=cams.filter(function(d){ return isBack(d.label); }); backs.sort(function(a,b){ return (a.label||'').length-(b.label||'').length; }); pick=backs[0]; }
    session.camPick=pick?pick.label:'(無)'; session.camReacq=false;
    if(pick&&pick.deviceId){
      const cur=stream.getVideoTracks()[0];
      const curId=(cur&&cur.getSettings)?cur.getSettings().deviceId:null;
      if(pick.deviceId!==curId){
        stream.getTracks().forEach(function(t){ t.stop(); });
        stream=await navigator.mediaDevices.getUserMedia({ video:{ deviceId:{ exact:pick.deviceId } } });
        session.camReacq=true;
      }
    }
  }catch(e){ session.camPickErr=(e&&e.name)||'err'; }
  session.stream=stream;
  const track=stream.getVideoTracks()[0];
  session.track=track;
  // 鏡頭診斷（?debug 時，畫面最上方顯示：有哪些鏡頭、目前用哪顆、可控能力）。
  // z-index 蓋過使用者列；每欄各自 try 以免一處出錯整個不顯示。
  if(/debug/.test(location.search)||/debug/.test(location.hash)){
    let box=document.getElementById('hrvCamDbg');
    if(!box){ box=document.createElement('div'); box.id='hrvCamDbg'; box.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483646;background:rgba(0,0,0,.9);color:#0ff;font:11px/1.45 monospace;padding:8px 10px;white-space:pre-wrap;word-break:break-all;pointer-events:none'; document.body.appendChild(box); }
    let info='[鏡頭診斷]';
    try{ const devs2=await navigator.mediaDevices.enumerateDevices(); info+='\ncams: '+devs2.filter(function(d){return d.kind==='videoinput';}).map(function(d){return d.label||'(空)';}).join('  ||  '); }catch(e){ info+='\ncams: 列舉失敗 '+(e&&e.name); }
    info+='\npicked: '+(session.camPick||'?')+'  reacq:'+(session.camReacq?'Y':'N')+(session.camPickErr?('  err:'+session.camPickErr):'');
    try{ const st=(track&&track.getSettings)?track.getSettings():{}; info+='\nactive: '+(track&&track.label||'?')+'  '+(st.width||'?')+'x'+(st.height||'?'); }catch(e){ info+='\nactive: ? '+(e&&e.name); }
    try{ const caps=(track&&track.getCapabilities)?track.getCapabilities():null; info+='\ncaps: '+(caps?(Object.keys(caps).join(',')||'(空)'):'無 getCapabilities'); }catch(e){ info+='\ncaps: err '+(e&&e.name); }
    box.textContent=info;
  }
  // iPhone：閃光燈（torch）常不支援，applyConstraints 會丟例外 → 吞掉，改用環境光。
  try{
    if(track&&track.applyConstraints){
      await track.applyConstraints({ advanced:[{ torch:true }] });
    }
  }catch(e){ /* 無閃光燈，靠環境光；說明已引導到亮的地方 */ }

  _video=document.getElementById('cam');
  if(!_video){ return; }
  _video.srcObject=stream;
  try{ await _video.play(); }catch(e){ /* autoplay 受限時忽略，影格仍可讀 */ }

  _grabCanvas=document.createElement('canvas');
  _grabCanvas.width=64; _grabCanvas.height=64;
  _grabCtx=_grabCanvas.getContext('2d',{ willReadFrequently:true });
  session.lastUi=0;
  loopGrab();
}

function loopGrab(){
  session.raf=requestAnimationFrame(loopGrab);
  const now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  if(_video&&_grabCtx&&_video.videoWidth){
    const vw=_video.videoWidth, vh=_video.videoHeight;
    const side=Math.min(vw,vh), sx=(vw-side)/2, sy=(vh-side)/2;
    try{
      _grabCtx.drawImage(_video, sx,sy,side,side, 0,0,64,64);
      // 取中央 ~50x50（7..57）：紅光平均（訊號）＋綠光平均＋紅光飽和比例（診斷用）
      const img=_grabCtx.getImageData(7,7,50,50).data, px=img.length/4;
      let r=0,g=0,sat=0; for(let i=0;i<img.length;i+=4){ r+=img[i]; g+=img[i+1]; if(img[i]>=250)sat++; }
      const redMean=r/px, greenMean=g/px;
      session.samples.push({ t:now, v:redMean, g:greenMean });
      session.lastDiag={ R:redMean, G:greenMean, sat:sat/px };
      // 維護最近 KEEP_SEC 秒（量測中保留全部給結果頁；未量測時只留視窗）
      if(!session.measuring){
        const cutoff=now-KEEP_SEC*1000;
        while(session.samples.length && session.samples[0].t<cutoff) session.samples.shift();
      }
    }catch(e){ /* 影格未就緒/跨域，忽略此格 */ }
  }
  if(now-session.lastUi>=500){ session.lastUi=now; updateLiveUi(now); }
}

function recentSamples(now,sec){
  const cutoff=now-sec*1000, out=[];
  for(let i=session.samples.length-1;i>=0;i--){
    if(session.samples[i].t<cutoff)break;
    out.push(session.samples[i]);
  }
  out.reverse(); return out;
}

// —— 診斷模式（網址加 ?debug 或 #debug 時顯示）：只觀測、不改變量測邏輯 ——
function isDebug(){ return /debug/.test(location.search) || /debug/.test(location.hash); }
function updateDebug(recent, beats, rr, q){
  let el=document.getElementById('hrvDbg');
  if(!el){
    el=document.createElement('div'); el.id='hrvDbg';
    el.style.cssText='position:fixed;left:6px;bottom:6px;z-index:99999;background:rgba(0,0,0,.82);color:#0f0;font:13px/1.45 monospace;padding:7px 9px;border-radius:7px;white-space:pre;pointer-events:auto;cursor:pointer';
    el.onclick=function(){ try{ navigator.clipboard.writeText(JSON.stringify(session._dbgRecent||[])); el.style.color='#ff0'; setTimeout(function(){el.style.color='#0f0';},700); }catch(e){} };
    document.body.appendChild(el);
  }
  session._dbgRecent = recent;
  let rmn=Infinity,rmx=-Infinity,gmn=Infinity,gmx=-Infinity;
  for(let i=0;i<recent.length;i++){ const s=recent[i]; if(s.v<rmn)rmn=s.v; if(s.v>rmx)rmx=s.v; const gv=s.g||0; if(gv<gmn)gmn=gv; if(gv>gmx)gmx=gv; }
  const d=session.lastDiag||{R:0,G:0,sat:0};
  const acR=(rmx===-Infinity)?0:(rmx-rmn), acG=(gmx===-Infinity)?0:(gmx-gmn);
  let per=0, fs=0, acn=0; try{ const pr=HrvAnalyze._prep(recent); if(pr){ per=HrvAnalyze._periodicity(pr.ac, pr.fs); fs=pr.fs; acn=pr.ac.length; } }catch(e){}
  const mm=HrvAnalyze.metricsFromRr(rr);
  el.textContent='R '+d.R.toFixed(0)+'   sat '+(d.sat*100).toFixed(0)+'%\nG '+d.G.toFixed(0)+
    '\nACr '+acR.toFixed(1)+'   ACg '+acG.toFixed(1)+
    '\nfs '+fs.toFixed(0)+'  acN '+acn+
    '\nper '+per.toFixed(2)+'   hr '+Math.round(mm.hr)+
    '\nbeats '+beats.length+'  rr '+rr.length+'  ['+q+']\nsamples '+recent.length+
    '\n(點我複製原始資料)';
}

function updateLiveUi(now){
  if(!window.HrvAnalyze)return;
  const recent=recentSamples(now, KEEP_SEC);
  drawWave(recent);
  const q=HrvAnalyze.signalQuality(recent);
  const dot=document.getElementById('qdot'), ql=document.getElementById('qlabel');
  if(dot){ dot.className='qdot '+q; }
  if(ql){ ql.textContent = q==='green'?'訊號良好':(q==='yellow'?'訊號普通，盡量別動':'請調整手指與光線'); }
  // 即時心率
  const beats=HrvAnalyze.detectBeats(recent);
  const rr=HrvAnalyze.rrFromBeats(beats);
  const m=HrvAnalyze.metricsFromRr(rr);
  const hrEl=document.getElementById('hrLive');
  if(hrEl) hrEl.textContent = (m.hr>=30&&m.hr<=220) ? String(Math.round(m.hr)) : '--';
  if(isDebug()) updateDebug(recent, beats, rr, q);

  const hint=document.getElementById('camHint');
  // 品質轉 green 才開始倒數
  if(q==='green' && !session.measuring){
    session.measuring=true; session.countdownStart=now; session.samples=[];
    if(hint){ hint.className='cam-hint'; hint.textContent='開始量測，保持靜止，正常呼吸…'; }
  }
  if(session.measuring){
    const total=measureSec();
    const elapsed=(now-session.countdownStart)/1000;
    const remain=Math.max(0, total-elapsed);
    const secEl=document.getElementById('ringSec'); if(secEl)secEl.textContent=String(Math.ceil(remain));
    const prog=document.getElementById('ringProg');
    if(prog){ const C=2*Math.PI*52; prog.setAttribute('stroke-dashoffset', String(C*(1-Math.min(1,elapsed/total)))); }
    if(q==='red'){
      // 中途轉紅：提示調整（不重置倒數，避免一直歸零）
      if(hint){ hint.className='cam-hint warn'; hint.textContent='訊號變差了，手指別移開、放輕鬆…'; }
    }else if(hint && hint.classList.contains('warn')){
      hint.className='cam-hint'; hint.textContent='很好，保持住…';
    }
    if(remain<=0){ finishMeasure(); }
  }else{
    if(hint && !hint.classList.contains('warn')){
      hint.textContent = q==='red' ? '把手指輕蓋後鏡頭、保持靜止…' : '快好了，穩住，等品質燈轉綠…';
    }
  }
}

function drawWave(samples){
  if(!waveCtx||!waveCanvas)return;
  const w=waveCanvas.clientWidth||600, h=70;
  waveCtx.clearRect(0,0,w,h);
  if(samples.length<2)return;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<samples.length;i++){ const v=samples[i].v; if(v<mn)mn=v; if(v>mx)mx=v; }
  const range=(mx-mn)||1;
  waveCtx.beginPath();
  waveCtx.lineWidth=2; waveCtx.strokeStyle='#003D7C'; waveCtx.lineJoin='round';
  for(let i=0;i<samples.length;i++){
    const x=w*i/(samples.length-1);
    const y=h-6 - (samples[i].v-mn)/range*(h-12);
    if(i===0)waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
  }
  waveCtx.stroke();
}

function finishMeasure(){
  const collected=session.samples.slice();
  stopCamera();
  session.mode='result';
  renderResult(collected);
}

function stopCamera(){
  if(session.raf){ cancelAnimationFrame(session.raf); session.raf=null; }
  if(session.track){ try{ session.track.applyConstraints({ advanced:[{ torch:false }] }); }catch(e){} }
  if(session.stream){ try{ session.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} session.stream=null; }
  session.track=null; _video=null; _grabCtx=null; _grabCanvas=null; session.measuring=false;
}

/* —— 結果頁 —— */
function renderResult(samples){
  session.mode='result'; clearAll();
  samples=samples||[];
  const A=window.HrvAnalyze;
  // 用既有純函式算指標與品質
  const beats=A?A.detectBeats(samples):[];
  const rr=A?A.cleanRr(A.rrFromBeats(beats)):[]; // 偽差校正後再算指標（RMSSD 才不會被掉訊號灌爆）
  const m=A?A.metricsFromRr(rr):{hr:0,rmssd:0,sdnn:0,n:0};
  const quality=A?A.signalQuality(samples):'red';
  // 誠實降級：訊號太差→不顯示任何數字、不存記錄、引導重量
  const tooNoisy = !A || m.n<8 || quality==='red' || !(m.hr>=30&&m.hr<=220);

  const d=document.createElement('div');d.className='step';
  d.appendChild(backHomeLink());

  if(tooNoisy){
    const c=document.createElement('div');c.className='err-card';
    c.innerHTML='<h3>這次沒量好</h3><p>請在光線充足處，手指輕貼鏡頭（含旁邊的閃光燈），保持靜止，再量一次。</p>';
    d.appendChild(c);
    d.insertAdjacentHTML('beforeend','<p class="disclaimer">'+_h(DISCLAIMER)+'</p>');
    app.appendChild(d);
    const inner=document.createElement('div');inner.className='bar-inner';
    const again=document.createElement('button');again.className='btn btn-primary';again.textContent='再量一次';
    again.onclick=function(){ renderMeasure(); };
    inner.appendChild(again);
    bar.appendChild(inner);
    return;
  }

  const cls=A.classify(m);
  const state=cls.state;                       // relaxed / balanced / tense（仍記錄供舊資料相容）
  const hr=Math.round(m.hr), rmssd=Math.round(m.rmssd), sdnn=Math.round(m.sdnn);

  // 先放一個讀取中的身體能量卡（取過去記錄算 baseline 是非同步）
  const card=document.createElement('div');card.className='state-card s-balanced';
  card.innerHTML='<div class="lab">身體能量</div><div class="big" id="enBig">…</div>';
  d.appendChild(card);
  app.appendChild(d);

  // 量測底部列（看趨勢／再量一次）先放上，渲染不卡在讀記錄
  const inner=document.createElement('div');inner.className='bar-inner';
  const trend=document.createElement('button');trend.className='btn-ghost';trend.textContent='看趨勢';
  trend.onclick=function(){ renderTrend(); };
  const again=document.createElement('button');again.className='btn btn-primary';again.textContent='再量一次';
  again.onclick=function(){ renderMeasure(); };
  inner.appendChild(trend);inner.appendChild(again);
  bar.appendChild(inner);

  // 取「過去」HRV 記錄（不含本次）→ baseline → 身體能量分數，再渲染 hero
  Promise.resolve(jteListRecordsMerged()).then(function(list){
    if(session.mode!=='result')return;         // 已離開結果頁就不渲染
    renderEnergyResult(d, card, list||[], m, {hr:hr,rmssd:rmssd,sdnn:sdnn,state:state});
  }).catch(function(){
    if(session.mode!=='result')return;
    renderEnergyResult(d, card, [], m, {hr:hr,rmssd:rmssd,sdnn:sdnn,state:state});
  });
}

// 顏色：能量 high→綠(relaxed)、mid→金(balanced)、low→暖(tense)
const ENERGY_TONE={ high:'relaxed', mid:'balanced', low:'tense' };
function renderEnergyResult(d, card, list, m, rec){
  const E=window.HrvEnergy;
  // 過去 HRV 記錄（已含本次？本次尚未寫入，故 list 即為「過去」）：過濾 source==='HRV' 且有 rmssd
  const hist=(list||[]).filter(function(r){ return r&&r.source==='HRV'&&Number(r.rmssd)>0; })
    .map(function(r){ return { rmssd:Number(r.rmssd), hr:Number(r.hr)||0, ts:r.ts }; });
  const base=E?E.baselineFrom(hist):null;
  const en=E?E.energyScore({rmssd:m.rmssd,hr:m.hr}, base):{score:0,level:'mid',label:'平穩',advice:'',confidence:'building',n:0,recovery:null,calm:null};

  // —— 身體能量 hero 卡（重建，避免閃爍殘留）——
  card.className='state-card s-'+(ENERGY_TONE[en.level]||'balanced');
  card.innerHTML='';
  const lab=document.createElement('div');lab.className='lab';lab.textContent='身體能量';
  const big=document.createElement('div');big.className='big';big.textContent=String(Number(en.score));
  const labelEl=document.createElement('div');labelEl.className='adv';
  labelEl.style.cssText='font-family:"Noto Serif TC",serif;font-size:18px;font-weight:600;margin-top:4px;opacity:1';
  labelEl.textContent=String(en.label);
  const advEl=document.createElement('div');advEl.className='adv';advEl.textContent=String(en.advice||'');
  card.appendChild(lab);card.appendChild(big);card.appendChild(labelEl);card.appendChild(advEl);
  if(en.confidence==='building'){
    const note=document.createElement('div');note.className='adv';
    note.style.cssText='font-size:12.5px;opacity:.9;margin-top:8px';
    note.textContent='信心建立中（'+String(Number(en.n))+'/'+String(Number(E?E._CONF_N:7))+'）— 多量幾次會越來越貼近你自己。';
    card.appendChild(note);
  }

  // —— 可展開細項：恢復力／平靜 ＋ 原始 HR/RMSSD ——
  const hr=Math.round(m.hr), rmssd=Math.round(m.rmssd), sdnn=Math.round(m.sdnn);
  const det=document.createElement('details');det.className='metrics';
  det.innerHTML='<summary>看細項</summary>'+
    '<div class="idx-card" style="margin-top:8px">'+
      '<div class="metric-row"><span class="mt">恢復力 <small>vs 你的常態</small></span><span class="idx-lv" id="enRec"></span></div>'+
      '<div class="metric-row"><span class="mt">平靜 <small>靜息心率</small></span><span class="idx-lv" id="enCalm"></span></div>'+
    '</div>'+
    '<div class="panel" style="margin-top:8px">'+
      '<div class="metric-row"><span class="mt">心率 <small>HR</small></span><span class="mv" id="mHr"></span></div>'+
      '<div class="metric-row"><span class="mt">心率變異 <small>RMSSD</small></span><span class="mv" id="mRm"></span></div>'+
    '</div>';
  d.appendChild(det);
  // 細項膠囊（顏色用既有 idx-lv high/mid/low）
  function tone3(lv){ return lv==='high'?'high':(lv==='low'?'low':'mid'); }
  const recEl=det.querySelector('#enRec');
  if(en.recovery){ recEl.classList.add(tone3(en.recovery.level)); recEl.textContent=String(en.recovery.label); }
  else { recEl.classList.add('mid'); recEl.textContent='—'; }
  const calmEl=det.querySelector('#enCalm');
  if(en.calm){ calmEl.classList.add(tone3(en.calm.level)); calmEl.textContent=String(en.calm.label); }
  else { calmEl.classList.add('mid'); calmEl.textContent='—'; }
  det.querySelector('#mHr').textContent=String(hr)+' bpm';
  det.querySelector('#mRm').textContent=String(rmssd)+' ms';

  // —— 常駐免責（相對參考、非醫療）——
  d.insertAdjacentHTML('beforeend','<p class="disclaimer">'+_h(ENERGY_DISCLAIMER)+'</p>');
  d.insertAdjacentHTML('beforeend','<p class="disclaimer">'+_h(DISCLAIMER)+'</p>');

  // —— 儲存（只在通過誠實把關時才到這裡）：加 energy / level ——
  const now=new Date();
  const recId='hrv_'+now.getTime()+'_'+Math.random().toString(36).slice(2,8);
  jteWriteRecord({ source:'HRV', id:recId, recordId:recId, ts:now.toISOString(),
    hr:hr, rmssd:rmssd, sdnn:sdnn, energy:Number(en.score), level:en.level, state:rec.state });
}
/* —— 趨勢頁 —— */

// 能量等級→色：high 綠 / mid 金 / low 暖。舊記錄無 level 時退用 state。
const ENERGY_COLOR={ high:'#2e8b57', mid:'#b8860b', low:'#c2631f' };
const STATE_COLOR={ relaxed:'#2e8b57', balanced:'#b8860b', tense:'#c2631f' };
const ENERGY_LABEL={ high:'充足', mid:'平穩', low:'偏低' };
function recColor(r){ return ENERGY_COLOR[r.level]||STATE_COLOR[r.state]||'#003D7C'; }
function drawTrend(list){
  const body=document.getElementById('trendBody'); if(!body)return;
  // 所有 HRV 記錄（供列表），依 ts 正序
  const all=(list||[]).filter(function(r){ return r&&r.source==='HRV'; })
    .sort(function(a,b){ return String(a.ts||'').localeCompare(String(b.ts||'')); });
  // 折線只取有 energy 分數的記錄（舊記錄無 energy 者退出折線，仍進列表）
  const recs=all.filter(function(r){ return isFinite(Number(r.energy)); });
  body.innerHTML='';
  if(!all.length){
    const c=document.createElement('div');c.className='guide-card';
    c.innerHTML='<h3><i class="ti ti-chart-line"></i>還沒有記錄</h3>'+
      '<p style="font-size:14px;color:var(--ink-soft);margin:0;line-height:1.7">量過一次之後，這裡會出現你的身體能量趨勢。先量一次看看吧。</p>';
    body.appendChild(c);
    return;
  }

  // —— SVG 身體能量折線（0–100 固定刻度）——
  if(recs.length){
    const W=520, H=170, padL=8, padR=8, padT=14, padB=18;
    const mn=0, mx=100, span=100;
    const n=recs.length;
    function px(i){ return n===1 ? W/2 : padL + (W-padL-padR)*i/(n-1); }
    function py(v){ return padT + (H-padT-padB)*(1-(v-mn)/span); }
    let path='';
    for(let i=0;i<n;i++){ path += (i===0?'M':'L')+px(i).toFixed(1)+' '+py(Number(recs[i].energy)).toFixed(1)+' '; }
    let dots='';
    for(let i=0;i<n;i++){
      const r=recs[i]; const col=recColor(r);
      const whenT=String(r.ts||'');
      const lvZh=ENERGY_LABEL[r.level]||'';
      dots+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(Number(r.energy)).toFixed(1)+'" r="4.5" fill="'+col+'">'+
        '<title>身體能量 '+Number(r.energy)+(lvZh?(' · '+_h(lvZh)):'')+' · '+_h(whenT.slice(0,16).replace('T',' '))+'</title></circle>';
    }
    const wrap=document.createElement('div');wrap.className='trend-wrap';
    wrap.innerHTML='<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<path d="'+path.trim()+'" fill="none" stroke="#003D7C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      dots+'</svg>';
    body.appendChild(wrap);
  }else{
    const c=document.createElement('div');c.className='guide-card';
    c.innerHTML='<h3><i class="ti ti-chart-line"></i>還沒有身體能量分數</h3>'+
      '<p style="font-size:14px;color:var(--ink-soft);margin:0;line-height:1.7">再量一次，這裡就會畫出你的身體能量趨勢。</p>';
    body.appendChild(c);
  }

  // —— 列表（新到舊）——
  for(let i=all.length-1;i>=0;i--){
    const r=all[i];
    const card=document.createElement('div');card.className='hist-card';
    const hasEn=isFinite(Number(r.energy));
    const lvZh=ENERGY_LABEL[r.level]||(STATE_LABEL[r.state]||r.state||'');
    const when=String(r.ts||'').slice(0,16).replace('T',' ');
    const head=document.createElement('div');head.className='hist-head';
    const badge=document.createElement('span');badge.className='hist-badge s-'+(ENERGY_TONE[r.level]||r.state||'balanced');
    badge.textContent=hasEn?('能量 '+String(Number(r.energy))+(lvZh?(' · '+lvZh):'')):lvZh;
    const hr=document.createElement('span');hr.className='hist-hr';hr.textContent=String(Number(r.hr))+' bpm';
    const small=document.createElement('span');small.style.fontSize='12px';small.style.color='var(--ink-soft)';
    small.textContent='RMSSD '+String(Number(r.rmssd))+' ms';
    const whenEl=document.createElement('span');whenEl.className='hist-when';whenEl.textContent=when;
    head.appendChild(badge);head.appendChild(hr);head.appendChild(small);head.appendChild(whenEl);
    card.appendChild(head);

    const ops=document.createElement('div');ops.className='hist-ops';
    const del=document.createElement('button');del.className='hist-del';del.textContent='刪除';
    const keyId=r.recordId||r.id;
    del.onclick=function(){ jteDeleteRecord(keyId); renderTrend(); };
    ops.appendChild(del);
    card.appendChild(ops);
    body.appendChild(card);
  }
}

   平台記錄 helper（HRV 走「一般記錄」明文，不加密；localStorage + Firestore）
   ============================================================ */

function initFirebase(){
  if(typeof firebase==='undefined'){setTimeout(initFirebase,200);return;}
  try{
    if(firebase.apps.length===0){
      firebase.initializeApp({

        messagingSenderId:"978242729427",
        appId:"1:978242729427:web:ab31364f21c67c2ab56b26"
      });
    }
    _db=firebase.firestore();
  }catch(e){console.warn('Firebase init failed',e);}
}
window.addEventListener('load',initFirebase);

function jteEmail(){return localStorage.getItem('jte_user_email')||'';}
function jteKey(){const e=jteEmail();return e?'jte_daily_'+e.replace(/[^a-zA-Z0-9]/g,'_'):'jte_daily_v1';}
function jteTodayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function jteAll(){try{return JSON.parse(localStorage.getItem(jteKey())||'{}')}catch(e){return{}}}
function jteFsSave(dateKey,day){
  const e=jteEmail();if(!_db||!e)return;
  // HRV 為一般記錄、明文直接上雲（不加密）。
  _db.collection('users').doc(e.toLowerCase().trim()).collection('daily').doc(dateKey).set(day,{merge:true})
    .catch(function(err){console.warn('Firestore write failed',err);});
}
function jteWriteRecord(rec){
  const k=jteKey(),today=jteTodayKey(),all=jteAll();
  const day=all[today]||{moods:[],energy:5,note:'',tags:[],linked:[],createdAt:new Date().toISOString()};
  if(!day.linked)day.linked=[];
  day.linked.push(rec);day.updatedAt=new Date().toISOString();
  all[today]=day;localStorage.setItem(k,JSON.stringify(all));
  jteFsSave(today,day);
}
function _flattenHrv(all){var out=[];Object.keys(all).forEach(function(dk){(all[dk].linked||[]).forEach(function(l){if(l.source==='HRV')out.push(l);});});out.sort(function(a,b){return (a.ts||'').localeCompare(b.ts||'');});return out;}
function jteFsLoadDays(){
  const e=jteEmail();if(!_db||!e)return Promise.resolve({});
  return _db.collection('users').doc(e.toLowerCase().trim()).collection('daily').get()
   .then(function(snap){var days={};snap.forEach(function(doc){days[doc.id]=doc.data();});return days;})
   .catch(function(){return {};});
}
/* 把雲端 daily 的 HRV 記錄併回本機（依 recordId 去重）、hydrate localStorage，回傳攤平清單（時間正序） */
function jteListRecordsMerged(){
  const localAll=jteAll();
  return jteFsLoadDays().then(function(cloudDays){
    const merged=Object.assign({},localAll);
    Object.keys(cloudDays).forEach(function(dk){
      const cloudDay=cloudDays[dk]||{};
      const base=merged[dk]?Object.assign({},merged[dk]):Object.assign({},cloudDay);
      const seen={}; const linked=[];
      (merged[dk]&&merged[dk].linked||[]).forEach(function(r){ const id=r.recordId||r.id; if(id)seen[id]=1; linked.push(r); });
      (cloudDay.linked||[]).forEach(function(r){ const id=r.recordId||r.id; if(id&&!seen[id]){ seen[id]=1; linked.push(r); } else if(!id){ linked.push(r); } });
      base.linked=linked; merged[dk]=base;
    });
    try{localStorage.setItem(jteKey(),JSON.stringify(merged));}catch(e){}
    return _flattenHrv(merged);
  });
}
function jteDeleteRecord(id){
  const k=jteKey(),all=jteAll();let touched=null;
  Object.keys(all).forEach(function(dk){
    if(!all[dk].linked)return;
    const before=all[dk].linked.length;
    all[dk].linked=all[dk].linked.filter(function(l){return (l.recordId||l.id)!==id;});
    if(all[dk].linked.length!==before)touched=dk;
  });
  if(touched){all[touched].updatedAt=new Date().toISOString();localStorage.setItem(k,JSON.stringify(all));jteFsSave(touched,all[touched]);}
}
