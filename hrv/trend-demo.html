<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HRV 趨勢視覺 · 提案示意</title>
<style>
  :root{
    --ink:#23252b; --ink-soft:#5b6270; --ink-faint:#8a93a3;
    --paper:#eef1f6; --card:#ffffff; --line:#e3e8f0;
    --accent:#003D7C; --accent-soft:#eaf1f9;
    --band:#cfe0f2; --band-line:#7ba4d0;
    --high:#2e8b57; --mid:#b8860b; --low:#c2631f;
    --shadow:0 2px 14px rgba(0,61,124,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ink:#e9edf3; --ink-soft:#a7b0c0; --ink-faint:#79839a;
      --paper:#12151b; --card:#1a1e26; --line:#2a303b;
      --accent:#7fb0e6; --accent-soft:#1c2735;
      --band:#22344a; --band-line:#4d78a8;
      --high:#5cc186; --mid:#d6a43a; --low:#e0794a;
      --shadow:0 2px 14px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  .wrap{max-width:460px;margin:0 auto;padding:26px 18px 40px;background:var(--paper);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink)}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
  h1{font-family:"Noto Serif TC",Georgia,"Songti TC",serif;font-weight:600;font-size:22px;line-height:1.3;margin:0 0 8px}
  .sub{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px;box-shadow:var(--shadow);margin-bottom:16px}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 4px}
  .card-t{font-family:"Noto Serif TC",Georgia,serif;font-weight:600;font-size:15px;color:var(--ink)}
  .tag{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px}
  .tag.new{background:var(--accent-soft);color:var(--accent)}
  .tag.old{background:var(--paper);color:var(--ink-faint);border:1px solid var(--line)}
  .card-note{font-size:12.5px;color:var(--ink-soft);line-height:1.65;margin:2px 0 12px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%}
  .swatch{width:16px;height:9px;border-radius:3px;background:var(--band);border:1px solid var(--band-line)}
  .divider{display:flex;align-items:center;gap:12px;margin:24px 2px 14px;color:var(--ink-faint);font-size:12px;letter-spacing:.04em}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .foot{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:18px;line-height:1.6}
  .callout{font-size:11px;fill:var(--ink-faint)}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">HRV · 趨勢視覺升級</p>
  <h1>身體能量趨勢</h1>
  <p class="sub">提案把折線加上兩樣東西:<b style="color:var(--ink)">你的「平常範圍」帶</b>(一眼看出今天在自己的高標還低標),以及<b style="color:var(--ink)">真實日期軸</b>(看得出隔了多久沒量,而不是均勻擠一起)。</p>

  <div class="card">
    <div class="card-h">
      <span class="card-t">提案</span>
      <span class="tag new">平常範圍帶 · 真實日期軸</span>
    </div>
    <div class="card-note" id="note-new"></div>
    <svg id="chart-new" viewBox="0 0 340 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="身體能量趨勢折線,含平常範圍帶與真實日期軸"></svg>
    <div class="legend">
      <span><i class="dot" style="background:var(--high)"></i>充足</span>
      <span><i class="dot" style="background:var(--mid)"></i>平穩</span>
      <span><i class="dot" style="background:var(--low)"></i>偏低</span>
      <span><i class="swatch"></i>你的平常範圍</span>
    </div>
  </div>

  <div class="divider">對照:現在的樣子</div>

  <div class="card">
    <div class="card-h">
      <span class="card-t">現在</span>
      <span class="tag old">均勻排列 · 無參照</span>
    </div>
    <div class="card-note">點均勻排,看不出中間隔了幾天;也沒有「你的平常」當參照,不知道今天算高還低。</div>
    <svg id="chart-old" viewBox="0 0 340 160" preserveAspectRatio="xMidYMid meet" role="img" aria-label="現有折線,點均勻排列"></svg>
  </div>

  <p class="foot">示意圖 · 使用假資料。實作會沿用 App 現有配色與資料。</p>
</div>

<script>
(function(){
  var SVGNS="http://www.w3.org/2000/svg";
  var data=[
    {lab:"7/1",day:0,v:58},{lab:"7/2",day:1,v:63},{lab:"7/3",day:2,v:71},
    {lab:"7/6",day:5,v:49},{lab:"7/7",day:6,v:44},{lab:"7/8",day:7,v:53},
    {lab:"7/12",day:11,v:77},{lab:"7/13",day:12,v:68},{lab:"7/15",day:14,v:56},
    {lab:"7/19",day:18,v:46},{lab:"7/20",day:19,v:65}
  ];
  function lvlColor(v){ return v>=75?"var(--high)":(v>=45?"var(--mid)":"var(--low)"); }
  function pct(sorted,p){ var i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo); }
  function el(name,attrs){ var e=document.createElementNS(SVGNS,name); for(var k in attrs) e.setAttribute(k,attrs[k]); return e; }

  var vs=data.map(function(d){return d.v;}).slice().sort(function(a,b){return a-b;});
  var p25=pct(vs,0.25), p50=pct(vs,0.5), p75=pct(vs,0.75);

  document.getElementById("note-new").innerHTML=
    "藍帶＝你過去分數的中段範圍("+Math.round(p25)+"–"+Math.round(p75)+"),虛線＝你的平常("+Math.round(p50)+")。今天的點落在帶上方＝比平常好。";

  (function(){
    var svg=document.getElementById("chart-new");
    var W=340,H=200,padL=6,padR=6,padT=10,padB=26;
    var maxDay=data[data.length-1].day;
    function px(day){ return padL+(W-padL-padR)*(day/maxDay); }
    function py(v){ return padT+(H-padT-padB)*(1-v/100); }

    svg.appendChild(el("rect",{x:padL,y:py(p75).toFixed(1),width:(W-padL-padR).toFixed(1),height:(py(p25)-py(p75)).toFixed(1),
      fill:"var(--band)",opacity:"0.55",rx:"3"}));
    svg.appendChild(el("line",{x1:padL,y1:py(p50).toFixed(1),x2:(W-padR),y2:py(p50).toFixed(1),
      stroke:"var(--band-line)","stroke-width":"1.2","stroke-dasharray":"4 4"}));
    var med=el("text",{x:(W-padR),y:(py(p50)-4).toFixed(1),"text-anchor":"end"}); med.setAttribute("class","callout");
    med.textContent="平常 "+Math.round(p50); svg.appendChild(med);

    var dpath=""; data.forEach(function(d,i){ dpath+=(i?"L":"M")+px(d.day).toFixed(1)+" "+py(d.v).toFixed(1)+" "; });
    svg.appendChild(el("path",{d:dpath.trim(),fill:"none",stroke:"var(--accent)","stroke-width":"2","stroke-linejoin":"round","stroke-linecap":"round",opacity:"0.85"}));

    var showLab={0:1,6:1,11:1,18:1,19:1};
    data.forEach(function(d){
      svg.appendChild(el("circle",{cx:px(d.day).toFixed(1),cy:py(d.v).toFixed(1),r:"4.5",fill:lvlColor(d.v),stroke:"var(--card)","stroke-width":"1.5"}));
      if(showLab[d.day]){
        var t=el("text",{x:px(d.day).toFixed(1),y:(H-8).toFixed(1),"text-anchor":"middle"}); t.setAttribute("class","callout");
        t.textContent=d.lab; svg.appendChild(t);
      }
    });
    var gx=((px(7)+px(11))/2).toFixed(1);
    var g=el("text",{x:gx,y:(py(50)).toFixed(1),"text-anchor":"middle"}); g.setAttribute("class","callout");
    g.setAttribute("opacity","0.7"); g.textContent="· 隔 4 天 ·"; svg.appendChild(g);
  })();

  (function(){
    var svg=document.getElementById("chart-old");
    var W=340,H=160,padL=6,padR=6,padT=10,padB=14, n=data.length;
    function px(i){ return padL+(W-padL-padR)*(i/(n-1)); }
    function py(v){ return padT+(H-padT-padB)*(1-v/100); }
    var dpath=""; data.forEach(function(d,i){ dpath+=(i?"L":"M")+px(i).toFixed(1)+" "+py(d.v).toFixed(1)+" "; });
    svg.appendChild(el("path",{d:dpath.trim(),fill:"none",stroke:"var(--accent)","stroke-width":"2","stroke-linejoin":"round","stroke-linecap":"round"}));
    data.forEach(function(d,i){ svg.appendChild(el("circle",{cx:px(i).toFixed(1),cy:py(d.v).toFixed(1),r:"4.5",fill:lvlColor(d.v),stroke:"var(--card)","stroke-width":"1.5"})); });
  })();
})();
</script>
</body>
</html>
