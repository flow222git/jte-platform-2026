<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>第一次進來（試作）｜練息場</title>
<style>
:root{--ink:#1A2230;--ink-2:#5A6573;--ink-3:#6F838E;--line:rgba(20,34,56,.12);--bg:#fff;--card:#fff;--soft:#F6F8FB;--accent:#12263F;--accent-ink:#fff;--r:20px;--shadow:0 18px 40px rgba(20,34,56,.06);
--font:'GenJyuuGothic','Yuanti TC','Noto Sans TC','PingFang TC',-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif;
--hw:"HanziPen TC","Hannotate TC","Kaiti TC","BiauKai","DFKai-SB",cursive;
--s-good:#F1F8C9;--s-keen:#FFE6CC;--s-empty:#E6E8FE;--s-full:#FFE3FE;--s-stuck:#DFF7FE}
/* 手帳那一本：米色紙、顆粒、手寫字。字體先用系統內建的頂著。 */
html[data-book="sketch"]{--ink:#3b3a35;--ink-2:#6b675c;--ink-3:#857f70;--line:rgba(59,58,53,.22);--bg:#F4EEDF;--card:#FBF7EC;--soft:#EEE6D2;--accent:#3b3a35;--accent-ink:#FBF7EC;--r:6px;--shadow:none;--font:var(--hw);
--s-good:#E9EDB4;--s-keen:#F6D9B0;--s-empty:#DCD8EC;--s-full:#F1D3DC;--s-stuck:#CFE4E2}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .3s}
html[data-book="sketch"] body{font-size:18px;background-image:radial-gradient(rgba(59,58,53,.07) 1px,transparent 1.2px),radial-gradient(rgba(59,58,53,.05) 1px,transparent 1.2px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:28px;margin:0;line-height:1.25}h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--ink-2);margin:2px 0 0}.note{color:var(--ink-3);font-size:.85em;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:44px}
.btn.fill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lnk{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);padding:10px 4px;min-height:44px}
html[data-book="sketch"] .btn{border-radius:4px;border-width:1.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
html[data-book="sketch"] .panel{border-style:dashed;border-width:1.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* 挑本子 */
.books{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.book{display:block;width:100%;text-align:left;border:1px solid var(--line);padding:22px 18px;min-height:210px;cursor:pointer;transition:transform .15s}
.book:hover{transform:translateY(-3px)}
.book b{display:block;font-size:22px}.book i{display:block;font-style:normal;margin-top:36px;font-size:19px}
.book small{display:block;margin-top:6px;opacity:.8;font-size:14px}
.book.clean{background:#fff;color:#1A2230;border-radius:20px;font-family:'GenJyuuGothic','Yuanti TC','Noto Sans TC','PingFang TC',-apple-system,'Microsoft JhengHei',sans-serif;box-shadow:0 18px 40px rgba(20,34,56,.08)}
.book.sketch{background:#F4EEDF;color:#3b3a35;border:1.5px dashed rgba(59,58,53,.4);border-radius:6px;font-family:var(--hw);background-image:radial-gradient(rgba(59,58,53,.08) 1px,transparent 1.2px);background-size:7px 7px}
/* 題目 */
.q{margin-top:18px}.q .n{font-size:.8em;color:var(--ink-3);letter-spacing:.08em}
.states{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.st{border:0;border-radius:var(--r);padding:14px 12px;text-align:left;min-height:84px}
.st b{display:block;font-size:1.15em}.st small{display:block;font-size:.78em;line-height:1.45;margin-top:2px;opacity:.8}
.st.good{background:var(--s-good)}.st.keen{background:var(--s-keen)}.st.empty{background:var(--s-empty)}.st.full{background:var(--s-full)}.st.stuck{background:var(--s-stuck)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
html[data-book="sketch"] .chip{border-radius:4px;border-width:1.5px}
input.in{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;min-width:0;flex:1}
/* 長出來的首頁 */
#home{display:grid;gap:12px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;animation:grow .45s ease-out}
html[data-book="sketch"] .blk{border-style:dashed;border-width:1.5px}
.blk h3{font-size:.8em;letter-spacing:.08em;color:var(--ink-3);margin:0 0 6px;font-weight:700}
.blk p{margin:0}.blk p+p{margin-top:4px}
.blk.good{background:var(--s-good)}.blk.keen{background:var(--s-keen)}.blk.empty{background:var(--s-empty)}.blk.full{background:var(--s-full)}.blk.stuck{background:var(--s-stuck)}
.item{display:flex;align-items:center;gap:10px;padding:6px 0}.item+.item{border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.item b{flex:1}
.quote{margin:6px 0;padding:2px 0 2px 12px;border-left:2px solid var(--ink-3)}.quote small{display:block;color:var(--ink-3);font-size:.8em;font-weight:700}
.breath{display:flex;align-items:center;gap:16px;margin-top:8px}
.ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);flex:none;transform:scale(.6)}
.ring.in{transform:scale(1);transition:transform 4s ease-in-out}.ring.out{transform:scale(.6);transition:transform 4s ease-in-out}
/* 只動位置不動透明度：動畫沒跑完（分頁在背景）時內容也看得到。 */
@keyframes grow{from{transform:translateY(10px)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.blk{animation:none}.ring.in,.ring.out{transition:none}.book{transition:none}}
.stamp{margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:420px){.books{grid-template-columns:1fr}.book{min-height:150px}.book i{margin-top:18px}h1{font-size:24px}}
</style></head><body>
<div class="wrap">
  <div class="top"><div><h1 id="ttl"></h1><p class="sub" id="date"></p></div><button class="lnk" id="swap" hidden></button></div>
  <div id="pick"></div>
  <div id="home" aria-live="polite"></div>
  <div class="q panel" id="q" hidden></div>
  <div class="q" id="end" hidden></div>
  <p class="note stamp" id="stamp"></p>
</div>
<script src="me-data.js"></script>
<script src="me-core.js"></script>
<script src="first-data.js"></script>
<script>
(function(){
'use strict';
var D=window.JTE_ME_DATA,M=window.JteMe,F=window.JTE_FIRST_DATA,esc=M.esc,$=function(s){return document.querySelector(s)};
var S={book:'',step:0,state:null,items:[],own:[],from:null,logged:{},breath:0};
var TODAY=M.keyOf(new Date());
$('#ttl').textContent=F.title;$('#date').textContent=M.dlabel(TODAY);$('#stamp').textContent=F.stamp;$('#swap').textContent=F.pick.swap;

function setBook(k){S.book=k;document.documentElement.setAttribute('data-book',k);$('#swap').hidden=false}
function renderPick(){$('#pick').hidden=S.step>0;if(S.step>0)return;
  $('#pick').innerHTML='<h2>'+F.pick.h+'</h2><p class="note">'+F.pick.note+'</p><div class="books">'+F.pick.books.map(function(b){
    return '<button class="book '+b.key+'" data-book="'+b.key+'"><b>'+esc(b.name)+'</b><i>'+esc(F.pick.sample)+'</i><small>'+esc(b.line)+'</small></button>'}).join('')+'</div>'}

// 每一塊各自畫；home 整個重畫時不會有動畫閃爍以外的副作用，因為這一頁沒有要保留的輸入狀態。
function blkToday(){if(!S.state)return '';var s=S.state,door=(s.doors||[])[0];
  return '<div class="blk '+s.key+'"><h3>'+F.q1.block+'　'+esc(M.dlabel(TODAY))+'</h3><p><b>'+esc(s.name)+'</b>　'+esc(s.desc)+'</p>'+
    (door?'<p class="note">'+F.q1.door+'：'+esc(door.label)+'</p>':'')+'</div>'}
function allItems(){return S.items.concat(S.own)}
function blkPrac(){var its=allItems(),cs=D.prac.colors;
  if(its.length)return '<div class="blk"><h3>'+F.q2.block+'</h3>'+its.map(function(n,i){
    return '<div class="item"><span class="dot" style="background:'+cs[i%cs.length]+'"></span><b>'+esc(n)+'</b>'+(S.logged[n]?'<span class="note">'+F.q2.logged+'</span>':'<button class="btn" data-log="'+esc(n)+'">'+F.q2.log+'</button>')+'</div>'}).join('')+'</div>';
  if(S.none){
    if(S.breath>=3)return '<div class="blk"><h3>'+F.q2.block+'</h3><p>'+F.q2.breathed+'</p></div>';
    return '<div class="blk"><h3>'+F.q2.noneBlock+'</h3><p>'+F.q2.noneNote+'</p><div class="breath"><div class="ring" id="ring"></div><div><p id="bsay" aria-live="polite">&nbsp;</p><div class="row"><button class="btn fill" id="bstart">'+F.q2.start+'</button><button class="lnk" id="blater">'+F.q2.later+'</button></div></div></div></div>'}
  return ''}
function blkFrom(){if(!S.from)return '';
  if(S.from==='event')return '<div class="blk"><h3>'+F.q3.block+'</h3><p><b>'+esc(F.q3.eventHead)+'</b></p><div class="quote"><small>'+F.q3.eventLead+'</small>'+esc(F.q3.eventQuote)+'</div><p class="note">'+F.q3.eventNote+'</p></div>';
  return '<div class="blk"><p>'+F.q3.welcome+'</p></div>'}
function renderHome(){$('#home').innerHTML=blkFrom()+blkToday()+blkPrac()}

function qHead(n,q){return '<p class="n">'+F.step.replace('{n}',n)+'</p><h2 id="qh" tabindex="-1">'+q.h+'</h2><p class="note">'+q.note+'</p>'}
function renderQ(){var q=$('#q'),h='';q.hidden=S.step<1||S.step>3;$('#end').hidden=S.step<4;
  if(S.step===1)h=qHead(1,F.q1)+'<div class="states">'+D.states.map(function(s){return '<button class="st '+s.key+'" data-st="'+s.key+'"><b>'+esc(s.name)+'</b><small>'+esc(s.desc)+'</small></button>'}).join('')+'</div>';
  if(S.step===2){var names=D.prac.examples.map(function(x){return x.name}).concat(F.q2.extra);
    h=qHead(2,F.q2)+'<div class="row" style="margin-top:12px">'+names.concat(S.own).map(function(n){var on=allItems().indexOf(n)>-1;return '<button class="chip" data-it="'+esc(n)+'" aria-pressed="'+on+'">'+esc(n)+'</button>'}).join('')+'</div>'+
      '<div class="row" style="margin-top:10px"><input class="in" id="own" maxlength="'+D.prac.max.name+'" placeholder="'+F.q2.own+'" aria-label="'+F.q2.own+'"><button class="btn" id="ownadd">'+F.q2.ownAdd+'</button></div>'+
      '<div class="row" style="margin-top:14px"><button class="btn fill" data-go="next">'+F.done+'</button><button class="btn" data-go="none">'+F.q2.none+'</button></div>'}
  if(S.step===3)h=qHead(3,F.q3)+'<div class="row" style="margin-top:12px">'+F.q3.opts.map(function(o){return '<button class="chip" data-from="'+o.key+'">'+esc(o.name)+'</button>'}).join('')+'</div>';
  if(h)h+='<div class="row" style="margin-top:6px"><button class="lnk" data-go="skip">'+F.skip+'</button></div>';
  q.innerHTML=h;
  if(S.step===4){var none=!S.state&&!allItems().length&&!S.none&&!S.from;
    $('#end').innerHTML='<h2 id="qh" tabindex="-1">'+F.end.h+'</h2><p class="note">'+(none?F.end.empty:F.end.note)+'</p><div class="row" style="margin-top:12px"><button class="btn" id="again">'+F.again+'</button><a class="lnk" href="./">'+F.end.real+'</a></div>'}
  var f=$('#qh');if(f&&S.step>0)f.focus({preventScroll:true})}
function go(n){S.step=n;renderPick();renderHome();renderQ()}

$('#pick').onclick=function(e){var b=e.target.closest('[data-book]');if(!b)return;setBook(b.dataset.book);go(1)};
$('#swap').onclick=function(){setBook(S.book==='clean'?'sketch':'clean')};
$('#q').onclick=function(e){var t=e.target,b;
  if((b=t.closest('[data-st]'))){S.state=D.states.filter(function(s){return s.key===b.dataset.st})[0];go(2);return}
  if((b=t.closest('[data-it]'))){var n=b.dataset.it,i=S.items.indexOf(n),j=S.own.indexOf(n);if(j>-1)S.own.splice(j,1);else if(i>-1)S.items.splice(i,1);else S.items.push(n);S.none=false;renderHome();renderQ();return}
  if(t.id==='ownadd'){addOwn();return}
  if((b=t.closest('[data-from]'))){S.from=b.dataset.from;go(4);return}
  if((b=t.closest('[data-go]'))){var k=b.dataset.go;
    if(k==='none'){S.items=[];S.own=[];S.none=true;go(3);return}
    if(k==='skip'&&S.step===2){S.items=[];S.own=[];S.none=false}
    go(S.step+1)}};
function addOwn(){var el=$('#own'),v=(el.value||'').trim().slice(0,D.prac.max.name);if(!v)return;if(allItems().indexOf(v)<0)S.own.push(v);S.none=false;renderHome();renderQ();var again=$('#own');if(again)again.focus()}
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='own'&&!e.isComposing){e.preventDefault();addOwn()}});
$('#home').onclick=function(e){var b=e.target.closest('[data-log]');
  if(b){S.logged[b.dataset.log]=1;renderHome();return}
  if(e.target.id==='blater'){S.none=false;renderHome();return}
  if(e.target.id==='bstart')breathe()};
// 三次呼吸：吸 4 秒、吐 4 秒。減少動態的人看文字就好。
function breathe(){var ring=$('#ring'),say=$('#bsay'),btn=$('#bstart');if(!ring||btn.disabled)return;btn.disabled=true;var n=0;
  function cycle(){var r=$('#ring'),s=$('#bsay');if(!r){return}
    if(n>=3){S.breath=3;renderHome();return}
    r.className='ring in';s.textContent=F.q2.inhale+'　'+(n+1)+'／3';
    setTimeout(function(){var r2=$('#ring'),s2=$('#bsay');if(!r2)return;r2.className='ring out';s2.textContent=F.q2.exhale+'　'+(n+1)+'／3';
      setTimeout(function(){n++;cycle()},4000)},4000)}
  cycle()}
$('#end').onclick=function(e){if(e.target.id!=='again')return;S={book:S.book,step:0,state:null,items:[],own:[],from:null,logged:{},breath:0};$('#swap').hidden=true;document.documentElement.removeAttribute('data-book');go(0)};
go(0);
window.__first={S:function(){return S}};
})();
</script>
</body></html>
