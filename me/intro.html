<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>認識練息場｜練息場 Join to Enjoy</title>
<link rel="preconnect" href="https://font.emtech.cc" crossorigin><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://font.emtech.cc/css/GenJyuuGothic/500" rel="stylesheet"><link href="https://font.emtech.cc/css/GenJyuuGothic/700" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jte-theme.css">
<script src="../jte-theme.js"></script>
<style>
/* 完整的平台介紹。字都在 first-data.js 的 page；五個空間、工具的名稱與說明沿用 me-data.js。
   色票、圓角、字體沿用 ../jte-theme.css，三種外觀都看得。 */
*{box-sizing:border-box}
body{margin:0;background:var(--bg-soft);color:var(--ink);font:400 15.5px/1.8 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul{margin:0}
h1,h2,h3{font-weight:700;color:var(--dark);text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:820px;margin:auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:26px 0 8px}
h1{font-size:clamp(30px,5vw,44px);line-height:1.2}
.lead{font-size:17px;color:var(--ink-2);margin:10px 0 0;max-width:34em}
section{margin-top:44px}
h2{font-size:24px;line-height:1.3;margin-bottom:6px}
.note{font-size:13.5px;color:var(--ink-3)}
.grid{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.card{background:var(--bg);border:var(--edge-w,1px) var(--edge,solid) var(--line);border-radius:var(--r-md);padding:16px 18px;display:grid;gap:2px;align-content:start}
.card b{color:var(--dark);font-size:16px}
.card span{color:var(--ink-2);font-size:14.5px}
a.card{text-decoration:none;transition:border-color .2s ease}
a.card:hover{border-color:var(--dark)}
h3{font-size:15px;margin:22px 0 0;color:var(--ink-2)}
h3+.grid{margin-top:10px}
.stampnote{margin-top:14px;font-size:13.5px;color:var(--ink-2);border-left:2px solid var(--ink-4);padding-left:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--dark);padding:8px 22px;font-size:14.5px;font-weight:700;letter-spacing:.06em;text-decoration:none;min-height:44px}
.btn.fill{background:var(--dark);border-color:var(--dark);color:#fff}
.lnk{font-size:13.5px;color:var(--blue);text-underline-offset:3px}
footer{padding:44px 0 60px;color:var(--ink-3);font-size:12.5px;display:grid;gap:6px}
.stamp{display:inline-block;border:1px solid var(--ink-4);border-radius:999px;padding:1px 12px;letter-spacing:.1em;font:700 11px var(--font-en);width:max-content}
@media(max-width:640px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr}section{margin-top:34px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="ttl"></h1><p class="lead" id="lead"></p></div>
    <div id="themesw"></div>
  </header>
  <main id="main"></main>
  <footer>
    <span class="stamp">v0.1 試作</span>
  </footer>
</div>
<script src="me-data.js"></script>
<script src="me-core.js"></script>
<script src="first-data.js"></script>
<script>
(function(){
  var D=window.JTE_ME_DATA,M=window.JteMe,P=window.JTE_FIRST_DATA.page,esc=M.esc;
  function cards(items){return '<ul class="grid">'+items.map(function(x){return '<li class="card"><b>'+esc(x.b)+'</b><span>'+esc(x.t)+'</span></li>'}).join('')+'</ul>'}
  function sec(id,o,body){return '<section aria-labelledby="h-'+id+'"><h2 id="h-'+id+'">'+esc(o.h)+'</h2>'+(o.note?'<p class="note">'+esc(o.note)+'</p>':'')+body+'</section>'}
  var h=sec('what',P.what,cards(P.what.items));
  h+=sec('book',P.book,cards(D.panes.map(function(p){return {b:p.name,t:p.q+'？'}}))+'<div class="row" style="margin-top:16px"><a class="btn fill" href="./">'+esc(P.go)+'</a></div>');
  h+=sec('tools',P.tools,D.toolbox.groups.map(function(g){return '<h3>'+esc(g.name)+'</h3><div class="grid">'+g.tools.map(function(k){var t=D.tools[k];return '<a class="card" href="'+esc(t.href)+'"><b>'+esc(t.name)+'</b><span>'+esc(t.desc)+'</span></a>'}).join('')+'</div>'}).join('')+'<p class="stampnote">'+esc(P.tools.octenso)+'</p>');
  h+=sec('keep',P.keep,cards(P.keep.items)+'<div class="row" style="margin-top:14px"><a class="lnk" href="./?show=data#mymap-map">'+esc(P.data)+'</a></div>');
  h+=sec('look',P.look,'');
  h+='<section><div class="row"><a class="btn fill" href="./">'+esc(P.go)+'</a><a class="btn" href="../">'+esc(P.home)+'</a></div></section>';
  document.getElementById('ttl').textContent=P.title;document.getElementById('lead').textContent=P.lead;
  document.getElementById('main').innerHTML=h;
  
  JteTheme.mount(document.getElementById('themesw'));
})();
</script>
</body>
</html>
