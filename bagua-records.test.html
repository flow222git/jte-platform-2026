<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>PENDING</title></head><body>
<pre id="out">running...</pre>
<iframe id="f" style="width:600px;height:400px"></iframe>
<script>
var pass=0,fail=0,log=[];
function ok(c,m){ if(c){pass++;} else {fail++; log.push('FAIL: '+m);} }

// 先在「同源」塞好各 key（測試檔與 records 同源）
function seed(){
  localStorage.setItem('bagua_persona_v1', JSON.stringify({
    scores:{qian:90,li:10,zhen:20,dui:30,kun:40,kan:50,gen:60,xun:70},
    top:'qian', title:'乾金 · 開創者', ts:new Date().toISOString()}));
  localStorage.setItem('bagua_facets_v1', JSON.stringify({
    work:{scores:{qian:10,li:10,zhen:5,dui:10,kun:90,kan:10,gen:10,xun:10},ts:new Date().toISOString()}}));
  // 兩個局：一個有名稱含 HTML 特殊字元、一個普通；都有 ts
  var d2=new Date(Date.now()-2*86400000).toISOString();
  localStorage.setItem('bagua_fields_v1', JSON.stringify([
    {name:'<img src=x>新工作', scores:{qian:80,li:20,zhen:30,dui:10,kun:10,kan:10,gen:10,xun:10}, ts:new Date().toISOString()},
    {name:'一段關係', scores:{qian:10,li:10,zhen:10,dui:90,kun:20,kan:10,gen:10,xun:10}, ts:d2}
  ]));
  localStorage.setItem('bagua_compat_v1', JSON.stringify([
    {ts:new Date().toISOString(), otherCode:'B1'+'1'.repeat(16), otherTop:'li', otherTitle:'離火 · 洞見者', sim:72, comp:55}
  ]));
  localStorage.setItem('bagua_now_v1', JSON.stringify({
    scores:{qian:5,zhen:4,dui:1,li:0,xun:-1,kan:-3,gen:-2,kun:1}, mainHex:'節', ts:new Date().toISOString()}));
}

seed();

var ifr=document.getElementById('f');
var ran=false;
ifr.onload=function(){
  if(ran) return; ran=true;
  try{
    var w=document.getElementById('f').contentWindow;
    var d=w.document;

    // helpers exist
    ok(typeof w.buildRadar==='function','buildRadar reused');
    ok(typeof w.relTimeStr==='function','relTimeStr helper present');

    // 相對時間 helper
    ok(w.relTimeStr(new Date().toISOString())==='今天','relTime 今天');
    ok(w.relTimeStr(new Date(Date.now()-86400000).toISOString())==='昨天','relTime 昨天');
    ok(w.relTimeStr(new Date(Date.now()-3*86400000).toISOString())==='3 天前','relTime N天前');
    ok(w.relTimeStr(new Date(Date.now()-10*86400000).toISOString()).indexOf('週前')>=0,'relTime N週前');
    ok(w.relTimeStr(new Date(Date.now()-60*86400000).toISOString()).indexOf('個月前')>=0,'relTime N個月前');
    ok(w.dateOrTested('')==='已測','dateOrTested falls back 已測 when no ts');

    // 1. 底色區：型稱號 + 卦象 + mini 雷達 + 日期 + 重測連結
    ok(d.querySelector('.basecard'),'base card rendered');
    ok(d.querySelector('.basecard .bc-title').textContent.indexOf('乾金')>=0,'base shows title 乾金');
    ok(d.querySelector('.basecard #bc-radar svg'),'base mini radar svg');
    ok(d.querySelector('.basecard .bc-link').getAttribute('href')==='bagua-persona.html','base 重測 link');

    // 2. 場域側寫：work 已測 → 場域名 + top 型 title
    var facetRows=d.querySelectorAll('.sec')[1].querySelectorAll('.row');
    ok(facetRows.length===1,'one facet row (work), got '+facetRows.length);
    ok(facetRows[0].textContent.indexOf('工作的你')>=0,'facet shows 工作的你');
    ok(facetRows[0].textContent.indexOf('坤土')>=0,'facet top→title 坤土 (work top kun)');

    // 3. 測過的局：兩筆；名稱 escape；適配度 fit% 顯示
    var fieldSec=d.querySelectorAll('.sec')[2];
    var fieldRows=fieldSec.querySelectorAll('.row');
    ok(fieldRows.length===2,'two field rows, got '+fieldRows.length);
    // escape：不應有真正的 img element 注入
    ok(!fieldSec.querySelector('img'),'field name escaped — no injected <img>');
    ok(fieldSec.innerHTML.indexOf('&lt;img')>=0,'field name shows escaped &lt;img');
    ok(fieldSec.innerHTML.indexOf('適配')>=0 && fieldSec.innerHTML.indexOf('%')>=0,'fit% shown for fields (base present)');

    // 4. 合盤紀錄：對方型 + 同頻/互補 %
    var compatSec=d.querySelectorAll('.sec')[3];
    ok(compatSec.querySelectorAll('.row').length===1,'one compat row');
    ok(compatSec.textContent.indexOf('離火')>=0,'compat shows otherTitle 離火');
    ok(compatSec.textContent.indexOf('72%')>=0 && compatSec.textContent.indexOf('55%')>=0,'compat shows sim/comp %');

    // 5. 此刻：卦象 + 去問易連結
    var nowSec=d.querySelectorAll('.sec')[4];
    ok(nowSec.textContent.indexOf('節')>=0,'now shows mainHex 節');
    ok(nowSec.querySelector('.r-link').getAttribute('href')==='ven-i/','now 去問易 link');

    // 6. clearAll 清掉五個 key（stub confirm + reload）
    w.confirm=function(){return true;};
    var reloaded=false; try{ w.location.reload=function(){reloaded=true;}; }catch(e){}
    w.clearAll();
    ok(w.localStorage.getItem('bagua_persona_v1')===null,'clear removes persona');
    ok(w.localStorage.getItem('bagua_facets_v1')===null,'clear removes facets');
    ok(w.localStorage.getItem('bagua_fields_v1')===null,'clear removes fields');
    ok(w.localStorage.getItem('bagua_now_v1')===null,'clear removes now');
    ok(w.localStorage.getItem('bagua_compat_v1')===null,'clear removes compat');

    // 7. 空狀態提示：重新 render → 各區出現「還沒有…」
    w.render();
    var emptyTxt=d.getElementById('app').textContent;
    ok((emptyTxt.match(/還沒有/g)||[]).length>=4,'empty states show 還沒有 prompts, got '+(emptyTxt.match(/還沒有/g)||[]).length);
    ok(!d.querySelector('.basecard'),'no base card when empty');

  }catch(e){ fail++; log.push('EXCEPTION: '+e.message); }

  var msg='RESULT pass='+pass+' fail='+fail+(log.length?' | '+log.join(' ; '):'');
  document.title=msg;
  document.getElementById('out').textContent=msg;
};
ifr.src='bagua-records.html';
</script>
</body></html>
