<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>PENDING</title></head><body>
<pre id="out">running...</pre>
<iframe id="f" style="width:600px;height:400px"></iframe>
<script>
var pass=0,fail=0,log=[];
function ok(c,m){ if(c){pass++;} else {fail++; log.push('FAIL: '+m);} }

// 先在「同源」塞好各 key（測試檔與 records 同源）
function seed(){
  localStorage.setItem('bagua_persona_v1', JSON.stringify({
    scores:{qian:90,li:10,zhen:20,dui:30,kun:40,kan:50,gen:60,xun:70},
    top:'qian', title:'乾金 · 開創者', ts:new Date().toISOString()}));
  localStorage.setItem('bagua_facets_v1', JSON.stringify({
    work:{scores:{qian:10,li:10,zhen:5,dui:10,kun:90,kan:10,gen:10,xun:10},ts:new Date().toISOString()}}));
  // 兩個局：一個有名稱含 HTML 特殊字元、一個普通；都有 ts
  var d2=new Date(Date.now()-2*86400000).toISOString();
  localStorage.setItem('bagua_fields_v1', JSON.stringify([
    {name:'<img src=x>新工作', scores:{qian:80,li:20,zhen:30,dui:10,kun:10,kan:10,gen:10,xun:10}, ts:new Date().toISOString()},
    {name:'一段關係', scores:{qian:10,li:10,zhen:10,dui:90,kun:20,kan:10,gen:10,xun:10}, ts:d2}
  ]));
  localStorage.setItem('bagua_compat_v1', JSON.stringify([
    {ts:new Date().toISOString(), otherCode:'B1'+'1'.repeat(16), otherTop:'li', otherTitle:'離火 · 洞見者', sim:72, comp:55}
  ]));
  localStorage.setItem('bagua_now_v1', JSON.stringify({
    scores:{qian:5,zhen:4,dui:1,li:0,xun:-1,kan:-3,gen:-2,kun:1}, mainHex:'節', ts:new Date().toISOString()}));
}

seed();

var ifr=document.getElementById('f');
var ran=false;
ifr.onload=function(){
  if(ran) return; ran=true;
  try{
    var w=document.getElementById('f').contentWindow;
    var d=w.document;

    // helpers exist
    ok(typeof w.buildRadar==='function','buildRadar reused');
    ok(typeof w.relTimeStr==='function','relTimeStr helper present');

    // 相對時間 helper
    ok(w.relTimeStr(new Date().toISOString())==='今天','relTime 今天');
    ok(w.relTimeStr(new Date(Date.now()-86400000).toISOString())==='昨天','relTime 昨天');
    ok(w.relTimeStr(new Date(Date.now()-3*86400000).toISOString())==='3 天前','relTime N天前');
    ok(w.relTimeStr(new Date(Date.now()-10*86400000).toISOString()).indexOf('週前')>=0,'relTime N週前');
    ok(w.relTimeStr(new Date(Date.now()-60*86400000).toISOString()).indexOf('個月前')>=0,'relTime N個月前');
    ok(w.dateOrTested('')==='已測','dateOrTested falls back 已測 when no ts');

    // 1. 底色區：型稱號 + 卦象 + mini 雷達 + 日期 + 重測連結
    ok(d.querySelector('.basecard'),'base card rendered');
    ok(d.querySelector('.basecard .bc-title').textContent.indexOf('乾金')>=0,'base shows title 乾金');
    ok(d.querySelector('.basecard #bc-radar svg'),'base mini radar svg');
    ok(d.querySelector('.basecard .bc-link').getAttribute('href')==='bagua-persona.html','base 重測 link');

    // 1.5 能量提醒 memo（依底色；index 1，插在底色之後）
    var memoSec=d.querySelectorAll('.sec')[1];
    ok(memoSec.querySelector('h2').textContent.indexOf('能量提醒')>=0,'memo sec is index 1');
    ok(memoSec.querySelector('.memo-block'),'memo block rendered (base present)');
    ok(memoSec.querySelectorAll('.memo-row').length===2,'memo 2 nudge rows, got '+memoSec.querySelectorAll('.memo-row').length);
    ok(memoSec.querySelector('.memo-watch'),'memo watch (小叮嚀) present');
    // base top=qian(90) → watch 應為 qian 叮嚀；最低 li(10)/zhen(20) → nudges
    ok(memoSec.querySelector('.memo-watch').textContent.indexOf('你很能扛')>=0,'memo watch = qian (top), got '+memoSec.querySelector('.memo-watch').textContent);
    ok(memoSec.textContent.indexOf('看清楚')>=0,'memo nudge includes li (lowest)');
    // 打勾 round-trip：點 li → memoChecked(li) true → 重繪後顯示 ✓
    w.memoCheck('li');
    ok(w.memoChecked('li')===true,'memoChecked(li) true after memoCheck');
    ok(d.querySelectorAll('.sec')[1].querySelector('.memo-chk.on'),'checked nudge shows ✓ on state after render');

    // 2. 場域側寫：work 已測 → 場域名 + top 型 title
    var facetRows=d.querySelectorAll('.sec')[2].querySelectorAll('.row');
    ok(facetRows.length===1,'one facet row (work), got '+facetRows.length);
    ok(facetRows[0].textContent.indexOf('工作的你')>=0,'facet shows 工作的你');
    ok(facetRows[0].textContent.indexOf('坤土')>=0,'facet top→title 坤土 (work top kun)');

    // 3. 測過的局：兩筆；名稱 escape；適配度 fit% 顯示
    var fieldSec=d.querySelectorAll('.sec')[3];
    var fieldRows=fieldSec.querySelectorAll('.row');
    ok(fieldRows.length===2,'two field rows, got '+fieldRows.length);
    // escape：不應有真正的 img element 注入
    ok(!fieldSec.querySelector('img'),'field name escaped — no injected <img>');
    ok(fieldSec.innerHTML.indexOf('&lt;img')>=0,'field name shows escaped &lt;img');
    ok(fieldSec.innerHTML.indexOf('適配')>=0 && fieldSec.innerHTML.indexOf('%')>=0,'fit% shown for fields (base present)');

    // 4. 合盤紀錄：對方型 + 同頻/互補 %（memo+drain+regulate 前插，compat 移到 6）
    var compatSec=d.querySelectorAll('.sec')[6];
    ok(compatSec.querySelectorAll('.row').length===1,'one compat row');
    ok(compatSec.textContent.indexOf('離火')>=0,'compat shows otherTitle 離火');
    ok(compatSec.textContent.indexOf('72%')>=0 && compatSec.textContent.indexOf('55%')>=0,'compat shows sim/comp %');

    // 5. 此刻：卦象 + 去問易連結（now 後移到 7）
    var nowSec=d.querySelectorAll('.sec')[7];
    ok(nowSec.textContent.indexOf('節')>=0,'now shows mainHex 節');
    ok(nowSec.querySelector('.r-link').getAttribute('href')==='ven-i/','now 去問易 link');

    // ── 消耗熱點：純函式 ──────────────────────────────────
    ok(typeof w.drainCounts==='function','drainCounts present');
    ok(typeof w.drainHotspots==='function','drainHotspots present');
    ok(typeof w.mostDrainingField==='function','mostDrainingField present');
    ok(typeof w.baseWeakest==='function','baseWeakest present');
    ok(typeof w.strategyFor==='function','strategyFor present');

    // 控制情境：底色 dui=20(低)、li=85(高)；兩個局 dui 需求都≥55、li 也高
    var youT={qian:50,li:85,zhen:50,dui:20,kun:50,kan:30,gen:50,xun:50};
    var fA={qian:10,li:90,zhen:10,dui:60,kun:10,kan:10,gen:10,xun:10}; // dui drain, li 不算(you高)
    var fB={qian:10,li:90,zhen:10,dui:80,kun:10,kan:10,gen:10,xun:10}; // dui drain, li 不算
    var cT=w.drainCounts(youT,[{scores:fA},{scores:fB}]);
    ok(cT.dui===2,'drainCounts dui=2, got '+cT.dui);
    ok(cT.li===0,'li 你高(85)即使局需求高也不算熱點, got '+cT.li);
    var hsT=w.drainHotspots(youT,[{scores:fA},{scores:fB}]);
    ok(hsT.indexOf('dui')>=0,'dui 出現在消耗熱點');
    ok(hsT.indexOf('li')<0,'li 不在消耗熱點');

    // 最耗你的局 = fit 最低者（fB 比 fA 更吃 dui，落差更大→fit 更低）
    var mostT=w.mostDrainingField(youT,[{name:'局A',scores:fA},{name:'局B',scores:fB}]);
    ok(w.fitScore(youT,fB) < w.fitScore(youT,fA),'fB fit lower than fA (sanity)');
    ok(mostT && mostT.field.name==='局B','mostDrainingField = fit 最低者(局B), got '+(mostT&&mostT.field.name));

    // baseWeakest：dui(20) 應是最弱之一
    ok(w.baseWeakest(youT,2).indexOf('dui')>=0,'baseWeakest 含 dui');

    // strategyFor(dui)：含能量名＋對極(巽)＋field 口吻
    var sd=w.strategyFor('dui');
    ok(sd.indexOf('兌')>=0 && sd.indexOf('交流')>=0,'strategy 提到 兌·交流');
    ok(sd.indexOf('巽')>=0,'strategy 補對極 巽 (dui⇄xun)');
    ok(sd.indexOf('硬撐')>=0,'strategy 沿用 field 口吻(別硬撐)');

    // ── 消耗熱點：DOM（用控制情境重塞後 render）────────────
    w.localStorage.setItem('bagua_persona_v1', JSON.stringify({scores:youT,top:'li',title:'離火 · 洞見者',ts:new Date().toISOString()}));
    w.localStorage.setItem('bagua_fields_v1', JSON.stringify([{name:'局A',scores:fA,ts:new Date().toISOString()},{name:'局B',scores:fB,ts:new Date().toISOString()}]));
    w.render();
    var drainSec=d.querySelectorAll('.sec')[4]; // base,memo,facets,fields,DRAIN,...
    ok(drainSec && drainSec.querySelector('h2').textContent.indexOf('消耗熱點')>=0,'drain sec is index 4');
    var dtxt=drainSec.textContent;
    ok(dtxt.indexOf('縱觀你測過的 2 個局')>=0,'overview 顯示 N=2');
    ok(drainSec.querySelector('.drain-overview .em').textContent.indexOf('兌')>=0,'overview 列出熱點 兌');
    ok(drainSec.querySelector('.most-field').textContent.indexOf('局B')>=0,'最費力的局 = fit最低的局B');
    ok(drainSec.querySelector('.most-field').textContent.indexOf('適配度')>=0,'最費力的局 顯示適配度');
    ok(dtxt.indexOf('別硬撐')>=0,'應對策略文字出現');
    ok(dtxt.indexOf('照顧自己')>=0,'誠實句出現');
    ok(!drainSec.querySelector('img'),'drain 局名 escape — no injected img');

    // 局名含特殊字元 escape
    w.localStorage.setItem('bagua_fields_v1', JSON.stringify([{name:'<b>x</b>局',scores:fA,ts:new Date().toISOString()}]));
    w.render();
    var drainSec2=d.querySelectorAll('.sec')[4];
    ok(drainSec2.querySelector('.most-field').innerHTML.indexOf('&lt;b&gt;')>=0,'drain 局名 escaped');
    ok(drainSec2.textContent.indexOf('再多測幾個局')>=0,'局數=1 加提醒');

    // 分級：真的低適配→紅框「最耗你的局」；高適配→中性不說「耗」
    var youLow={qian:20,li:20,zhen:20,dui:20,kun:20,kan:20,gen:20,xun:80};
    var fieldHard={qian:80,li:80,zhen:80,dui:80,kun:80,kan:80,gen:80,xun:10};
    w.localStorage.setItem('bagua_persona_v1', JSON.stringify({scores:youLow,top:'xun',ts:new Date().toISOString()}));
    w.localStorage.setItem('bagua_fields_v1', JSON.stringify([{name:'硬局',scores:fieldHard,ts:new Date().toISOString()}]));
    w.render();
    var dh=d.querySelectorAll('.sec')[4].querySelector('.most-field');
    ok(dh && dh.textContent.indexOf('最耗你的局')>=0,'低適配→顯示「最耗你的局」');
    ok(dh && dh.className.indexOf('drain-note')>=0,'低適配→紅色 drain-note 樣式');
    var youHi={qian:80,li:80,zhen:80,dui:80,kun:80,kan:80,gen:80,xun:80};
    w.localStorage.setItem('bagua_persona_v1', JSON.stringify({scores:youHi,top:'qian',ts:new Date().toISOString()}));
    w.localStorage.setItem('bagua_fields_v1', JSON.stringify([{name:'合局',scores:{qian:50,li:50,zhen:50,dui:50,kun:50,kan:50,gen:50,xun:50},ts:new Date().toISOString()}]));
    w.render();
    var dhi=d.querySelectorAll('.sec')[4].querySelector('.most-field');
    ok(dhi && dhi.textContent.indexOf('最耗你的局')<0,'高適配→不說「最耗」');

    // 有底色、0 局 → 提示去測局，無熱點
    w.localStorage.setItem('bagua_persona_v1', JSON.stringify({scores:youT,top:'li',ts:new Date().toISOString()}));
    w.localStorage.removeItem('bagua_fields_v1');
    w.render();
    var drainSec3=d.querySelectorAll('.sec')[4];
    ok(drainSec3.querySelector('.empty'),'有底色0局 → empty 提示');
    ok(drainSec3.textContent.indexOf('測一個局')>=0,'0局 提示去測局');
    ok(!drainSec3.querySelector('.drain-note'),'0局 無熱點');

    // 沒底色 → 提示且無熱點
    w.localStorage.removeItem('bagua_persona_v1');
    w.render();
    var drainSec4=d.querySelectorAll('.sec')[4];
    ok(drainSec4.querySelector('.empty'),'沒底色 → empty 提示');
    ok(drainSec4.textContent.indexOf('底色')>=0,'沒底色 提示先測底色');
    ok(!drainSec4.querySelector('.drain-note'),'沒底色 無熱點');

    // ── 能量調節 regulate ────────────────────────────────────
    ok(typeof w.renderRegulate==='function','renderRegulate present');
    ok(typeof w.logRegulate==='function','logRegulate present');
    ok(typeof w.setFelt==='function','setFelt present');
    ok(typeof w.getRegulateLog==='function','getRegulateLog present');
    ok(w.REGULATE_ACTION && w.REGULATE_ACTION.dui,'REGULATE_ACTION map present');

    // 控制情境：底色 dui 弱 + 兩個局 dui 需求高 → drainHotspots[0]=dui
    var youR={qian:50,li:85,zhen:50,dui:20,kun:50,kan:30,gen:50,xun:50};
    var fR1={qian:10,li:90,zhen:10,dui:60,kun:10,kan:10,gen:10,xun:10};
    var fR2={qian:10,li:90,zhen:10,dui:80,kun:10,kan:10,gen:10,xun:10};
    w.localStorage.setItem('bagua_persona_v1', JSON.stringify({scores:youR,top:'li',ts:new Date().toISOString()}));
    w.localStorage.setItem('bagua_fields_v1', JSON.stringify([{name:'局A',scores:fR1,ts:new Date().toISOString()},{name:'局B',scores:fR2,ts:new Date().toISOString()}]));
    w.localStorage.removeItem('bagua_regulate_v1');
    w.render();
    var regSec=d.querySelectorAll('.sec')[5]; // base,memo,facets,fields,drain,REGULATE
    ok(regSec && regSec.querySelector('h2').textContent.indexOf('能量調節')>=0,'regulate sec is index 5');
    var regTxt=regSec.textContent;
    // 通用呼吸連結
    var pills=regSec.querySelectorAll('.reg-pill');
    var hrefs=[].map.call(pills,function(a){return a.getAttribute('href');});
    ok(hrefs.indexOf('BreatheAware/')>=0,'regulate has BreatheAware/ link');
    ok(hrefs.indexOf('xiaoqi/')>=0,'regulate has xiaoqi/ link');
    // 針對性行動 = drainHotspots[0]=dui 的 REGULATE_ACTION
    ok(w.drainHotspots(youR,[{scores:fR1},{scores:fR2}])[0]==='dui','hotspot[0]=dui (sanity)');
    ok(regTxt.indexOf(w.REGULATE_ACTION.dui)>=0,'regulate shows dui action text');
    ok(regSec.querySelector('.reg-did'),'regulate 我做了 button present');

    // logRegulate round-trip
    var before=w.getRegulateLog().length;
    w.logRegulate('dui', w.REGULATE_ACTION.dui);
    var after=w.getRegulateLog();
    ok(after.length===before+1,'logRegulate adds one entry, got '+after.length);
    ok(after[0].key==='dui' && after[0].ts && after[0].felt===null,'log entry has key/ts/felt:null');
    // render 後出現「最近的調節」＋有感問句
    var regSec2=d.querySelectorAll('.sec')[5];
    ok(regSec2.querySelector('.reg-recent'),'最近的調節 shown after log');
    ok(regSec2.querySelector('.reg-felt'),'有感嗎 prompt shown for unrated entry');
    // setFelt 寫入
    w.setFelt(0,'good');
    ok(w.getRegulateLog()[0].felt==='good','setFelt writes felt=good');
    var regSec3=d.querySelectorAll('.sec')[5];
    ok(regSec3.querySelector('.reg-recent').textContent.indexOf('👍')>=0,'rated entry shows 👍 emoji');
    ok(!regSec3.querySelector('.reg-felt'),'no 有感 prompt once rated (only 1 entry)');

    // 沒底色 → 不顯示行動、給引導
    w.localStorage.removeItem('bagua_persona_v1');
    w.render();
    var regSec4=d.querySelectorAll('.sec')[5];
    ok(regSec4.querySelector('.empty'),'no base → regulate empty guide');
    ok(!regSec4.querySelector('.reg-pill'),'no base → no action pills');
    ok(regSec4.textContent.indexOf('底色')>=0,'no base → guide mentions 底色');

    // 有底色但 0 局 → 用 baseWeakest[0]（仍顯示行動）
    w.localStorage.setItem('bagua_persona_v1', JSON.stringify({scores:youR,top:'li',ts:new Date().toISOString()}));
    w.localStorage.removeItem('bagua_fields_v1');
    w.render();
    var regSec5=d.querySelectorAll('.sec')[5];
    ok(regSec5.querySelector('.reg-pill'),'base+0局 → still shows actions (baseWeakest fallback)');
    var wk=w.baseWeakest(youR,1)[0];
    ok(regSec5.textContent.indexOf(w.REGULATE_ACTION[wk])>=0,'base+0局 → action from baseWeakest[0]');
    w.localStorage.removeItem('bagua_regulate_v1');

    // 還原 seed 供後續既有測試
    seed();
    w.render();

    // 6. clearAll 清掉五個 key（stub confirm + reload）
    w.confirm=function(){return true;};
    var reloaded=false; try{ w.location.reload=function(){reloaded=true;}; }catch(e){}
    w.clearAll();
    ok(w.localStorage.getItem('bagua_persona_v1')===null,'clear removes persona');
    ok(w.localStorage.getItem('bagua_facets_v1')===null,'clear removes facets');
    ok(w.localStorage.getItem('bagua_fields_v1')===null,'clear removes fields');
    ok(w.localStorage.getItem('bagua_now_v1')===null,'clear removes now');
    ok(w.localStorage.getItem('bagua_compat_v1')===null,'clear removes compat');

    // 7. 空狀態提示：重新 render → 各區出現「還沒有…」
    w.render();
    var emptyTxt=d.getElementById('app').textContent;
    ok((emptyTxt.match(/還沒有/g)||[]).length>=4,'empty states show 還沒有 prompts, got '+(emptyTxt.match(/還沒有/g)||[]).length);
    ok(!d.querySelector('.basecard'),'no base card when empty');

  }catch(e){ fail++; log.push('EXCEPTION: '+e.message); }

  var msg='RESULT pass='+pass+' fail='+fail+(log.length?' | '+log.join(' ; '):'');
  document.title=msg;
  document.getElementById('out').textContent=msg;
};
ifr.src='bagua-records.html';
</script>
</body></html>
